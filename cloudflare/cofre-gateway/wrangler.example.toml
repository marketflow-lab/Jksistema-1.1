name = "jk-cofre-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-22"
workers_dev = true
preview_urls = false
logpush = false
send_metrics = false

# Workers Free enforces its own 10 ms CPU limit. Custom CPU limits require Paid.

[observability]
enabled = false

[vars]
COFRE_ISSUER_EMAIL = "jk-auth-gateway@jkjkjk-485920.iam.gserviceaccount.com"

[[d1_databases]]
binding = "DB"
database_name = "jk-cofre-company"
database_id = "REPLACE_WITH_SEPARATE_COFRE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Optional attachments: reuse the existing MEDIA KV namespace only after checking
# its account/quota. Keep the real namespace ID in ignored wrangler.toml.
# No change to, or activation of, the WhatsApp gateway is needed.
# [[kv_namespaces]]
# binding = "MEDIA"
# id = "REPLACE_WITH_EXISTING_MEDIA_KV_NAMESPACE_ID"

# COFRE_ISSUER_EMAIL is the public, pinned signing identity, not a private key.
# No private signing key, Firebase key, WhatsApp D1 binding, or scheduled trigger.
