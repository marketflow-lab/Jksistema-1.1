<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - JK Sistema</title>
    <style>
        body { margin:0; padding:20px; background:#0e1117; color:#e5e5e5; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:20px; }
        .back-btn { padding:8px 14px; background:#4facfe; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold; }
        .back-btn:hover { background:#0073e6; }
        h1 { margin:0; }
        .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; align-items:center; }
        input, select { padding:8px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; }
        .loja-group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .loja-btn { padding:8px 12px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; }
        .loja-btn.active { background:#4facfe; color:#0e1117; border-color:#4facfe; font-weight:bold; }
        table { width:100%; border-collapse:collapse; background:#1c1f2b; border:1px solid #222; }
        th, td { padding:10px; border-bottom:1px solid #222; text-align:left; font-size:0.95rem; }
        th { background:#161925; color:#9bd1ff; position:sticky; top:0; z-index:1; }
        tr:hover { background:#1f2331; }
        .summary { display:flex; gap:16px; margin-bottom:15px; flex-wrap:wrap; }
        .card { background:#1c1f2b; border:1px solid #222; padding:12px 14px; border-radius:8px; min-width:140px; }
        .card h3 { margin:0 0 6px 0; font-size:0.95rem; color:#9bd1ff; }
        .card .val { font-size:1.2rem; font-weight:bold; }
        .status-bar { margin:10px 0; padding:10px 12px; border-radius:8px; background:#161925; border:1px solid #222; min-height:20px; }
        .status-bar.loading { color:#9bd1ff; border-color:#4facfe; background:#0a1428; }
        .status-bar.error { color:#ff6b6b; border-color:#c62828; background:#28010d; }
        .status-bar.success { color:#66bb6a; border-color:#1b5e20; background:#0f2e0d; }
        .status-bar.empty { color:#aaa; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid #4facfe; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .paginacao { display:flex; align-items:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
        .page-btn { padding:6px 10px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; }
        .page-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .page-info { color:#9bd1ff; font-size:0.92rem; }
        #btnSync:disabled { opacity:0.6; cursor:not-allowed; }
        .tabs { display:flex; gap:8px; margin:0 0 14px 0; flex-wrap:wrap; }
        .tab-btn { padding:9px 14px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; font-weight:700; }
        .tab-btn.active { background:#4facfe; color:#0e1117; border-color:#4facfe; }
        .aba-conteudo.hidden { display:none; }
        .filters label, .history-actions label { display:flex; align-items:center; gap:6px; color:#9bd1ff; font-size:0.92rem; }
        .history-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:15px; }
        .history-table th, .history-table td { text-align:right; }
        .history-table th:first-child, .history-table td:first-child { text-align:left; }
        #btnHistoricoSync:disabled, #btnHistoricoCarregar:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
    <script src="/auth.js?v=20260618-persist-login"></script>
    <script src="/ncm-sync.js"></script>
    <script src="/global-status.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Estoque</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <a class="back-btn" href="/dashboard.html">Home</a>
            <a class="back-btn" href="/dashboard.html">Voltar</a>
        </div>
    </div>

    <div id="status" class="status-bar"></div>

    <div class="tabs">
        <button id="tabAtual" class="tab-btn active" type="button">Estoque atual</button>
        <button id="tabHistorico" class="tab-btn" type="button">Histórico de estoque</button>
    </div>

    <div class="filters">
        <div class="loja-group" id="lojaBotoes" aria-label="Selecionar loja"></div>
    </div>

    <section id="abaAtual" class="aba-conteudo">
        <div class="filters">
            <button id="btnSync" class="back-btn" style="background:#28a745;">Atualizar estoque</button>
            <input type="text" id="filtroTexto" placeholder="Buscar por SKU, título ou código" aria-label="Filtro de texto">
            <select id="ordenarPor" aria-label="Organizar SKUs">
                <option value="loja_az">Loja (A-Z)</option>
                <option value="loja_za">Loja (Z-A)</option>
                <option value="data_atual">Data da atualização (atual)</option>
                <option value="sku_az">SKU alfabético (A-Z)</option>
                <option value="sku_desc">SKU maior para menor</option>
                <option value="estoque_desc">Estoque maior para menor</option>
                <option value="estoque_asc">Estoque menor para maior</option>
            </select>
        </div>

        <div class="summary" id="resumo"></div>

        <div class="table-wrapper">
            <table>
                <thead id="tHead"></thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>

        <div class="paginacao" id="paginacao" style="display:none;">
            <button id="btnPaginaAnterior" class="page-btn">Anterior</button>
            <span id="pageInfo" class="page-info"></span>
            <button id="btnPaginaProxima" class="page-btn">Próxima</button>
        </div>
    </section>

    <section id="abaHistorico" class="aba-conteudo hidden">
        <div class="history-actions">
            <label>Início <input type="date" id="histDataInicio"></label>
            <label>Fim <input type="date" id="histDataFim"></label>
            <button id="btnHistoricoCarregar" class="back-btn" type="button">Carregar histórico</button>
            <button id="btnHistoricoSync" class="back-btn" style="background:#28a745;" type="button">Sincronizar registros</button>
        </div>

        <div id="historicoStatus" class="status-bar"></div>
        <div class="summary" id="historicoResumo"></div>

        <div class="table-wrapper">
            <table class="history-table">
                <thead id="historicoTHead"></thead>
                <tbody id="historicoTBody"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
    const tHead = document.getElementById('tHead');
    const tBody = document.getElementById('tBody');
    const resumo = document.getElementById('resumo');
    const statusEl = document.getElementById('status');
    const filtroTexto = document.getElementById('filtroTexto');
    const ordenarPor = document.getElementById('ordenarPor');
    const lojaBotoes = document.getElementById('lojaBotoes');
    const btnSync = document.getElementById('btnSync');
    const paginacaoEl = document.getElementById('paginacao');
    const btnPaginaAnterior = document.getElementById('btnPaginaAnterior');
    const btnPaginaProxima = document.getElementById('btnPaginaProxima');
    const pageInfo = document.getElementById('pageInfo');
    const tabAtual = document.getElementById('tabAtual');
    const tabHistorico = document.getElementById('tabHistorico');
    const abaAtual = document.getElementById('abaAtual');
    const abaHistorico = document.getElementById('abaHistorico');
    const histDataInicio = document.getElementById('histDataInicio');
    const histDataFim = document.getElementById('histDataFim');
    const btnHistoricoCarregar = document.getElementById('btnHistoricoCarregar');
    const btnHistoricoSync = document.getElementById('btnHistoricoSync');
    const historicoStatus = document.getElementById('historicoStatus');
    const historicoResumo = document.getElementById('historicoResumo');
    const historicoTHead = document.getElementById('historicoTHead');
    const historicoTBody = document.getElementById('historicoTBody');
    const spinnerHtml = '<span class="spinner"></span>';
    let dados = [];
    let clientId = null;
    let lojaSelecionada = '__todas';
    let lojasDisponiveis = [];
    let paginaAtual = 1;
    const ITENS_POR_PAGINA = 50;
    const SYNC_SOLICITACAO_TIMEOUT_MS = 15000;
    const SYNC_PROGRESS_TIMEOUT_MS = 8000;
    let syncEmAndamento = false;
    let solicitandoSync = false;
    let progressTimer = null;
    let autoSyncSolicitado = false;
    let janelaAutoSyncMinutos = 30;
    let abaAtiva = 'atual';
    let historicoSyncEmAndamento = false;
    let historicoSolicitandoSync = false;
    let historicoProgressTimer = null;

    async function carregarConfiguracoesGlobais() {
        try {
            const resp = await fetch('/api/configuracoes', { headers: obterAuthHeaders(), cache: 'no-store' });
            if (!resp.ok) return;
            const cfg = await resp.json();
            const janela = Number(cfg && cfg.auto_sync_estoque_janela_minutos);
            if (Number.isFinite(janela) && janela >= 1) {
                janelaAutoSyncMinutos = Math.round(janela);
            }
        } catch (_e) {
            // Mantém fallback local caso endpoint/configuração não esteja disponível.
        }
    }

    function setSyncButton(isSyncing) {
        btnSync.disabled = isSyncing;
        btnSync.textContent = isSyncing ? 'Atualizando...' : 'Atualizar estoque';
    }

    function setHistoricoButtons(isSyncing) {
        btnHistoricoSync.disabled = isSyncing;
        btnHistoricoCarregar.disabled = isSyncing;
        btnHistoricoSync.textContent = isSyncing ? 'Sincronizando...' : 'Sincronizar registros';
    }

    function mostrarStatusCarregando(mensagem) {
        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = spinnerHtml;
        statusEl.appendChild(document.createTextNode(mensagem));
    }

    async function fetchComTimeout(url, options = {}, timeoutMs = SYNC_SOLICITACAO_TIMEOUT_MS) {
        if (!window.AbortController) {
            return fetch(url, options);
        }
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    function renderProgresso(progress, logs) {
        if (!progress) return;
        const percent = Math.max(0, Math.min(100, Number(progress.percentual || 0)));
        const logsList = (logs || []).slice(-8).map(l => `<div style="color:#9bd1ff; margin:2px 0;">${l}</div>`).join('');
        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = `${spinnerHtml}<strong>${progress.mensagem || 'Atualizando estoque...'}</strong>
            <div style="margin-top:8px;background:#222;border-radius:6px;overflow:hidden;">
                <div style="height:8px;width:${percent}%;background:#4facfe;"></div>
            </div>
            <div style="margin-top:6px;font-size:0.85rem;color:#9bd1ff;">${percent}%</div>
            <div style="margin-top:8px;font-size:0.85rem;">${logsList}</div>`;
    }

    function pararMonitoramentoProgresso() {
        if (progressTimer) {
            clearInterval(progressTimer);
            progressTimer = null;
        }
    }

    async function verificarProgressoEstoque() {
        try {
            const resp = await fetchComTimeout('/api/estoque/sync/progress', { headers: obterAuthHeaders(), cache: 'no-store' }, SYNC_PROGRESS_TIMEOUT_MS);
            if (!resp.ok) return null;
            const payload = await resp.json();
            const progress = payload.progress;
            const active = !!payload.active;
            if (progress && (active || !solicitandoSync)) {
                renderProgresso(progress, payload.logs || []);
            }

            syncEmAndamento = active;
            setSyncButton(syncEmAndamento || solicitandoSync);

            if (!active && progress && !solicitandoSync) {
                if (Number(progress.percentual || 0) >= 100) {
                    statusEl.className = 'status-bar success';
                    statusEl.textContent = `${progress.mensagem || 'Estoque atualizado.'}`;
                    await carregar(false);
                    setTimeout(() => {
                        statusEl.className = 'status-bar';
                        statusEl.textContent = '';
                    }, 3500);
                } else if ((progress.etapa || '').toLowerCase() === 'erro') {
                    statusEl.className = 'status-bar error';
                    statusEl.textContent = `${progress.mensagem || 'Falha na atualização do estoque.'}`;
                }
                pararMonitoramentoProgresso();
            } else if (!active && !progress && !solicitandoSync && progressTimer) {
                pararMonitoramentoProgresso();
                if (statusEl.classList.contains('loading')) {
                    statusEl.className = 'status-bar';
                    statusEl.textContent = '';
                }
            }
            return payload;
        } catch (_e) {
            // Falha momentânea de rede durante polling; tenta novamente no próximo ciclo.
            return null;
        }
    }

    function iniciarMonitoramentoProgresso() {
        pararMonitoramentoProgresso();
        progressTimer = setInterval(verificarProgressoEstoque, 2500);
        verificarProgressoEstoque();
    }

    function formatarDataInput(dt) {
        const yyyy = dt.getFullYear();
        const mm = String(dt.getMonth() + 1).padStart(2, '0');
        const dd = String(dt.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function inicializarDatasHistorico() {
        const fim = new Date();
        const inicio = new Date();
        inicio.setFullYear(inicio.getFullYear() - 1);
        histDataInicio.value = formatarDataInput(inicio);
        histDataFim.value = formatarDataInput(fim);
    }

    function mudarAba(nome) {
        abaAtiva = nome === 'historico' ? 'historico' : 'atual';
        const historicoAtivo = abaAtiva === 'historico';
        tabAtual.classList.toggle('active', !historicoAtivo);
        tabHistorico.classList.toggle('active', historicoAtivo);
        abaAtual.classList.toggle('hidden', historicoAtivo);
        abaHistorico.classList.toggle('hidden', !historicoAtivo);
        if (historicoAtivo) {
            if (!lojaSelecionada || lojaSelecionada === '__todas') {
                historicoStatus.className = 'status-bar empty';
                historicoStatus.textContent = 'Selecione uma loja para ver o histórico de estoque.';
            } else if (!historicoTBody.children.length) {
                carregarHistorico(false);
            }
        }
    }

    function parseDataHoraAtualizacao(valor) {
        const txt = String(valor || '').trim();
        if (!txt) return null;

        // Formato esperado: dd/mm/aaaa HH:MM
        const m = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
        if (m) {
            const [, dd, mm, yyyy, hh, mi] = m;
            const dt = new Date(Number(yyyy), Number(mm) - 1, Number(dd), Number(hh), Number(mi), 0, 0);
            return Number.isNaN(dt.getTime()) ? null : dt;
        }

        // Fallback para formatos ISO, se aparecerem futuramente.
        const dtIso = new Date(txt);
        return Number.isNaN(dtIso.getTime()) ? null : dtIso;
    }

    function obterUltimaAtualizacaoDaLoja(lojaNome) {
        if (!lojaNome || lojaNome === '__todas') return null;
        const alvo = String(lojaNome).toLowerCase();
        let ultima = null;

        for (const row of dados) {
            const lojaRow = String(row.loja_sync || row.loja || '').toLowerCase();
            if (lojaRow !== alvo) continue;

            const dt = parseDataHoraAtualizacao(row.last_update);
            if (!dt) continue;
            if (!ultima || dt > ultima) {
                ultima = dt;
            }
        }

        return ultima;
    }

    async function solicitarSyncEstoque(lojaAlvo, isAuto = false) {
        if (!lojaAlvo || lojaAlvo === '__todas') {
            if (!isAuto) {
                alert('Selecione uma loja para atualizar no Bling.');
            }
            return;
        }

        clientId = clientId || obterClientId();
        if (!clientId) {
            window.location.href = '/frontend_index.html';
            return;
        }

        solicitandoSync = true;
        setSyncButton(true);
        iniciarMonitoramentoProgresso();

        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = `${spinnerHtml}${isAuto ? 'Solicitando atualização automática...' : 'Solicitando atualização manual...'}`;

        try {
            const resp = await fetchComTimeout('/api/estoque/sync', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...obterAuthHeaders()
                },
                body: JSON.stringify({ loja: lojaAlvo })
            });

            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                throw new Error(data.detail || `HTTP ${resp.status}`);
            }

            solicitandoSync = false;
            if (data.started || data.already_running) {
                syncEmAndamento = true;
                setSyncButton(true);
                if (data.already_running && data.message) {
                    mostrarStatusCarregando(data.message);
                }
                iniciarMonitoramentoProgresso();
                return;
            }

            syncEmAndamento = false;
            pararMonitoramentoProgresso();
            statusEl.className = 'status-bar error';
            statusEl.textContent = data.message || 'Atualizacao de estoque nao foi iniciada.';
            setSyncButton(false);
        } catch (e) {
            solicitandoSync = false;
            const payload = await verificarProgressoEstoque();
            if (payload && payload.active) {
                return;
            }
            syncEmAndamento = false;
            pararMonitoramentoProgresso();
            statusEl.className = 'status-bar error';
            statusEl.textContent = e.name === 'AbortError'
                ? 'A solicitacao de estoque demorou demais e nao ha atualizacao ativa. Tente novamente em alguns instantes.'
                : `Erro ao sincronizar: ${e.message}`;
            setSyncButton(false);
        }
    }

    function chavePreferenciaLoja() {
        const cid = clientId || obterClientId() || 'anon';
        return `estoque_loja_preferencia_${cid}`;
    }

    function salvarPreferenciaLoja() {
        try {
            localStorage.setItem(chavePreferenciaLoja(), lojaSelecionada || '__todas');
        } catch (_e) {
            // Ignora erro de armazenamento local.
        }
    }

    function carregarPreferenciaLoja() {
        try {
            return localStorage.getItem(chavePreferenciaLoja()) || '__todas';
        } catch (_e) {
            return '__todas';
        }
    }

    function obterClientId() {
        const user = JSON.parse(localStorage.getItem('user_data') || 'null');
        return user && user.client_id ? user.client_id : null;
    }

    function renderResumo(lista) {
        resumo.innerHTML = '';
        const total = lista.length;
        const cards = [
            { label: 'Itens', value: total },
        ];
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<h3>${c.label}</h3><div class="val">${c.value}</div>`;
            resumo.appendChild(div);
        });
    }

    function formatarQtd(valor) {
        const numero = Number(valor || 0);
        if (!Number.isFinite(numero)) return '0';
        return numero.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
    }

    function renderHistoricoResumo(payload) {
        historicoResumo.innerHTML = '';
        const cards = [
            { label: 'Loja', value: payload.loja || lojaSelecionada || '-' },
            { label: 'Base', value: payload.base_snapshot_data || '-' },
            { label: 'SKUs', value: formatarQtd(payload.total_skus || 0) },
        ];
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<h3>${c.label}</h3><div class="val">${c.value}</div>`;
            historicoResumo.appendChild(div);
        });
    }

    function renderHistorico(payload) {
        historicoTHead.innerHTML = '';
        historicoTBody.innerHTML = '';
        renderHistoricoResumo(payload || {});

        const labels = Array.isArray(payload?.labels) ? payload.labels : [];
        const saldos = Array.isArray(payload?.saldo_retroativo) ? payload.saldo_retroativo : [];
        const entradas = Array.isArray(payload?.entradas) ? payload.entradas : [];
        const saidas = Array.isArray(payload?.saidas) ? payload.saidas : [];

        if (!labels.length) {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = payload?.detail || 'Sem histórico para o período selecionado.';
            return;
        }

        const trHead = document.createElement('tr');
        ['Mês', 'Saldo loja', 'Entradas', 'Saídas', 'Variação'].forEach(label => {
            const th = document.createElement('th');
            th.textContent = label;
            trHead.appendChild(th);
        });
        historicoTHead.appendChild(trHead);

        const frag = document.createDocumentFragment();
        labels.forEach((label, idx) => {
            const entrada = Number(entradas[idx] || 0);
            const saida = Number(saidas[idx] || 0);
            const tr = document.createElement('tr');
            [label, formatarQtd(saldos[idx]), formatarQtd(entrada), formatarQtd(saida), formatarQtd(entrada - saida)].forEach(valor => {
                const td = document.createElement('td');
                td.textContent = valor;
                tr.appendChild(td);
            });
            frag.appendChild(tr);
        });
        historicoTBody.appendChild(frag);

        historicoStatus.className = 'status-bar success';
        historicoStatus.textContent = `Histórico carregado: ${labels.length} mês(es).`;
    }

    async function carregarHistorico(exibirStatus = true) {
        if (!lojaSelecionada || lojaSelecionada === '__todas') {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Selecione uma loja para ver o histórico de estoque.';
            return;
        }
        if (exibirStatus) {
            historicoStatus.className = 'status-bar loading';
            historicoStatus.innerHTML = `${spinnerHtml}Carregando histórico mensal...`;
        }
        try {
            const params = new URLSearchParams({
                loja: lojaSelecionada,
                periodo: 'max',
                intervalo: 'mes',
                fonte: 'lancamentos',
                data_inicio: histDataInicio.value || '',
                data_fim: histDataFim.value || ''
            });
            const resp = await fetch(`/api/estoque/serie-retroativa?${params.toString()}`, {
                headers: obterAuthHeaders(),
                cache: 'no-store'
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                throw new Error(data.detail || `HTTP ${resp.status}`);
            }
            renderHistorico(data);
        } catch (e) {
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = `Erro ao carregar histórico: ${e.message}`;
        }
    }

    function renderHistoricoProgresso(progress, logs) {
        if (!progress) return;
        const percent = Math.max(0, Math.min(100, Number(progress.percentual || 0)));
        const logsList = (logs || []).slice(-8).map(l => `<div style="color:#9bd1ff; margin:2px 0;">${l}</div>`).join('');
        historicoStatus.className = 'status-bar loading';
        historicoStatus.innerHTML = `${spinnerHtml}<strong>${progress.mensagem || 'Sincronizando histórico...'}</strong>
            <div style="margin-top:8px;background:#222;border-radius:6px;overflow:hidden;">
                <div style="height:8px;width:${percent}%;background:#4facfe;"></div>
            </div>
            <div style="margin-top:6px;font-size:0.85rem;color:#9bd1ff;">${percent}%</div>
            <div style="margin-top:8px;font-size:0.85rem;">${logsList}</div>`;
    }

    function pararMonitoramentoHistorico() {
        if (historicoProgressTimer) {
            clearInterval(historicoProgressTimer);
            historicoProgressTimer = null;
        }
    }

    async function verificarProgressoHistorico() {
        try {
            const resp = await fetchComTimeout('/api/estoque/lancamentos/sync-lote/progress', { headers: obterAuthHeaders(), cache: 'no-store' }, SYNC_PROGRESS_TIMEOUT_MS);
            if (!resp.ok) return null;
            const payload = await resp.json();
            const progress = payload.progress;
            const active = !!payload.active;
            if (progress && (active || !historicoSolicitandoSync)) {
                renderHistoricoProgresso(progress, payload.logs || []);
            }

            historicoSyncEmAndamento = active;
            setHistoricoButtons(historicoSyncEmAndamento || historicoSolicitandoSync);

            if (!active && progress && !historicoSolicitandoSync) {
                if (Number(progress.percentual || 0) >= 100) {
                    historicoStatus.className = 'status-bar success';
                    historicoStatus.textContent = `${progress.mensagem || 'Registros sincronizados.'}`;
                    await carregarHistorico(false);
                } else if ((progress.etapa || '').toLowerCase() === 'erro') {
                    historicoStatus.className = 'status-bar error';
                    historicoStatus.textContent = `${progress.mensagem || 'Falha ao sincronizar histórico.'}`;
                }
                pararMonitoramentoHistorico();
            }
            return payload;
        } catch (_e) {
            return null;
        }
    }

    function iniciarMonitoramentoHistorico() {
        pararMonitoramentoHistorico();
        historicoProgressTimer = setInterval(verificarProgressoHistorico, 2500);
        verificarProgressoHistorico();
    }

    async function sincronizarHistorico() {
        if (!lojaSelecionada || lojaSelecionada === '__todas') {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Selecione uma loja para sincronizar os registros históricos.';
            return;
        }

        historicoSolicitandoSync = true;
        setHistoricoButtons(true);
        iniciarMonitoramentoHistorico();
        historicoStatus.className = 'status-bar loading';
        historicoStatus.innerHTML = `${spinnerHtml}Solicitando sincronização de registros...`;

        try {
            const resp = await fetchComTimeout('/api/estoque/lancamentos/sync-lote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...obterAuthHeaders()
                },
                body: JSON.stringify({
                    loja: lojaSelecionada,
                    data_inicio: histDataInicio.value || null,
                    data_fim: histDataFim.value || null
                })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                throw new Error(data.detail || `HTTP ${resp.status}`);
            }

            historicoSolicitandoSync = false;
            if (data.started || data.already_running) {
                historicoSyncEmAndamento = true;
                if (data.already_running && data.message) {
                    historicoStatus.className = 'status-bar loading';
                    historicoStatus.innerHTML = `${spinnerHtml}${data.message}`;
                }
                iniciarMonitoramentoHistorico();
                return;
            }

            historicoSyncEmAndamento = false;
            pararMonitoramentoHistorico();
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = data.message || 'Sincronização de registros não foi iniciada.';
            setHistoricoButtons(false);
        } catch (e) {
            historicoSolicitandoSync = false;
            const payload = await verificarProgressoHistorico();
            if (payload && payload.active) {
                return;
            }
            historicoSyncEmAndamento = false;
            pararMonitoramentoHistorico();
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = e.name === 'AbortError'
                ? 'A solicitação demorou demais e não há sincronização ativa. Tente novamente.'
                : `Erro ao sincronizar registros: ${e.message}`;
            setHistoricoButtons(false);
        }
    }

    function renderTabela(lista) {
        tHead.innerHTML = '';
        tBody.innerHTML = '';
        if (!lista.length) {
            statusEl.className = 'status-bar empty';
            statusEl.textContent = 'Nenhum registro encontrado.';
            atualizarPaginacao(0, 0);
            return;
        }
        if (!syncEmAndamento) {
            statusEl.className = 'status-bar';
            statusEl.textContent = '';
        }
        const cols = Object.keys(lista[0]);
        const trHead = document.createElement('tr');
        cols.forEach(col => {
            const th = document.createElement('th');
            th.textContent = String(col || '').replace(/_/g, ' ').toLocaleUpperCase('pt-BR');
            trHead.appendChild(th);
        });
        tHead.appendChild(trHead);

        const frag = document.createDocumentFragment();
        lista.forEach(item => {
            const tr = document.createElement('tr');
            cols.forEach(col => {
                const td = document.createElement('td');
                td.textContent = item[col];
                tr.appendChild(td);
            });
            frag.appendChild(tr);
        });
        tBody.appendChild(frag);
    }

    function obterSku(row) {
        return String(row.sku || row.SKU || row.codigo || row.Codigo || '').trim();
    }

    function obterNumeroSku(sku) {
        const txt = String(sku || '').trim();
        if (/^\d+(?:[.,]\d+)?$/.test(txt)) {
            return Number(txt.replace(',', '.'));
        }
        const match = txt.match(/\d+/);
        return match ? Number(match[0]) : Number.NEGATIVE_INFINITY;
    }

    function obterDataOrdenacao(row) {
        const campos = ['data_criacao', 'created_at', 'last_update', 'Atualizado em'];
        for (const campo of campos) {
            if (!row || row[campo] === undefined || row[campo] === null || row[campo] === '') continue;
            const dt = parseDataHoraAtualizacao(row[campo]);
            if (dt) return dt.getTime();
        }
        return 0;
    }

    function obterNumeroCampo(valor) {
        if (typeof valor === 'number') return Number.isFinite(valor) ? valor : 0;
        const txt = String(valor || '').trim();
        if (!txt) return 0;
        const normalizado = txt.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
        const numero = Number(normalizado);
        return Number.isFinite(numero) ? numero : 0;
    }

    function obterQuantidadeEstoque(row) {
        if (!row) return 0;
        const camposTotal = ['saldo_total', 'estoque_total', 'total_estoque', 'quantidade', 'Quantidade', 'estoque'];
        for (const campo of camposTotal) {
            if (row[campo] !== undefined && row[campo] !== null && row[campo] !== '') {
                return obterNumeroCampo(row[campo]);
            }
        }
        return obterNumeroCampo(row.saldo_loja) + obterNumeroCampo(row.saldo_full);
    }

    function obterNomeLoja(row) {
        return String(row?.loja_sync || row?.loja || 'Desconhecida').trim();
    }

    function normalizarLoja(valor) {
        return String(valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();
    }

    function ordenarLista(lista) {
        const modo = ordenarPor.value || 'data_atual';
        return lista
            .map((item, indice) => ({ item, indice }))
            .sort((a, b) => {
                if (modo === 'loja_az' || modo === 'loja_za') {
                    const lojaA = obterNomeLoja(a.item);
                    const lojaB = obterNomeLoja(b.item);
                    const cmpLojaBase = lojaA.localeCompare(lojaB, 'pt-BR', { numeric: true, sensitivity: 'base' });
                    const cmpLoja = modo === 'loja_za' ? -cmpLojaBase : cmpLojaBase;
                    if (cmpLoja) return cmpLoja;
                    const cmpSku = obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmpSku || a.indice - b.indice;
                }

                if (modo === 'sku_az') {
                    const cmp = obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmp || a.indice - b.indice;
                }

                if (modo === 'sku_desc') {
                    const skuA = obterSku(a.item);
                    const skuB = obterSku(b.item);
                    const numCmp = obterNumeroSku(skuB) - obterNumeroSku(skuA);
                    if (numCmp) return numCmp;
                    const cmp = skuB.localeCompare(skuA, 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmp || a.indice - b.indice;
                }

                if (modo === 'estoque_desc' || modo === 'estoque_asc') {
                    const qtdA = obterQuantidadeEstoque(a.item);
                    const qtdB = obterQuantidadeEstoque(b.item);
                    const qtdCmp = modo === 'estoque_desc' ? qtdB - qtdA : qtdA - qtdB;
                    return qtdCmp || obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' }) || a.indice - b.indice;
                }

                const dataCmp = obterDataOrdenacao(b.item) - obterDataOrdenacao(a.item);
                return dataCmp || a.indice - b.indice;
            })
            .map(({ item }) => item);
    }

    function atualizarPaginacao(totalItens, totalPaginas) {
        if (!totalItens || totalPaginas <= 1) {
            paginacaoEl.style.display = 'none';
            return;
        }

        paginacaoEl.style.display = 'flex';
        btnPaginaAnterior.disabled = paginaAtual <= 1;
        btnPaginaProxima.disabled = paginaAtual >= totalPaginas;

        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA + 1;
        const fim = Math.min(paginaAtual * ITENS_POR_PAGINA, totalItens);
        pageInfo.textContent = `Mostrando ${inicio}-${fim} de ${totalItens} SKUs (página ${paginaAtual}/${totalPaginas})`;
    }

    function filtrar() {
        const termo = filtroTexto.value.trim().toLowerCase();
        let lista = dados;

        if (lojaSelecionada && lojaSelecionada !== '__todas') {
            lista = lista.filter(row => {
                const loja = normalizarLoja(row.loja_sync || row.loja || '');
                return loja === normalizarLoja(lojaSelecionada);
            });
        }

        if (termo) {
            lista = lista.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(termo)));
        }

        lista = ordenarLista(lista);

        renderResumo(lista);
        const totalItens = lista.length;
        const totalPaginas = Math.max(1, Math.ceil(totalItens / ITENS_POR_PAGINA));
        if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
        if (paginaAtual < 1) paginaAtual = 1;

        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const listaPaginada = lista.slice(inicio, inicio + ITENS_POR_PAGINA);
        renderTabela(listaPaginada);
        atualizarPaginacao(totalItens, totalPaginas);
    }

    function renderBotoesLojas(lojas) {
        lojaBotoes.innerHTML = '';
        const lojasNomes = new Set(lojas.map(l => l.nome));
        if (lojaSelecionada !== '__todas' && !lojasNomes.has(lojaSelecionada)) {
            lojaSelecionada = '__todas';
        }

        const todosBtn = document.createElement('button');
        todosBtn.textContent = 'Todas as lojas';
        todosBtn.className = 'loja-btn' + (lojaSelecionada === '__todas' ? ' active' : '');
        todosBtn.onclick = () => {
            lojaSelecionada = '__todas';
            salvarPreferenciaLoja();
            paginaAtual = 1;
            atualizarSelecao();
        };
        lojaBotoes.appendChild(todosBtn);

        lojas.forEach(l => {
            const btn = document.createElement('button');
            btn.textContent = l.nome;
            btn.className = 'loja-btn' + (lojaSelecionada === l.nome ? ' active' : '');
            btn.onclick = () => {
                lojaSelecionada = l.nome;
                salvarPreferenciaLoja();
                paginaAtual = 1;
                atualizarSelecao();
            };
            lojaBotoes.appendChild(btn);
        });
    }

    function atualizarSelecao() {
        Array.from(lojaBotoes.children).forEach(btn => {
            btn.classList.toggle('active', btn.textContent === 'Todas as lojas' ? lojaSelecionada === '__todas' : btn.textContent === lojaSelecionada);
        });
        filtrar();
        if (abaAtiva === 'historico') {
            historicoTHead.innerHTML = '';
            historicoTBody.innerHTML = '';
            historicoResumo.innerHTML = '';
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = lojaSelecionada === '__todas'
                ? 'Selecione uma loja para ver o histórico de estoque.'
                : 'Loja alterada. Clique em carregar histórico.';
        }
    }

    async function carregarLojas() {
        try {
            clientId = obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }
            const resp = await fetch('/api/lojas', { headers: obterAuthHeaders() });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const lojas = await resp.json();
            lojasDisponiveis = Array.isArray(lojas) ? lojas : [];
            lojaSelecionada = carregarPreferenciaLoja();
            renderBotoesLojas(lojas);
            salvarPreferenciaLoja();
        } catch (e) {
            statusEl.className = 'status-bar error';
            statusEl.textContent = `Erro ao carregar lojas: ${e.message}`;
        }
    }

    async function carregar(exibirStatus = true) {
        if (exibirStatus && !syncEmAndamento) {
            statusEl.className = 'status-bar loading';
            statusEl.innerHTML = `${spinnerHtml}Carregando estoque...`;
        }
        try {
            clientId = clientId || obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }
            const resp = await fetch('/api/estoque', { headers: obterAuthHeaders() });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            dados = await resp.json();
            filtrar();
            if (exibirStatus && !syncEmAndamento) {
                statusEl.className = 'status-bar';
                statusEl.textContent = '';
            }
        } catch (e) {
            statusEl.className = 'status-bar error';
            statusEl.textContent = `Erro ao carregar estoque: ${e.message}`;
        }
    }

    filtroTexto.addEventListener('input', () => {
        paginaAtual = 1;
        filtrar();
    });

    ordenarPor.addEventListener('change', () => {
        paginaAtual = 1;
        filtrar();
    });

    btnPaginaAnterior.addEventListener('click', () => {
        if (paginaAtual > 1) {
            paginaAtual -= 1;
            filtrar();
        }
    });

    btnPaginaProxima.addEventListener('click', () => {
        paginaAtual += 1;
        filtrar();
    });
    btnSync.addEventListener('click', async () => {
        await solicitarSyncEstoque(lojaSelecionada, false);
    });
    tabAtual.addEventListener('click', () => mudarAba('atual'));
    tabHistorico.addEventListener('click', () => mudarAba('historico'));
    btnHistoricoCarregar.addEventListener('click', () => carregarHistorico(true));
    btnHistoricoSync.addEventListener('click', () => sincronizarHistorico());

    async function inicializarPaginaEstoque() {
        inicializarDatasHistorico();
        await carregarConfiguracoesGlobais();
        await carregarLojas();
        await carregar();

        const lojaAuto = lojaSelecionada !== '__todas'
            ? lojaSelecionada
            : (lojasDisponiveis[0] && lojasDisponiveis[0].nome ? lojasDisponiveis[0].nome : null);

        if (!autoSyncSolicitado && lojaAuto) {
            autoSyncSolicitado = true;
            const ultimaAtualizacao = obterUltimaAtualizacaoDaLoja(lojaAuto);
            if (ultimaAtualizacao) {
                const diffMin = (Date.now() - ultimaAtualizacao.getTime()) / 60000;
                if (diffMin < janelaAutoSyncMinutos) {
                    statusEl.className = 'status-bar';
                    statusEl.textContent = `Última atualização de ${lojaAuto} foi há ${Math.max(1, Math.round(diffMin))} min. Auto-atualização ignorada.`;
                    return;
                }
            }

            await solicitarSyncEstoque(lojaAuto, true);
        }
    }

    inicializarPaginaEstoque();

</script>
