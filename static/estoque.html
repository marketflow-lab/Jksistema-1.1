<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - JK Sistema</title>
    <style>
        body { margin:0; padding:20px; background:#0e1117; color:#e5e5e5; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:20px; }
        .back-btn { padding:8px 14px; background:#4facfe; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold; }
        .back-btn:hover { background:#0073e6; }
        h1 { margin:0; }
        .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; align-items:center; }
        input, select { padding:8px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; }
        .loja-group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .loja-btn { padding:8px 12px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; }
        .loja-btn.active { background:#4facfe; color:#0e1117; border-color:#4facfe; font-weight:bold; }
        table { width:100%; border-collapse:collapse; background:#1c1f2b; border:1px solid #222; }
        th, td { padding:10px; border-bottom:1px solid #222; text-align:left; font-size:0.95rem; }
        th { background:#161925; color:#9bd1ff; position:sticky; top:0; z-index:1; }
        tr:hover { background:#1f2331; }
        .summary { display:flex; gap:16px; margin-bottom:15px; flex-wrap:wrap; }
        .card { background:#1c1f2b; border:1px solid #222; padding:12px 14px; border-radius:8px; min-width:140px; }
        .card h3 { margin:0 0 6px 0; font-size:0.95rem; color:#9bd1ff; }
        .card .val { font-size:1.2rem; font-weight:bold; }
        .status-bar { margin:10px 0; padding:10px 12px; border-radius:8px; background:#161925; border:1px solid #222; min-height:20px; }
        .status-bar.loading { color:#9bd1ff; border-color:#4facfe; background:#0a1428; }
        .status-bar.error { color:#ff6b6b; border-color:#c62828; background:#28010d; }
        .status-bar.warning { color:#ffcc80; border-color:#ef6c00; background:#2b1700; }
        .status-bar.success { color:#66bb6a; border-color:#1b5e20; background:#0f2e0d; }
        .status-bar.empty { color:#aaa; }
        .sync-account-result.loading { color:#9bd1ff; }
        .sync-account-result.warning { color:#ffcc80; }
        .sync-account-result.error { color:#ff8a80; }
        .sync-account-result.success { color:#81c784; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid #4facfe; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .paginacao { display:flex; align-items:center; gap:10px; margin:12px 0; flex-wrap:wrap; }
        .page-btn { padding:6px 10px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; }
        .page-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .page-info { color:#9bd1ff; font-size:0.92rem; }
        #btnSync:disabled { opacity:0.6; cursor:not-allowed; }
        .tabs { display:flex; gap:8px; margin:0 0 14px 0; flex-wrap:wrap; }
        .tab-btn { padding:9px 14px; border-radius:6px; border:1px solid #333; background:#1c1f2b; color:#e5e5e5; cursor:pointer; font-weight:700; }
        .tab-btn.active { background:#4facfe; color:#0e1117; border-color:#4facfe; }
        .aba-conteudo.hidden { display:none; }
        .filters label, .history-actions label { display:flex; align-items:center; gap:6px; color:#9bd1ff; font-size:0.92rem; }
        .history-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:15px; }
        .history-view-options { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:-3px 0 15px; padding:10px 12px; border:1px solid #222; border-radius:8px; background:#161925; }
        .history-view-options label { display:flex; align-items:center; gap:6px; color:#d8ecff; font-size:0.92rem; }
        .history-view-options input[type="checkbox"] { width:17px; height:17px; accent-color:#4facfe; }
        .history-view-options input:disabled { opacity:0.55; cursor:not-allowed; }
        .history-help { flex-basis:100%; margin:0; color:#aab8c5; font-size:0.84rem; }
        .history-table th, .history-table td { text-align:right; }
        .history-table th:first-child, .history-table td:first-child { text-align:left; }
        .history-table .history-separator { border-left:2px solid #37536b; }
        #btnHistoricoSync:disabled, #btnHistoricoCarregar:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
    <script src="/auth.js?v=20260828-cadastro-fotos-lojas-v1"></script>
    <script src="/ncm-sync.js"></script>
    <script src="/global-status.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Estoque</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <a class="back-btn" href="/dashboard.html">Home</a>
            <a class="back-btn" href="/dashboard.html">Voltar</a>
        </div>
    </div>

    <div id="status" class="status-bar"></div>

    <div class="tabs" role="tablist" aria-label="Visões de estoque">
        <button id="tabAtual" class="tab-btn active" type="button" role="tab" tabindex="0" aria-selected="true" aria-controls="abaAtual">Estoque atual</button>
        <button id="tabHistorico" class="tab-btn" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="abaHistorico">Histórico de estoque</button>
    </div>

    <div class="filters">
        <div class="loja-group" id="lojaBotoes" aria-label="Selecionar loja"></div>
    </div>

    <section id="abaAtual" class="aba-conteudo" role="tabpanel" aria-labelledby="tabAtual">
        <div class="filters">
            <button id="btnSync" class="back-btn" style="background:#28a745;">Atualizar estoque</button>
            <input type="text" id="filtroTexto" placeholder="Buscar por SKU, título ou código" aria-label="Filtro de texto">
            <select id="ordenarPor" aria-label="Organizar SKUs">
                <option value="loja_az">Loja (A-Z)</option>
                <option value="loja_za">Loja (Z-A)</option>
                <option value="data_atual">Data da atualização (atual)</option>
                <option value="sku_az">SKU alfabético (A-Z)</option>
                <option value="sku_desc">SKU maior para menor</option>
                <option value="estoque_desc">Estoque maior para menor</option>
                <option value="estoque_asc">Estoque menor para maior</option>
            </select>
        </div>

        <div class="summary" id="resumo"></div>

        <div class="table-wrapper">
            <table>
                <thead id="tHead"></thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>

        <div class="paginacao" id="paginacao" style="display:none;">
            <button id="btnPaginaAnterior" class="page-btn">Anterior</button>
            <span id="pageInfo" class="page-info"></span>
            <button id="btnPaginaProxima" class="page-btn">Próxima</button>
        </div>
    </section>

    <section id="abaHistorico" class="aba-conteudo hidden" role="tabpanel" aria-labelledby="tabHistorico">
        <div class="history-actions">
            <label>Início <input type="date" id="histDataInicio"></label>
            <label>Fim <input type="date" id="histDataFim"></label>
            <label>Agrupar
                <select id="histIntervalo" aria-label="Agrupamento do histórico">
                    <option value="atualizacao">Por atualização</option>
                    <option value="dia">Dia</option>
                    <option value="semana">Semana</option>
                    <option value="mes" selected>Mês</option>
                </select>
            </label>
            <button id="btnHistoricoCarregar" class="back-btn" type="button">Carregar histórico</button>
            <button id="btnHistoricoSync" class="back-btn" style="background:#28a745;" type="button">Sincronizar registros</button>
        </div>

        <div class="history-view-options" role="group" aria-labelledby="histVisualizacaoTitulo">
            <strong id="histVisualizacaoTitulo">Visualização</strong>
            <label><input type="checkbox" id="histIncluirGeral" checked> Total geral da loja</label>
            <label><input type="checkbox" id="histIncluirSku"> SKU individual</label>
            <label for="histSkuInput">SKU
                <input type="search" id="histSkuInput" list="histSkuOpcoes" placeholder="Digite ou selecione" autocomplete="off" disabled aria-describedby="histEscopoAjuda">
            </label>
            <datalist id="histSkuOpcoes"></datalist>
            <p id="histEscopoAjuda" class="history-help">Os valores exibidos são do saldo da loja. O estoque Full permanece separado.</p>
        </div>

        <div id="historicoStatus" class="status-bar" role="status" aria-live="polite"></div>
        <div class="summary" id="historicoResumo"></div>

        <div class="table-wrapper">
            <table class="history-table">
                <thead id="historicoTHead"></thead>
                <tbody id="historicoTBody"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
    const tHead = document.getElementById('tHead');
    const tBody = document.getElementById('tBody');
    const resumo = document.getElementById('resumo');
    const statusEl = document.getElementById('status');
    const filtroTexto = document.getElementById('filtroTexto');
    const ordenarPor = document.getElementById('ordenarPor');
    const lojaBotoes = document.getElementById('lojaBotoes');
    const btnSync = document.getElementById('btnSync');
    const paginacaoEl = document.getElementById('paginacao');
    const btnPaginaAnterior = document.getElementById('btnPaginaAnterior');
    const btnPaginaProxima = document.getElementById('btnPaginaProxima');
    const pageInfo = document.getElementById('pageInfo');
    const tabAtual = document.getElementById('tabAtual');
    const tabHistorico = document.getElementById('tabHistorico');
    const abaAtual = document.getElementById('abaAtual');
    const abaHistorico = document.getElementById('abaHistorico');
    const histDataInicio = document.getElementById('histDataInicio');
    const histDataFim = document.getElementById('histDataFim');
    const histIntervalo = document.getElementById('histIntervalo');
    const histIncluirGeral = document.getElementById('histIncluirGeral');
    const histIncluirSku = document.getElementById('histIncluirSku');
    const histSkuInput = document.getElementById('histSkuInput');
    const histSkuOpcoes = document.getElementById('histSkuOpcoes');
    const btnHistoricoCarregar = document.getElementById('btnHistoricoCarregar');
    const btnHistoricoSync = document.getElementById('btnHistoricoSync');
    const historicoStatus = document.getElementById('historicoStatus');
    const historicoResumo = document.getElementById('historicoResumo');
    const historicoTHead = document.getElementById('historicoTHead');
    const historicoTBody = document.getElementById('historicoTBody');
    const spinnerHtml = '<span class="spinner"></span>';
    let dados = [];
    let clientId = null;
    let lojaSelecionada = '__todas';
    let lojasDisponiveis = [];
    let paginaAtual = 1;
    const ITENS_POR_PAGINA = 50;
    const SYNC_SOLICITACAO_TIMEOUT_MS = 15000;
    const SYNC_PROGRESS_TIMEOUT_MS = 8000;
    let syncEmAndamento = false;
    let solicitandoSync = false;
    let syncFinalizacaoProcessada = false;
    let syncGeracaoAtual = 0;
    let syncJobIdAtual = '';
    let syncPollEmAndamento = null;
    let progressTimer = null;
    let autoSyncSolicitado = false;
    let janelaAutoSyncMinutos = 30;
    let abaAtiva = 'atual';
    let historicoSyncEmAndamento = false;
    let historicoSolicitandoSync = false;
    let historicoProgressTimer = null;
    let historicoRequestSeq = 0;
    let historicoAbortController = null;

    async function carregarConfiguracoesGlobais() {
        try {
            const resp = await fetch('/api/configuracoes', { headers: obterAuthHeaders(), cache: 'no-store' });
            if (!resp.ok) return;
            const cfg = await resp.json();
            const janela = Number(cfg && cfg.auto_sync_estoque_janela_minutos);
            if (Number.isFinite(janela) && janela >= 1) {
                janelaAutoSyncMinutos = Math.round(janela);
            }
        } catch (_e) {
            // Mantém fallback local caso endpoint/configuração não esteja disponível.
        }
    }

    function setSyncButton(isSyncing) {
        btnSync.disabled = isSyncing;
        btnSync.textContent = isSyncing ? 'Atualizando...' : 'Atualizar estoque';
    }

    function setHistoricoButtons(isSyncing) {
        btnHistoricoSync.disabled = isSyncing;
        btnHistoricoCarregar.disabled = isSyncing;
        btnHistoricoSync.textContent = isSyncing ? 'Sincronizando...' : 'Sincronizar registros';
    }

    function mostrarStatusCarregando(mensagem) {
        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = spinnerHtml;
        statusEl.appendChild(document.createTextNode(mensagem));
    }

    async function fetchComTimeout(url, options = {}, timeoutMs = SYNC_SOLICITACAO_TIMEOUT_MS) {
        if (!window.AbortController) {
            return fetch(url, options);
        }
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    function escaparHtmlSync(valor) {
        return String(valor ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function normalizarOutcomeSync(syncMeta) {
        return String(syncMeta?.outcome || '').trim().toLowerCase();
    }

    function normalizarJobIdSync(valor) {
        return typeof valor === 'string' ? valor.trim() : '';
    }

    function jobIdPayloadSync(payload) {
        return normalizarJobIdSync(payload?.sync_meta?.job_id);
    }

    function resultadosContasSync(syncMeta) {
        return Array.isArray(syncMeta?.resultados)
            ? syncMeta.resultados.filter(item => item && typeof item === 'object')
            : [];
    }

    function textoMensagemSync(valor, profundidade = 0) {
        if (valor === null || valor === undefined) return '';
        if (typeof valor === 'string' || typeof valor === 'number' || typeof valor === 'boolean') {
            return String(valor).trim();
        }
        if (typeof valor !== 'object' || profundidade >= 3) return '';
        for (const chave of ['message', 'detail', 'mensagem', 'error', 'erro']) {
            const texto = textoMensagemSync(valor[chave], profundidade + 1);
            if (texto) return texto;
        }
        return '';
    }

    function primeiraMensagemSync(...valores) {
        for (const valor of valores) {
            const texto = textoMensagemSync(valor);
            if (texto) return texto;
        }
        return '';
    }

    function classificarResultadoContaSync(resultado) {
        const outcome = String(resultado?.outcome || resultado?.status || '').trim().toLowerCase();
        if (['queued', 'running'].includes(outcome)) return { classe: 'loading', icone: '…' };
        if (resultado?.success === true || ['completed', 'success', 'sucesso'].includes(outcome)) {
            return { classe: 'success', icone: '✓' };
        }
        if (outcome === 'partial') return { classe: 'warning', icone: '⚠' };
        if (outcome === 'cancelled') return { classe: 'error', icone: '■' };
        return { classe: 'error', icone: '✕' };
    }

    function resumoContasSync(syncMeta) {
        const resultados = resultadosContasSync(syncMeta);
        if (!resultados.length) return '';
        const linhas = resultados.map(resultado => {
            const classificacao = classificarResultadoContaSync(resultado);
            const loja = resultado.loja || resultado.nome || resultado.store_name || resultado.store_id || 'Conta';
            const mensagem = primeiraMensagemSync(
                resultado.mensagem,
                resultado.message,
                resultado.error,
                resultado.erro,
                resultado.detail,
            );
            const complemento = mensagem ? ` — ${escaparHtmlSync(mensagem)}` : '';
            return `<div class="sync-account-result ${classificacao.classe}" style="margin-top:4px;">${classificacao.icone} <strong>${escaparHtmlSync(loja)}</strong>${complemento}</div>`;
        }).join('');
        return `<div class="sync-account-results" style="margin-top:10px;"><strong>Resumo por conta (${resultados.length})</strong>${linhas}</div>`;
    }

    function classificarFinalSync(payload) {
        const progress = payload?.progress || {};
        const syncMeta = payload?.sync_meta || {};
        const outcome = normalizarOutcomeSync(syncMeta);
        const mensagem = fallback => primeiraMensagemSync(
            syncMeta.mensagem,
            syncMeta.message,
            syncMeta.error,
            syncMeta.erro,
            syncMeta.detail,
            progress.mensagem,
            fallback,
        );
        if (outcome === 'completed') {
            return { terminal: true, classe: 'success', mensagem: mensagem('Estoque atualizado.') };
        }
        if (outcome === 'partial') {
            return { terminal: true, classe: 'warning', mensagem: mensagem('Atualização concluída parcialmente. Confira as contas abaixo.') };
        }
        if (outcome === 'failed') {
            return { terminal: true, classe: 'error', mensagem: mensagem('Falha na atualização do estoque.') };
        }
        if (outcome === 'cancelled') {
            return { terminal: true, classe: 'error', mensagem: mensagem('Atualização de estoque cancelada.') };
        }
        if (['running', 'queued'].includes(outcome)) {
            return payload?.active
                ? { terminal: false, classe: 'loading', mensagem: mensagem('Atualizando estoque...') }
                : { terminal: true, classe: 'error', mensagem: 'A atualização terminou sem resultado conclusivo.' };
        }

        const etapa = String(progress.etapa || '').trim().toLowerCase();
        if (etapa === 'erro') {
            return { terminal: true, classe: 'error', mensagem: mensagem('Falha na atualização do estoque.') };
        }
        if (Number(progress.percentual || 0) >= 100) {
            return { terminal: true, classe: 'success', mensagem: mensagem('Estoque atualizado.') };
        }
        return { terminal: true, classe: 'error', mensagem: 'A atualização terminou sem resultado conclusivo.' };
    }

    function renderProgresso(progress, logs, syncMeta) {
        if (!progress) return;
        const percent = Math.max(0, Math.min(100, Number(progress.percentual || 0)));
        const logsList = (logs || []).slice(-8).map(l => `<div style="color:#9bd1ff; margin:2px 0;">${escaparHtmlSync(l)}</div>`).join('');
        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = `${spinnerHtml}<strong>${escaparHtmlSync(progress.mensagem || 'Atualizando estoque...')}</strong>
            <div style="margin-top:8px;background:#222;border-radius:6px;overflow:hidden;">
                <div style="height:8px;width:${percent}%;background:#4facfe;"></div>
            </div>
            <div style="margin-top:6px;font-size:0.85rem;color:#9bd1ff;">${percent}%</div>
            ${resumoContasSync(syncMeta)}
            <div style="margin-top:8px;font-size:0.85rem;">${logsList}</div>`;
    }

    function renderFinalSync(final, syncMeta) {
        statusEl.className = `status-bar ${final.classe}`;
        statusEl.innerHTML = `<strong>${escaparHtmlSync(final.mensagem)}</strong>${resumoContasSync(syncMeta || {})}`;
    }

    function pararMonitoramentoProgresso() {
        if (progressTimer) {
            clearTimeout(progressTimer);
            progressTimer = null;
        }
    }

    function contextoSyncAtual(geracaoSync, jobIdEsperado, aceitarFinalizado = false) {
        const jobId = normalizarJobIdSync(jobIdEsperado);
        return geracaoSync === syncGeracaoAtual
            && !!jobId
            && jobId === syncJobIdAtual
            && (aceitarFinalizado || !syncFinalizacaoProcessada);
    }

    async function verificarProgressoEstoque(geracaoSync = syncGeracaoAtual, jobIdEsperado = syncJobIdAtual) {
        if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return null;
        if (syncPollEmAndamento
            && syncPollEmAndamento.geracao === geracaoSync
            && syncPollEmAndamento.jobId === jobIdEsperado) {
            return null;
        }
        const tokenPoll = { geracao: geracaoSync, jobId: jobIdEsperado };
        syncPollEmAndamento = tokenPoll;
        try {
            const progressUrl = `/api/estoque/sync/progress?job_id=${encodeURIComponent(jobIdEsperado)}`;
            const resp = await fetchComTimeout(progressUrl, { headers: obterAuthHeaders(), cache: 'no-store' }, SYNC_PROGRESS_TIMEOUT_MS);
            if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return null;
            if (!resp.ok) {
                if (resp.status === 404 || resp.status === 410) {
                    const erroPayload = await resp.json().catch(() => ({}));
                    if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return null;
                    syncFinalizacaoProcessada = true;
                    pararMonitoramentoProgresso();
                    syncEmAndamento = false;
                    setSyncButton(false);
                    statusEl.className = 'status-bar error';
                    statusEl.textContent = primeiraMensagemSync(
                        erroPayload.detail,
                        erroPayload.error,
                        erroPayload.message,
                        'Não foi possível recuperar o resultado desta atualização de estoque.',
                    );
                }
                return null;
            }
            const payload = await resp.json();
            if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return null;
            if (jobIdPayloadSync(payload) !== jobIdEsperado) return null;
            const progress = payload.progress;
            const active = !!payload.active;
            if (progress) {
                renderProgresso(progress, payload.logs || [], payload.sync_meta || {});
            }

            if (active) {
                syncEmAndamento = true;
                setSyncButton(true);
            }

            if (!active && (progress || payload.sync_meta)) {
                const final = classificarFinalSync(payload);
                if (!final.terminal) return payload;
                syncFinalizacaoProcessada = true;
                pararMonitoramentoProgresso();
                syncEmAndamento = true;
                renderFinalSync(final, payload.sync_meta || {});
                const estoqueRecarregado = await carregar(false);
                if (contextoSyncAtual(geracaoSync, jobIdEsperado, true) && syncFinalizacaoProcessada) {
                    syncEmAndamento = false;
                    setSyncButton(false);
                    if (estoqueRecarregado) {
                        renderFinalSync(final, payload.sync_meta || {});
                    }
                }
            }
            return payload;
        } catch (_e) {
            // Falha momentânea de rede durante polling; tenta novamente no próximo ciclo.
            return null;
        } finally {
            if (syncPollEmAndamento === tokenPoll) {
                syncPollEmAndamento = null;
            }
        }
    }

    function iniciarMonitoramentoProgresso(geracaoSync = syncGeracaoAtual, jobIdEsperado = syncJobIdAtual) {
        pararMonitoramentoProgresso();
        if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return;
        const executarCiclo = async () => {
            progressTimer = null;
            if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return;
            await verificarProgressoEstoque(geracaoSync, jobIdEsperado);
            if (!contextoSyncAtual(geracaoSync, jobIdEsperado)) return;
            progressTimer = setTimeout(executarCiclo, 2500);
        };
        progressTimer = setTimeout(executarCiclo, 0);
    }

    async function adotarSincronizacaoEstoqueAtiva() {
        try {
            const resp = await fetchComTimeout(
                '/api/estoque/sync/progress',
                { headers: obterAuthHeaders(), cache: 'no-store' },
                SYNC_PROGRESS_TIMEOUT_MS,
            );
            if (!resp.ok) return false;
            const payload = await resp.json();
            const jobId = jobIdPayloadSync(payload);
            if (!payload.active || !jobId) return false;

            const geracaoSync = syncGeracaoAtual + 1;
            syncGeracaoAtual = geracaoSync;
            syncJobIdAtual = jobId;
            syncFinalizacaoProcessada = false;
            syncEmAndamento = true;
            solicitandoSync = false;
            setSyncButton(true);
            if (payload.progress) {
                renderProgresso(payload.progress, payload.logs || [], payload.sync_meta || {});
            } else {
                mostrarStatusCarregando('Atualização de estoque já em andamento.');
            }
            iniciarMonitoramentoProgresso(geracaoSync, jobId);
            return true;
        } catch (_e) {
            return false;
        }
    }

    function formatarDataInput(dt) {
        const yyyy = dt.getFullYear();
        const mm = String(dt.getMonth() + 1).padStart(2, '0');
        const dd = String(dt.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function inicializarDatasHistorico() {
        const fim = new Date();
        const inicio = new Date();
        inicio.setFullYear(inicio.getFullYear() - 1);
        histDataInicio.value = formatarDataInput(inicio);
        histDataFim.value = formatarDataInput(fim);
    }

    function invalidarConsultaHistorico() {
        historicoRequestSeq += 1;
        if (historicoAbortController) historicoAbortController.abort();
        historicoAbortController = null;
    }

    function assinaturaEstadoHistorico() {
        return JSON.stringify({
            loja: lojaSelecionada,
            data_inicio: histDataInicio.value || '',
            data_fim: histDataFim.value || '',
            intervalo: histIntervalo.value,
            incluir_geral: histIncluirGeral.checked,
            incluir_sku: histIncluirSku.checked,
            sku: histSkuInput.value.trim()
        });
    }

    function consultaHistoricoObsoleta(requestSeq, requestSeqAtual, assinaturaInicial, assinaturaAtual) {
        return requestSeq !== requestSeqAtual || assinaturaInicial !== assinaturaAtual;
    }

    function indiceTabDestinoPorTecla(tecla, indiceAtual, total) {
        if (!Number.isInteger(total) || total <= 0) return indiceAtual;
        if (tecla === 'Home') return 0;
        if (tecla === 'End') return total - 1;
        if (tecla === 'ArrowRight') return (indiceAtual + 1) % total;
        if (tecla === 'ArrowLeft') return (indiceAtual - 1 + total) % total;
        return indiceAtual;
    }

    function navegarTabsPorTeclado(event) {
        const teclas = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
        if (!teclas.includes(event.key)) return;
        const tabs = [tabAtual, tabHistorico];
        const indiceAtual = Math.max(0, tabs.indexOf(event.currentTarget));
        const indiceDestino = indiceTabDestinoPorTecla(event.key, indiceAtual, tabs.length);
        event.preventDefault();
        tabs[indiceDestino].focus();
        mudarAba(tabs[indiceDestino] === tabHistorico ? 'historico' : 'atual');
    }

    function mudarAba(nome) {
        abaAtiva = nome === 'historico' ? 'historico' : 'atual';
        const historicoAtivo = abaAtiva === 'historico';
        tabAtual.classList.toggle('active', !historicoAtivo);
        tabHistorico.classList.toggle('active', historicoAtivo);
        tabAtual.setAttribute('aria-selected', String(!historicoAtivo));
        tabHistorico.setAttribute('aria-selected', String(historicoAtivo));
        tabAtual.tabIndex = historicoAtivo ? -1 : 0;
        tabHistorico.tabIndex = historicoAtivo ? 0 : -1;
        abaAtual.classList.toggle('hidden', historicoAtivo);
        abaHistorico.classList.toggle('hidden', !historicoAtivo);
        if (!historicoAtivo) invalidarConsultaHistorico();
        if (historicoAtivo) {
            if (!lojaSelecionada || lojaSelecionada === '__todas') {
                historicoStatus.className = 'status-bar empty';
                historicoStatus.textContent = 'Selecione uma loja para ver o histórico de estoque.';
            } else if (!historicoTBody.children.length) {
                carregarHistorico(false);
            }
        }
    }

    function parseDataHoraAtualizacao(valor) {
        const txt = String(valor || '').trim();
        if (!txt) return null;

        // Formato esperado: dd/mm/aaaa HH:MM
        const m = txt.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
        if (m) {
            const [, dd, mm, yyyy, hh, mi] = m;
            const dt = new Date(Number(yyyy), Number(mm) - 1, Number(dd), Number(hh), Number(mi), 0, 0);
            return Number.isNaN(dt.getTime()) ? null : dt;
        }

        // Fallback para formatos ISO, se aparecerem futuramente.
        const dtIso = new Date(txt);
        return Number.isNaN(dtIso.getTime()) ? null : dtIso;
    }

    function obterUltimaAtualizacaoDaLoja(storeId) {
        if (!storeId || storeId === '__todas') return null;
        let ultima = null;

        for (const row of dados) {
            if (!linhaPertenceLojaSelecionada(row, storeId)) continue;

            const dt = parseDataHoraAtualizacao(row.last_update);
            if (!dt) continue;
            if (!ultima || dt > ultima) {
                ultima = dt;
            }
        }

        return ultima;
    }

    async function solicitarSyncEstoque(storeIdAlvo, isAuto = false) {
        if (solicitandoSync || syncEmAndamento) return;
        const todasLojas = storeIdAlvo === '__todas';
        if (!storeIdAlvo) return;
        const lojaAlvo = todasLojas ? null : obterLojaPorStoreId(storeIdAlvo);
        if (!todasLojas && !lojaAlvo) {
            if (!isAuto) alert('A loja selecionada não está mais disponível.');
            return;
        }

        clientId = clientId || obterClientId();
        if (!clientId) {
            window.location.href = '/frontend_index.html';
            return;
        }

        const geracaoSync = syncGeracaoAtual + 1;
        syncGeracaoAtual = geracaoSync;
        syncJobIdAtual = '';
        solicitandoSync = true;
        syncFinalizacaoProcessada = false;
        pararMonitoramentoProgresso();
        setSyncButton(true);

        statusEl.className = 'status-bar loading';
        statusEl.innerHTML = `${spinnerHtml}${todasLojas
            ? 'Solicitando atualização de todas as lojas...'
            : (isAuto ? 'Solicitando atualização automática...' : 'Solicitando atualização manual...')}`;

        try {
            const resp = await fetchComTimeout('/api/estoque/sync', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...obterAuthHeaders()
                },
                body: JSON.stringify(todasLojas ? {
                    todas_lojas: true,
                    store_id: '__todas',
                    loja: 'Todas as lojas'
                } : {
                    store_id: String(lojaAlvo.store_id || '').trim(),
                    loja: String(lojaAlvo.nome || '').trim()
                })
            });

            const data = await resp.json().catch(() => ({}));
            if (geracaoSync !== syncGeracaoAtual) return;
            if (!resp.ok) {
                throw new Error(primeiraMensagemSync(data.detail, data.error, data.message, `HTTP ${resp.status}`));
            }

            solicitandoSync = false;
            const jobIdResposta = normalizarJobIdSync(data.job_id);
            if ((data.started === true || data.already_running === true) && jobIdResposta) {
                syncJobIdAtual = jobIdResposta;
                syncEmAndamento = true;
                setSyncButton(true);
                if (data.already_running === true) {
                    mostrarStatusCarregando(primeiraMensagemSync(data.message, 'Atualização de estoque já em andamento.'));
                }
                iniciarMonitoramentoProgresso(geracaoSync, jobIdResposta);
                return;
            }

            syncFinalizacaoProcessada = true;
            syncEmAndamento = false;
            pararMonitoramentoProgresso();
            statusEl.className = 'status-bar error';
            statusEl.textContent = (data.started === true || data.already_running === true)
                ? 'A atualização foi informada sem um job_id válido e não será monitorada.'
                : primeiraMensagemSync(data.message, data.detail, data.error, 'Atualização de estoque não foi iniciada.');
            setSyncButton(false);
        } catch (e) {
            if (geracaoSync !== syncGeracaoAtual) return;
            solicitandoSync = false;
            syncFinalizacaoProcessada = true;
            syncJobIdAtual = '';
            syncEmAndamento = false;
            pararMonitoramentoProgresso();
            statusEl.className = 'status-bar error';
            statusEl.textContent = e.name === 'AbortError'
                ? 'A solicitação demorou demais e o resultado é incerto. Aguarde alguns instantes antes de tentar novamente.'
                : `Erro ao sincronizar: ${primeiraMensagemSync(e, 'Falha inesperada.')}`;
            setSyncButton(false);
        }
    }

    function chavePreferenciaLoja() {
        const cid = clientId || obterClientId() || 'anon';
        return `estoque_loja_preferencia_${cid}`;
    }

    function salvarPreferenciaLoja() {
        try {
            localStorage.setItem(chavePreferenciaLoja(), lojaSelecionada || '__todas');
        } catch (_e) {
            // Ignora erro de armazenamento local.
        }
    }

    function carregarPreferenciaLoja() {
        try {
            return localStorage.getItem(chavePreferenciaLoja()) || '__todas';
        } catch (_e) {
            return '__todas';
        }
    }

    function obterLojaPorStoreId(storeId) {
        const alvo = String(storeId || '').trim();
        if (!alvo || alvo === '__todas') return null;
        return lojasDisponiveis.find(loja => String(loja?.store_id || '').trim() === alvo) || null;
    }

    function lojasComNomeExato(nome) {
        const alvo = String(nome || '').trim();
        if (!alvo) return [];
        return lojasDisponiveis.filter(loja => String(loja?.nome || '').trim() === alvo);
    }

    function nomeLojaSelecionada() {
        const loja = obterLojaPorStoreId(lojaSelecionada);
        return loja ? String(loja.nome || '').trim() : '';
    }

    function rotuloLoja(loja) {
        const nome = String(loja?.nome || '').trim() || 'Loja sem nome';
        const storeId = String(loja?.store_id || '').trim();
        return lojasComNomeExato(nome).length > 1 && storeId
            ? `${nome} (${storeId})`
            : nome;
    }

    function normalizarPreferenciaLoja(valor) {
        const preferencia = String(valor || '').trim();
        if (!preferencia || preferencia === '__todas') return '__todas';
        if (obterLojaPorStoreId(preferencia)) return preferencia;
        const legadoPorNome = lojasComNomeExato(preferencia);
        return legadoPorNome.length === 1
            ? String(legadoPorNome[0].store_id || '').trim() || '__todas'
            : '__todas';
    }

    function linhaPertenceLojaSelecionada(row, storeId = lojaSelecionada) {
        const alvo = String(storeId || '').trim();
        if (!alvo || alvo === '__todas') return true;
        const rowStoreId = String(row?.store_id || '').trim();
        if (rowStoreId) return rowStoreId === alvo;

        const loja = obterLojaPorStoreId(alvo);
        const nome = String(loja?.nome || '').trim();
        if (!nome || lojasComNomeExato(nome).length !== 1) return false;
        return String(row?.loja_sync || row?.loja || '').trim() === nome;
    }

    function obterClientId() {
        const user = JSON.parse(localStorage.getItem('user_data') || 'null');
        return user && user.client_id ? user.client_id : null;
    }

    function renderResumo(lista) {
        resumo.innerHTML = '';
        const total = lista.length;
        const cards = [
            { label: 'Itens', value: total },
        ];
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<h3>${c.label}</h3><div class="val">${c.value}</div>`;
            resumo.appendChild(div);
        });
    }

    function formatarQtd(valor) {
        const numero = Number(valor || 0);
        if (!Number.isFinite(numero)) return '0';
        return numero.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
    }

    function numeroHistorico(valor) {
        if (valor === null || valor === undefined || valor === '') return null;
        const numero = Number(valor);
        return Number.isFinite(numero) ? numero : null;
    }

    function formatarQtdHistorico(valor) {
        const numero = numeroHistorico(valor);
        return numero === null ? '—' : formatarQtd(numero);
    }

    function formatarRotuloHistorico(valor) {
        const texto = String(valor || '').trim();
        if (!texto) return '-';
        if (!/^\d{4}-\d{2}-\d{2}T/.test(texto)) return texto;
        const data = new Date(texto);
        if (Number.isNaN(data.getTime())) return texto;
        return data.toLocaleString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function normalizarPontoHistorico(ponto, indice, labelFallback = '') {
        const item = (ponto && typeof ponto === 'object') ? ponto : { saldo: ponto };
        const registradoEm = String(item.recorded_at || item.registrado_em || item.data_hora || '').trim();
        const label = String(
            item.label || item.rotulo || registradoEm || item.data || item.data_ref || labelFallback || (indice + 1)
        ).trim();
        const entrada = numeroHistorico(item.entradas ?? item.entrada);
        const saida = numeroHistorico(item.saidas ?? item.saida);
        const variacaoInformada = numeroHistorico(
            item.variacao ?? item.delta ?? item.delta_saldo ?? item.variacao_saldo
        );
        return {
            chave: String(item.snapshot_id || item.event_id || registradoEm || label || indice),
            label: formatarRotuloHistorico(label),
            saldo: numeroHistorico(
                item.saldo_loja ?? item.saldo ?? item.valor ?? item.saldo_total_loja
            ),
            entrada,
            saida,
            variacao: variacaoInformada !== null
                ? variacaoInformada
                : (entrada !== null && saida !== null ? entrada - saida : null),
            ordem: registradoEm ? Date.parse(registradoEm) : indice
        };
    }

    function normalizarSerieHistorico(raw, labels = [], saldos = [], entradas = [], saidas = []) {
        let pontos = raw;
        if (pontos && !Array.isArray(pontos) && typeof pontos === 'object') {
            pontos = pontos.pontos || pontos.points || pontos.items || pontos.dados;
        }
        if (Array.isArray(pontos)) {
            return pontos.map((ponto, indice) => normalizarPontoHistorico(ponto, indice, labels[indice]));
        }
        return labels.map((label, indice) => normalizarPontoHistorico({
            label,
            saldo: saldos[indice],
            entradas: entradas[indice],
            saidas: saidas[indice]
        }, indice));
    }

    function obterSeriesHistorico(payload) {
        const skuAtivo = histIncluirSku.checked && Boolean(histSkuInput.value.trim());
        const series = payload?.series && typeof payload.series === 'object' ? payload.series : {};
        let geral = normalizarSerieHistorico(
            series.geral ?? payload?.serie_geral ?? payload?.series_geral
        );
        let sku = normalizarSerieHistorico(
            series.sku ?? payload?.serie_sku ?? payload?.series_sku
        );

        if (!geral.length && payload?.__payloadGeralCompat) {
            const compat = payload.__payloadGeralCompat;
            const pontosCompat = Array.isArray(compat?.labels)
                ? compat.labels.map((label, indice) => ({
                    event_id: Array.isArray(compat?.event_ids) ? compat.event_ids[indice] : '',
                    label,
                    saldo: Array.isArray(compat?.saldo_retroativo) ? compat.saldo_retroativo[indice] : null,
                    entradas: Array.isArray(compat?.entradas) ? compat.entradas[indice] : null,
                    saidas: Array.isArray(compat?.saidas) ? compat.saidas[indice] : null
                }))
                : [];
            geral = normalizarSerieHistorico(
                compat?.series?.geral ?? compat?.serie_geral ?? compat?.series_geral ?? pontosCompat
            );
        }

        const labelsLegado = Array.isArray(payload?.labels) ? payload.labels : [];
        const saldosLegado = Array.isArray(payload?.saldo_retroativo) ? payload.saldo_retroativo : [];
        const entradasLegado = Array.isArray(payload?.entradas) ? payload.entradas : [];
        const saidasLegado = Array.isArray(payload?.saidas) ? payload.saidas : [];

        if (!skuAtivo && !geral.length) {
            geral = normalizarSerieHistorico(null, labelsLegado, saldosLegado, entradasLegado, saidasLegado);
        }
        if (skuAtivo && !sku.length) {
            if (payload?.historico_fonte === 'eventos') {
                sku = normalizarSerieHistorico(payload?.series_por_sku);
            } else {
                sku = normalizarSerieHistorico(null, labelsLegado, saldosLegado, entradasLegado, saidasLegado);
            }
            if (!sku.length) sku = normalizarSerieHistorico(payload?.series_por_sku);
        }
        return { geral, sku };
    }

    function ultimoSaldoHistorico(serie) {
        for (let indice = serie.length - 1; indice >= 0; indice -= 1) {
            if (serie[indice].saldo !== null) return serie[indice].saldo;
        }
        return null;
    }

    function serieHistoricoTemSaldo(serie) {
        return Array.isArray(serie) && serie.some(ponto => ponto && ponto.saldo !== null
            && ponto.saldo !== undefined && ponto.saldo !== '' && Number.isFinite(Number(ponto.saldo)));
    }

    function renderHistoricoResumo(payload, series) {
        historicoResumo.innerHTML = '';
        const cards = [
            { label: 'Loja', value: payload.loja || nomeLojaSelecionada() || '-' },
            { label: 'Tipo de saldo', value: 'Loja (Full separado)' },
            { label: 'Base', value: payload.base_snapshot_at || payload.base_snapshot_data || '-' },
        ];
        if (histIncluirGeral.checked) {
            cards.push({ label: 'Total geral', value: formatarQtdHistorico(ultimoSaldoHistorico(series.geral)) });
        }
        if (histIncluirSku.checked) {
            cards.push({
                label: `SKU ${histSkuInput.value.trim() || '-'}`,
                value: formatarQtdHistorico(ultimoSaldoHistorico(series.sku))
            });
        }
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            const titulo = document.createElement('h3');
            titulo.textContent = c.label;
            const valor = document.createElement('div');
            valor.className = 'val';
            valor.textContent = c.value;
            div.append(titulo, valor);
            historicoResumo.appendChild(div);
        });
    }

    function renderHistorico(payload) {
        historicoTHead.innerHTML = '';
        historicoTBody.innerHTML = '';
        const series = obterSeriesHistorico(payload || {});
        renderHistoricoResumo(payload || {}, series);

        const pontosPorChave = new Map();
        const adicionarPontos = (lista, tipo) => {
            lista.forEach((ponto, indice) => {
                const existente = pontosPorChave.get(ponto.chave) || {
                    chave: ponto.chave,
                    label: ponto.label,
                    ordem: Number.isFinite(ponto.ordem) ? ponto.ordem : indice,
                    geral: null,
                    sku: null
                };
                existente[tipo] = ponto;
                pontosPorChave.set(ponto.chave, existente);
            });
        };
        adicionarPontos(series.geral, 'geral');
        adicionarPontos(series.sku, 'sku');
        const linhas = Array.from(pontosPorChave.values()).sort((a, b) => {
            if (Number.isFinite(a.ordem) && Number.isFinite(b.ordem) && a.ordem !== b.ordem) {
                return a.ordem - b.ordem;
            }
            return String(a.label).localeCompare(String(b.label), 'pt-BR', { numeric: true });
        });

        if (!linhas.length) {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = payload?.meta?.detail || payload?.detail
                || 'Sem histórico para o período selecionado. Atualize o estoque para iniciar o histórico.';
            return;
        }

        const trHead = document.createElement('tr');
        const cabecalhos = [{
            label: histIntervalo.value === 'atualizacao' ? 'Atualização' : 'Período',
            classe: ''
        }];
        if (histIncluirGeral.checked) {
            cabecalhos.push(
                { label: 'Total geral da loja', classe: '' },
                { label: 'Entradas gerais', classe: '' },
                { label: 'Saídas gerais', classe: '' },
                { label: 'Variação geral', classe: '' }
            );
        }
        if (histIncluirSku.checked) {
            const skuLabel = histSkuInput.value.trim() || '-';
            cabecalhos.push(
                { label: `Saldo SKU ${skuLabel}`, classe: 'history-separator' },
                { label: 'Entradas SKU', classe: '' },
                { label: 'Saídas SKU', classe: '' },
                { label: 'Variação SKU', classe: '' }
            );
        }
        cabecalhos.forEach(item => {
            const th = document.createElement('th');
            th.textContent = item.label;
            if (item.classe) th.className = item.classe;
            th.scope = 'col';
            trHead.appendChild(th);
        });
        historicoTHead.appendChild(trHead);

        const frag = document.createDocumentFragment();
        linhas.forEach(linha => {
            const tr = document.createElement('tr');
            const celulas = [{ valor: linha.label, classe: '' }];
            if (histIncluirGeral.checked) {
                celulas.push(
                    { valor: formatarQtdHistorico(linha.geral?.saldo), classe: '' },
                    { valor: formatarQtdHistorico(linha.geral?.entrada), classe: '' },
                    { valor: formatarQtdHistorico(linha.geral?.saida), classe: '' },
                    { valor: formatarQtdHistorico(linha.geral?.variacao), classe: '' }
                );
            }
            if (histIncluirSku.checked) {
                celulas.push(
                    { valor: formatarQtdHistorico(linha.sku?.saldo), classe: 'history-separator' },
                    { valor: formatarQtdHistorico(linha.sku?.entrada), classe: '' },
                    { valor: formatarQtdHistorico(linha.sku?.saida), classe: '' },
                    { valor: formatarQtdHistorico(linha.sku?.variacao), classe: '' }
                );
            }
            celulas.forEach(item => {
                const td = document.createElement('td');
                td.textContent = item.valor;
                if (item.classe) td.className = item.classe;
                tr.appendChild(td);
            });
            frag.appendChild(tr);
        });
        historicoTBody.appendChild(frag);

        const skuDisponivel = serieHistoricoTemSaldo(series.sku);
        const geralDisponivel = serieHistoricoTemSaldo(series.geral);
        const skuSemHistorico = histIncluirSku.checked && !skuDisponivel;
        const geralSemHistorico = histIncluirGeral.checked && !geralDisponivel;
        if (skuSemHistorico || geralSemHistorico) {
            historicoStatus.className = 'status-bar empty';
            if (skuSemHistorico) {
                historicoStatus.textContent = histIncluirGeral.checked && geralDisponivel
                    ? `Total geral carregado. Sem histórico para o SKU ${histSkuInput.value.trim()} nesta loja.`
                    : `Sem histórico para o SKU ${histSkuInput.value.trim()} nesta loja.`;
            } else {
                historicoStatus.textContent = histIncluirSku.checked && skuDisponivel
                    ? 'Histórico do SKU carregado. A série total geral não está disponível para este período.'
                    : 'Sem histórico geral para esta loja no período selecionado.';
            }
        } else {
            historicoStatus.className = 'status-bar success';
            const modo = histIntervalo.options[histIntervalo.selectedIndex]?.textContent || histIntervalo.value;
            const legado = payload?.meta?.fallback_legacy || payload?.fallback_legacy || payload?.__intervaloFallback;
            historicoStatus.textContent = legado
                ? `Histórico carregado por compatibilidade (${modo}); o detalhamento por atualização começa na próxima atualização.`
                : `Histórico carregado: ${linhas.length} ponto(s), agrupamento ${modo.toLowerCase()}.`;
        }
    }

    async function consultarHistorico(params, permitirFallbackAtualizacao = true, signal = null) {
        let resp = await fetch(`/api/estoque/serie-retroativa?${params.toString()}`, {
            headers: obterAuthHeaders(),
            cache: 'no-store',
            signal
        });
        let data = await resp.json().catch(() => ({}));
        if (!resp.ok && permitirFallbackAtualizacao && params.get('intervalo') === 'atualizacao' && resp.status === 400) {
            const paramsLegado = new URLSearchParams(params);
            paramsLegado.set('intervalo', 'dia');
            resp = await fetch(`/api/estoque/serie-retroativa?${paramsLegado.toString()}`, {
                headers: obterAuthHeaders(),
                cache: 'no-store',
                signal
            });
            data = await resp.json().catch(() => ({}));
            if (resp.ok) data.__intervaloFallback = true;
        }
        if (!resp.ok) {
            throw new Error(data?.detail?.message || data.detail || `HTTP ${resp.status}`);
        }
        return data;
    }

    async function carregarHistorico(exibirStatus = true) {
        invalidarConsultaHistorico();
        if (!lojaSelecionada || lojaSelecionada === '__todas') {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Selecione uma loja para ver o histórico de estoque.';
            return;
        }
        const incluirGeral = histIncluirGeral.checked;
        const incluirSku = histIncluirSku.checked;
        const sku = histSkuInput.value.trim();
        if (!incluirGeral && !incluirSku) {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Marque Total geral da loja, SKU individual ou ambos.';
            return;
        }
        if (incluirSku && !sku) {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Digite ou selecione um SKU para carregar o histórico individual.';
            histSkuInput.focus();
            return;
        }
        const requestSeq = historicoRequestSeq;
        const assinaturaInicial = assinaturaEstadoHistorico();
        const requestController = new AbortController();
        historicoAbortController = requestController;
        const { signal } = requestController;
        if (exibirStatus) {
            historicoStatus.className = 'status-bar loading';
            historicoStatus.innerHTML = `${spinnerHtml}Carregando histórico de estoque...`;
        }
        try {
            const params = new URLSearchParams({
                loja: nomeLojaSelecionada(),
                store_id: lojaSelecionada,
                periodo: 'max',
                intervalo: histIntervalo.value,
                fonte: 'lancamentos',
                incluir_geral: String(incluirGeral),
                incluir_sku: String(incluirSku),
                data_inicio: histDataInicio.value || '',
                data_fim: histDataFim.value || ''
            });
            if (incluirSku) params.set('sku', sku);

            const data = await consultarHistorico(params, true, signal);
            const serieGeralNova = data?.series?.geral ?? data?.serie_geral ?? data?.series_geral;
            if (incluirGeral && incluirSku && !normalizarSerieHistorico(serieGeralNova).length) {
                const paramsGeral = new URLSearchParams(params);
                paramsGeral.delete('sku');
                paramsGeral.set('incluir_sku', 'false');
                try {
                    data.__payloadGeralCompat = await consultarHistorico(paramsGeral, true, signal);
                } catch (erroGeral) {
                    data.__erroGeralCompat = String(erroGeral?.message || erroGeral || '');
                }
            }
            if (signal.aborted || consultaHistoricoObsoleta(
                requestSeq,
                historicoRequestSeq,
                assinaturaInicial,
                assinaturaEstadoHistorico()
            )) return;
            renderHistorico(data);
        } catch (e) {
            if (e?.name === 'AbortError' || signal.aborted || consultaHistoricoObsoleta(
                requestSeq,
                historicoRequestSeq,
                assinaturaInicial,
                assinaturaEstadoHistorico()
            )) return;
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = `Erro ao carregar histórico: ${e.message}`;
        } finally {
            if (historicoRequestSeq === requestSeq && historicoAbortController === requestController) {
                historicoAbortController = null;
            }
        }
    }

    function renderHistoricoProgresso(progress, logs) {
        if (!progress) return;
        const percent = Math.max(0, Math.min(100, Number(progress.percentual || 0)));
        const logsList = (logs || []).slice(-8).map(l => `<div style="color:#9bd1ff; margin:2px 0;">${l}</div>`).join('');
        historicoStatus.className = 'status-bar loading';
        historicoStatus.innerHTML = `${spinnerHtml}<strong>${progress.mensagem || 'Sincronizando histórico...'}</strong>
            <div style="margin-top:8px;background:#222;border-radius:6px;overflow:hidden;">
                <div style="height:8px;width:${percent}%;background:#4facfe;"></div>
            </div>
            <div style="margin-top:6px;font-size:0.85rem;color:#9bd1ff;">${percent}%</div>
            <div style="margin-top:8px;font-size:0.85rem;">${logsList}</div>`;
    }

    function pararMonitoramentoHistorico() {
        if (historicoProgressTimer) {
            clearInterval(historicoProgressTimer);
            historicoProgressTimer = null;
        }
    }

    async function verificarProgressoHistorico() {
        try {
            const resp = await fetchComTimeout('/api/estoque/lancamentos/sync-lote/progress', { headers: obterAuthHeaders(), cache: 'no-store' }, SYNC_PROGRESS_TIMEOUT_MS);
            if (!resp.ok) return null;
            const payload = await resp.json();
            const progress = payload.progress;
            const active = !!payload.active;
            if (progress && (active || !historicoSolicitandoSync)) {
                renderHistoricoProgresso(progress, payload.logs || []);
            }

            historicoSyncEmAndamento = active;
            setHistoricoButtons(historicoSyncEmAndamento || historicoSolicitandoSync);

            if (!active && progress && !historicoSolicitandoSync) {
                if (Number(progress.percentual || 0) >= 100) {
                    historicoStatus.className = 'status-bar success';
                    historicoStatus.textContent = `${progress.mensagem || 'Registros sincronizados.'}`;
                    await carregarHistorico(false);
                } else if ((progress.etapa || '').toLowerCase() === 'erro') {
                    historicoStatus.className = 'status-bar error';
                    historicoStatus.textContent = `${progress.mensagem || 'Falha ao sincronizar histórico.'}`;
                }
                pararMonitoramentoHistorico();
            }
            return payload;
        } catch (_e) {
            return null;
        }
    }

    function iniciarMonitoramentoHistorico() {
        pararMonitoramentoHistorico();
        historicoProgressTimer = setInterval(verificarProgressoHistorico, 2500);
        verificarProgressoHistorico();
    }

    async function sincronizarHistorico() {
        if (!lojaSelecionada || lojaSelecionada === '__todas') {
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = 'Selecione uma loja para sincronizar os registros históricos.';
            return;
        }

        historicoSolicitandoSync = true;
        setHistoricoButtons(true);
        iniciarMonitoramentoHistorico();
        historicoStatus.className = 'status-bar loading';
        historicoStatus.innerHTML = `${spinnerHtml}Solicitando sincronização de registros...`;

        try {
            const resp = await fetchComTimeout('/api/estoque/lancamentos/sync-lote', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...obterAuthHeaders()
                },
                body: JSON.stringify({
                    loja: nomeLojaSelecionada(),
                    store_id: lojaSelecionada,
                    data_inicio: histDataInicio.value || null,
                    data_fim: histDataFim.value || null
                })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                throw new Error(data?.detail?.message || data.detail || `HTTP ${resp.status}`);
            }

            historicoSolicitandoSync = false;
            if (data.started || data.already_running) {
                historicoSyncEmAndamento = true;
                if (data.already_running && data.message) {
                    historicoStatus.className = 'status-bar loading';
                    historicoStatus.innerHTML = `${spinnerHtml}${data.message}`;
                }
                iniciarMonitoramentoHistorico();
                return;
            }

            historicoSyncEmAndamento = false;
            pararMonitoramentoHistorico();
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = data.message || 'Sincronização de registros não foi iniciada.';
            setHistoricoButtons(false);
        } catch (e) {
            historicoSolicitandoSync = false;
            const payload = await verificarProgressoHistorico();
            if (payload && payload.active) {
                return;
            }
            historicoSyncEmAndamento = false;
            pararMonitoramentoHistorico();
            historicoStatus.className = 'status-bar error';
            historicoStatus.textContent = e.name === 'AbortError'
                ? 'A solicitação demorou demais e não há sincronização ativa. Tente novamente.'
                : `Erro ao sincronizar registros: ${e.message}`;
            setHistoricoButtons(false);
        }
    }

    function renderTabela(lista) {
        tHead.innerHTML = '';
        tBody.innerHTML = '';
        if (!lista.length) {
            statusEl.className = 'status-bar empty';
            statusEl.textContent = 'Nenhum registro encontrado.';
            atualizarPaginacao(0, 0);
            return;
        }
        if (!syncEmAndamento) {
            statusEl.className = 'status-bar';
            statusEl.textContent = '';
        }
        const cols = Object.keys(lista[0]);
        const trHead = document.createElement('tr');
        cols.forEach(col => {
            const th = document.createElement('th');
            th.textContent = String(col || '').replace(/_/g, ' ').toLocaleUpperCase('pt-BR');
            trHead.appendChild(th);
        });
        tHead.appendChild(trHead);

        const frag = document.createDocumentFragment();
        lista.forEach(item => {
            const tr = document.createElement('tr');
            cols.forEach(col => {
                const td = document.createElement('td');
                td.textContent = item[col];
                tr.appendChild(td);
            });
            frag.appendChild(tr);
        });
        tBody.appendChild(frag);
    }

    function obterSku(row) {
        return String(row.sku || row.SKU || row.codigo || row.Codigo || '').trim();
    }

    function atualizarOpcoesSkuHistorico() {
        const skus = new Set();
        dados.forEach(row => {
            if (!linhaPertenceLojaSelecionada(row)) return;
            const sku = obterSku(row);
            if (sku) skus.add(sku);
        });
        histSkuOpcoes.innerHTML = '';
        Array.from(skus)
            .sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true, sensitivity: 'base' }))
            .forEach(sku => {
                const option = document.createElement('option');
                option.value = sku;
                histSkuOpcoes.appendChild(option);
            });
    }

    function marcarFiltrosHistoricoAlterados() {
        invalidarConsultaHistorico();
        historicoTHead.innerHTML = '';
        historicoTBody.innerHTML = '';
        historicoResumo.innerHTML = '';
        historicoStatus.className = 'status-bar empty';
        historicoStatus.textContent = 'Filtros alterados. Clique em carregar histórico.';
    }

    function obterNumeroSku(sku) {
        const txt = String(sku || '').trim();
        if (/^\d+(?:[.,]\d+)?$/.test(txt)) {
            return Number(txt.replace(',', '.'));
        }
        const match = txt.match(/\d+/);
        return match ? Number(match[0]) : Number.NEGATIVE_INFINITY;
    }

    function obterDataOrdenacao(row) {
        const campos = ['data_criacao', 'created_at', 'last_update', 'Atualizado em'];
        for (const campo of campos) {
            if (!row || row[campo] === undefined || row[campo] === null || row[campo] === '') continue;
            const dt = parseDataHoraAtualizacao(row[campo]);
            if (dt) return dt.getTime();
        }
        return 0;
    }

    function obterNumeroCampo(valor) {
        if (typeof valor === 'number') return Number.isFinite(valor) ? valor : 0;
        const txt = String(valor || '').trim();
        if (!txt) return 0;
        const normalizado = txt.replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '');
        const numero = Number(normalizado);
        return Number.isFinite(numero) ? numero : 0;
    }

    function obterQuantidadeEstoque(row) {
        if (!row) return 0;
        const camposTotal = ['saldo_total', 'estoque_total', 'total_estoque', 'quantidade', 'Quantidade', 'estoque'];
        for (const campo of camposTotal) {
            if (row[campo] !== undefined && row[campo] !== null && row[campo] !== '') {
                return obterNumeroCampo(row[campo]);
            }
        }
        return obterNumeroCampo(row.saldo_loja) + obterNumeroCampo(row.saldo_full);
    }

    function obterNomeLoja(row) {
        return String(row?.loja_sync || row?.loja || 'Desconhecida').trim();
    }

    function normalizarLoja(valor) {
        return String(valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/\s+/g, ' ')
            .trim()
            .toLowerCase();
    }

    function ordenarLista(lista) {
        const modo = ordenarPor.value || 'data_atual';
        return lista
            .map((item, indice) => ({ item, indice }))
            .sort((a, b) => {
                if (modo === 'loja_az' || modo === 'loja_za') {
                    const lojaA = obterNomeLoja(a.item);
                    const lojaB = obterNomeLoja(b.item);
                    const cmpLojaBase = lojaA.localeCompare(lojaB, 'pt-BR', { numeric: true, sensitivity: 'base' });
                    const cmpLoja = modo === 'loja_za' ? -cmpLojaBase : cmpLojaBase;
                    if (cmpLoja) return cmpLoja;
                    const cmpSku = obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmpSku || a.indice - b.indice;
                }

                if (modo === 'sku_az') {
                    const cmp = obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmp || a.indice - b.indice;
                }

                if (modo === 'sku_desc') {
                    const skuA = obterSku(a.item);
                    const skuB = obterSku(b.item);
                    const numCmp = obterNumeroSku(skuB) - obterNumeroSku(skuA);
                    if (numCmp) return numCmp;
                    const cmp = skuB.localeCompare(skuA, 'pt-BR', { numeric: true, sensitivity: 'base' });
                    return cmp || a.indice - b.indice;
                }

                if (modo === 'estoque_desc' || modo === 'estoque_asc') {
                    const qtdA = obterQuantidadeEstoque(a.item);
                    const qtdB = obterQuantidadeEstoque(b.item);
                    const qtdCmp = modo === 'estoque_desc' ? qtdB - qtdA : qtdA - qtdB;
                    return qtdCmp || obterSku(a.item).localeCompare(obterSku(b.item), 'pt-BR', { numeric: true, sensitivity: 'base' }) || a.indice - b.indice;
                }

                const dataCmp = obterDataOrdenacao(b.item) - obterDataOrdenacao(a.item);
                return dataCmp || a.indice - b.indice;
            })
            .map(({ item }) => item);
    }

    function atualizarPaginacao(totalItens, totalPaginas) {
        if (!totalItens || totalPaginas <= 1) {
            paginacaoEl.style.display = 'none';
            return;
        }

        paginacaoEl.style.display = 'flex';
        btnPaginaAnterior.disabled = paginaAtual <= 1;
        btnPaginaProxima.disabled = paginaAtual >= totalPaginas;

        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA + 1;
        const fim = Math.min(paginaAtual * ITENS_POR_PAGINA, totalItens);
        pageInfo.textContent = `Mostrando ${inicio}-${fim} de ${totalItens} SKUs (página ${paginaAtual}/${totalPaginas})`;
    }

    function filtrar() {
        const termo = filtroTexto.value.trim().toLowerCase();
        let lista = dados;

        if (lojaSelecionada && lojaSelecionada !== '__todas') {
            lista = lista.filter(row => linhaPertenceLojaSelecionada(row));
        }

        if (termo) {
            lista = lista.filter(row => Object.values(row).some(val => String(val).toLowerCase().includes(termo)));
        }

        lista = ordenarLista(lista);

        renderResumo(lista);
        const totalItens = lista.length;
        const totalPaginas = Math.max(1, Math.ceil(totalItens / ITENS_POR_PAGINA));
        if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
        if (paginaAtual < 1) paginaAtual = 1;

        const inicio = (paginaAtual - 1) * ITENS_POR_PAGINA;
        const listaPaginada = lista.slice(inicio, inicio + ITENS_POR_PAGINA);
        renderTabela(listaPaginada);
        atualizarPaginacao(totalItens, totalPaginas);
    }

    function renderBotoesLojas(lojas) {
        lojaBotoes.innerHTML = '';
        const lojasComId = (Array.isArray(lojas) ? lojas : [])
            .filter(loja => String(loja?.store_id || '').trim());
        const lojasIds = new Set(lojasComId.map(loja => String(loja.store_id).trim()));
        if (lojaSelecionada !== '__todas' && !lojasIds.has(lojaSelecionada)) {
            lojaSelecionada = '__todas';
        }

        const todosBtn = document.createElement('button');
        todosBtn.textContent = 'Todas as lojas';
        todosBtn.dataset.storeId = '__todas';
        todosBtn.className = 'loja-btn' + (lojaSelecionada === '__todas' ? ' active' : '');
        todosBtn.onclick = () => {
            lojaSelecionada = '__todas';
            salvarPreferenciaLoja();
            paginaAtual = 1;
            atualizarSelecao();
        };
        lojaBotoes.appendChild(todosBtn);

        lojasComId.forEach(l => {
            const storeId = String(l.store_id).trim();
            const btn = document.createElement('button');
            btn.textContent = rotuloLoja(l);
            btn.dataset.storeId = storeId;
            btn.className = 'loja-btn' + (lojaSelecionada === storeId ? ' active' : '');
            btn.onclick = () => {
                lojaSelecionada = storeId;
                salvarPreferenciaLoja();
                paginaAtual = 1;
                atualizarSelecao();
            };
            lojaBotoes.appendChild(btn);
        });
    }

    function atualizarSelecao() {
        invalidarConsultaHistorico();
        Array.from(lojaBotoes.children).forEach(btn => {
            btn.classList.toggle('active', btn.dataset.storeId === lojaSelecionada);
        });
        filtrar();
        atualizarOpcoesSkuHistorico();
        if (abaAtiva === 'historico') {
            historicoTHead.innerHTML = '';
            historicoTBody.innerHTML = '';
            historicoResumo.innerHTML = '';
            historicoStatus.className = 'status-bar empty';
            historicoStatus.textContent = lojaSelecionada === '__todas'
                ? 'Selecione uma loja para ver o histórico de estoque.'
                : 'Loja alterada. Clique em carregar histórico.';
        }
    }

    async function carregarLojas() {
        try {
            clientId = obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return false;
            }
            const resp = await fetch('/api/lojas', { headers: obterAuthHeaders() });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const lojas = await resp.json();
            lojasDisponiveis = Array.isArray(lojas) ? lojas : [];
            lojaSelecionada = normalizarPreferenciaLoja(carregarPreferenciaLoja());
            renderBotoesLojas(lojasDisponiveis);
            salvarPreferenciaLoja();
        } catch (e) {
            statusEl.className = 'status-bar error';
            statusEl.textContent = `Erro ao carregar lojas: ${e.message}`;
        }
    }

    async function carregar(exibirStatus = true) {
        if (exibirStatus && !syncEmAndamento) {
            statusEl.className = 'status-bar loading';
            statusEl.innerHTML = `${spinnerHtml}Carregando estoque...`;
        }
        try {
            clientId = clientId || obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }
            const resp = await fetch('/api/estoque', { headers: obterAuthHeaders() });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            dados = await resp.json();
            atualizarOpcoesSkuHistorico();
            filtrar();
            if (exibirStatus && !syncEmAndamento) {
                statusEl.className = 'status-bar';
                statusEl.textContent = '';
            }
            return true;
        } catch (e) {
            statusEl.className = 'status-bar error';
            statusEl.textContent = `Erro ao carregar estoque: ${e.message}`;
            return false;
        }
    }

    filtroTexto.addEventListener('input', () => {
        paginaAtual = 1;
        filtrar();
    });

    ordenarPor.addEventListener('change', () => {
        paginaAtual = 1;
        filtrar();
    });

    btnPaginaAnterior.addEventListener('click', () => {
        if (paginaAtual > 1) {
            paginaAtual -= 1;
            filtrar();
        }
    });

    btnPaginaProxima.addEventListener('click', () => {
        paginaAtual += 1;
        filtrar();
    });
    btnSync.addEventListener('click', async () => {
        await solicitarSyncEstoque(lojaSelecionada, false);
    });
    tabAtual.addEventListener('click', () => mudarAba('atual'));
    tabHistorico.addEventListener('click', () => mudarAba('historico'));
    tabAtual.addEventListener('keydown', navegarTabsPorTeclado);
    tabHistorico.addEventListener('keydown', navegarTabsPorTeclado);
    btnHistoricoCarregar.addEventListener('click', () => carregarHistorico(true));
    btnHistoricoSync.addEventListener('click', () => sincronizarHistorico());
    histDataInicio.addEventListener('change', marcarFiltrosHistoricoAlterados);
    histDataFim.addEventListener('change', marcarFiltrosHistoricoAlterados);
    histIntervalo.addEventListener('change', marcarFiltrosHistoricoAlterados);
    histIncluirGeral.addEventListener('change', marcarFiltrosHistoricoAlterados);
    histIncluirSku.addEventListener('change', () => {
        histSkuInput.disabled = !histIncluirSku.checked;
        marcarFiltrosHistoricoAlterados();
        if (histIncluirSku.checked) histSkuInput.focus();
    });
    histSkuInput.addEventListener('input', marcarFiltrosHistoricoAlterados);
    histSkuInput.addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        event.preventDefault();
        if (!histIncluirSku.checked) {
            histIncluirSku.checked = true;
            histSkuInput.disabled = false;
        }
        carregarHistorico(true);
    });

    async function inicializarPaginaEstoque() {
        inicializarDatasHistorico();
        await carregarConfiguracoesGlobais();
        await carregarLojas();
        await carregar();
        if (await adotarSincronizacaoEstoqueAtiva()) return;

        const lojaAuto = lojaSelecionada !== '__todas'
            ? lojaSelecionada
            : (lojasDisponiveis.find(loja => String(loja?.store_id || '').trim())?.store_id || null);

        if (!autoSyncSolicitado && lojaAuto) {
            autoSyncSolicitado = true;
            const rotuloLojaAuto = rotuloLoja(obterLojaPorStoreId(lojaAuto));
            const ultimaAtualizacao = obterUltimaAtualizacaoDaLoja(lojaAuto);
            if (ultimaAtualizacao) {
                const diffMin = (Date.now() - ultimaAtualizacao.getTime()) / 60000;
                if (diffMin < janelaAutoSyncMinutos) {
                    statusEl.className = 'status-bar';
                    statusEl.textContent = `Última atualização de ${rotuloLojaAuto} foi há ${Math.max(1, Math.round(diffMin))} min. Auto-atualização ignorada.`;
                    return;
                }
            }

            await solicitarSyncEstoque(lojaAuto, true);
        }
    }

    inicializarPaginaEstoque();

</script>
