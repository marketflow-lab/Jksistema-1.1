<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incluir SKU - JK Sistema</title>
    <style>
        :root {
            --bg: #0b101b;
            --panel: #1a2236;
            --line: #26314b;
            --text: #e7ecf7;
            --muted: #9eb0d1;
            --accent: #4facfe;
            --success: #28a745;
            --danger: #ff6b6b;
        }
        body {
            margin:0;
            padding:20px;
            color: var(--text);
            font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(900px 500px at 10% -10%, rgba(79, 172, 254, 0.15), transparent 60%),
                radial-gradient(800px 450px at 95% -20%, rgba(40, 167, 69, 0.12), transparent 58%),
                var(--bg);
        }
        .container { max-width:1180px; margin:0 auto; }
        .header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
        .back-btn {
            padding:8px 14px;
            background: linear-gradient(135deg, #5bb5ff, #3b95df);
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-weight:700;
            box-shadow: 0 6px 20px rgba(45, 126, 198, 0.35);
        }
        .back-btn:hover { filter: brightness(1.05); }
        h1 { margin: 0; letter-spacing: 0.2px; }
        .subtitle { margin: 0 0 14px; color: var(--muted); font-size: 0.95rem; }
        .status {
            margin:10px 0 16px;
            padding:12px 14px;
            border-radius:10px;
            background: rgba(18, 26, 43, 0.85);
            border:1px solid var(--line);
            min-height:20px;
        }
        .loading { color:#9bd1ff; }
        .error { color:#ff6b6b; }
        .success { color:#80ed99; }
        .card {
            background: linear-gradient(180deg, rgba(28, 35, 55, 0.95), rgba(24, 32, 51, 0.92));
            border:1px solid var(--line);
            border-radius:12px;
            padding:16px;
            box-shadow: 0 12px 26px rgba(4, 8, 14, 0.35);
        }
        .section-title {
            margin:0 0 10px;
            font-size:0.95rem;
            color:#b8c9e8;
            letter-spacing:0.4px;
            text-transform:uppercase;
        }
        .form-grid { display:grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap:12px; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field.full { grid-column: 1 / -1; }
        .mlb-editor { border:1px solid #2f3f61; border-radius:8px; padding:10px; background:#0f1628; }
        .mlb-head { display:grid; grid-template-columns: 180px 1fr 70px; gap:8px; margin-bottom:6px; color:#9fb7de; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.4px; }
        .mlb-rows { display:flex; flex-direction:column; gap:8px; }
        .mlb-row { display:grid; grid-template-columns: 180px 1fr 70px; gap:8px; align-items:center; }
        .mlb-row input { width:100%; box-sizing:border-box; }
        .mlb-del { border:1px solid #4a2f3b; background:#2b1820; color:#ff9cae; border-radius:8px; height:38px; cursor:pointer; font-weight:700; }
        .mlb-del:hover { background:#3a1f29; }
        .mlb-add { margin-top:10px; border:1px solid #2d5a3d; background:#123024; color:#8ef0b0; border-radius:8px; padding:8px 12px; cursor:pointer; font-weight:700; }
        .mlb-add:hover { background:#17402f; }
        .field label { color:#c8d7ea; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.4px; }
        input, textarea {
            padding:10px;
            border-radius:8px;
            border:1px solid #33415f;
            background:#0f1525;
            color:#e5e5e5;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        input:focus, textarea:focus {
            outline:none;
            border-color:#5bb5ff;
            box-shadow: 0 0 0 3px rgba(91, 181, 255, 0.16);
        }
        textarea { min-height:110px; resize:vertical; }
        .foto-block {
            background: linear-gradient(180deg, rgba(20, 25, 40, 0.9), rgba(15, 20, 35, 0.87));
            border:1px solid #2a3a55;
            border-radius:10px;
            padding:14px;
            margin-top:14px;
        }
        .foto-tools { display:flex; gap:10px; margin-bottom:10px; }
        .foto-input, .foto-paste { flex:1; padding:8px 10px; border-radius:8px; border:1px dashed #4a5a7a; background:#0f1525; cursor:pointer; text-align:center; color:#9eb0d1; transition:all .15s ease; }
        .foto-input:hover, .foto-paste:hover { border-color:#5bb5ff; }
        .foto-preview { border:1px solid #2f3f5a; border-radius:8px; padding:8px; background:#0b0f1a; min-height:80px; display:flex; align-items:center; justify-content:center; color:#7a8fb3; font-size:0.85rem; }
        .foto-preview img { max-width:100%; max-height:200px; border-radius:6px; }
        .foto-preview a { text-decoration:none; }
        .foto-link img { max-width:100%; max-height:200px; border-radius:6px; }
        #fotoInput { display:none; }
        .actions {
            display:flex;
            gap:10px;
            margin-top:16px;
            flex-wrap:wrap;
            padding-top:10px;
            border-top:1px solid #2a3551;
        }
        .btn { padding:10px 14px; border-radius:8px; border:1px solid transparent; cursor:pointer; font-weight:700; }
        .btn-primary { background:#28a745; color:#fff; }
        .btn-primary:hover { background:#20913a; }
        .btn-secondary { background:#2b3245; color:#e5e5e5; border-color:#3a435c; }
        .btn-secondary:hover { background:#36415b; }
        @media (max-width: 900px) {
            body { padding:14px; }
            .form-grid { grid-template-columns:1fr; }
            .card { padding:12px; }
        }
    </style>
    <script src="/auth.js?v=20260618-persist-login"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>? Incluir Novo SKU</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <a class="back-btn" href="/dashboard.html">🏠 Home</a>
            <a class="back-btn" href="/cadastro.html">Voltar</a>
        </div>
    </div>
    <p class="subtitle">Preencha os dados do produto e finalize em Cadastrar SKU.</p>

    <div id="status" class="status"></div>

    <div class="card">
        <h2 class="section-title">Dados do Novo Produto</h2>
        <form id="formIncluir">
            <div id="formGrid" class="form-grid"></div>
            <div class="foto-block">
                <h3 style="margin:0 0 8px; color:#b8c9e8; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.3px;">Imagem do Produto (Opcional)</h3>
                <div class="foto-tools">
                    <button id="btnUploadFoto" class="foto-input" type="button"> Escolher arquivo</button>
                    <button id="btnPasteFoto" class="foto-paste" type="button"> Colar imagem</button>
                </div>
                <div id="fotoPreview" class="foto-preview">Sem imagem vinculada.</div>
                <input id="fotoInput" type="file" accept="image/*">
            </div>
            <div class="actions">
                <button class="btn btn-primary" type="submit">Cadastrar SKU</button>
                <button id="btnLimpar" class="btn btn-secondary" type="button">Limpar formulário</button>
            </div>
        </form>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const formIncluir = document.getElementById('formIncluir');
    const formGrid = document.getElementById('formGrid');
    const btnLimpar = document.getElementById('btnLimpar');
    const fotoInput = document.getElementById('fotoInput');
    const btnUploadFoto = document.getElementById('btnUploadFoto');
    const btnPasteFoto = document.getElementById('btnPasteFoto');
    const fotoPreview = document.getElementById('fotoPreview');

    let colunas = [];
    let fotoPendenteDataUrl = '';
    let fotoPendenteFilename = '';

    function setStatus(msg, cls) {
        statusEl.className = 'status ' + (cls || '');
        statusEl.textContent = msg || '';
    }

    function ordemCampos(campos) {
        const prioridade = ['sku', 'nome', 'categoria', 'marca', 'custo', 'imposto', 'preco', 'descricao', 'updated_at'];
        const score = (c) => {
            const i = prioridade.indexOf(c);
            return i === -1 ? 999 : i;
        };
        return [...campos].sort((a, b) => {
            const sa = score(a);
            const sb = score(b);
            if (sa !== sb) return sa - sb;
            return a.localeCompare(b);
        });
    }

    function numericParaBRL(valor) {
        const v = String(valor || '').trim();
        if (!v) return '';
        const num = parseFloat(v);
        if (isNaN(num)) return v;
        return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function brlParaNumeric(valor) {
        const v = String(valor || '').replace(/R\$\s?/gi, '').replace(/\./g, '').replace(',', '.').trim();
        if (!v) return '';
        const num = parseFloat(v);
        return isNaN(num) ? v : num.toFixed(2);
    }

    function aplicarMascaraMoeda(input) {
        input.addEventListener('input', function () {
            let digits = this.value.replace(/\D/g, '');
            if (!digits) { this.value = ''; return; }
            let centavos = parseInt(digits, 10);
            const reais = Math.floor(centavos / 100);
            const dec = centavos % 100;
            this.value = 'R$ ' + reais.toLocaleString('pt-BR') + ',' + String(dec).padStart(2, '0');
        });
    }

    function formatarNomeCampo(chave) {
        return String(chave || '')
            .replace(/^cg_/i, '')
            .replace(/_/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function lerArquivoComoDataUrl(file) {
        return new Promise((resolve, reject) => {
            const fr = new FileReader();
            fr.onload = () => resolve(String(fr.result || ''));
            fr.onerror = () => reject(new Error('Falha ao ler imagem.'));
            fr.readAsDataURL(file);
        });
    }

    async function prepararImagemPendente(fileOrBlob, nomeArquivo) {
        const file = fileOrBlob instanceof File
            ? fileOrBlob
            : new File([fileOrBlob], nomeArquivo || 'imagem.png', { type: fileOrBlob.type || 'image/png' });

        try {
            fotoPendenteDataUrl = await lerArquivoComoDataUrl(file);
            fotoPendenteFilename = file.name || 'imagem.png';
            atualizarPreviewFoto();
            setStatus('Imagem anexada. Será salva somente ao clicar em Cadastrar SKU.', 'success');
        } catch (e) {
            setStatus(`Erro ao preparar imagem: ${e.message}`, 'error');
        }
    }

    function atualizarPreviewFoto() {
        if (fotoPendenteDataUrl) {
            fotoPreview.innerHTML = `<img src="${fotoPendenteDataUrl}" alt="Prévia da imagem pendente"><div style="margin-left:10px; color:#9bd1ff; font-size:0.8rem;">Imagem<br>pendente</div>`;
            return;
        }
        fotoPreview.innerHTML = '<span style="color:#7a8fb3;">Sem imagem vinculada.</span>';
    }

    function criarCampo(chave) {
        const field = document.createElement('div');
        field.className = 'field' + (String(chave).includes('descricao') || String(chave).includes('link') ? ' full' : '');

        const label = document.createElement('label');
        label.setAttribute('for', `f_${chave}`);
        label.textContent = formatarNomeCampo(chave);

        let input;
        if (String(chave).includes('descricao')) {
            input = document.createElement('textarea');
        } else {
            input = document.createElement('input');
            input.type = 'text';
        }
        input.id = `f_${chave}`;
        input.name = chave;
        input.value = '';

        if (chave === 'sku') {
            input.required = true;
            label.textContent = 'sku *';
        }
        if (chave === 'updated_at') {
            input.placeholder = 'Será preenchido automaticamente';
        }
        if (chave === 'custo') {
            input.setAttribute('data-tipo', 'moeda');
            aplicarMascaraMoeda(input);
        }
        field.appendChild(label);
        field.appendChild(input);
        return field;
    }

    function criarLinhaMlb(mlb = '', frete = '') {
        const row = document.createElement('div');
        row.className = 'mlb-row';

        const inFrete = document.createElement('input');
        inFrete.type = 'text';
        inFrete.className = 'mlb-frete';
        inFrete.placeholder = 'Frete';
        inFrete.value = String(frete || '');

        const inMlb = document.createElement('input');
        inMlb.type = 'text';
        inMlb.className = 'mlb-id';
        inMlb.placeholder = 'MLB123456789';
        inMlb.value = String(mlb || '');

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'mlb-del';
        btnDel.textContent = '?';
        btnDel.addEventListener('click', () => row.remove());

        row.appendChild(inFrete);
        row.appendChild(inMlb);
        row.appendChild(btnDel);
        return row;
    }

    function criarEditorMlb() {
        const field = document.createElement('div');
        field.className = 'field full';

        const label = document.createElement('label');
        label.textContent = 'mlb_ids (frete separado)';
        field.appendChild(label);

        const box = document.createElement('div');
        box.className = 'mlb-editor';

        const head = document.createElement('div');
        head.className = 'mlb-head';
        head.innerHTML = '<div>Frete</div><div>MLB</div><div>Ação</div>';
        box.appendChild(head);

        const rows = document.createElement('div');
        rows.className = 'mlb-rows';
        rows.id = 'mlbRows';
        rows.appendChild(criarLinhaMlb('', ''));
        box.appendChild(rows);

        const btnAdd = document.createElement('button');
        btnAdd.type = 'button';
        btnAdd.className = 'mlb-add';
        btnAdd.textContent = '+ Adicionar MLB';
        btnAdd.addEventListener('click', () => rows.appendChild(criarLinhaMlb('', '')));
        box.appendChild(btnAdd);

        field.appendChild(box);
        return field;
    }

    function extrairMlbFreteEditor() {
        const rows = Array.from(formGrid.querySelectorAll('.mlb-row'));
        const ids = [];
        const fretes = [];
        for (const row of rows) {
            const id = String((row.querySelector('.mlb-id') || {}).value || '').trim();
            const frete = String((row.querySelector('.mlb-frete') || {}).value || '').trim();
            if (!id) continue;
            ids.push(id);
            fretes.push(frete || '-');
        }

        return {
            mlb_ids: ids.join('|'),
            custos_frete_mlb: fretes.join('|')
        };
    }

    function montarFormulario() {
        formGrid.innerHTML = '';
        const campos = ordemCampos(colunas);
        campos.forEach(c => {
            if (c === 'custos_frete_mlb') return;
            if (c === 'mlb_ids') {
                formGrid.appendChild(criarEditorMlb());
                return;
            }
            formGrid.appendChild(criarCampo(c));
        });
    }

    async function carregarColunas() {
        setStatus('Carregando colunas do cadastro...', 'loading');
        try {
            const resp = await fetch('/api/cadastro/colunas', { headers: obterAuthHeaders() });
            const payload = await resp.json();
            if (!resp.ok) throw new Error(payload?.detail || `HTTP ${resp.status}`);
            colunas = Array.isArray(payload.colunas) ? payload.colunas : [];
            if (!colunas.includes('sku')) colunas.unshift('sku');
            montarFormulario();
            setStatus('Preencha os dados para incluir um novo SKU.', 'success');
        } catch (e) {
            setStatus(`Erro ao carregar colunas: ${e.message}`, 'error');
        }
    }

    async function incluirSku(ev) {
        ev.preventDefault();
        const data = {};
        const els = formGrid.querySelectorAll('input[name], textarea[name]');
        els.forEach(el => {
            if (el.name === 'updated_at') return;
            if (el.getAttribute('data-tipo') === 'moeda') {
                data[el.name] = brlParaNumeric(el.value);
            } else {
                data[el.name] = el.value || '';
            }
        });

        if (colunas.includes('mlb_ids')) {
            const parsed = extrairMlbFreteEditor();
            data.mlb_ids = parsed.mlb_ids;
            data.custos_frete_mlb = parsed.custos_frete_mlb;
        }

        if (fotoPendenteDataUrl) {
            data.__foto_data_url = fotoPendenteDataUrl;
            data.__foto_filename = fotoPendenteFilename || 'imagem.png';
        }

        if (!String(data.sku || '').trim()) {
            setStatus('Informe o SKU para cadastrar.', 'error');
            return;
        }

        setStatus('Incluindo SKU...', 'loading');
        try {
            const resp = await fetch('/api/cadastro/produto', {
                method: 'POST',
                headers: obterAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(data)
            });
            const payload = await resp.json();
            if (!resp.ok) throw new Error(payload?.detail || `HTTP ${resp.status}`);

            setStatus(`SKU incluído com sucesso: ${payload.sku || data.sku}`, 'success');
            formIncluir.reset();
            fotoPendenteDataUrl = '';
            fotoPendenteFilename = '';
            atualizarPreviewFoto();
        } catch (e) {
            setStatus(`Erro ao incluir SKU: ${e.message}`, 'error');
        }
    }

    btnLimpar.addEventListener('click', () => {
        formIncluir.reset();
        fotoPendenteDataUrl = '';
        fotoPendenteFilename = '';
        atualizarPreviewFoto();
    });
    formIncluir.addEventListener('submit', incluirSku);

    btnUploadFoto.addEventListener('click', () => fotoInput.click());
    fotoInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            prepararImagemPendente(e.target.files[0]);
        }
    });

    btnPasteFoto.addEventListener('click', async () => {
        try {
            const clips = await navigator.clipboard.read();
            for (const clip of clips) {
                if (clip.types.includes('image/png') || clip.types.includes('image/webp')) {
                    const blob = await clip.getType(clip.types.find(t => t.includes('image/')));
                    prepararImagemPendente(blob);
                    return;
                }
            }
            setStatus('Nenhuma imagem na área de transferência.', 'error');
        } catch (e) {
            setStatus(`Erro ao colar imagem: ${e.message}`, 'error');
        }
    });

    document.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData)?.items || [];
        for (const item of items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                prepararImagemPendente(item.getAsFile());
                return;
            }
        }
    });

    if (verificarSessao()) {
        carregarColunas();
    }
</script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
