        }
        .back-main-btn:hover {

        }
        .nav-actions .back-main-btn {

            z-index: auto;
        }
        h1 { margin:0; }
        .filters {
            display:flex;
            flex-direction:column;
            gap:8px;
            margin-bottom:12px;
            align-items:stretch;
        }
        .periodo-linha {
            display:flex;
            flex-wrap:wrap;
            gap:8px;

        .flatpickr-prev-month, .flatpickr-next-month { opacity:1!important; visibility:visible!important; display:block!important; width:34px; height:34px; padding:6px!important; border-radius:8px; top:4px; color:#2f4a67!important; }
        .flatpickr-prev-month svg, .flatpickr-next-month svg { display:block!important; width:18px; height:18px; fill:#2f4a67!important; }
        .loja-barra {

<div class="container">

<script>
    const params = new URLSearchParams(window.location.search);
    const skuAlvo = params.get('sku');
    const dataInicio = params.get('data_inicio') || '';
    const dataFim_param = params.get('data_fim') || '';
    const lojaAlvo = params.get('loja') || '';
    const unidadeNegocioAlvo = params.get('unidade_negocio') || '';
    const veioDeVendas = document.referrer && document.referrer.includes('/vendas.html');

    const tHead = document.getElementById('tHead');
    const tBody = document.getElementById('tBody');
    const resumo = document.getElementById('resumo');
    const statusEl = document.getElementById('status');
    const dataIni = document.getElementById('dataIni');
    const dataFimEl = document.getElementById('dataFim');
    const mesAno = document.getElementById('mesAno');
    const periodoTexto = document.getElementById('periodoTexto');
    const btnReload = document.getElementById('btnReload');
    const titulo = document.getElementById('titulo');
    const unidadeNegocioSelect = document.getElementById('unidadeNegocioSelect');
    const btnTransferenciaFull = document.getElementById('btnTransferenciaFull');
    const panelTransferenciaFull = document.getElementById('panelTransferenciaFull');
    const resumoTransferenciaFull = document.getElementById('resumoTransferenciaFull');
    const tBodyTransferenciaFull = document.getElementById('tBodyTransferenciaFull');
    const graficoObservacoes = document.getElementById('graficoObservacoes');
    const graficoSidebarTitulo = document.getElementById('graficoSidebarTitulo');
    const btnToggleObservacoes = document.getElementById('btnToggleObservacoes');
    const graficosContainer = document.querySelector('.graficos-container');
    const graficoSidebar = document.querySelector('.grafico-sidebar');
    const navActionsSKU = document.querySelector('.nav-actions');

    let clientId = null;
    let dados = [];
    let devolucoes = [];
    let vendasTransferenciaFull = [];
    let paginaEncerrando = false;
    let dateRangePicker = null;
    let dateFimPicker = null;
    let unidadeNegocioInicialAplicada = false;
    const controladoresFetchAtivos = new Set();
    const timeoutsAtivos = new Set();

    // Estado inicial: sidebar de observacoes sempre visivel ao abrir a pagina.
    if (graficosContainer) {
        graficosContainer.classList.remove('observacoes-fechado');
    }
    if (graficoSidebar) {
        graficoSidebar.style.display = 'block';
        graficoSidebar.style.visibility = 'visible';
        graficoSidebar.style.opacity = '1';
    }
    if (btnToggleObservacoes) {
        btnToggleObservacoes.style.display = 'inline-flex';
        btnToggleObservacoes.style.visibility = 'visible';
        btnToggleObservacoes.setAttribute('aria-expanded', 'true');
        btnToggleObservacoes.textContent = '❯';
    }

    // --- Funções de data (mesmo padrão de vendas.html) ---
    function toIsoDateFromInput(value) {
        const v = String(value || '').trim();
        if (!v) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
        if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) {
            const [d, m, y] = v.split('/');
            return `${y}-${m}-${d}`;
        }
        return '';
    }

    function getDataIniISO() { return toIsoDateFromInput(dataIni.value); }
    function getDataFimISO() { return toIsoDateFromInput(dataFimEl.value); }
    function getHojeISO() { return new Date().toISOString().split('T')[0]; }

    function setDataRangeISO(inicioIso, fimIso) {
        const hojeIso = getHojeISO();
        const fimSeguro = fimIso && fimIso > hojeIso ? hojeIso : fimIso;
        // Usa Date object para evitar ambiguidade na parse do flatpickr (formato d/m/Y)
        if (dateRangePicker) dateRangePicker.setDate(new Date(inicioIso + 'T12:00:00'), false);
        else dataIni.value = inicioIso;
        if (dateFimPicker) { if (fimSeguro) dateFimPicker.setDate(new Date(fimSeguro + 'T12:00:00'), false); else dateFimPicker.clear(false); }
        else dataFimEl.value = fimSeguro || '';
    }

    function limitarDataFinalAoHoje() {
        const fimIso = getDataFimISO();
        if (!fimIso) return false;
        const hojeIso = getHojeISO();
        if (fimIso <= hojeIso) return false;
        setDataRangeISO(getDataIniISO() || hojeIso, hojeIso);
        return true;
    }

    function garantirOrdemPeriodo() {
        const iniIso = getDataIniISO(), fimIso = getDataFimISO();
        if (!iniIso || !fimIso || fimIso >= iniIso) return false;
        setDataRangeISO(iniIso, iniIso);
        return true;
    }

    function atualizarPeriodoTexto() {
        const ini = getDataIniISO(), fim = getDataFimISO();
        if (ini && fim) {
            periodoTexto.textContent = 'Período: ' + formatDate(ini) + ' até ' + formatDate(fim);
        } else {
            periodoTexto.textContent = 'Período: não selecionado';
        }
    }

    function sincronizarMesAnoSelect(inicioIso, fimIso) {
        const mIni = (inicioIso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        const mFim = (fimIso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        let valor = '';
        if (mIni && mFim && mIni[1] === mFim[1] && mIni[2] === mFim[2] && mIni[3] === '01') {
            const ultimoDia = new Date(Number(mIni[1]), Number(mIni[2]), 0).getDate();
            if (Number(mFim[3]) === ultimoDia) valor = `${mIni[1]}-${mIni[2]}`;
        }
        mesAno.value = valor;
    }

    function preencherMeses() {
        const hoje = new Date();
        const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
        for (let i = 0; i < 24; i++) {
            const data = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
            const opt = document.createElement('option');
            opt.value = data.getFullYear() + '-' + String(data.getMonth()+1).padStart(2,'0');
            opt.textContent = meses[data.getMonth()] + ' de ' + data.getFullYear();
            mesAno.appendChild(opt);
        }
    }

    function selecionarMes(valor) {
        if (!valor) return;
        const [ano, mes] = valor.split('-');
        const ultimoDia = new Date(Number(ano), Number(mes), 0).getDate();
        const ini = `${ano}-${mes}-01`;
        const fim = `${ano}-${mes}-${String(ultimoDia).padStart(2,'0')}`;
        setDataRangeISO(ini, fim);
        atualizarPeriodoTexto();
        // setTimeout(0) garante que o flatpickr atualizou .value antes de ler getDataIniISO()
        setTimeout(() => {
            carregarUnidadesNegocioSku();
            carregarVendasSku();
        }, 0);
    }

    function initFlatpickrSku() {
        if (typeof flatpickr !== 'function') return;
        if (flatpickr?.localize && flatpickr?.l10ns?.pt) flatpickr.localize(flatpickr.l10ns.pt);
        dateRangePicker = flatpickr(dataIni, {
            dateFormat: 'd/m/Y', disableMobile: true, allowInput: true, clickOpens: true,
            maxDate: 'today', locale: flatpickr.l10ns?.pt,
            onChange: (sel) => {
                if (sel.length === 1) { dataFimEl.value = ''; if (dateFimPicker) { dateFimPicker.clear(false); dateFimPicker.open(); } }
            },
            onValueUpdate: () => atualizarPeriodoTexto(),
            onClose: () => {
                limitarDataFinalAoHoje();
                if (getDataIniISO() && getDataFimISO()) { atualizarPeriodoTexto(); carregarUnidadesNegocioSku(); carregarVendasSku(); }
            }
        });
        dateFimPicker = flatpickr(dataFimEl, {
            dateFormat: 'd/m/Y', disableMobile: true, allowInput: true, clickOpens: true,
            maxDate: 'today', locale: flatpickr.l10ns?.pt,
            onChange: (sel, _s, inst) => { if (sel.length === 1 && inst?.isOpen) inst.close(); },
            onValueUpdate: () => { limitarDataFinalAoHoje(); garantirOrdemPeriodo(); atualizarPeriodoTexto(); },
            onClose: () => {
                limitarDataFinalAoHoje(); garantirOrdemPeriodo();
                if (getDataIniISO() && getDataFimISO()) { atualizarPeriodoTexto(); carregarUnidadesNegocioSku(); carregarVendasSku(); }
            }
        });
    }

    function agendarTimeout(fn, ms) {
        const id = setTimeout(() => {
            timeoutsAtivos.delete(id);
            fn();
        }, ms);
        timeoutsAtivos.add(id);
        return id;
    }

    async function fetchCancelable(url, options = {}) {
        if (paginaEncerrando) {
            throw new Error('Navegando para Vendas');
        }
        const controller = new AbortController();
        controladoresFetchAtivos.add(controller);
        try {
            return await fetch(url, {
                ...options,
                signal: controller.signal
            });
        } finally {
            controladoresFetchAtivos.delete(controller);
        }
    }

    function cancelarProcessosAtivosSku() {
        paginaEncerrando = true;
        controladoresFetchAtivos.forEach(controller => controller.abort());
        controladoresFetchAtivos.clear();
        timeoutsAtivos.forEach(id => clearTimeout(id));
        timeoutsAtivos.clear();
        if (chartInstance) {
            chartInstance.destroy();
            chartInstance = null;
        }
    }

    // Funções utilitárias
    function formatDate(dateStr) {
        if (!dateStr) return '';
        const [year, month, day] = dateStr.split('-');
        return day + '/' + month + '/' + year;
    }

    if (skuAlvo) {
        titulo.textContent = 'SKU: ' + skuAlvo;
    }

    preencherMeses();
    initFlatpickrSku();
    // Inicializa datas APÓS o flatpickr estar pronto para que setDate() seja chamado corretamente
    if (dataInicio) setDataRangeISO(dataInicio, dataFim_param || dataInicio);
    else if (dataFim_param) setDataRangeISO(dataFim_param, dataFim_param);
    atualizarPeriodoTexto();
    if (dataInicio && dataFim_param) sincronizarMesAnoSelect(dataInicio, dataFim_param);
    mesAno.addEventListener('change', (e) => selecionarMes(e.target.value));

    // Redireciona setDataRangeISO para funcionar antes do flatpickr estar inicializado
    // (já tratado com fallback no método)

    function formatCurrency(v) {
        return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function vendaEhTransferenciaFull(venda) {
        const devolucao = Number(venda?.devolucao || 0) === 1;
        if (devolucao) return false;
        const comprador = String(venda?.comprador || '').toUpperCase();
        const canal = String(venda?.canal || '').toUpperCase();
        return comprador.includes('EBAZAR') || canal.includes('EBAZAR');
    }

        const totalItens = vendasTransferenciaFull.reduce((acc, cur) => acc + Number(cur.quantidade || 0), 0);
        const totalValor = vendasTransferenciaFull.reduce((acc, cur) => acc + Number(cur.valor || 0), 0);

    function vendaEhEbazarSomatorio(venda) {
        const devolucao = Number(venda?.devolucao || 0) === 1;
        if (devolucao) return true;
        const comprador = String(venda?.comprador || '').toUpperCase();
        const canal = String(venda?.canal || '').toUpperCase();
        return comprador.includes('EBAZAR') || canal.includes('EBAZAR');
    }

    function renderResumo(lista, dev) {
        const listaSomatorio = (lista || []).filter(item => !vendaEhEbazarSomatorio(item));
        const totalPedidos = listaSomatorio.length;
        const totalItens = listaSomatorio.reduce((acc, cur) => acc + Number(cur.quantidade || 0), 0);
        const totalValor = listaSomatorio.reduce((acc, cur) => acc + Number(cur.valor || 0), 0);
        const totalDevolucoes = dev.length;
        const itensDevolucao = dev.reduce((acc, cur) => acc + Number(cur.quantidade || 0), 0);
        const valorDevolucao = dev.reduce((acc, cur) => acc + Number(cur.valor_total || 0), 0);
        const itensLiquidos = totalItens - itensDevolucao;
        const valorLiquido = totalValor - valorDevolucao;
        resumo.innerHTML = '';
        const cards = [
            { label: 'Pedidos Vendidos', value: totalPedidos },
            { label: 'Itens Vendidos', value: totalItens },
            { label: 'Valor Bruto', value: formatCurrency(totalValor) },
            { label: 'Devolucoes', value: totalDevolucoes, isNegative: true },
            { label: 'Itens Devolvidos', value: itensDevolucao, isNegative: true },
            { label: 'Valor Devolvido', value: formatCurrency(valorDevolucao), isNegative: true },
            { label: 'Itens Liquidos', value: itensLiquidos, isLiquido: true },
            { label: 'Valor Liquido', value: formatCurrency(valorLiquido), isLiquido: true }
        ];
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            if (c.isNegative) {
                div.style.background = '#8f1f26';
                div.style.borderLeft = '4px solid #ff6d74';
                div.style.color = '#fff';
            } else if (c.isLiquido) {
                div.style.background = '#1a5a29';
                div.style.borderLeft = '4px solid #69d68e';
                div.style.fontWeight = 'bold';
                div.style.color = '#fff';
            }
            const h3 = document.createElement('h3');
            if (c.isNegative || c.isLiquido) h3.style.color = '#fff';
            h3.textContent = c.label;
            const val = document.createElement('div');
            val.className = 'val';
            if (c.isNegative || c.isLiquido) val.style.color = '#fff';
            val.textContent = c.value;
            div.appendChild(h3);
            div.appendChild(val);
            resumo.appendChild(div);
        });
    }

    function obterClientId() {
        const user = JSON.parse(localStorage.getItem('user_data') || 'null');
        return user && user.client_id ? user.client_id : null;
    }

    function obterHeadersProtegidos(extra = {}) {
        if (typeof obterAuthHeaders === 'function') {
            return obterAuthHeaders(extra);
        }
        const cid = clientId || obterClientId();
        return {
            ...extra,
            ...(cid ? { 'X-Client-ID': cid } : {})
        };
    }

    function normalizarTextoUnidade(valor) {
        return String(valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/\s+/g, ' ')
            .trim();
    }

    async function carregarUnidadesNegocioSku() {
        try {
            const qsUn = new URLSearchParams();
            if (lojaAlvo) qsUn.append('loja', lojaAlvo);
            if (skuAlvo) qsUn.append('sku', skuAlvo);
            const iniIso = getDataIniISO();
            const fimIso = getDataFimISO();
            if (iniIso) qsUn.append('data_inicio', iniIso);
            if (fimIso) qsUn.append('data_fim', fimIso);
            const resp = await fetchCancelable('/api/unidades-negocios' + (qsUn.toString() ? `?${qsUn.toString()}` : ''), { headers: obterHeadersProtegidos() });
            if (!resp.ok) return;
            const payload = await resp.json();
            const unidades = Array.isArray(payload?.unidades) ? payload.unidades : [];
            const nomes = unidades
                .map(u => String(u?.nome || '').trim())
                .filter(Boolean);

            const atual = (!unidadeNegocioInicialAplicada && unidadeNegocioAlvo)
                ? unidadeNegocioAlvo
                : (unidadeNegocioSelect.value || '__todos');
            unidadeNegocioSelect.innerHTML = '<option value="__todos">Todas as lojas virtuais</option>';

            const nomesUnicos = [];
            const nomesNorm = new Set();
            nomes.forEach(nome => {
                const norm = normalizarTextoUnidade(nome);
                if (!norm || nomesNorm.has(norm)) return;
                nomesNorm.add(norm);
                nomesUnicos.push(nome);
            });

            nomesUnicos.sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(nome => {
                const opt = document.createElement('option');
                opt.value = nome;
                opt.textContent = String(nome || '').replace(/^\s*Unidade\s+/i, '').trim() || nome;
                unidadeNegocioSelect.appendChild(opt);
            });

            // Se veio unidade na URL e ela não estiver na lista, mantém como opção para preservar o filtro no drill-down.
            if (unidadeNegocioAlvo) {
                const alvoNorm = normalizarTextoUnidade(unidadeNegocioAlvo);
                const existeAlvo = Array.from(unidadeNegocioSelect.options)
                    .some(o => normalizarTextoUnidade(o.value) === alvoNorm);
                if (!existeAlvo) {
                    const opt = document.createElement('option');
                    opt.value = unidadeNegocioAlvo;
                    opt.textContent = unidadeNegocioAlvo;
                    unidadeNegocioSelect.appendChild(opt);
                }
            }

            const opcoes = Array.from(unidadeNegocioSelect.options);
            const atualNorm = normalizarTextoUnidade(atual);
            const opcaoExata = opcoes.find(o => o.value === atual);
            const opcaoNormalizada = opcaoExata || opcoes.find(o => normalizarTextoUnidade(o.value) === atualNorm);
            unidadeNegocioSelect.value = opcaoNormalizada ? opcaoNormalizada.value : '__todos';
            unidadeNegocioInicialAplicada = true;
        } catch (_e) {
            // Se falhar, mantém apenas "Todas as lojas virtuais".
        }
    }

    async function carregarVendasSku() {
        if (paginaEncerrando) return;
        statusEl.className = 'status-bar loading';
        statusEl.textContent = 'Carregando vendas e devolucoes...';
        try {
            clientId = clientId || obterClientId();
            if (!clientId) { 
                console.warn('ClientId vazio - tentando carregar de localStorage novamente');
                const userData2 = JSON.parse(localStorage.getItem('user_data') || 'null');
                if (userData2 && userData2.client_id) {
                    clientId = userData2.client_id;
                    console.log('ClientId recuperado:', clientId);
                }
            }
            
            if (!clientId) { 
                statusEl.className = 'status-bar error';
                statusEl.innerHTML = '⚠️ Sessão expirada. <a href="/frontend_index.html" style="color:white; text-decoration:underline;">Fazer login novamente</a>';
                console.warn('ClientId ainda vazio');
                return; 
            }
            if (!skuAlvo) { 
                statusEl.textContent = 'SKU nao informado.'; 
                return; 
            }
            
            const iniIso = getDataIniISO();
            const fimIso = getDataFimISO();
            const qs = new URLSearchParams({ sku: skuAlvo, resolver_nf: '0' });
            if (iniIso) qs.append('data_inicio', iniIso);
            if (fimIso) qs.append('data_fim', fimIso);
            if (lojaAlvo) qs.append('loja', lojaAlvo);
            if (unidadeNegocioSelect.value && unidadeNegocioSelect.value !== '__todos') {
                qs.append('unidade_negocio', unidadeNegocioSelect.value);
            }
            const qsTransfer = new URLSearchParams(qs);
            qsTransfer.set('incluir_ebazar', '1');

            const graficoPromise = carregarGrafico();
            
            const url = '/api/vendas?' + qs.toString();
            const urlTransfer = '/api/vendas?' + qsTransfer.toString();
            const qsDev = new URLSearchParams();
            if (iniIso) qsDev.append('data_inicio', iniIso);
            if (fimIso) qsDev.append('data_fim', fimIso);
            if (lojaAlvo) qsDev.append('loja', lojaAlvo);
            if (unidadeNegocioSelect.value && unidadeNegocioSelect.value !== '__todos') {
                qsDev.append('unidade_negocio', unidadeNegocioSelect.value);
            }
            const urlDev = '/api/notas-entrada/sku/' + encodeURIComponent(skuAlvo) + '?' + qsDev.toString();

            const [resp, respDev, respTransfer] = await Promise.all([
                fetchCancelable(url, { headers: obterHeadersProtegidos() }),
                fetchCancelable(urlDev, { headers: obterHeadersProtegidos() }),
                fetchCancelable(urlTransfer, { headers: obterHeadersProtegidos() })
            ]);

            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const dadosApi = await resp.json();
            dados = (Array.isArray(dadosApi) ? dadosApi : []).filter(item => Number(item?.devolucao || 0) !== 1);
            if (respDev.ok) {
                devolucoes = await respDev.json();
            } else {
                devolucoes = [];
            }

            let listaTransferencia = [];
            if (respTransfer.ok) {
                const dadosComEbazar = await respTransfer.json();
                listaTransferencia = (Array.isArray(dadosComEbazar) ? dadosComEbazar : []).filter(vendaEhTransferenciaFull);
            }
            renderTransferenciaFull(listaTransferencia);
            
            if (paginaEncerrando) return;

            // A API de devoluções já recebe os mesmos filtros (loja/unidade/período),
            // então devemos sempre contabilizar o retorno para manter o resumo consistente.
            renderResumo(dados, devolucoes);
            renderTabela(dados, devolucoes);
            statusEl.className = 'status-bar';
            statusEl.textContent = '';
            await graficoPromise;

            // Hidrata numero de NF em segundo plano sem bloquear a primeira renderizacao.
            hidratarNfEmSegundoPlano(qs);
        } catch (e) {
            if (paginaEncerrando || e.name === 'AbortError') {
                return;
            }
            statusEl.className = 'status-bar error';
            statusEl.textContent = 'Erro ao carregar: ' + e.message;
            console.error(e);
        }
    }

    function chaveVenda(v) {
        return [
            (v.data || '').slice(0, 10),
            String(v.numero || ''),
            String(v.quantidade || ''),
            String(v.valor || ''),
            String(v.nota_fiscal_id || '')
        ].join('|');
    }

    async function hidratarNfEmSegundoPlano(qsBase) {
        if (paginaEncerrando) return;
        const semNf = dados.some(v => !v.numero_nf && v.nota_fiscal_id);
        if (!semNf) return;

        try {
            const qsNf = new URLSearchParams(qsBase);
            qsNf.set('resolver_nf', '1');
            const respNf = await fetchCancelable('/api/vendas?' + qsNf.toString(), { headers: obterHeadersProtegidos() });
            if (!respNf.ok) return;

            const dadosComNf = await respNf.json();
            const mapaNf = new Map(dadosComNf.map(item => [chaveVenda(item), item.numero_nf || '']));
            let alterou = false;

            dados = dados.map(item => {
                const nf = mapaNf.get(chaveVenda(item));
                if (nf && nf !== item.numero_nf) {
                    alterou = true;
                    return { ...item, numero_nf: nf };
                }
                return item;
            });

            if (alterou) {
                if (paginaEncerrando) return;
                renderTabela(dados, devolucoes);
            }
        } catch (_e) {
            // Sem impacto na UX principal se a hidratacao de NF falhar.
        }
    }

    // ==================== GRÁFICOS ====================
    let chartInstance = null;
    let periodoGrafico = '3m';
    let tipoGrafico = 'linha';
    let metricaGrafico = 'valor';
    let intervaloGrafico = 'dia';

    function chavePreferenciaGraficoSku() {
        const cid = clientId || obterClientId() || 'anon';
        return `vendas_sku_grafico_pref_${cid}`;
    }

    function salvarPreferenciaGraficoSku() {
        try {
            localStorage.setItem(chavePreferenciaGraficoSku(), JSON.stringify({
                periodo: periodoGrafico,
                tipo: tipoGrafico,
                metrica: metricaGrafico,
                intervalo: intervaloGrafico
            }));
        } catch (_e) {
            // Ignora erro de localStorage.
        }
    }

    function carregarPreferenciaGraficoSku() {
        try {
            const raw = localStorage.getItem(chavePreferenciaGraficoSku());
            if (!raw) return;
            const pref = JSON.parse(raw);
            if (pref?.periodo) periodoGrafico = pref.periodo;
            if (pref?.tipo) tipoGrafico = pref.tipo;
            if (pref?.metrica) metricaGrafico = pref.metrica;
            if (pref?.intervalo) intervaloGrafico = pref.intervalo;
        } catch (_e) {
            // Ignora preferência inválida.
        }
    }

    function aplicarPreferenciaGraficoUI() {
        document.querySelectorAll('.grafico-btn[data-periodo]').forEach(b => {
            b.classList.toggle('active', b.dataset.periodo === periodoGrafico);
        });
        document.querySelectorAll('.grafico-btn[data-tipo]').forEach(b => {
            b.classList.toggle('active', b.dataset.tipo === tipoGrafico);
        });
        document.querySelectorAll('.grafico-btn[data-metrica]').forEach(b => {
            b.classList.toggle('active', b.dataset.metrica === metricaGrafico);
        });
        document.querySelectorAll('.grafico-btn[data-intervalo]').forEach(b => {
            b.classList.toggle('active', b.dataset.intervalo === intervaloGrafico);
        });

        const btnsPeriodo = document.querySelectorAll('.grafico-btn[data-periodo]');
        if (intervaloGrafico === 'semana') {
            btnsPeriodo.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.style.cursor = 'not-allowed';
            });
        } else {
            btnsPeriodo.forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            });
        }
    }

    function formatarLabelDataGrafico(label) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(label || '')) {
            const [ano, mes, dia] = label.split('-');
            return `${dia}/${mes}/${ano}`;
        }
        return label;
    }

    function atualizarObservacoesGrafico(data) {
        if (!graficoObservacoes) return;
        if (graficoSidebarTitulo) {
            graficoSidebarTitulo.textContent = `Observações do SKU ${skuAlvo || '-'}`;
        }
        const labels = Array.isArray(data?.labels) ? data.labels : [];
        const qtdVendas = Array.isArray(data?.quantidades_vendas) ? data.quantidades_vendas : [];
        const qtdDevol = Array.isArray(data?.quantidades_devolucoes) ? data.quantidades_devolucoes : [];
        const valVendas = Array.isArray(data?.valores_vendas) ? data.valores_vendas : [];
        const valDevol = Array.isArray(data?.valores_devolucoes) ? data.valores_devolucoes : [];

        const totalQtdVendas = qtdVendas.reduce((acc, v) => acc + Number(v || 0), 0);
        const totalQtdDevol = qtdDevol.reduce((acc, v) => acc + Number(v || 0), 0);
        const totalValVendas = valVendas.reduce((acc, v) => acc + Number(v || 0), 0);
        const totalValDevol = valDevol.reduce((acc, v) => acc + Number(v || 0), 0);

        let picoVendaIdx = -1;
        let picoDevolIdx = -1;
        let picoVendaValor = -1;
        let picoDevolValor = -1;
        const seriePicoVenda = metricaGrafico === 'quantidade' ? qtdVendas : valVendas;
        const seriePicoDevol = metricaGrafico === 'quantidade' ? qtdDevol : valDevol;

        seriePicoVenda.forEach((v, idx) => {
            const n = Number(v || 0);
            if (n > picoVendaValor) {
                picoVendaValor = n;
                picoVendaIdx = idx;
            }
        });
        seriePicoDevol.forEach((v, idx) => {
            const n = Number(v || 0);
            if (n > picoDevolValor) {
                picoDevolValor = n;
                picoDevolIdx = idx;
            }
        });

        const taxaDevol = totalQtdVendas > 0 ? (totalQtdDevol / totalQtdVendas) * 100 : 0;
        const periodoPicoVenda = picoVendaIdx >= 0 ? formatarLabelDataGrafico(labels[picoVendaIdx] || '-') : '-';
        const periodoPicoDevol = picoDevolIdx >= 0 ? formatarLabelDataGrafico(labels[picoDevolIdx] || '-') : '-';

        graficoObservacoes.innerHTML = `
            <div class="sidebar-obs-card sidebar-obs-neutro">
                <div class="sidebar-obs-label">🔎 SKU analisado</div>
                <div class="sidebar-obs-valor">${skuAlvo || '-'}</div>
                <div class="sidebar-obs-detalhe">resumo do período selecionado</div>
            </div>
            <div class="sidebar-obs-card sidebar-obs-vendas">
                <div class="sidebar-obs-label">💰 Total vendido</div>
                <div class="sidebar-obs-valor">${Math.round(totalQtdVendas).toLocaleString('pt-BR')} item(ns)</div>
                <div class="sidebar-obs-detalhe">${formatCurrency(totalValVendas)}</div>
            </div>
            <div class="sidebar-obs-card sidebar-obs-devolucao">
                <div class="sidebar-obs-label">📦 Total devolvido</div>
                <div class="sidebar-obs-valor">${Math.round(totalQtdDevol).toLocaleString('pt-BR')} item(ns)</div>
                <div class="sidebar-obs-detalhe">${formatCurrency(totalValDevol)}</div>
            </div>
            <div class="sidebar-obs-card sidebar-obs-devolucao">
                <div class="sidebar-obs-label">📊 Taxa de devolução</div>
                <div class="sidebar-obs-valor">${taxaDevol.toFixed(1).replace('.', ',')}%</div>
                <div class="sidebar-obs-detalhe">sobre itens vendidos</div>
            </div>
            <div class="sidebar-obs-card sidebar-obs-vendas">
                <div class="sidebar-obs-label">📈 Pico de vendas</div>
                <div class="sidebar-obs-valor">${periodoPicoVenda}</div>
                <div class="sidebar-obs-detalhe">${metricaGrafico === 'quantidade' ? 'por quantidade' : 'por valor'}</div>
            </div>
            <div class="sidebar-obs-card sidebar-obs-devolucao">
                <div class="sidebar-obs-label">📉 Pico de devoluções</div>
                <div class="sidebar-obs-valor">${periodoPicoDevol}</div>
                <div class="sidebar-obs-detalhe">${metricaGrafico === 'quantidade' ? 'por quantidade' : 'por valor'}</div>
            </div>
        `;
    }

    async function carregarGrafico() {
        if (paginaEncerrando) return;
        try {
            const params = new URLSearchParams({
                periodo: periodoGrafico,
                intervalo: intervaloGrafico,
                sku: skuAlvo
            });

            if (dataIni.value) params.append('data_inicio', getDataIniISO() || dataIni.value);
            if (dataFimEl.value) params.append('data_fim', getDataFimISO() || dataFimEl.value);
            if (lojaAlvo) params.append('loja', lojaAlvo);
            if (unidadeNegocioSelect.value && unidadeNegocioSelect.value !== '__todos') {
                params.append('unidade_negocio', unidadeNegocioSelect.value);
            }

            const response = await fetchCancelable(`/api/vendas/grafico?${params.toString()}`, {
                headers: obterHeadersProtegidos()
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const data = await response.json();

            if (paginaEncerrando) return;
            renderizarGrafico(data);
            atualizarObservacoesGrafico(data);
        } catch (error) {
            if (paginaEncerrando || error.name === 'AbortError') {
                return;
            }
            console.error('Erro ao carregar gráfico:', error);
            if (graficoObservacoes) {
                graficoObservacoes.innerHTML = `
                    <div class="sidebar-obs-card sidebar-obs-devolucao">
                        <div class="sidebar-obs-label">Erro ao carregar</div>
                        <div class="sidebar-obs-detalhe">Não foi possível carregar observações do gráfico.</div>
                    </div>
                `;
            }
        }
    }

    function renderizarGrafico(data) {
        const ctx = document.getElementById('graficoVendas').getContext('2d');
        
        // Destruir gráfico anterior se existir
        if (chartInstance) {
            chartInstance.destroy();
        }

        const tipo = tipoGrafico === 'linha' ? 'line' : 'bar';
        const usandoQuantidade = metricaGrafico === 'quantidade';

        const unidadesNoTopoPlugin = {
            id: 'unidadesNoTopo',
            afterDatasetsDraw(chart) {
                const { ctx } = chart;
                ctx.save();
                ctx.font = '700 11px Segoe UI';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';

                const seriesQtd = [
                    data.quantidades_vendas || [],
                    data.quantidades_devolucoes || []
                ];

                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    if (!meta || meta.hidden) return;

                    meta.data.forEach((pointOrBar, index) => {
                        const pos = pointOrBar.tooltipPosition();
                        ctx.fillStyle = datasetIndex === 0 ? '#9bd1ff' : '#ffb3b3';

                        if (tipoGrafico === 'barra') {
                            const valorMetrica = Number((chart.data.datasets[datasetIndex]?.data || [])[index] || 0);
                            if (!valorMetrica) return;
                            const yBar = Math.min(pos.y - 6, chart.chartArea.bottom - 4);
                            const textoBarra = usandoQuantidade
                                ? Math.round(valorMetrica).toLocaleString('pt-BR')
                                : ('R$ ' + valorMetrica.toFixed(2));
                            ctx.fillText(textoBarra, pos.x, yBar);
                            return;
                        }

                        if (tipoGrafico === 'linha') {
                            const valor = Number((dataset.data || [])[index] || 0);
                            if (!Number.isFinite(valor)) return;
                            const texto = usandoQuantidade
                                ? Math.round(valor).toLocaleString('pt-BR')
                                : ('R$ ' + valor.toFixed(2));
                            const yLinha = pos.y - 8;
                            ctx.fillText(texto, pos.x, yLinha);
                        }
                    });
                });

                ctx.restore();
            }
        };

        chartInstance = new Chart(ctx, {
            type: tipo,
            plugins: [unidadesNoTopoPlugin],
            data: {
                labels: (data.labels || []).map(formatarLabelDataGrafico),
                datasets: [
                    {
                        label: usandoQuantidade ? `Vendas - SKU ${skuAlvo} (Qtd)` : `Vendas - SKU ${skuAlvo} (R$)`,
                        data: usandoQuantidade ? (data.quantidades_vendas || []) : (data.valores_vendas || []),
                        backgroundColor: tipoGrafico === 'linha' ? 'rgba(79, 172, 254, 0.2)' : 'rgba(79, 172, 254, 0.6)',
                        borderColor: 'rgba(79, 172, 254, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: usandoQuantidade ? `Devoluções - SKU ${skuAlvo} (Qtd)` : `Devoluções - SKU ${skuAlvo} (R$)`,
                        data: usandoQuantidade ? (data.quantidades_devolucoes || []) : (data.valores_devolucoes || []),
                        backgroundColor: tipoGrafico === 'linha' ? 'rgba(255, 107, 107, 0.2)' : 'rgba(255, 107, 107, 0.6)',
                        borderColor: 'rgba(255, 107, 107, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: '#e5e5e5'
                        }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                const idx = context.dataIndex;
                                const isVendas = context.datasetIndex === 0;
                                const qtdSerie = isVendas
                                    ? (data.quantidades_vendas || [])
                                    : (data.quantidades_devolucoes || []);
                                const qtd = Number(qtdSerie[idx] || 0);
                                if (usandoQuantidade) {
                                    label += String(Math.round(context.parsed.y));
                                } else {
                                    label += 'R$ ' + context.parsed.y.toFixed(2) + ` | Qtd: ${qtd}`;
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#e5e5e5',
                            maxRotation: 45,
                            minRotation: 45
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    y: {
                        ticks: {
                            color: '#e5e5e5',
                            callback: function(value) {
                                if (usandoQuantidade) {
                                    return Number(value || 0).toLocaleString('pt-BR');
                                }
                                return 'R$ ' + value.toFixed(2);
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    }
                }
            }
        });
    }

    // Event listeners para controles de gráfico
    document.querySelectorAll('.grafico-btn[data-periodo]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.grafico-btn[data-periodo]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            periodoGrafico = this.dataset.periodo;
            salvarPreferenciaGraficoSku();
            
            // Calcular e aplicar datas correspondentes
            const hoje = new Date();
            let dataInicial;
            
            if (periodoGrafico === '3m') {
                dataInicial = new Date(hoje);
                dataInicial.setDate(hoje.getDate() - 90);
            } else if (periodoGrafico === '6m') {
                dataInicial = new Date(hoje);
                dataInicial.setDate(hoje.getDate() - 180);
            } else if (periodoGrafico === '1a') {
                dataInicial = new Date(hoje);
                dataInicial.setDate(hoje.getDate() - 365);
            } else if (periodoGrafico === '2a') {
                dataInicial = new Date(hoje);
                dataInicial.setDate(hoje.getDate() - 730);
            } else if (periodoGrafico === 'max') {
                dataInicial = new Date(hoje);
                dataInicial.setFullYear(hoje.getFullYear() - 10);
            } else {
                dataInicial = new Date(hoje);
                dataInicial.setDate(hoje.getDate() - 90);
            }
            
            // Atualizar inputs de data
            dataIni.value = dataInicial.toISOString().split('T')[0];
            dataFimEl.value = hoje.toISOString().split('T')[0];
            atualizarPeriodoTexto();
            
            // Recarregar dados do SKU; o gráfico é carregado dentro do próprio fluxo.
            carregarVendasSku();
        });
    });

    document.querySelectorAll('.grafico-btn[data-tipo]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.grafico-btn[data-tipo]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            tipoGrafico = this.dataset.tipo;
            salvarPreferenciaGraficoSku();
            carregarGrafico();
        });
    });

    document.querySelectorAll('.grafico-btn[data-metrica]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.grafico-btn[data-metrica]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            metricaGrafico = this.dataset.metrica;
            salvarPreferenciaGraficoSku();
            carregarGrafico();
        });
    });

    document.querySelectorAll('.grafico-btn[data-intervalo]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.grafico-btn[data-intervalo]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            intervaloGrafico = this.dataset.intervalo;
            salvarPreferenciaGraficoSku();
            
            // Desabilitar botões de período se intervalo = semana
            const btnsPeriodo = document.querySelectorAll('.grafico-btn[data-periodo]');
            if (intervaloGrafico === 'semana') {
                btnsPeriodo.forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                });
            } else {
                btnsPeriodo.forEach(btn => {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                });
            }
            
            carregarGrafico();
        });
    });

    if (btnToggleObservacoes && graficosContainer && navActionsSKU) {
        // Inicializa estado dos botões no carregamento
        const fechadoInicial = graficosContainer.classList.contains('observacoes-fechado');
        console.log('Sidebar SKU carregado, fechado:', fechadoInicial);
        document.body.classList.toggle('sidebar-observacoes-aberto', !fechadoInicial);
        console.log('Classe sidebar-observacoes-aberto adicionada:', document.body.classList.contains('sidebar-observacoes-aberto'));
        
        // Oculta TODOS os botões .back-main-btn diretamente
        document.querySelectorAll('.back-main-btn').forEach(btn => {
            btn.style.display = 'none';
            btn.style.visibility = 'hidden';
            btn.style.pointerEvents = 'none';
        });
        console.log('Todos os .back-main-btn ocultados');

        btnToggleObservacoes.addEventListener('click', () => {
            const fechado = graficosContainer.classList.toggle('observacoes-fechado');
            const temClasse = !fechado;
            document.body.classList.toggle('sidebar-observacoes-aberto', temClasse);
            console.log('Sidebar SKU toggle - fechado:', fechado, 'classe adicionada:', temClasse);
            
            // Oculta/mostra TODOS os .back-main-btn
            document.querySelectorAll('.back-main-btn').forEach(btn => {
                if (temClasse) {
                    btn.style.display = 'none';
                    btn.style.visibility = 'hidden';
                    btn.style.pointerEvents = 'none';
                    console.log('back-main-btn ocultado');
                } else {
                    btn.style.display = '';
                    btn.style.visibility = '';
                    btn.style.pointerEvents = '';
                    console.log('back-main-btn mostrado');
                }
            });
            
            btnToggleObservacoes.setAttribute('aria-expanded', String(!fechado));
            btnToggleObservacoes.setAttribute('aria-label', fechado ? 'Abrir observações' : 'Minimizar observações');
            btnToggleObservacoes.textContent = fechado ? '❮' : '❯';
        });
    }

    btnReload.addEventListener('click', () => { carregarUnidadesNegocioSku(); carregarVendasSku(); });
    btnTransferenciaFull.addEventListener('click', () => {
        if (!vendasTransferenciaFull.length) return;
        panelTransferenciaFull.classList.toggle('active');
    });
    unidadeNegocioSelect.addEventListener('change', () => { carregarVendasSku(); });

    const btnVoltarVendas = document.getElementById('btnVoltarVendas');
    if (btnVoltarVendas) {
        btnVoltarVendas.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            btnVoltarVendas.disabled = true;
            cancelarProcessosAtivosSku();

            if (veioDeVendas && window.history.length > 1) {
                agendarTimeout(() => window.history.back(), 10);
                return;
            }

            const qs = new URLSearchParams();
            const iniIso = getDataIniISO();
            const fimIso = getDataFimISO();
            if (iniIso) qs.append('data_inicio', iniIso);
            if (fimIso) qs.append('data_fim', fimIso);
            if (lojaAlvo) qs.append('loja', lojaAlvo);
            if (unidadeNegocioSelect.value && unidadeNegocioSelect.value !== '__todos') {
                qs.append('unidade_negocio', unidadeNegocioSelect.value);
            }
            qs.append('from_sku', '1');
            qs.append('_ts', String(Date.now()));
            const destino = '/vendas.html' + (qs.toString() ? `?${qs.toString()}` : '');
            agendarTimeout(() => window.location.replace(destino), 20);
        }, { capture: true });
    }

    carregarPreferenciaGraficoSku();
    aplicarPreferenciaGraficoUI();
    carregarLojasBotoes();
    carregarUnidadesNegocioSku().finally(() => {
        // Carregar automaticamente se houver período selecionado e SKU
        if (skuAlvo && (getDataIniISO() || dataInicio)) {
            carregarVendasSku();
        }
    });
    const lojaBotoes = document.getElementById('lojaBotoes');
    let lojaSelecionadaSku = lojaAlvo || '__todas';

    function renderBotoesLojasSku(lojas) {
        lojaBotoes.innerHTML = '';
        const todosBtn = document.createElement('button');
        todosBtn.textContent = 'Todas as lojas';
        todosBtn.className = 'loja-btn' + (lojaSelecionadaSku === '__todas' ? ' active' : '');
        todosBtn.onclick = () => trocarLojaSku('__todas');
        lojaBotoes.appendChild(todosBtn);
        lojas.forEach(l => {
            const btn = document.createElement('button');
            btn.textContent = l.nome;
            btn.className = 'loja-btn' + (lojaSelecionadaSku === l.nome ? ' active' : '');
            btn.onclick = () => trocarLojaSku(l.nome);
            lojaBotoes.appendChild(btn);
        });
    }

    function trocarLojaSku(novaLoja) {
        const qs = new URLSearchParams(window.location.search);
        if (novaLoja && novaLoja !== '__todas') qs.set('loja', novaLoja);
        else qs.delete('loja');
        const iniIso = getDataIniISO(), fimIso = getDataFimISO();
        if (iniIso) qs.set('data_inicio', iniIso);
        if (fimIso) qs.set('data_fim', fimIso);
        window.location.href = '/vendas_sku.html?' + qs.toString();
    }

    async function carregarLojasBotoes() {
        try {
            const resp = await fetchCancelable('/api/lojas', { headers: obterHeadersProtegidos() });
            if (!resp.ok) return;
            const lojas = await resp.json();
            if (!Array.isArray(lojas)) return;
            lojas.sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt-BR'));
            renderBotoesLojasSku(lojas);
        } catch (_e) {
            // Se falhar mantém botão Todas as lojas vazio
            lojaBotoes.innerHTML = '<button class="loja-btn active">Todas as lojas</button>';
        }
    }

</script>
<script src="/ia-sidebar.js"></script>
</body>
