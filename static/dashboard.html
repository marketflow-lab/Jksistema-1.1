<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JK Sistema</title>
    <script>
        (function () {
            const ua = navigator.userAgent || '';
            const mobileUa = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(ua);
            const compactScreen = window.matchMedia('(max-width: 920px)').matches;
            const touch = (navigator.maxTouchPoints || 0) > 0;
            window.__JK_DASHBOARD_MOBILE__ = mobileUa || (touch && compactScreen);
        })();
    </script>
    <style>
        @property --neon-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        :root {
            --bg: #070c14;
            --bg-alt: #0f1a2a;
            --card: #161925;
            --card-hover: #1b2232;
            --border: #2f3d56;
            --text: #e5e5e5;
            --muted: #b9c9df;
            --accent: #4facfe;
            --accent-hover: #3b8de0;
            --danger: #ff6b6b;
            --danger-hover: #e15757;
            --module-glow: rgba(79, 172, 254, 0.18);
        }

        body.dashboard-preload {
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 32px 20px;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 8%, rgba(79, 172, 254, 0.16), transparent 34%),
                radial-gradient(circle at 85% 12%, rgba(53, 182, 166, 0.11), transparent 30%),
                linear-gradient(145deg, var(--bg), #0b1320 58%, var(--bg-alt));
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .user-sidebar {
            position: fixed;
            left: 0;
            top: 20px;
            bottom: 20px;
            width: 224px;
            box-sizing: border-box;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px 16px;
            border: 1px solid rgba(127, 188, 255, 0.24);
            border-left: 0;
            border-radius: 0 16px 16px 0;
            background: linear-gradient(180deg, rgba(11, 24, 43, 0.94), rgba(8, 17, 32, 0.96));
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(10px);
            transform: translateX(-202px);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            pointer-events: none;
        }

        .user-sidebar.open {
            transform: translateX(0);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.44);
            pointer-events: auto;
        }

        .user-sidebar-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 14px;
            z-index: 45;
            background: transparent;
        }

        .user-sidebar-peek {
            position: absolute;
            right: 0;
            top: 50%;
            width: 22px;
            min-height: 108px;
            display: grid;
            place-items: center;
            color: #9bd1ff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            writing-mode: vertical-rl;
            text-transform: uppercase;
            transform: translateY(-50%);
            border-left: 1px solid rgba(127, 188, 255, 0.22);
            background: rgba(79, 172, 254, 0.08);
            pointer-events: none;
        }

        .user-sidebar.open .user-sidebar-peek {
            opacity: 0;
        }

        .user-sidebar-brand {
            color: #9bd1ff;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .user-sidebar-profile {
            display: grid;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #06111f;
            background: linear-gradient(135deg, #62d6ff, #61e2ad);
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 10px 24px rgba(79, 172, 254, 0.22);
        }

        .user-name {
            margin: 0;
            color: #f4f9ff;
            font-size: 1.02rem;
            font-weight: 850;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .user-email {
            margin: 3px 0 0;
            color: rgba(217, 234, 255, 0.74);
            font-size: 0.78rem;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .user-sidebar-details {
            display: grid;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.09);
        }

        .user-info-row {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .user-info-label {
            color: rgba(155, 209, 255, 0.78);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .user-info-value {
            color: #eef7ff;
            font-size: 0.84rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-sidebar-spacer {
            flex: 1;
        }

        .user-sidebar .sidebar-logout {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.18);
        }

        .user-sidebar-actions {
            display: grid;
            gap: 8px;
        }

        .user-sidebar-actions button {
            width: 100%;
        }

        body::selection {
            background: rgba(79, 172, 254, 0.3);
            color: #fff;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.28;
        }

        body::before {
            top: -120px;
            left: -80px;
            background: rgba(79, 172, 254, 0.55);
        }

        body::after {
            bottom: -130px;
            right: -90px;
            background: rgba(190, 135, 255, 0.45);
        }

        .container {
            max-width: 1160px;
            margin: 0 auto;
            transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
        }

        body.dashboard-preload .container {
            opacity: 0;
            transform: translateY(16px);
            filter: blur(8px);
        }

        .hero {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: #9bd1ff;
            margin: 0;
            font-size: clamp(1.7rem, 2.8vw, 2.4rem);
            letter-spacing: 0.4px;
            text-shadow: 0 6px 20px rgba(79, 172, 254, 0.2);
        }

        .subtitle {
            margin: 8px auto 0;
            color: var(--muted);
            font-size: 0.98rem;
            max-width: 720px;
            line-height: 1.4;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 18px;
        }

        .card {
            --module: var(--accent);
            --module-soft: rgba(79, 172, 254, 0.28);
            --module-glow: rgba(79, 172, 254, 0.18);
            --module-alt: #cfe8ff;
            --neon-angle: 0deg;
            --neon-a: rgba(0, 191, 255, 0);
            --neon-b: rgba(102, 214, 255, 0);
            background:
                radial-gradient(circle at 100% -10%, var(--module-glow), transparent 44%),
                linear-gradient(180deg, rgba(18, 27, 42, 0.95), rgba(14, 23, 37, 0.96)) padding-box,
                conic-gradient(
                    from var(--neon-angle),
                    transparent 0deg 58deg,
                    var(--neon-b) 76deg,
                    var(--neon-a) 90deg,
                    var(--neon-b) 104deg,
                    transparent 122deg 238deg,
                    var(--neon-b) 256deg,
                    var(--neon-a) 270deg,
                    var(--neon-b) 284deg,
                    transparent 302deg 360deg
                ) border-box;
            border: 1px solid transparent;
            padding: 26px 22px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            cursor: pointer;
            transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            will-change: transform;
            opacity: 1;
            isolation: isolate;
        }

        .card::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--module), transparent);
            opacity: 0.9;
            z-index: 0;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 0;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.08);
            --neon-a: rgba(0, 191, 255, 1);
            --neon-b: rgba(102, 214, 255, 0.92);
            background:
                radial-gradient(circle at 100% -10%, var(--module-glow), transparent 40%),
                linear-gradient(180deg, var(--card-hover), rgba(22, 34, 51, 0.98)) padding-box,
                conic-gradient(
                    from var(--neon-angle),
                    transparent 0deg 58deg,
                    var(--neon-b) 76deg,
                    var(--neon-a) 90deg,
                    var(--neon-b) 104deg,
                    transparent 122deg 238deg,
                    var(--neon-b) 256deg,
                    var(--neon-a) 270deg,
                    var(--neon-b) 284deg,
                    transparent 302deg 360deg
                ) border-box;
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.36), 0 0 0 1px var(--module-soft), 0 0 22px var(--module-glow), 0 0 28px rgba(0, 191, 255, 0.24);
            z-index: 2;
                animation: ringRotate 1.2s linear infinite;
        }

        .card-head {
            display: grid;
            grid-template-columns: 44px 1fr;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 1.35rem;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--module-soft);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .card-title {
            text-align: left;
        }

        .card h2 {
            margin: 0;
            color: var(--module);
            font-size: 1.65rem;
            line-height: 1.15;
            letter-spacing: 0.2px;
            text-wrap: balance;
            text-shadow: 0 2px 12px var(--module-glow);
        }

        .card p {
            color: var(--muted);
            margin: 14px 0 0;
            font-size: 0.98rem;
            line-height: 1.45;
            text-wrap: balance;
            text-align: left;
        }

        .dashboard-empty-state {
            grid-column: 1 / -1;
            display: grid;
            justify-items: start;
            gap: 14px;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.45;
        }

        .dashboard-empty-state p {
            margin: 0;
        }

        .dashboard-empty-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logout {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 11px 24px;
            background: linear-gradient(100deg, var(--danger), #ff8e8e);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(255, 107, 107, 0.24);
        }

        button:hover {
            background: linear-gradient(100deg, var(--danger-hover), #ff7777);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(255, 107, 107, 0.3);
        }

        .sidebar-password,
        .sidebar-update,
        .sidebar-import-credentials,
        .sidebar-drive-sync,
        .modal-secondary {
            background: rgba(79, 172, 254, 0.12);
            color: #d9ecff;
            border-color: rgba(127, 188, 255, 0.34);
            box-shadow: none;
        }

        .sidebar-password:hover,
        .sidebar-update:hover,
        .sidebar-import-credentials:hover,
        .sidebar-drive-sync:hover,
        .modal-secondary:hover {
            background: rgba(79, 172, 254, 0.2);
            box-shadow: 0 10px 22px rgba(79, 172, 254, 0.14);
        }

        .password-modal {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(3, 8, 17, 0.72);
            backdrop-filter: blur(4px);
        }

        .password-modal.open {
            display: flex;
        }

        .password-card {
            width: min(430px, calc(100vw - 32px));
            border: 1px solid rgba(127, 188, 255, 0.28);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(13, 28, 50, 0.98), rgba(8, 17, 32, 0.98));
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .password-card h2 {
            margin: 0 0 14px;
            color: #9bd1ff;
            font-size: 1.24rem;
        }

        .password-card label {
            display: grid;
            gap: 6px;
            margin-top: 12px;
            color: rgba(217, 234, 255, 0.8);
            font-size: 0.84rem;
            font-weight: 800;
        }

        .password-card input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(127, 188, 255, 0.28);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #f4f9ff;
            padding: 11px 12px;
            outline: none;
        }

        .password-card input:focus {
            border-color: rgba(79, 172, 254, 0.78);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.14);
        }

        .password-message {
            min-height: 18px;
            margin: 12px 0 0;
            color: #ffb0b0;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .password-message.success {
            color: #7ee8b2;
        }

        .password-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes ringRotate {
            from { --neon-angle: 0deg; }
            to { --neon-angle: 360deg; }
        }

        @media (max-width: 720px) {
            body {
                padding: 22px 14px;
            }

            .user-sidebar {
                position: relative;
                left: auto;
                top: auto;
                bottom: auto;
                width: auto;
                transform: none;
                pointer-events: auto;
                margin: 0 auto 16px;
                max-width: 1160px;
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
            }

            .user-sidebar-trigger {
                display: none;
            }

            .user-sidebar-profile {
                grid-template-columns: 44px minmax(0, 1fr);
                align-items: center;
            }

            .user-avatar {
                width: 44px;
                height: 44px;
                border-radius: 12px;
            }

            .user-sidebar-brand,
            .user-sidebar-details,
            .user-sidebar-spacer,
            .user-sidebar-peek {
                display: none;
            }

            .user-sidebar .sidebar-logout {
                width: auto;
                min-width: 84px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .card {
                padding: 22px 18px;
            }

            .card h2 {
                font-size: 1.45rem;
            }

            .card-head {
                grid-template-columns: 40px 1fr;
                gap: 10px;
            }

            .card-icon {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }
        }

        body.modo-mobile {
            padding: 14px 10px 22px;
        }

        body.modo-mobile .user-sidebar {
            position: relative;
            left: auto;
            top: auto;
            bottom: auto;
            width: auto;
            transform: none;
            pointer-events: auto;
            margin: 0 0 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 14px;
        }

        body.modo-mobile .user-sidebar-trigger {
            display: none;
        }

        body.modo-mobile .user-sidebar-profile {
            grid-template-columns: 42px minmax(0, 1fr);
            align-items: center;
        }

        body.modo-mobile .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1rem;
        }

        body.modo-mobile .user-sidebar-brand,
        body.modo-mobile .user-sidebar-details,
        body.modo-mobile .user-sidebar-spacer,
        body.modo-mobile .user-sidebar-peek {
            display: none;
        }

        body.modo-mobile .user-sidebar .sidebar-logout {
            width: auto;
            min-width: 78px;
            min-height: 40px;
            font-size: 0.86rem;
        }

        body.modo-mobile .hero {
            margin-bottom: 16px;
            text-align: left;
            padding: 0 4px;
        }

        body.modo-mobile h1 {
            font-size: 1.45rem;
            line-height: 1.2;
        }

        body.modo-mobile .subtitle {
            font-size: 0.9rem;
            margin-top: 6px;
            text-align: left;
        }

        body.modo-mobile .grid {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        body.modo-mobile .card {
            padding: 18px 14px;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        }

        body.modo-mobile .card:hover {
            transform: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            animation: none;
        }

        body.modo-mobile .card h2 {
            font-size: 1.34rem;
        }

        body.modo-mobile .card p {
            font-size: 0.9rem;
            margin-top: 10px;
        }

        body.modo-mobile .logout {
            margin-top: 18px;
            position: sticky;
            bottom: 10px;
            z-index: 5;
        }

        body.modo-mobile .logout button {
            width: 100%;
            max-width: 100%;
            min-height: 46px;
            font-size: 0.98rem;
        }

        body:not(.modo-mobile) .user-sidebar {
            transform: translate3d(-224px, 0, 0) !important;
            pointer-events: none !important;
        }

        body:not(.modo-mobile).sidebar-open .user-sidebar {
            transform: translate3d(0, 0, 0) !important;
            pointer-events: auto !important;
        }

        body:not(.modo-mobile).sidebar-open .user-sidebar-peek {
            opacity: 0;
        }

        .card[data-key="analise_promo"] { --module: #4facfe; --module-alt: #9ed8ff; --module-soft: rgba(79, 172, 254, 0.3); --module-glow: rgba(79, 172, 254, 0.2); }

        .card[data-key="medias_compras"] { --module: #7bd36b; --module-alt: #c8f4bf; --module-soft: rgba(123, 211, 107, 0.32); --module-glow: rgba(123, 211, 107, 0.22); }
        .card[data-key="impostos"] { --module: #ff8c5a; --module-alt: #ffd0ba; --module-soft: rgba(255, 140, 90, 0.33); --module-glow: rgba(255, 140, 90, 0.23); }
        .card[data-key="simulador"] { --module: #35d0a7; --module-alt: #c8fff0; --module-soft: rgba(53, 208, 167, 0.32); --module-glow: rgba(53, 208, 167, 0.22); }
        .card[data-key="configuracoes"] { --module: #be87ff; --module-alt: #e4cfff; --module-soft: rgba(190, 135, 255, 0.33); --module-glow: rgba(190, 135, 255, 0.23); }

    </style>

</head>
<body>

<div class="user-sidebar-trigger" id="user-sidebar-trigger" aria-hidden="true"></div>
<aside class="user-sidebar" aria-label="Informações do usuário">
    <div class="user-sidebar-peek">Usuário</div>
    <div class="user-sidebar-brand">JK Sistema</div>
    <div class="user-sidebar-profile">
        <div class="user-avatar" id="user-avatar">U</div>
        <div>
            <p class="user-name" id="user-name">Usuário</p>
            <p class="user-email" id="user-email"></p>
        </div>
    </div>
    <div class="user-sidebar-details">
        <div class="user-info-row">
            <span class="user-info-label">Cliente</span>
            <span class="user-info-value" id="user-client">-</span>
        </div>
        <div class="user-info-row">
            <span class="user-info-label">Acesso</span>
            <span class="user-info-value" id="user-access">-</span>
        </div>
        <div class="user-info-row">
            <span class="user-info-label">Máquina</span>
            <span class="user-info-value" id="user-machine">-</span>
        </div>
    </div>
    <div class="user-sidebar-spacer"></div>
    <div class="user-sidebar-actions">
        <button id="btn-importar-credenciais" class="sidebar-import-credentials" type="button" onclick="importarCredenciais()">Importar credenciais</button>
        <button id="btn-sincronizar-drive" class="sidebar-drive-sync" type="button" onclick="sincronizarDriveBackup(true)">Sincronizar Drive</button>
        <button id="btn-verificar-atualizacao" class="sidebar-update" type="button" onclick="verificarAtualizacao()">Verificar atualizacao</button>
        <button class="sidebar-password" type="button" onclick="abrirTrocaSenha()">Trocar senha</button>
        <button class="sidebar-logout" type="button" onclick="sair()">Sair</button>
    </div>
</aside>

<div class="container">
    <div class="hero">
        <h1>🚀 JK Sistema de Gestão</h1>
        <p class="subtitle">Painel central com acesso rápido aos módulos do sistema</p>
    </div>
    
    <div id="cards" class="grid"></div>
</div>

<div class="password-modal" id="password-modal" aria-hidden="true">
    <form class="password-card" id="password-form">
        <h2>Trocar senha</h2>
        <label>
            Senha atual
            <input id="senha-atual" type="password" autocomplete="current-password" required>
        </label>
        <label>
            Nova senha
            <input id="senha-nova" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
            Confirmar nova senha
            <input id="senha-confirmar" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p class="password-message" id="password-message"></p>
        <div class="password-actions">
            <button class="modal-secondary" type="button" onclick="fecharTrocaSenha()">Cancelar</button>
            <button type="submit" id="password-submit">Salvar</button>
        </div>
    </form>
</div>

<script>
    if (window.__JK_DASHBOARD_MOBILE__) {
        document.body.classList.add('modo-mobile');
    }

    function finalizarEntradaDashboard() {
        if (!document.body) return;
        document.body.classList.add('dashboard-ready', 'jk-page-ready');
        document.body.classList.remove('dashboard-preload', 'jk-page-preload', 'jk-page-leaving');
    }

    function safeJsonParse(value, fallback) {
        try {
            return JSON.parse(value);
        } catch (_e) {
            return fallback;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', finalizarEntradaDashboard, { once: true });
    } else {
        finalizarEntradaDashboard();
    }
    window.addEventListener('pageshow', finalizarEntradaDashboard);
    window.addEventListener('load', () => setTimeout(finalizarEntradaDashboard, 80), { once: true });
    setTimeout(finalizarEntradaDashboard, 250);
    setTimeout(finalizarEntradaDashboard, 1200);

    if (!verificarSessao()) {
        // verificarSessao já redireciona quando não há token.
    }

    const userData = safeJsonParse(localStorage.getItem('user_data') || 'null', null);
    const permissions = safeJsonParse(localStorage.getItem('permissions') || '{}', {});

    if (!userData) {
        window.location.href = 'frontend_index.html';
    }

    document.body.classList.remove('dashboard-preload');
    document.body.classList.add('dashboard-ready');

    const modules = [
        { key: 'analise_promo', href: 'frontend_promo.html', title: '📈 Promoção ML', desc: 'Análise de campanhas e cálculo de taxas.' },
        { key: 'renovacao_fixa', href: 'renovacao.html', title: '🔄 Renovação Fixa', desc: 'Comparar e renovar campanhas.' },
        { key: 'anuncios_ml', href: 'anunciosml.html', title: '📦 Anúncios ML', desc: 'Gestão de anúncios no Mercado Livre.' },
        { key: 'etiquetas', href: 'frontend_etiquetas.html', title: '🏷️ Etiquetas', desc: 'Gerador de etiquetas (ML, Shopee, TikTok).' },
        { key: 'integracao', href: 'integracoes.html', title: '🔗 Integrações', desc: 'Gerenciar conexões com Bling, ML, etc.' },
        { key: 'cadastro', href: 'cadastro.html', title: '🧾 Cadastro', desc: 'Cadastro manual de produtos.' },
        { key: 'estoque', href: 'estoque.html', title: '📦 Estoque', desc: 'Consulta rápida do estoque consolidado.' },
        { key: 'mercado_full', href: 'full.html', title: '🚚 Full', desc: 'Controle e acompanhamento do estoque Full.' },
        { key: 'vendas', href: 'vendas.html', title: '💰 Vendas', desc: 'Histórico de pedidos e itens.' },
        { key: 'favoritos', href: 'favoritos.html', title: '⭐ Favoritos ML', desc: 'Pesquisa e ranking de anúncios no Mercado Livre.' },
        { key: 'perguntas_pos_venda', href: 'perguntas_pos_venda.html', title: '💬 Perguntas e pós venda', desc: 'Central para perguntas dos clientes e atendimentos após a venda.' },
        { key: 'medias_compras', href: 'medias_compras.html', title: '📊 Médias e Pedidos', desc: 'Planejamento e gestão de pedidos por média de vendas.' },
        { key: 'impostos', href: 'impostos.html', title: '💸 Impostos', desc: 'Regras fiscais por NCM/CEST e simulação tributária.' },
        { key: 'simulador', href: 'simulador.html', title: '🧮 Simulador', desc: 'Calcule o preço final por NCM, dólar, quantidade e cubagem.' },
        { key: 'configuracoes', href: 'configuracoes.html', title: '⚙️ Configurações', desc: 'Parâmetros globais do sistema para todos os usuários.' },
        { key: 'importacoes', href: 'importacoes.html', title: '📥 Importações', desc: 'Central de importação e processamento de planilhas.' }
    ];

    const canSeeAll = permissions.full === true;
    const enabledBase = canSeeAll
        ? modules
        : modules.filter(m => permissions[m.key] === true);
    const enabled = enabledBase.slice().sort((a, b) => {
        if (a.key === 'configuracoes' && b.key !== 'configuracoes') return 1;
        if (a.key !== 'configuracoes' && b.key === 'configuracoes') return -1;
        return 0;
    });

    function iniciaisUsuario(nome, email) {
        const base = String(nome || email || 'Usuario').trim();
        const partes = base.split(/\s+/).filter(Boolean);
        if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
        return base.slice(0, 2).toUpperCase();
    }

    function preencherSidebarUsuario() {
        if (!userData) return;
        const nome = String(userData.name || userData.username || 'Usuário').trim();
        const email = String(userData.email || userData.username || '').trim();
        const cliente = String(userData.client_id || 'default').trim();
        const maquina = String(userData.machine_id || '').trim();
        const avatar = document.getElementById('user-avatar');
        const nameEl = document.getElementById('user-name');
        const emailEl = document.getElementById('user-email');
        const clientEl = document.getElementById('user-client');
        const accessEl = document.getElementById('user-access');
        const machineEl = document.getElementById('user-machine');
        if (avatar) avatar.textContent = iniciaisUsuario(nome, email);
        if (nameEl) nameEl.textContent = nome;
        if (emailEl) emailEl.textContent = email;
        if (clientEl) clientEl.textContent = cliente || '-';
        if (accessEl) accessEl.textContent = canSeeAll ? 'Completo' : `${enabled.length} módulos`;
        if (machineEl) {
            machineEl.textContent = maquina ? maquina.slice(0, 18) : '-';
            machineEl.title = maquina || '';
        }
    }

    preencherSidebarUsuario();

    async function chamarDriveSync(endpoint) {
        const resp = await fetch(endpoint, {
            method: 'POST',
            headers: obterAuthHeaders()
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data.success === false) {
            throw new Error(data.detail || data.message || 'Nao foi possivel sincronizar com o Google Drive.');
        }
        return data;
    }

    async function sincronizarDriveBackup(manual = false) {
        const botao = document.getElementById('btn-sincronizar-drive');
        try {
            if (botao && manual) {
                botao.disabled = true;
                botao.textContent = 'Sincronizando...';
            }
            let data = await chamarDriveSync('/api/drive-sync/auto');
            if (data.action === 'conflict' && manual) {
                const enviarLocal = confirm('Existe um backup diferente no Google Drive e tambem ha dados locais nesta maquina. Deseja enviar os dados desta maquina para o Drive agora?');
                if (enviarLocal) {
                    data = await chamarDriveSync('/api/drive-sync/backup');
                }
            }
            if (manual) {
                alert(data.message || 'Sincronizacao do Drive concluida.');
            } else if (data.action && data.action !== 'synced' && data.action !== 'not_linked') {
                console.info('[Drive Sync]', data.message || data.action);
            }
        } catch (err) {
            if (manual) {
                alert((err && err.message) || 'Nao foi possivel sincronizar com o Google Drive.');
            } else {
                console.warn('[Drive Sync]', err);
            }
        } finally {
            if (botao && manual) {
                botao.disabled = false;
                botao.textContent = 'Sincronizar Drive';
            }
        }
    }

    setTimeout(() => sincronizarDriveBackup(false), 1800);

    async function importarCredenciais() {
        const api = window.electronAPI;
        const botao = document.getElementById('btn-importar-credenciais');

        if (!api || typeof api.importCredentials !== 'function') {
            alert('Esta opção está disponível no aplicativo desktop. Se estiver no navegador, execute ImportarCredenciais.bat na pasta do sistema.');
            return;
        }

        const confirmar = confirm('Vou pedir para você selecionar o arquivo .jkcred e depois abrir o importador local. Informe a senha quando a janela abrir.');
        if (!confirmar) return;

        try {
            if (botao) {
                botao.disabled = true;
                botao.textContent = 'Abrindo...';
            }
            const resultado = await api.importCredentials();
            const mensagem = (resultado && resultado.message) || 'Importador de credenciais aberto.';
            alert(`${mensagem}\n\nQuando a importação terminar, saia e entre novamente para recarregar as permissões.`);
        } catch (err) {
            alert((err && err.message) || 'Não foi possível abrir o importador de credenciais.');
        } finally {
            if (botao) {
                botao.disabled = false;
                botao.textContent = 'Importar credenciais';
            }
        }
    }

    async function verificarAtualizacao() {
        const api = window.electronAPI;
        const botao = document.getElementById('btn-verificar-atualizacao');

        if (!api || typeof api.checkForUpdates !== 'function') {
            alert('Esta opção está disponível no aplicativo desktop instalado.');
            return;
        }

        try {
            if (botao) {
                botao.disabled = true;
                botao.textContent = 'Verificando...';
            }
            const resultado = await api.checkForUpdates();
            if (resultado && resultado.skipped) {
                console.warn(resultado.reason || 'Atualizacao automatica indisponivel neste ambiente.');
            } else if (resultado && resultado.checking) {
                console.info('A verificacao de atualizacao ja esta em andamento.');
            }
        } catch (err) {
            alert((err && err.message) || 'Não foi possível verificar atualizações.');
        } finally {
            if (botao) {
                botao.disabled = false;
                botao.textContent = 'Verificar atualizacao';
            }
        }
    }

    function abrirTrocaSenha() {
        const modal = document.getElementById('password-modal');
        const form = document.getElementById('password-form');
        const msg = document.getElementById('password-message');
        if (!modal) return;
        if (form) form.reset();
        if (msg) {
            msg.textContent = '';
            msg.classList.remove('success');
        }
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(() => document.getElementById('senha-atual')?.focus(), 30);
    }

    function fecharTrocaSenha() {
        const modal = document.getElementById('password-modal');
        if (!modal) return;
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
    }

    function mostrarMensagemSenha(texto, sucesso = false) {
        const msg = document.getElementById('password-message');
        if (!msg) return;
        msg.textContent = texto || '';
        msg.classList.toggle('success', !!sucesso);
    }

    async function salvarNovaSenha(event) {
        event.preventDefault();
        const atual = document.getElementById('senha-atual')?.value || '';
        const nova = document.getElementById('senha-nova')?.value || '';
        const confirmar = document.getElementById('senha-confirmar')?.value || '';
        const botao = document.getElementById('password-submit');

        if (nova.length < 6) {
            mostrarMensagemSenha('A nova senha deve ter pelo menos 6 caracteres.');
            return;
        }
        if (nova !== confirmar) {
            mostrarMensagemSenha('A confirmação da senha não confere.');
            return;
        }

        try {
            if (botao) botao.disabled = true;
            mostrarMensagemSenha('Salvando...');
            const resp = await fetch('/api/auth/change-password', {
                method: 'PUT',
                headers: obterAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    current_password: atual,
                    new_password: nova,
                    confirm_password: confirmar
                })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || data.success === false) {
                throw new Error(data.detail || data.message || 'Não foi possível trocar a senha.');
            }
            mostrarMensagemSenha(data.message || 'Senha alterada com sucesso.', true);
            setTimeout(fecharTrocaSenha, 900);
        } catch (err) {
            mostrarMensagemSenha(err.message || 'Não foi possível trocar a senha.');
        } finally {
            if (botao) botao.disabled = false;
        }
    }

    document.getElementById('password-form')?.addEventListener('submit', salvarNovaSenha);
    document.getElementById('password-modal')?.addEventListener('click', (event) => {
        if (event.target && event.target.id === 'password-modal') fecharTrocaSenha();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') fecharTrocaSenha();
    });

    (function controlarSidebarRecolhivel() {
        const sidebar = document.querySelector('.user-sidebar');
        const trigger = document.getElementById('user-sidebar-trigger');
        if (!sidebar || document.body.classList.contains('modo-mobile')) return;
        let timerFechar = null;

        function abrir() {
            clearTimeout(timerFechar);
            document.body.classList.add('sidebar-open');
            sidebar.classList.add('open');
            sidebar.style.transform = 'translate3d(0, 0, 0)';
            sidebar.style.pointerEvents = 'auto';
        }

        function fechar(rapido = false) {
            clearTimeout(timerFechar);
            timerFechar = setTimeout(() => {
                if (sidebar.matches(':hover')) return;
                document.body.classList.remove('sidebar-open');
                sidebar.classList.remove('open');
                sidebar.style.transform = 'translate3d(-224px, 0, 0)';
                sidebar.style.pointerEvents = 'none';
                sidebar.querySelectorAll('button, input').forEach(el => el.blur());
            }, rapido ? 0 : 120);
        }

        trigger?.addEventListener('mouseenter', abrir);
        sidebar.addEventListener('mouseleave', fechar);
        document.body.classList.remove('sidebar-open');
        sidebar.classList.remove('open');
        sidebar.style.transform = 'translate3d(-224px, 0, 0)';
        sidebar.style.pointerEvents = 'none';
        document.addEventListener('mousemove', (event) => {
            if (event.clientX <= 12) {
                abrir();
                return;
            }
            if (document.body.classList.contains('sidebar-open')) {
                const rect = sidebar.getBoundingClientRect();
                const foraDaSidebar = event.clientX > rect.right + 8 || event.clientY < rect.top || event.clientY > rect.bottom;
                if (foraDaSidebar) fechar(true);
            }
        });
    })();

    const cards = document.getElementById('cards');
    if (!enabled.length) {
        const empty = document.createElement('div');
        empty.className = 'dashboard-empty-state';
        empty.innerHTML = `
            <p>Nenhum módulo habilitado para seu usuário.</p>
            <div class="dashboard-empty-actions">
                <button class="sidebar-import-credentials" type="button" onclick="importarCredenciais()">Importar credenciais</button>
                <button class="modal-secondary" type="button" onclick="sair()">Sair e entrar novamente</button>
            </div>
        `;
        cards.appendChild(empty);
    } else {
        enabled.forEach(mod => {
            const a = document.createElement('a');
            a.className = 'card';
            a.dataset.key = String(mod.key || '');
            a.style.setProperty('--d', String(Math.min(560, cards.childElementCount * 40)) + 'ms');
            if (mod.dev) {
                a.href = '#';
                a.addEventListener('click', (e) => { e.preventDefault(); alert('Em desenvolvimento'); });
            } else {
                a.href = mod.href;
            }
            const m = String(mod.title || '').match(/^(\S+)\s+(.+)$/);
            const icon = m ? m[1] : '•';
            const titleText = m ? m[2] : String(mod.title || 'Módulo');
            a.innerHTML =
                '<div class="card-head">' +
                    '<span class="card-icon" aria-hidden="true">' + icon + '</span>' +
                    '<div class="card-title"><h2>' + titleText + '</h2></div>' +
                '</div>' +
                '<p>' + mod.desc + '</p>';
            cards.appendChild(a);
        });
    }

    function sair() {
        encerrarSessao();
    }
</script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
