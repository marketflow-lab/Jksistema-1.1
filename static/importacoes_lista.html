<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe da Lista - Importações</title>
    <script src="/auth.js?v=20260618-persist-login"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: #e5e5e5;
        }
        .container {
            max-width: 1220px;
            margin: 0 auto;
            padding: 24px;
        }
        .topbar {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 18px;
            align-items: center;
        }
        .fx-box, .clock-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 68px;
            padding: 10px 14px;
            border-radius: 13px;
            border: 1px solid #2a3f5c;
            background: linear-gradient(180deg, rgba(13,24,43,0.9), rgba(10,19,35,0.95));
            box-shadow: inset 0 1px 0 rgba(185,226,255,0.1), 0 14px 28px rgba(0,0,0,0.3);
        }
        .fx-box {
            border-color: rgba(99,187,255,0.55);
            background: linear-gradient(180deg, rgba(14,33,59,0.92), rgba(10,22,40,0.96));
        }
        .clock-box {
            border-color: rgba(255,166,94,0.52);
            background: linear-gradient(180deg, rgba(56,34,19,0.9), rgba(33,22,14,0.95));
        }
        .clock-box.brasilia {
            border-color: rgba(104,214,142,0.54);
            background: linear-gradient(180deg, rgba(19,60,36,0.9), rgba(13,40,25,0.95));
        }
        .fx-label { color: #9ecfff; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .clock-label { color: #ffca9f; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .clock-box.brasilia .clock-label { color: #9be9b6; }
        .clock-value { color: #ffc68f; font-size: 1.65rem; font-weight: 800; line-height: 1; }
        .clock-box.brasilia .clock-value { color: #7bffab; }
        .fx-value { color: #9dd6ff; font-size: 1.7rem; font-weight: 800; line-height: 1; }
        .fx-time { color: #d2e6ff; font-size: 0.9rem; font-weight: 700; }
        /* mantém compatibilidade chip legado */
        .fx-chip { display: none; }
        h1 {
            margin: 0;
            color: #9bd1ff;
            font-size: 1.45rem;
        }
        .btn {
            border: 1px solid #333;
            border-radius: 8px;

            font-size: 0.78rem;
        }

        .resumo-card {

<body>
    <div class="container">
        <div class="topbar">
            <h1 id="titulo">Lista de Importação</h1>
            <div class="fx-box">
                <div>
                    <div class="fx-label">Dólar x Real (USD/BRL)</div>
                    <div id="fxValue" class="fx-value">Carregando...</div>
                </div>
                <div id="fxTime" class="fx-time">--:--:--</div>
            </div>
            <div class="clock-box brasilia">
                <div>
                    <div class="clock-label">Horário de Brasília</div>
                    <div id="clockBrasilia" class="clock-value">--:--:--</div>
                </div>
            </div>
            <div class="clock-box">
                <div>
                    <div class="clock-label">Horário em Pequim</div>
                    <div id="clockBeijing" class="clock-value">--:--:--</div>
                </div>
            </div>
            <a class="back-btn" id="btnVoltar" href="importacoes.html">Voltar</a>
        </div>

        <div id="erro" class="erro"></div>

        <div class="card">
            <div id="meta" class="meta"></div>
            <div id="resumoTopo" class="resumo-topo"></div>
            <div class="table-wrap">
                <table>
                    <colgroup id="tCols"></colgroup>
                    <thead id="tHead"></thead>
                    <tbody id="tbodyLista">
                        <tr><td colspan="15" class="empty">Carregando itens...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="totalGeral" class="total-box"></div>
            <div class="add-sku-box">
                <div class="add-sku-title">Incluir SKU no pedido</div>
                <div class="add-sku-grid">
                    <div class="add-sku-field">
                        <label for="manualSku">SKU</label>
                        <input id="manualSku" type="text" placeholder="Ex.: 12345" autocomplete="off">
                    </div>
                    <div class="add-sku-field">
                        <label for="manualQtd">Quantidade</label>
                        <input id="manualQtd" type="number" min="1" step="1" value="1">
                    </div>
                    <div class="add-sku-field">
                        <label for="manualValor">Valor unitário (USD)</label>
                        <input id="manualValor" type="number" min="0.01" step="0.01" placeholder="0.00">
                    </div>
                    <button id="btnAddSkuManual" type="button" class="btn-add-sku">Incluir SKU</button>
                    <div class="add-sku-field">
                        <label for="btnAddSkuLista">Incluir SKUs por arquivo</label>
                        <button id="btnAddSkuLista" type="button" class="btn-add-sku">Incluir Lista por Arquivo</button>
                        <div class="add-sku-field-hint">Use o mesmo Excel padrão do módulo principal de Importações.</div>
                    </div>
                </div>
                <div id="addSkuStatus" class="add-sku-status"></div>
            </div>
        </div>
    </div>
    <div id="skuContextMenu" class="sku-context-menu" role="menu" aria-hidden="true">
        <button id="skuContextEditarCadastro" type="button" role="menuitem">Editar SKU no Cadastro</button>
    </div>

    <script>
        if (!verificarSessao()) {
            // verificarSessao já redireciona quando não há token.
        }

        function getListaIdDaUrl() {
            const p = new URLSearchParams(window.location.search);
            return String(p.get('lista_id') || '').trim();
        }

        (function() {
            const p = new URLSearchParams(window.location.search);
            const fromEmb = p.get('from_embarque');
            if (fromEmb) {
                const btn = document.getElementById('btnVoltar');

        async function carregarFaturamentoVendas12m() {
            const lojaFiltro = obterLojaFiltroVendas(ultimaListaCarregada);
            const chaveLoja = obterChaveFaturamentoLoja(ultimaListaCarregada);

            if (!lojaFiltro) {
                faturamentoVendas12m = null;
                faturamentoVendasLoja = chaveLoja;
                if (ultimaListaCarregada) {
                    renderResumoTopo(ultimaListaCarregada, ultimosItensCarregados);
                }
                return;
            }

            if (faturamentoVendasCarregando) return;
            if (faturamentoVendasLoja !== chaveLoja) {
                faturamentoVendas12m = null;
                faturamentoVendasLoja = chaveLoja;
                if (ultimaListaCarregada) {
                    renderResumoTopo(ultimaListaCarregada, ultimosItensCarregados);
                }
            }

            faturamentoVendasCarregando = true;
            try {
                const params = new URLSearchParams({ periodo: '1a', intervalo: 'mes' });
                params.set('loja', lojaFiltro);
                const resp = await fetch('/api/vendas/grafico?' + params.toString(), {
                    method: 'GET',
                    headers: { ...obterAuthHeaders() },

                if (!resp.ok) throw new Error('Falha ao carregar faturamento do módulo Vendas.');

                const devolucoes = Array.isArray(data && data.valores_devolucoes) ? data.valores_devolucoes : [];

                const totalVendas = vendas.reduce((acc, v) => acc + Number(v || 0), 0);
                const totalDevolucoes = devolucoes.reduce((acc, v) => acc + Number(v || 0), 0);
                if (obterChaveFaturamentoLoja(ultimaListaCarregada) !== chaveLoja) return;
                faturamentoVendas12m = totalVendas - totalDevolucoes;
                faturamentoVendasLoja = chaveLoja;

                if (ultimaListaCarregada) {
                    renderResumoTopo(ultimaListaCarregada, ultimosItensCarregados);
                }
            } catch (_e) {

            } finally {
                faturamentoVendasCarregando = false;
            }
        }

        function calcularFaixaImpostoPorFaturamento(faturamento) {
            const f = Number(faturamento || 0);
            if (!Number.isFinite(f)) return '-';

            if (f <= 180000) return formatarPct(4);
            if (f <= 360000) return formatarPct(7.3);
            if (f <= 720000) return formatarPct(9.5);
            if (f <= 1800000) return formatarPct(10.7);
            if (f <= 3600000) return formatarPct(14.3);
            return formatarPct(19);
        }

        function formatarPct(v) {
            const n = Number(v || 0);
            if (!Number.isFinite(n)) return '-';
            return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
        }

        function obterCampo(item, chaves, valorPadrao) {
            const lista = Array.isArray(chaves) ? chaves : [chaves];
            for (const chave of lista) {
                if (Object.prototype.hasOwnProperty.call(item || {}, chave)) {
                    const v = item[chave];
                    if (v !== null && v !== undefined && String(v).trim() !== '') return v;
                }
            }
            return valorPadrao;
        }

        function obterCampoNormalizado(item, chaves, valorPadrao) {
            const obj = item || {};
            const alvos = (Array.isArray(chaves) ? chaves : [chaves])
                .map((chave) => normTxt(chave))
                .filter(Boolean);
            if (!alvos.length) return valorPadrao;

            for (const chave of Object.keys(obj)) {
                const nk = normTxt(chave);
                if (!alvos.includes(nk)) continue;
                const v = obj[chave];
                if (v !== null && v !== undefined && String(v).trim() !== '') return v;
            }
            return valorPadrao;
        }

        function valorNumerico(v) {
            if (v === null || v === undefined) return 0;
            if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
            let s = String(v).trim();
            if (!s) return 0;
            s = s.replace(/\s+/g, '').replace(/R\$/gi, '').replace(/US\$/gi, '').replace(/\$/g, '');
            const hasComma = s.includes(',');
            const hasDot = s.includes('.');
            if (hasComma && hasDot) {
                const lastComma = s.lastIndexOf(',');
                const lastDot = s.lastIndexOf('.');
                if (lastComma > lastDot) {
                    s = s.replace(/\./g, '').replace(',', '.');
                } else {
                    s = s.replace(/,/g, '');
                }
            } else if (hasComma) {
                s = s.replace(',', '.');
            }
            const n = Number(s);
            return Number.isFinite(n) ? n : 0;
        }

        function normalizarSkuComparacao(v) {
            let sku = String(v || '').trim().toUpperCase();
            if (!sku) return '';
            sku = sku.replace(/\s+/g, '').replace(/\.0+$/, '');
            const meses = {
                JAN: '1', FEV: '2', MAR: '3', ABR: '4', MAI: '5', JUN: '6',
                JUL: '7', AGO: '8', SET: '9', OUT: '10', NOV: '11', DEZ: '12'
            };
            sku = sku.replace(/-([A-Z]{3})\b/g, (_m, mes) => '-' + (meses[mes] || mes));
            return sku;
        }

        function itemComCompraAprovada(item) {
            const valor = item && (item.compra_aprovada ?? item['Compra aprovada']);
            if (valor === true || valor === 1) return true;
            return ['1', 'true', 'sim', 'aprovada', 'aprovado'].includes(String(valor || '').trim().toLowerCase());
        }

        function formatarMargensConcorrentes(item) {
            const sku = normalizarSkuComparacao(obterCampo(item || {}, ['SKU', 'Sku', 'sku'], ''));
            const estadoAutomatico = sku ? estadosAnaliseMargensAutomaticas.get(sku) : null;
            if (estadoAutomatico && estadoAutomatico.status === 'fila') {
                return '<span class="competitor-margins-empty is-loading">Na fila</span>';
            }
            if (estadoAutomatico && estadoAutomatico.status === 'analisando') {
                return '<span class="competitor-margins-empty is-loading">Analisando...</span>';
            }
            if (estadoAutomatico && estadoAutomatico.status === 'erro') {
                const mensagem = String(estadoAutomatico.mensagem || 'Não foi possível analisar este SKU.').trim();
                return '<span class="competitor-margins-empty is-error" title="'
                    + escaparHtml(mensagem) + '">Falha na análise</span>';
            }

            const analise = item && item.analise_concorrentes;
            if (!analise || typeof analise !== 'object') {
                return '<span class="competitor-margins-empty">Não analisado</span>';
            }

            const margens = analise.margens && typeof analise.margens === 'object'
                ? analise.margens
                : {};
            const disponiveis = [];
            const detalhes = [];
            const indisponiveis = [];
            [1, 2, 3, 4, 5].forEach((numero) => {
                const dados = margens['concorrente_' + numero];
                const bruto = dados && dados.margem_percentual;
                if (bruto === null || bruto === undefined || bruto === '') {
                    const motivo = String(dados && dados.motivo_indisponivel || '').trim();
                    if (motivo) indisponiveis.push('C' + numero + ': ' + motivo);
                    return;
                }
                const margem = Number(bruto);
                if (!Number.isFinite(margem)) return;
                disponiveis.push(
                    '<span class="competitor-margin ' + (margem < 0 ? 'negative' : 'positive') + '">'
                    + '<span>C' + numero + '</span><span>' + formatarPct(margem) + '</span>'
                    + '</span>'
                );
                detalhes.push(
                    'C' + numero
                    + ': preço ' + formatarBRL(Number(dados.preco_venda))
                    + ', custo cadastrado ' + formatarBRL(Number(dados.custo_unitario))
                    + ', imposto ' + formatarBRL(Number(dados.imposto_valor))
                    + ', tarifa ML ' + formatarBRL(Number(dados.tarifa_ml))
                    + ', frete ML ' + formatarBRL(Number(dados.frete_ml))
                    + ', líquido ' + formatarBRL(Number(dados.valor_liquido))
                );
            });

            if (!disponiveis.length) {
                return '<span class="competitor-margins-empty"'
                    + (indisponiveis.length ? ' title="' + escaparHtml(indisponiveis.join(' | ')) + '"' : '')
                    + '>Sem margem</span>';
            }

            const custoBruto = analise.custo_unitario;
            const custo = (custoBruto === null || custoBruto === undefined || custoBruto === '')
                ? NaN
                : Number(custoBruto);
            const titulo = detalhes.slice();
            if (Number.isFinite(custo) && custo >= 0) {
                titulo.push('Custo do cadastro: ' + formatarBRL(custo));
            }
            titulo.push(...indisponiveis);
            if (analise.atualizado_em) {
                titulo.push('Análise atualizada em ' + String(analise.atualizado_em));
            }
            return '<div class="competitor-margins"'
                + (titulo.length ? ' title="' + escaparHtml(titulo.join(' | ')) + '"' : '')
                + '>' + disponiveis.join('') + '</div>';
        }

        function extrairCodigoMlbMargensAutomaticas(...candidatos) {
            for (const candidato of candidatos) {
                let texto = String(candidato || '').trim();
                if (!texto) continue;
                try { texto = decodeURIComponent(texto); } catch (_e) {}
                const direcionado = texto.match(/(?:item_id\s*[:=]|wid\s*=)\s*MLB-?(\d{8,})/i);
                if (direcionado && direcionado[1]) return 'MLB' + direcionado[1];
                const generico = texto.match(/\bMLB-?(\d{8,})\b/i);
                if (generico && generico[1]) return 'MLB' + generico[1];
            }
            return '';
        }

        function obterSkuItemMargensAutomaticas(item) {

        function atualizarCelulaMargensAutomaticas(item) {

        function definirEstadoMargensAutomaticas(item, status, mensagem = '') {
            const sku = obterSkuItemMargensAutomaticas(item);
            if (!sku) return;
            if (status) estadosAnaliseMargensAutomaticas.set(sku, { status, mensagem });

        function montarPayloadMargensAutomaticas(fonte) {
            const valores = fonte && fonte.concorrentes_valores && typeof fonte.concorrentes_valores === 'object'
                ? fonte.concorrentes_valores
                : {};
            const anuncios = fonte && fonte.concorrentes_mlb && typeof fonte.concorrentes_mlb === 'object'
                ? fonte.concorrentes_mlb
                : {};
            const precosConcorrentes = {};
            const anunciosLoja = {};

            [1, 2, 3, 4, 5].forEach((numero) => {
                const chave = 'concorrente_' + numero;
                const preco = valorNumerico(valores[chave]);
                const itemIdLoja = extrairCodigoMlbMargensAutomaticas(anuncios[chave]);
                if (preco > 0) precosConcorrentes[chave] = preco;
                if (itemIdLoja) anunciosLoja[chave] = itemIdLoja;

        async function salvarMargensAutomaticasSku(listaId, sku, payload) {
            const resp = await fetch(
                '/api/medias-compras/listas-pedidos/' + encodeURIComponent(listaId)
                    + '/skus/' + encodeURIComponent(sku) + '/analise-concorrentes',
                {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', ...obterAuthHeaders() },
                    body: JSON.stringify(payload),
                }
            );
            if (!resp.ok) {
                const erro = await resp.json().catch(() => ({}));

            }
            return resp.json();

        async function analisarMargensConcorrentesAutomaticamente(listaId, itens) {
            const cicloAtual = ++cicloAnaliseMargensAutomaticas;
            const pendentes = (Array.isArray(itens) ? itens : []).filter((item) => (
                obterSkuItemMargensAutomaticas(item)
                && (!item.analise_concorrentes || typeof item.analise_concorrentes !== 'object')
            ));
            if (!pendentes.length) return;

            pendentes.forEach((item) => definirEstadoMargensAutomaticas(item, 'fila'));

            let fontes;
            try {
                fontes = await carregarFontesMargensAutomaticas(listaId);
            } catch (erro) {
                if (cicloAtual !== cicloAnaliseMargensAutomaticas) return;
                const mensagem = erro.message || 'Não foi possível iniciar a análise automática.';
                pendentes.forEach((item) => definirEstadoMargensAutomaticas(item, 'erro', mensagem));
                return;
            }

            for (const item of pendentes) {
                if (cicloAtual !== cicloAnaliseMargensAutomaticas) return;
                const sku = obterSkuItemMargensAutomaticas(item);
                definirEstadoMargensAutomaticas(item, 'analisando');
                try {
                    const fonte = fontes[sku] || {};
                    const resultado = await salvarMargensAutomaticasSku(
                        listaId,
                        sku,
                        montarPayloadMargensAutomaticas(fonte)
                    );
                    item.analise_concorrentes = resultado && resultado.analise_concorrentes
                        ? resultado.analise_concorrentes
                        : { margens: {} };
                    definirEstadoMargensAutomaticas(item, '');
                } catch (erro) {
                    definirEstadoMargensAutomaticas(
                        item,
                        'erro',
                        erro.message || 'Não foi possível calcular as margens deste SKU.'
                    );
                }
            }
        }

        const mapaM3IndividualSku = new Map();
        let mapaM3IndividualCarregado = false;

        function registrarM3IndividualPorSku(skuRaw, m3Val) {
            const m3 = valorNumerico(m3Val);
            if (m3 <= 0) return;

            const skuNorm = normalizarSkuComparacao(skuRaw);
            if (!skuNorm) return;

            const chaveCompacta = skuNorm.replace(/[^A-Z0-9]/g, '');
            const chaveNumSoft = skuNorm.replace(/([0-9]+)/g, (m) => String(parseInt(m, 10))).replace(/[^A-Z0-9]/g, '');

            if (!mapaM3IndividualSku.has(skuNorm)) mapaM3IndividualSku.set(skuNorm, m3);
            if (chaveCompacta && !mapaM3IndividualSku.has(chaveCompacta)) mapaM3IndividualSku.set(chaveCompacta, m3);
            if (chaveNumSoft && !mapaM3IndividualSku.has(chaveNumSoft)) mapaM3IndividualSku.set(chaveNumSoft, m3);
        }

        function obterM3IndividualDoItem(item) {
            const sku = String((item && item.SKU) || '').trim();
            const skuNorm = normalizarSkuComparacao(sku);
            const chaveCompacta = skuNorm.replace(/[^A-Z0-9]/g, '');
            const chaveNumSoft = skuNorm.replace(/([0-9]+)/g, (m) => String(parseInt(m, 10))).replace(/[^A-Z0-9]/g, '');

            const m3Cadastro = (
                mapaM3IndividualSku.get(skuNorm)
                || mapaM3IndividualSku.get(chaveCompacta)
                || mapaM3IndividualSku.get(chaveNumSoft)
                || 0
            );
            if (m3Cadastro > 0) return m3Cadastro;

            const m3IndividualItem = valorNumerico(obterCampoNormalizado(item, [
                'cg m3 individual',
                'cg_m3 individual',
                'm3 individual'
            ], 0));
            return m3IndividualItem > 0 ? m3IndividualItem : 0;
        }

        function obterM3TotalItem(item) {
            const qtd = valorNumerico(item && item.Quantidade);
            const m3Individual = obterM3IndividualDoItem(item);
            if (m3Individual > 0 && qtd > 0) {
                const totalCalc = m3Individual * qtd;
                return Number.isFinite(totalCalc) ? totalCalc : 0;
            }
            return 0;
        }

        function obterValorResumo(lista, itens, aliases, fallback = '-') {
            const alvos = (aliases || []).map((a) => normTxt(a)).filter(Boolean);
            if (!alvos.length) return fallback;

            const buscarNoObjeto = (obj) => {
                if (!obj || typeof obj !== 'object') return '';
                for (const k of Object.keys(obj)) {
                    const nk = normTxt(k);
                    if (!nk) continue;
                    const bate = alvos.some((a) => nk === a || nk.includes(a) || a.includes(nk));
                    if (!bate) continue;
                    const v = obj[k];
                    if (v !== null && v !== undefined && String(v).trim() !== '') {
                        return String(v).trim();
                    }
                }
                return '';
            };

            const vLista = buscarNoObjeto(lista);
            if (vLista) return vLista;

            const arr = Array.isArray(itens) ? itens : [];
            for (const item of arr) {
                const v = buscarNoObjeto(item);
                if (v) return v;
            }
            return fallback;
        }

        function obterValorPorAliasNormalizado(item, aliases, fallback = '') {
            const obj = item && typeof item === 'object' ? item : null;
            if (!obj) return fallback;
            const alvos = (aliases || []).map((a) => normTxt(a)).filter(Boolean);
            if (!alvos.length) return fallback;

            for (const k of Object.keys(obj)) {
                const nk = normTxt(k);
                if (!nk) continue;
                const bate = alvos.some((a) => nk === a || nk.includes(a) || a.includes(nk));
                if (!bate) continue;
                const v = obj[k];
                if (v !== null && v !== undefined && String(v).trim() !== '') {
                    return v;
                }
            }
            return fallback;
        }

        function calcularTaxaSiscomexPorTotalNcm(totalNcm) {
            const o36 = Math.max(0, Number(totalNcm) || 0);
            if (o36 === 0) return 115.67;
            if (o36 <= 2) return 115.67 + (o36 * 38.56);
            if (o36 <= 5) return 192.79 + ((o36 - 2) * 30.85);
            if (o36 <= 10) return 285.34 + ((o36 - 5) * 23.14);
            if (o36 <= 20) return 401.04 + ((o36 - 10) * 15.42);
            if (o36 <= 50) return 555.24 + ((o36 - 20) * 7.71);
            return 786.54 + ((o36 - 50) * 3.86);
        }

        function calcularPickupOrigemBrl(totalM3, dolar) {
            const m3 = Number(totalM3 || 0);
            const cotacao = Number(dolar || 0);
            if (!Number.isFinite(m3) || !Number.isFinite(cotacao) || cotacao <= 0) return 0;
            return ((m3 * PICKUP_ORIGEM_USD_POR_M3) + PICKUP_ORIGEM_USD_FIXO) * cotacao;
        }

        function calcularTaxasOrigemBrl(totalM3, dolar) {
            const m3 = Number(totalM3 || 0);
            const cotacao = Number(dolar || 0);
            if (!Number.isFinite(m3) || !Number.isFinite(cotacao) || cotacao <= 0) return 0;
            return ((m3 * TAXAS_ORIGEM_USD_POR_M3) + TAXAS_ORIGEM_USD_FIXO) * cotacao;
        }

        function calcularTransporteRodoviarioBrl(totalM3) {
            const m3 = Number(totalM3 || 0);
            if (!Number.isFinite(m3)) return 0;
            return (m3 * TRANSPORTE_RODOVIARIO_BRL_POR_M3) + TRANSPORTE_RODOVIARIO_BRL_FIXO;
        }

        function calcularCapataziaBrl(totalM3) {
            const m3 = Number(totalM3 || 0);
            if (!Number.isFinite(m3)) return 0;
            return m3 * CAPATAZIA_BRL_POR_M3;
        }

        function calcularTaxasFixasBrl(totalNcm, dolar) {
            const cotacao = Number(dolar || 0);
            if (!Number.isFinite(cotacao) || cotacao <= 0) return 0;
            const fixosUsd = CUSTOS_FIXOS_IMPORTACAO_USD.blFee
                + CUSTOS_FIXOS_IMPORTACAO_USD.desconsolidacao
                + CUSTOS_FIXOS_IMPORTACAO_USD.handling
                + PICKUP_ORIGEM_USD_FIXO
                + TAXAS_ORIGEM_USD_FIXO;
            const fixosBrl = CUSTOS_FIXOS_IMPORTACAO_BRL.desembaraco
                + CUSTOS_FIXOS_IMPORTACAO_BRL.expediente
                + TRANSPORTE_RODOVIARIO_BRL_FIXO
                + calcularTaxaSiscomexPorTotalNcm(totalNcm);
            return (fixosUsd * cotacao) + fixosBrl;
        }

        function calcularTaxasSobreM3Brl(totalM3, dolar) {
            const m3 = Number(totalM3 || 0);
            const cotacao = Number(dolar || 0);
            if (!Number.isFinite(m3) || m3 <= 0 || !Number.isFinite(cotacao) || cotacao <= 0) return 0;
            const taxasUsdPorM3 = PICKUP_ORIGEM_USD_POR_M3 + TAXAS_ORIGEM_USD_POR_M3;
            const taxasBrlPorM3 = TRANSPORTE_RODOVIARIO_BRL_POR_M3 + CAPATAZIA_BRL_POR_M3;
            return (m3 * taxasUsdPorM3 * cotacao) + (m3 * taxasBrlPorM3);
        }

        function ajustarTextoValorParaCaber(valorEl, minPx = 8.5) {
            if (!valorEl) return;
            if (valorEl.querySelector('input, select, textarea')) return;
            const texto = String(valorEl.textContent || '').trim();
            if (!texto) return;

            const estilo = window.getComputedStyle(valorEl);
            const basePx = Number(valorEl.dataset.baseFontPx || parseFloat(estilo.fontSize) || 14);
            if (!Number.isFinite(basePx) || basePx <= 0) return;

            const card = valorEl.closest('.resumo-card');
            const larguraLimite = Math.max(24, (card ? card.clientWidth : valorEl.clientWidth) - 12);

            valorEl.dataset.baseFontPx = String(basePx);
            valorEl.style.fontSize = basePx + 'px';

            // Mede largura real do texto em linha única para ajustar a fonte de forma confiável.
            const medidor = document.createElement('span');
            medidor.textContent = texto;
            medidor.style.position = 'fixed';
            medidor.style.left = '-99999px';
            medidor.style.top = '-99999px';
            medidor.style.visibility = 'hidden';
            medidor.style.whiteSpace = 'nowrap';
            medidor.style.fontFamily = estilo.fontFamily;
            medidor.style.fontWeight = estilo.fontWeight;
            medidor.style.letterSpacing = estilo.letterSpacing;
            document.body.appendChild(medidor);

            let atual = basePx;
            let tentativas = 0;
            medidor.style.fontSize = atual + 'px';
            while (medidor.offsetWidth > larguraLimite && atual > minPx && tentativas < 24) {
                atual -= 0.5;
                valorEl.style.fontSize = atual + 'px';
                medidor.style.fontSize = atual + 'px';
                tentativas += 1;
            }

            medidor.remove();
        }

                ordenadas.push(coluna);

            } catch (_e) {
                return [];
            }

                // Ignora falha de persistência local.
            }
            salvarPreferenciasColunasServidor();

        function aplicarOrdemColunasSalva() {
            const ordem = carregarOrdemColunasSalva();
            if (!ordem.length) return;
            const mapa = new Map(colunasTabela.map((c) => [c.key, c]));
            const ordenadas = [];
            ordem.forEach((k) => {
                const col = mapa.get(k);
                if (col) {
                    ordenadas.push(col);
                    mapa.delete(k);
                }
            });
            adicionarColunasNovasNaOrdem(ordenadas, mapa);
            colunasTabela.splice(0, colunasTabela.length, ...ordenadas);
        }

            const from = colunasTabela.findIndex((c) => c.key === origemKey);
            const to = colunasTabela.findIndex((c) => c.key === destinoKey);
            if (from < 0 || to < 0 || from === to) return;
            const [col] = colunasTabela.splice(from, 1);
            colunasTabela.splice(to, 0, col);
            salvarOrdemColunas();

                ordem.forEach((k) => {

                adicionarColunasNovasNaOrdem(ordenadas, mapa);

                try {
                    localStorage.setItem(LS_ORDEM_COLUNAS_KEY, JSON.stringify(colunasTabela.map((c) => c.key)));
                } catch (_e) {}
            }

            if (largurasColunasSrv && typeof largurasColunasSrv === 'object') {
                Object.keys(largurasColunasSrv).forEach((k) => {
                    const key = String(k || '').trim();
                    const w = parseInt(largurasColunasSrv[k], 10);
                    if (key && Number.isFinite(w) && w > 0) {
                        largurasColunas[key] = w;

                });
                try {

                } catch (_e) {}

            preferenciasColunasCarregadas = true;

                    method: 'GET',
                    headers: { ...obterAuthHeaders() },
                    cache: 'no-store'
                });
                if (!resp.ok) return;
                const data = await resp.json().catch(() => ({}));
                _aplicarPreferenciasColunasNoEstado(data && data.ordem_colunas, data && data.larguras_colunas);
            } catch (_e) {
                // Fallback localStorage já cobre a UI.
            }
        }

            if (th) {
                th.style.width = `${largura}px`;
                th.style.minWidth = `${largura}px`;
                th.style.maxWidth = `${largura}px`;
            }

            const linhas = document.querySelectorAll('#tbodyLista tr');
            linhas.forEach((linha) => {
                const td = linha.children[idx];
                if (td) {
                    td.style.width = `${largura}px`;
                    td.style.minWidth = `${largura}px`;
                    td.style.maxWidth = `${largura}px`;
                }
            });
        }

        function iniciarResizeColuna(event, idx, coluna) {
            event.preventDefault();
            const startX = event.clientX;
            const startWidth = obterLarguraColuna(coluna);

            function onMove(e) {
                const delta = e.clientX - startX;
                aplicarLarguraColuna(idx, coluna, startWidth + delta);
            }

            function onUp() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
                salvarLarguras();
            }

            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }

        function renderCabecalho() {
            if (!tHead || !tCols) return;
            tHead.innerHTML = '';
            tCols.innerHTML = '';

            const tr = document.createElement('tr');
            colunasTabela.forEach((coluna, idx) => {
                const largura = obterLarguraColuna(coluna);

                const colEl = document.createElement('col');
                colEl.style.width = `${largura}px`;
                tCols.appendChild(colEl);

                const th = document.createElement('th');
                th.style.width = `${largura}px`;
                th.style.minWidth = `${largura}px`;
                th.style.maxWidth = `${largura}px`;
                th.classList.add('th-draggable');
                th.setAttribute('draggable', 'true');
                th.dataset.colKey = coluna.key;

                const content = document.createElement('div');
                content.className = 'th-content';

                const label = document.createElement('span');
                label.className = 'th-label';
                label.textContent = coluna.label;
                content.appendChild(label);

                const resizer = document.createElement('div');
                resizer.className = 'th-resizer';
                resizer.addEventListener('mousedown', (ev) => iniciarResizeColuna(ev, idx, coluna));
                content.appendChild(resizer);

                th.appendChild(content);

                th.addEventListener('dragstart', (ev) => {
                    if (ev.target && ev.target.closest && ev.target.closest('.th-resizer')) {
                        ev.preventDefault();
                        return;
                    }
                    colunaArrastadaKey = coluna.key;
                    th.classList.add('dragging');
                    if (ev.dataTransfer) {
                        ev.dataTransfer.effectAllowed = 'move';
                        try {
                            ev.dataTransfer.setData('text/plain', coluna.key);
                        } catch (_e) {
                            // alguns browsers ignoram setData vazio
                        }
                    }
                });

                th.addEventListener('dragover', (ev) => {
                    if (!colunaArrastadaKey || colunaArrastadaKey === coluna.key) return;
                    ev.preventDefault();
                    th.classList.add('drag-over');
                });

                th.addEventListener('dragleave', () => {
                    th.classList.remove('drag-over');
                });

                th.addEventListener('drop', (ev) => {
                    ev.preventDefault();
                    th.classList.remove('drag-over');
                    const origem = colunaArrastadaKey;
                    if (!origem || origem === coluna.key) return;
                    moverColuna(origem, coluna.key);
                    renderCabecalho();
                    renderItens(ultimosItensCarregados, ultimaListaCarregada || {});
                });

                th.addEventListener('dragend', () => {
                    colunaArrastadaKey = '';
                    tHead.querySelectorAll('th.drag-over, th.dragging').forEach((el) => {
                        el.classList.remove('drag-over', 'dragging');
                    });
                });

                tr.appendChild(th);
            });

            tHead.appendChild(tr);
        }

        async function excluirSkuDaLista(sku, btn) {
            const listaId = getListaIdDaUrl();
            if (!listaId) {
                setErro('Lista não informada.');
                return;
            }

            const skuTxt = String(sku || '').trim();
            if (!skuTxt) {
                setErro('SKU inválido para exclusão.');
                return;
            }

            const skuRef = normalizarSkuComparacao(skuTxt);
            const itemAtual = (Array.isArray(ultimosItensCarregados) ? ultimosItensCarregados : [])
                .find((item) => normalizarSkuComparacao(item && item.SKU) === skuRef);
            if (itemComCompraAprovada(itemAtual)) {
                setErro('O SKU ' + skuTxt + ' está aprovado e não pode ser excluído. Desfaça a aprovação dentro do SKU.');
                return;
            }

            const confirmar = window.confirm('Deseja excluir o SKU ' + skuTxt + ' deste pedido?');
            if (!confirmar) return;

            const txtOriginal = btn ? btn.textContent : '';
            try {
                if (btn) {
                    btn.disabled = true;
                    btn.classList.add('is-busy');
                    btn.textContent = 'Excluindo...';
                }

                const itensAtuais = Array.isArray(ultimosItensCarregados) ? ultimosItensCarregados : [];
                const itensRestantes = itensAtuais.filter((it) => normalizarSkuComparacao(it && it.SKU) !== skuRef);

                if (itensRestantes.length === itensAtuais.length) {
                    throw new Error('SKU não encontrado na lista atual.');
                }

                const resp = await fetch('/api/medias-compras/listas-pedidos/' + encodeURIComponent(listaId), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        ...obterAuthHeaders(),
                    },
                    body: JSON.stringify({ itens: itensRestantes })
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.detail || 'Falha ao excluir SKU da lista.');
                }

                setErro('');
                await carregarDetalheLista();
            } catch (e) {
                const mensagem = e.message || 'Erro ao excluir SKU do pedido.';
                if (String(mensagem).toLowerCase().includes('aprovad')) {
                    await carregarDetalheLista();
                }
                setErro(mensagem);
            } finally {
                if (btn) {
                    btn.classList.remove('is-busy');
                    btn.disabled = false;
                    btn.textContent = txtOriginal || 'Excluir SKU';
                }
            }
        }

        async function aprovarSkuDaLista(sku, btn) {
            const listaId = getListaIdDaUrl();
            const skuTxt = String(sku || '').trim();
            if (!listaId || !skuTxt) {
                setErro('Não foi possível localizar o SKU para registrar a aprovação.');

            }

            const skuRef = normalizarSkuComparacao(skuTxt);

        async function salvarOrdemItensLista(itensOrdenados, itensAnteriores) {
            const listaId = getListaIdDaUrl();
            if (!listaId) {
                setErro('Lista nao informada.');
                return false;
            }

            skuArrasteSalvando = true;
            try {
                const resp = await fetch('/api/medias-compras/listas-pedidos/' + encodeURIComponent(listaId), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        ...obterAuthHeaders(),
                    },
                    body: JSON.stringify({ itens: itensOrdenados })
                });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.detail || 'Falha ao salvar nova ordem dos SKUs.');
                }

                const data = await resp.json().catch(() => ({}));
                const listaAtualizada = data && data.lista ? data.lista : {};
                const itensAtualizados = Array.isArray(listaAtualizada.itens) ? listaAtualizada.itens : itensOrdenados;
                ultimaListaCarregada = { ...(ultimaListaCarregada || {}), ...listaAtualizada, itens: itensAtualizados };
                ultimosItensCarregados = itensAtualizados;
                renderMeta(ultimaListaCarregada);
                renderResumoTopo(ultimaListaCarregada, ultimosItensCarregados);
                renderItens(ultimosItensCarregados, ultimaListaCarregada);
                setErro('');
                return true;
            } catch (e) {
                ultimosItensCarregados = Array.isArray(itensAnteriores) ? itensAnteriores : ultimosItensCarregados;
                if (ultimaListaCarregada) ultimaListaCarregada.itens = ultimosItensCarregados;
                renderResumoTopo(ultimaListaCarregada || {}, ultimosItensCarregados);
                renderItens(ultimosItensCarregados, ultimaListaCarregada || {});
                setErro(e.message || 'Erro ao salvar nova ordem dos SKUs.');
                return false;
            } finally {
                skuArrasteSalvando = false;
            }
        }

        function moverSkuNaLista(origemIndex, destinoIndex, inserirDepois) {
            const origem = Number(origemIndex);
            const destino = Number(destinoIndex);
            const itensAtuais = Array.isArray(ultimosItensCarregados) ? ultimosItensCarregados : [];
            if (!Number.isInteger(origem) || !Number.isInteger(destino)) return;
            if (origem < 0 || destino < 0 || origem >= itensAtuais.length || destino >= itensAtuais.length || origem === destino) return;

            const itensAnteriores = itensAtuais.slice();
            const itensOrdenados = itensAtuais.slice();
            const [itemMovido] = itensOrdenados.splice(origem, 1);
            let posicaoInsercao = destino + (inserirDepois ? 1 : 0);
            if (origem < posicaoInsercao) posicaoInsercao -= 1;
            posicaoInsercao = Math.max(0, Math.min(posicaoInsercao, itensOrdenados.length));
            if (posicaoInsercao === origem) return;

            itensOrdenados.splice(posicaoInsercao, 0, itemMovido);
            ultimosItensCarregados = itensOrdenados;
            if (ultimaListaCarregada) ultimaListaCarregada.itens = itensOrdenados;
            renderResumoTopo(ultimaListaCarregada || {}, itensOrdenados);
            renderItens(itensOrdenados, ultimaListaCarregada || {});
            salvarOrdemItensLista(itensOrdenados, itensAnteriores);
        }

        function renderItens(itens, lista) {
            const tbody = document.getElementById('tbodyLista');
            const totalGeralEl = document.getElementById('totalGeral');
            const listaIdAtual = getListaIdDaUrl();
            if (!tbody) return;

            const dados = Array.isArray(itens) ? itens : [];
            if (!dados.length) {
                tbody.innerHTML = '<tr><td colspan="' + colunasTabela.length + '" class="empty">Esta lista não possui itens.</td></tr>';
                colunasTabela.forEach((coluna, idx) => aplicarLarguraColuna(idx, coluna, obterLarguraColuna(coluna)));
                if (totalGeralEl) totalGeralEl.textContent = 'Total geral: ' + formatarUSD(0);
                return;
            }

            let totalGeral = 0;
            let totalQuantidade = 0;
            let totalM3 = 0;
            tbody.innerHTML = '';

            dados.forEach((item, idx) => {
                const sku = String(item.SKU || '').trim();
                const fotoUrl = obterUrlFoto(item.Foto || '');
                const qtd = Number(item.Quantidade || 0);
                const m3 = obterM3TotalItem(item);
                const m3SemMetragem = !Number.isFinite(m3) || m3 <= 0;
                const ii = Number(obterCampo(item, ['II', 'ii'], 0) || 0);
                const ipi = Number(obterCampo(item, ['IPI', 'ipi'], 0) || 0);
                const pis = Number(obterCampo(item, ['PIS', 'pis'], 0) || 0);
                const cofins = Number(obterCampo(item, ['COFINS', 'cofins'], 0) || 0);
                const icms = Number(obterCampo(item, ['ICMS', 'icms'], 0) || 0);
                const valorUnit = Number(item['Valor unidade'] || 0);
                const freteInternacionalItemUsd = Number(obterCampo(item, ['Frete Internacional'], 0) || 0);
                const freteInternacionalItemBrl = (freteInternacionalItemUsd > 0 && dolarBase > 0)
                    ? (freteInternacionalItemUsd * dolarBase)
                    : 0;
                const valorUnitRs = Number(obterCampo(item, ['Valor Unitário R$', 'Valor Unitario R$', 'Valor unitário R$', 'Valor unitario r$', 'Valor unitário em real', 'Valor unitario em real'], 0) || 0);
                const valorTotal = Number(item['Valor total'] || (qtd * valorUnit));
                const compraAprovada = itemComCompraAprovada(item);
                const valorProdutoBrl = (valorTotal > 0 && dolarBase > 0) ? (valorTotal * dolarBase) : 0;
                const baseTributosBrl = (valorTotal > 0 && freteInternacionalItemUsd >= 0 && dolarBase > 0)
                    ? ((valorTotal + freteInternacionalItemUsd) * dolarBase)
                    : 0;
                const iiBrl = (baseTributosBrl > 0 && ii > 0) ? (baseTributosBrl * (ii / 100)) : 0;
                const baseIpiBrl = valorProdutoBrl + iiBrl;
                const ipiBrl = (baseIpiBrl > 0 && ipi > 0) ? (baseIpiBrl * (ipi / 100)) : 0;
                const pisBrl = (baseTributosBrl > 0 && pis > 0) ? (baseTributosBrl * (pis / 100)) : 0;
                const cofinsBrl = (baseTributosBrl > 0 && cofins > 0) ? (baseTributosBrl * (cofins / 100)) : 0;
                totalGeral += valorTotal;
                totalQuantidade += qtd;
                totalM3 += m3;

                const tr = document.createElement('tr');

                tr.dataset.itemIndex = String(idx);

                const celulas = {

                    foto: (fotoUrl
                        ? '<img class="foto" src="' + escaparHtml(fotoUrl) + '" alt="Foto ' + escaparHtml(sku || '') + '" loading="lazy">'
                        : '<span class="foto-empty">Sem foto</span>'),
                    quantidade: formatarNumero(qtd),
                    m3: formatarM3(m3),
                    ii: formatarPct(ii) + '<span class="cell-sub-money">' + formatarBRL(iiBrl) + '</span>',
                    ipi: formatarPct(ipi) + '<span class="cell-sub-money">' + formatarBRL(ipiBrl) + '</span>',
                    pis: formatarPct(pis) + '<span class="cell-sub-money">' + formatarBRL(pisBrl) + '</span>',
                    cofins: formatarPct(cofins) + '<span class="cell-sub-money">' + formatarBRL(cofinsBrl) + '</span>',
                    icms: formatarPct(icms),
                    valor_usd: formatarUSD(valorUnit),
                    frete_internacional: formatarBRL(freteInternacionalItemBrl),
                    valor_unit_brl: formatarBRL(valorUnitRs),
                    valor_total_usd: formatarUSD(valorTotal),
                    margens_concorrentes: formatarMargensConcorrentes(item),
                    acao: sku
                        ? '<div class="sku-actions">' +
                            '<button type="button" class="btn-excluir-sku" data-excluir-sku="' + escaparHtml(sku) + '"' +
                                (compraAprovada ? ' disabled aria-disabled="true" title="Desfaça a aprovação dentro do SKU para permitir a exclusão"' : '') +
                                '>Excluir SKU</button>' +
                            '<button type="button" class="btn-aprovar-sku' + (compraAprovada ? ' is-approved' : '') + '" data-aprovar-sku="' + escaparHtml(sku) + '"' +
                                (compraAprovada ? ' disabled aria-disabled="true"' : '') +
                                '>' + (compraAprovada ? 'Aprovado' : 'Aprovar') + '</button>' +
                          '</div>'
                        : '-',
                };

                const classes = {
                    sku: 'sku',
                    quantidade: 'num-center',
                    m3: 'num-center' + (m3SemMetragem ? ' m3-alerta' : ''),
                    ii: 'num-center',
                    ipi: 'num-center',
                    pis: 'num-center',
                    cofins: 'num-center',
                    icms: 'num-center',
                    valor_usd: 'num',
                    frete_internacional: 'num',
                    valor_unit_brl: 'num',
                    valor_total_usd: 'num',
                    margens_concorrentes: 'num-center',
                    acao: 'num-center',
                };

                tr.innerHTML = colunasTabela.map((col) => {
                    const klass = classes[col.key] ? (' class="' + classes[col.key] + '"') : '';
                    const title = col.key === 'm3' && m3SemMetragem ? ' title="Sem metragem M3 ou valor igual a zero"' : '';
                    const dataColuna = col.key === 'margens_concorrentes'
                        ? ' data-coluna="margens_concorrentes"'
                        : '';
                    const conteudo = Object.prototype.hasOwnProperty.call(celulas, col.key) ? celulas[col.key] : '';
                    return '<td' + klass + title + dataColuna + '>' + conteudo + '</td>';
                }).join('');

                const btnExcluir = tr.querySelector('[data-excluir-sku]');
                if (btnExcluir) {
                    btnExcluir.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        ev.stopPropagation();
                        const skuExcluir = btnExcluir.getAttribute('data-excluir-sku') || '';
                        excluirSkuDaLista(skuExcluir, btnExcluir);
                    });
                }

                const btnAprovar = tr.querySelector('[data-aprovar-sku]');
                if (btnAprovar) {
                    btnAprovar.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        ev.stopPropagation();
                        const skuAprovar = btnAprovar.getAttribute('data-aprovar-sku') || '';
                        aprovarSkuDaLista(skuAprovar, btnAprovar);
                    });
                }

                const handleMover = tr.querySelector('[data-sku-drag-index]');
                if (handleMover) {
                    handleMover.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        ev.stopPropagation();
                    });
                    handleMover.addEventListener('dragstart', (ev) => {
                        if (skuArrasteSalvando) {
                            ev.preventDefault();
                            return;
                        }
                        ev.stopPropagation();
                        skuArrastadoIndex = idx;
                        tr.classList.add('sku-row-dragging');
                        if (ev.dataTransfer) {
                            ev.dataTransfer.effectAllowed = 'move';
                            try {
                                ev.dataTransfer.setData('text/plain', String(idx));
                            } catch (_e) {}
                        }
                    });
                    handleMover.addEventListener('dragend', () => {
                        skuArrastadoIndex = -1;
                        limparMarcadoresArrasteSku();
                    });
                }

                tr.addEventListener('dragover', (ev) => {
                    if (skuArrastadoIndex < 0 || skuArrastadoIndex === idx || skuArrasteSalvando) return;
                    ev.preventDefault();
                    const rect = tr.getBoundingClientRect();
                    const depois = ev.clientY > rect.top + (rect.height / 2);
                    tr.classList.toggle('sku-row-drop-before', !depois);
                    tr.classList.toggle('sku-row-drop-after', depois);
                    if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
                });

                tr.addEventListener('dragleave', () => {
                    tr.classList.remove('sku-row-drop-before', 'sku-row-drop-after');
                });

                tr.addEventListener('drop', (ev) => {
                    if (skuArrastadoIndex < 0 || skuArrasteSalvando) return;
                    ev.preventDefault();
                    ev.stopPropagation();
                    const rect = tr.getBoundingClientRect();
                    const depois = ev.clientY > rect.top + (rect.height / 2);
                    const origem = skuArrastadoIndex;
                    skuArrastadoIndex = -1;
                    limparMarcadoresArrasteSku();
                    moverSkuNaLista(origem, idx, depois);
                });
                tbody.appendChild(tr);
            });

            const trTotais = document.createElement('tr');
            trTotais.className = 'totais-row';
            trTotais.innerHTML = colunasTabela.map((col) => {
                let conteudo = '';
                let klass = '';

                if (col.key === 'sku') {
                    conteudo = 'Totais';
                    klass = 'sku totais-label';
                } else if (col.key === 'quantidade') {
                    conteudo = formatarNumero(totalQuantidade);
                    klass = 'num-center';
                } else if (col.key === 'm3') {
                    conteudo = formatarM3(totalM3);
                    klass = 'num-center';
                } else if (col.key === 'valor_total_usd') {
                    conteudo = formatarUSD(totalGeral);
                    klass = 'num';
                }

                return '<td' + (klass ? ' class="' + klass + '"' : '') + '>' + conteudo + '</td>';
            }).join('');
            tbody.appendChild(trTotais);

            colunasTabela.forEach((coluna, idx) => aplicarLarguraColuna(idx, coluna, obterLarguraColuna(coluna)));

            if (totalGeralEl) totalGeralEl.textContent = 'Total geral: ' + formatarUSD(totalGeral);
        }

        function renderMeta(lista) {
            const titulo = document.getElementById('titulo');
            const meta = document.getElementById('meta');
            const nome = String(lista.nome_lista || 'Sem nome').trim();
            const status = String(lista.status || '').trim() || 'Sem status';
            const totalItens = Number(lista.total_itens || 0);
            const totalQtd = Number(lista.total_quantidade || 0);
            const atualizada = String(lista.updated_at || lista.created_at || '').trim();
            const loja = obterLojaLista(lista);

            if (titulo) {
                titulo.textContent = 'Importações - ' + nome;
            }

            if (meta) {
                meta.innerHTML =
                    '<span><strong>Lista:</strong> ' + escaparHtml(nome) + '</span>' +
                    '<span><strong>Loja:</strong> ' + escaparHtml(loja) + '</span>' +
                    '<span><strong>Status:</strong> <span class="status">' + escaparHtml(status) + '</span></span>' +
                    '<span><strong>Itens:</strong> ' + formatarNumero(totalItens) + '</span>' +
                    '<span><strong>Quantidade total:</strong> ' + formatarNumero(totalQtd) + '</span>' +
                    '<span><strong>Atualizada em:</strong> ' + escaparHtml(atualizada || '-') + '</span>';
            }
        }

        async function carregarDetalheLista() {
            try {
                setErro('');
                const listaId = getListaIdDaUrl();
                if (!listaId) {
                    throw new Error('Lista não informada.');
                }

                const resp = await fetch('/api/medias-compras/listas-pedidos/' + encodeURIComponent(listaId), {
                    method: 'GET',
                    headers: { ...obterAuthHeaders() }
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.detail || 'Falha ao carregar detalhes da lista.');
                }

                const data = await resp.json();
                const lista = data && data.lista ? data.lista : {};
                const itens = lista.itens || [];
                ultimaListaCarregada = lista;
                ultimosItensCarregados = Array.isArray(itens) ? itens : [];
                carregarFaturamentoVendas12m();
                await carregarPreferenciasColunasServidor();
                renderCabecalho();
                await carregarMapaM3Individual();
                renderMeta(lista);
                renderResumoTopo(lista, itens);
                renderItens(itens, lista);
                void carregarCustoPostoBackend(listaId);
                void analisarMargensConcorrentesAutomaticamente(listaId, ultimosItensCarregados);
            } catch (e) {
                setErro(e.message || 'Erro ao carregar lista de importação.');
                renderResumoTopo({}, []);
                renderItens([], {});
            }
        }

        async function carregarCustoPostoBackend(listaId) {
            try {
                const resp = await fetch('/api/medias-compras/listas-pedidos/' + encodeURIComponent(listaId) + '/landed-cost', {
                    method: 'GET',
                    headers: { ...obterAuthHeaders() }
                });
                if (!resp.ok) return;
                const data = await resp.json().catch(() => ({}));
                ultimaAnaliseCustoPosto = data && data.analysis ? data.analysis : null;
                if (ultimaListaCarregada && String(ultimaListaCarregada.id || '') === String(listaId || '')) {
                    renderResumoTopo(ultimaListaCarregada, ultimosItensCarregados);
                }
            } catch (_e) {
                ultimaAnaliseCustoPosto = null;
            }
        }

        renderCabecalho();
        carregarFxTopo();
        atualizarHorarioBrasilia();
        setInterval(atualizarHorarioBrasilia, 1000);
        atualizarHorarioPequim();
        setInterval(atualizarHorarioPequim, 1000);
        carregarDetalheLista();
        setInterval(carregarFaturamentoVendas12m, FATURAMENTO_REFRESH_MS);

        const btnAddSkuManual = document.getElementById('btnAddSkuManual');
        if (btnAddSkuManual) {
            btnAddSkuManual.addEventListener('click', incluirSkuManual);
        }
        const btnAddSkuLista = document.getElementById('btnAddSkuLista');
        if (btnAddSkuLista) {
            btnAddSkuLista.addEventListener('click', incluirSkuPorLista);
        }
        const manualSku = document.getElementById('manualSku');
        const manualQtd = document.getElementById('manualQtd');
        const manualValor = document.getElementById('manualValor');
        [manualSku, manualQtd, manualValor].forEach((el) => {
            if (!el) return;
            el.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    incluirSkuManual();
                }
            });
        });
    </script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
