services:
  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - rtpengine
      - --foreground
      - --log-stderr
      - --interface=${PRIVATE_IPV4:?PRIVATE_IPV4 obrigatório}!${PUBLIC_IPV4:?PUBLIC_IPV4 obrigatório}
      - --listen-ng=127.0.0.1:2223
      - --port-min=${RTP_PORT_MIN:-30000}
      - --port-max=${RTP_PORT_MAX:-40000}
    healthcheck:
      test: ["CMD-SHELL", "ss -lun | grep -q ':2223 '"]
      interval: 15s
      timeout: 5s
      retries: 5

  kamailio:
    build:
      context: ./kamailio
    restart: unless-stopped
    network_mode: host
    depends_on:
      rtpengine:
        condition: service_healthy
    environment:
      PUBLIC_SIP_HOST: ${PUBLIC_SIP_HOST:?PUBLIC_SIP_HOST obrigatório}
      PUBLIC_IPV4: ${PUBLIC_IPV4:?PUBLIC_IPV4 obrigatório}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:?OPENAI_PROJECT_ID obrigatório}
      META_SIP_ALLOWED_CIDRS: ${META_SIP_ALLOWED_CIDRS:?META_SIP_ALLOWED_CIDRS obrigatório}
      SIP_TLS_CERT: ${SIP_TLS_CERT:-/run/secrets/tls/fullchain.pem}
      SIP_TLS_KEY: ${SIP_TLS_KEY:-/run/secrets/tls/privkey.pem}
    volumes:
      - ./secrets/tls:/run/secrets/tls:ro
    healthcheck:
      test: ["CMD", "kamcmd", "core.ps"]
      interval: 15s
      timeout: 5s
      retries: 5
