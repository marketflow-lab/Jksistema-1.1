        function normalizeInitialAppUrl(value) {
            const fallback = 'http://127.0.0.1:8001/dashboard.html';
            try {
                const target = new URL(value || fallback, fallback);
                if (/\/frontend_index\.html$/i.test(target.pathname)) {
                    target.pathname = target.pathname.replace(/frontend_index\.html$/i, 'dashboard.html');
                }
                return target.href;
            } catch (_err) {
                return value || fallback;
            }
        }

        function urlEmFluxoAutenticacaoMercadoLivreShell(value) {
            const raw = String(value || '').trim();
            if (!raw) return false;
            try {
                const url = new URL(raw);
                const host = String(url.hostname || '').toLowerCase();
                const mercadoLivreHost = host === 'mercadolivre.com'
                    || host.endsWith('.mercadolivre.com')
                    || host === 'mercadolivre.com.br'
                    || host.endsWith('.mercadolivre.com.br')
                    || host === 'mercadolibre.com'
                    || host.endsWith('.mercadolibre.com');
                if (!mercadoLivreHost) return false;
                const pathname = String(url.pathname || '/').toLowerCase().replace(/\/{2,}/g, '/');
                const specificAuthRoute = /^\/gz\/account-verification(?:\/|$)|^\/jms\/[^/]+\/lgz(?:\/|$)|^\/password\/validation(?:\/|$)|^\/totp(?:\/|$)|^\/login\/challenges?(?:\/|$)/.test(pathname);
                const genericAuthHost = host === 'mercadolivre.com'
                    || host === 'mercadolivre.com.br'
                    || host === 'mercadolibre.com'
                    || /^(?:www|auth|accounts?|account)\./.test(host);
                const genericAuthRoute = /^\/login(?:\/|$)|^\/(?:captcha|recaptcha|security[-_/]?check|identity[-_/]?verification)(?:\/|$)/.test(pathname);
                let negativeTraffic = false;
                let explicitAuthParam = false;
                for (const [name, itemValueRaw] of url.searchParams.entries()) {
                    const key = String(name || '').toLowerCase();
                    const itemValue = String(itemValueRaw || '').toLowerCase();
                    if (key === 'logintype' && itemValue === 'negative_traffic') negativeTraffic = true;
                    if (['captcha', 'recaptcha', 'security_check', 'identity_verification'].includes(key) && itemValue) {
                        explicitAuthParam = true;
                    }
                }
                return specificAuthRoute
                    || negativeTraffic
                    || (genericAuthHost && (genericAuthRoute || explicitAuthParam));
            } catch (_err) {
                return false;
            }
        }

        function normalizeTitle(value, fallback = 'Nova aba') {
            const clean = String(value || '')
                .replace(/\s+/g, ' ')
                .replace(/^[^\p{L}\p{N}]+/u, '')
                .replace(/\s+-\s+JK Sistema(?:\s+de Gest[aÃ£]o)?\s*$/iu, '')
                .trim();
            return (clean || fallback).slice(0, 90);
        }

        function titleFromUrl(value) {
            try {
                const url = new URL(value, appUrl);
                const file = (url.pathname.split('/').pop() || '').toLowerCase();
                const titles = {
                    'frontend_index.html': 'Inicio',
                    'dashboard.html': 'Inicio',
                    'favoritos.html': 'Favoritos ML',
                    'avant.html': 'Avant',
                    'perguntas_pos_venda.html': 'Perguntas e pos venda',
                    'cadastro.html': 'Cadastro de Produtos',
                    'configuracoes.html': 'Configuracoes',
                    'integracoes.html': 'Integracoes',
                    'estoque.html': 'Estoque',
                    'vendas.html': 'Vendas',
                    'medias_compras.html': 'Medias e Pedidos',
                    'frontend_promo.html': 'Promocao ML',
                    'renovacao.html': 'Renovacao Fixa',
                    'frontend_etiquetas.html': 'Etiquetas',
                    'anunciosml.html': 'Anuncios ML',
                    'impostos.html': 'Impostos',
                    'importacoes.html': 'Importacoes'
                };
                if (titles[file]) return titles[file];
                if (file.endsWith('.html')) {
                    return file
                        .replace(/\.html$/i, '')
                        .replace(/[_-]+/g, ' ')
                        .replace(/\b\w/g, char => char.toUpperCase());
                }
            } catch (_err) {}
            return '';
        }

        function normalizeTabUrl(value, fallback = '') {
            try {
                return new URL(value, appUrl).href;
            } catch (_err) {
                return String(value || fallback || '');
            }
        }

        function titleFromFrame(webview) {
            try {
                const doc = webview && (webview.contentDocument || webview.contentWindow?.document);
                const pageTitle = normalizeTitle(doc?.title || '', '');
                if (pageTitle && !/^JK Sistema(?: de Gest[aÃ£]o)?$/i.test(pageTitle)) {
                    return pageTitle;
                }
                const heading = normalizeTitle(doc?.querySelector('h1')?.textContent || '', '');
                if (heading && !/^JK Sistema(?: de Gest[aÃ£]o)?$/i.test(heading)) {
                    return heading;
                }
            } catch (_err) {}
            return '';
        }

        function sameUrlWithoutCache(left, right) {
            try {
                const a = new URL(left);
                const b = new URL(right);
                a.searchParams.delete('_jk_nocache');
                b.searchParams.delete('_jk_nocache');
                return a.toString() === b.toString();
            } catch (_err) {
                return String(left || '') === String(right || '');
            }
        }

        function compactKey(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function tabProfileFrom(url, title) {
            const key = compactKey(`${title || ''} ${url || ''}`);
            const profiles = [
                { label: 'IN', accent: '#4facfe', terms: ['inicio', 'dashboard', 'frontend_index'] },
                { label: '$', accent: '#f5a84b', terms: ['vendas'] },
                { label: 'ML', accent: '#29c7e8', terms: ['anuncios', 'mercado livre', 'anunciosml'] },
                { label: 'FV', accent: '#f4d03f', terms: ['favoritos'] },
                { label: 'AV', accent: '#2563eb', terms: ['avant'] },
                { label: '?', accent: '#38d4f0', terms: ['perguntas', 'pos venda'] },
                { label: 'CX', accent: '#4facfe', terms: ['estoque', 'full'] },
                { label: 'ET', accent: '#33d17a', terms: ['etiquetas'] },
                { label: 'IT', accent: '#33d1bf', terms: ['integracoes'] },
                { label: '+', accent: '#72a7ff', terms: ['cadastro'] },
                { label: 'PR', accent: '#4facfe', terms: ['promocao', 'promo'] },
                { label: 'RF', accent: '#25c2f0', terms: ['renovacao'] },
                { label: 'MD', accent: '#83d96b', terms: ['medias', 'pedidos'] },
                { label: '%', accent: '#ff8b5c', terms: ['impostos'] },
                { label: 'IM', accent: '#ffe066', terms: ['importacoes'] },
                { label: 'CF', accent: '#b68cff', terms: ['configuracoes'] }
            ];
            return profiles.find(profile => profile.terms.some(term => key.includes(term))) || { label: 'JK', accent: '#4facfe' };
        }

        function applyTabProfile(tab) {
            if (!tab || !tab.button) return;
            const profile = tabProfileFrom(tab.url, tab.title);
            tab.button.style.setProperty('--tab-accent', profile.accent);

            if (!shellEl || !toolbarEl) return;
            if (toolbarEl.matches(':hover') || toolbarEl.contains(document.activeElement)) {
                showTabsToolbar(900);

            }
            shellEl.classList.remove('tabs-expanded');

        function showTabsToolbar(timeout = 1800) {
            if (!shellEl) return;
            clearTimeout(toolbarAutoHideTimer);
            shellEl.classList.add('tabs-expanded');
            if (timeout > 0) {
                toolbarAutoHideTimer = setTimeout(hideTabsToolbar, timeout);

        function scheduleTabsToolbarHide(timeout = 700) {

        function bindAutoHidingToolbar() {
            if (!toolbarEl) return;
            if (toolbarTrigger) {
                toolbarTrigger.addEventListener('mouseenter', () => showTabsToolbar(2600));
                toolbarTrigger.addEventListener('click', () => showTabsToolbar(3200));
            }
            toolbarEl.addEventListener('mouseenter', () => showTabsToolbar(0));
            toolbarEl.addEventListener('mouseleave', () => scheduleTabsToolbarHide(650));
            toolbarEl.addEventListener('focusin', () => showTabsToolbar(0));
            toolbarEl.addEventListener('focusout', () => scheduleTabsToolbarHide(650));
            document.addEventListener('mousemove', event => {
                if (event.clientY <= 10) {

        function setTabTitle(id, title) {
            const tab = tabs.get(id);
            if (!tab) return;
            tab.title = normalizeTitle(title, tab.title || 'JK Sistema');
            const titleEl = tab.button.querySelector('.tab-title');
            if (titleEl) titleEl.textContent = tab.title;

        function findTabBySource(source) {
            for (const [id, tab] of tabs) {
                if (tab.webview && tab.webview.contentWindow === source) return { id, tab };

        }

        function postToTab(tab, message) {
            try {
                if (tab && tab.webview && tab.webview.contentWindow) {
                    tab.webview.contentWindow.postMessage(message, '*');
                }
            } catch (_err) {}
        }

        function postToSourceOrTab(sourceWindow, tab, message) {
            try {
                if (sourceWindow && typeof sourceWindow.postMessage === 'function') {
                    sourceWindow.postMessage(message, '*');
                    return;
                }
            } catch (_err) {}
            postToTab(tab, message);
        }

        function isFavoritosTab(tab) {
            const url = String((tab && (tab.url || tab.webview?.src)) || '').toLowerCase();
            const title = String((tab && tab.title) || '').toLowerCase();
            return url.includes('/favoritos.html') || title.includes('favoritos');

        function findFavoritosTabs() {

        }

        function postToFavoritosTabs(message) {

        function shouldUseFavoritosWorker(payload, found) {
            if (payload && payload.worker) return true;
            if (!favoritosWorkerBrowserActive && !(favoritosWorkerLastStatus && favoritosWorkerLastStatus.active)) {
                return false;
            }
            if (!found || !found.tab) return true;
            return isFavoritosTab(found.tab);
        }

        function setFavoritosWorkerBar(payload = {}, contexto = {}) {
            const status = String(payload.status || '').toLowerCase();
            const canceled = ['canceled', 'cancelled'].includes(status);
            const isFinal = ['done', 'stopped', 'closed', 'canceled', 'cancelled', 'error'].includes(status);
            const startSignal = contexto && contexto.start === true && payload.active !== false;
            if (startSignal) {
                favoritosWorkerCancellationLocked = false;
                favoritosWorkerTerminalLocked = false;
            }
            if (favoritosWorkerTerminalLocked && !isFinal && !startSignal) return;
            if (favoritosWorkerCancellationLocked && !canceled && !startSignal) return;
            if (canceled) favoritosWorkerCancellationLocked = true;
            const message = canceled ? '' : String(payload.message || payload.mensagem || payload.label || '').trim();
            if (favoritosWorkerElapsedTimer) {
                const timerStatus = favoritosWorkerElapsedTimer.snapshot();
                if (isFinal) {
                    favoritosWorkerElapsedTimer.finish({
                        status,
                        finishedAt: Number(payload.finishedAt || 0) || Date.now()
                    });
                } else if (payload.active !== false && (!timerStatus.active || !timerStatus.startedAt)) {
                    favoritosWorkerElapsedTimer.start({
                        status: status || 'running',
                        startedAt: Number(payload.startedAt || 0) || Date.now()
                    });
                }
            }
            if (isFinal) favoritosWorkerTerminalLocked = true;
            favoritosWorkerLastStatus = { ...(favoritosWorkerLastStatus || {}), ...(payload || {}) };
            favoritosWorkerBrowserActive = payload.active === false || isFinal ? false : !!(payload.active || message || favoritosWorkerBrowserActive);
            favoritosWorkerBrowserPaused = !!(payload.paused || status === 'paused');
            if (favoritosWorkerPauseBtn) favoritosWorkerPauseBtn.textContent = favoritosWorkerBrowserPaused ? 'Retomar' : 'Pausar';
            if (favoritosWorkerMessage) {
                favoritosWorkerMessage.textContent = canceled ? '' : (message || (favoritosWorkerBrowserPaused
                    ? 'Favoritos pausado.'
                    : 'Coleta do Favoritos em andamento.'));
            }
            if (!favoritosWorkerBar) return;
            if (favoritosWorkerBarHideTimer) {
                clearTimeout(favoritosWorkerBarHideTimer);
                favoritosWorkerBarHideTimer = null;
            }
            favoritosWorkerBar.classList.toggle('hidden', canceled || (!favoritosWorkerBrowserActive && !message));
            if (canceled) return;
            if (isFinal) {
                favoritosWorkerBarHideTimer = setTimeout(() => {
                    favoritosWorkerBar.classList.add('hidden');
                    favoritosWorkerBarHideTimer = null;
                }, status === 'error' ? 12000 : 7000);
            }
        }

        function enviarAcaoFavoritosWorker(action) {
            const normalized = String(action || '').toLowerCase();
            if (!normalized) return;
            postToFavoritosTabs({
                channel: 'jk-favoritos-worker-action',
                action: normalized
            });
            const api = window.electronAPI || null;
            if (!api) return;
            if (normalized === 'pause' && typeof api.pauseFavoritosWorkerBrowser === 'function') {
                api.pauseFavoritosWorkerBrowser().catch(() => {});
            } else if (normalized === 'resume' && typeof api.resumeFavoritosWorkerBrowser === 'function') {
                api.resumeFavoritosWorkerBrowser().catch(() => {});
            } else if (normalized === 'cancel' && typeof api.cancelFavoritosWorkerBrowser === 'function') {
                api.cancelFavoritosWorkerBrowser().catch(() => {});
            }
        }

        function configurarBarraFavoritosWorker() {
            if (favoritosWorkerShowBtn) {
                favoritosWorkerShowBtn.addEventListener('click', () => {
                    const api = window.electronAPI || null;
                    if (api && typeof api.showFavoritosWorkerBrowser === 'function') {
                        api.showFavoritosWorkerBrowser().then(setFavoritosWorkerBar).catch(() => {});
                    }
                });
            }
            if (favoritosWorkerHideBtn) {
                favoritosWorkerHideBtn.addEventListener('click', () => {
                    const api = window.electronAPI || null;
                    if (api && typeof api.hideFavoritosWorkerBrowser === 'function') {
                        api.hideFavoritosWorkerBrowser().then(setFavoritosWorkerBar).catch(() => {});
                    }
                });
            }
            if (favoritosWorkerPauseBtn) {
                favoritosWorkerPauseBtn.addEventListener('click', () => {
                    enviarAcaoFavoritosWorker(favoritosWorkerBrowserPaused ? 'resume' : 'pause');
                });
            }
            if (favoritosWorkerCancelBtn) {
                favoritosWorkerCancelBtn.addEventListener('click', () => {
                    if (!confirm('Cancelar o Favoritos em andamento?')) return;
                    setFavoritosWorkerBar({
                        active: false,

                        status: 'canceled',
                        message: ''
                    });
                    enviarAcaoFavoritosWorker('cancel');
                });
            }
            const api = window.electronAPI || null;
            if (api && typeof api.onFavoritosWorkerProgress === 'function') {
                api.onFavoritosWorkerProgress(setFavoritosWorkerBar);
            }
            if (api && typeof api.onFavoritosWorkerDone === 'function') {
                api.onFavoritosWorkerDone(payload => setFavoritosWorkerBar({
                    ...(payload || {}),
                    active: false,
                    status: payload && payload.status || 'done'
                }));
            }
            if (api && typeof api.onFavoritosWorkerError === 'function') {
                api.onFavoritosWorkerError(payload => setFavoritosWorkerBar({
                    ...(payload || {}),
                    active: false,
                    status: 'error',
                    message: payload && (payload.message || payload.mensagem) || 'Favoritos encontrou um erro.'
                }));
            }
            if (api && typeof api.getFavoritosWorkerBrowserStatus === 'function') {
                api.getFavoritosWorkerBrowserStatus()
                    .then(status => {
                        if (status && status.active) setFavoritosWorkerBar(status, { start: true });
                    })
                    .catch(() => {});
            }
        }

        configurarBarraFavoritosWorker();

        function isRustDeskUrl(url, title = '') {
            const urlText = String(url || '').toLowerCase();
            const titleText = String(title || '').toLowerCase();
            return urlText.includes('/rustdesk.html') || titleText.includes('rustdesk') || titleText.includes('acesso remoto');
        }

        function isRustDeskTab(tab) {
            const url = String((tab && (tab.url || tab.webview?.src)) || '');
            const title = String((tab && tab.title) || '');
            return isRustDeskUrl(url, title);
        }

        function findRustDeskTab() {
            if (activeId && tabs.has(activeId) && isRustDeskTab(tabs.get(activeId))) {
                return { id: activeId, tab: tabs.get(activeId) };
            }
            for (const [id, tab] of tabs) {
                if (isRustDeskTab(tab)) return { id, tab };
            }
            return null;
        }

        function rustDeskTabIds() {
            return Array.from(tabs.entries())
                .filter(([, tab]) => isRustDeskTab(tab))
                .map(([id]) => id);
        }

        function hasAnotherRustDeskTab(id) {
            return rustDeskTabIds().some(tabId => tabId !== id);
        }

        function dedupeRustDeskTabs(keepId) {
            const ids = rustDeskTabIds();
            ids.forEach(id => {
                if (id !== keepId) closeTab(id);
            });
        }

        function isActiveRustDeskTab() {
            return !!(activeId && isRustDeskTab(tabs.get(activeId)));
        }

        let rustDeskShellHideTimer = null;
        let rustDeskShellHideLastAt = 0;

        async function hideRustDeskFromShell(reason = 'rustdesk-tab-inactive') {
            const api = window.electronAPI || null;
            if (!api || typeof api.hideRustDeskInApp !== 'function') return;
            const now = Date.now();
            if (now - rustDeskShellHideLastAt < 500) return;
            rustDeskShellHideLastAt = now;
            const payload = {
                allow_hide: true,
                parent_mode: 'window',
                reason
            };
            try {
                if (typeof api.getNativeWindowHandle === 'function') {
                    const handle = await api.getNativeWindowHandle().catch(() => null);
                    if (handle && handle.success && handle.hwnd) {
                        payload.parent_hwnd = handle.hwnd;
                    }
                }
                await api.hideRustDeskInApp(payload, '').catch(() => null);
            } catch (_err) {}
        }

        function scheduleRustDeskShellHide(reason = 'rustdesk-tab-inactive') {
            window.clearTimeout(rustDeskShellHideTimer);
            rustDeskShellHideTimer = window.setTimeout(() => {
                if (isActiveRustDeskTab()) return;
                hideRustDeskFromShell(reason);
            }, 450);
        }

        function tabFrameBounds(tab, id) {
            if (!tab || !tab.webview || typeof tab.webview.getBoundingClientRect !== 'function') return null;
            const rect = tab.webview.getBoundingClientRect();
            return {
                x: rect.left,
                y: rect.top,
                width: rect.width,
                height: rect.height,
                active: String(id || tab.id || '') === String(activeId || '')
            };
        }

        function notifyRustDeskTabVisibility() {
            const activeRustDesk = isActiveRustDeskTab();
            tabs.forEach((tab, id) => {
                if (!isRustDeskTab(tab)) return;
                const active = id === activeId;
                postToTab(tab, {
                    channel: 'jk-rustdesk-tab-visibility',
                    active,
                    payload: {
                        frame: tabFrameBounds(tab, id),
                        anotherRustDeskActive: !active && activeRustDesk
                    }
                });
            });
        }

        function getTabIdFromButton(button) {
            return button && button.dataset ? String(button.dataset.tabId || '') : '';
        }

        function clearTabDragClasses() {
            tabs.forEach(tab => {
                if (!tab || !tab.button) return;
                tab.button.classList.remove('is-dragging', 'is-drop-before', 'is-detach-target');
            });
            if (tabDetachHint) tabDetachHint.classList.remove('is-active');
        }

        function isDetachDropPoint(event) {
            if (!toolbarEl) return false;
            const rect = toolbarEl.getBoundingClientRect();
            return event.clientY > rect.bottom + 32
                || event.clientY < rect.top - 16
                || event.clientX < rect.left - 24
                || event.clientX > rect.right + 24;
        }

        function getDropTargetId(clientX) {
            const buttons = Array.from(tabsEl.querySelectorAll('.tab'))
                .filter(button => !button.classList.contains('is-dragging'));
            for (const button of buttons) {
                const rect = button.getBoundingClientRect();
                if (clientX < rect.left + rect.width / 2) {
                    return getTabIdFromButton(button);
                }
            }
            return '';
        }

        function reorderTabBefore(dragId, targetId) {
            if (!dragId || dragId === targetId || !tabs.has(dragId)) return;
            const entries = Array.from(tabs.entries());
            const dragged = entries.find(([id]) => id === dragId);
            if (!dragged) return;
            const remaining = entries.filter(([id]) => id !== dragId);
            const targetIndex = targetId
                ? remaining.findIndex(([id]) => id === targetId)
                : remaining.length;
            if (targetIndex < 0) return;
            const nextEntries = [
                ...remaining.slice(0, targetIndex),
                dragged,
                ...remaining.slice(targetIndex)
            ];
            tabs.clear();
            nextEntries.forEach(([id, tab]) => {
                tabs.set(id, tab);
                if (tab.button) tabsEl.appendChild(tab.button);
            });
        }

        async function detachTabToWindow(id) {
            const tab = tabs.get(id);
            if (!tab) return;
            const url = getCurrentTabUrl(tab) || tab.url || appUrl;
            const title = tab.title || titleFromUrl(url) || 'JK Sistema';
            try {
                if (window.electronAPI && typeof window.electronAPI.openDetachedInternalBrowser === 'function') {
                    const result = await window.electronAPI.openDetachedInternalBrowser(url, title);
                    if (result && result.success === false) return;
                } else {
                    const popup = window.open(url, '_blank', 'noopener,noreferrer');
                    if (!popup) return;
                }
                closeTab(id);
            } catch (_err) {}
        }

        function bindTabDragHandlers(button, id) {
            button.dataset.tabId = id;
            button.addEventListener('pointerdown', (event) => {
                if (event.button !== 0 || event.target.closest('.tab-close')) return;
                tabDragState = {
                    id,
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    dragging: false
                };
                try { button.setPointerCapture(event.pointerId); } catch (_err) {}
            });
            button.addEventListener('pointermove', (event) => {
                if (!tabDragState || tabDragState.id !== id || tabDragState.pointerId !== event.pointerId) return;
                const dx = Math.abs(event.clientX - tabDragState.startX);
                const dy = Math.abs(event.clientY - tabDragState.startY);
                if (!tabDragState.dragging && Math.max(dx, dy) < 6) return;
                if (!tabDragState.dragging) {
                    tabDragState.dragging = true;
                    button.classList.add('is-dragging');
                    showTabsToolbar(0);
                }
                event.preventDefault();
                const detach = isDetachDropPoint(event);
                clearTabDragClasses();
                button.classList.add('is-dragging');
                button.classList.toggle('is-detach-target', detach);
                if (tabDetachHint) tabDetachHint.classList.toggle('is-active', detach);
                if (!detach) {
                    const targetId = getDropTargetId(event.clientX);
                    reorderTabBefore(id, targetId);
                    const targetButton = targetId && tabs.get(targetId) ? tabs.get(targetId).button : null;
                    if (targetButton) targetButton.classList.add('is-drop-before');
                }
            });
            const finalizar = (event) => {
                if (!tabDragState || tabDragState.id !== id || tabDragState.pointerId !== event.pointerId) return;
                const shouldDetach = tabDragState.dragging && isDetachDropPoint(event);
                const wasDragging = tabDragState.dragging;
                tabDragState = null;
                clearTabDragClasses();
                try { button.releasePointerCapture(event.pointerId); } catch (_err) {}
                if (wasDragging) {
                    button.dataset.dragSuppress = '1';
                    setTimeout(() => { delete button.dataset.dragSuppress; }, 0);
                    event.preventDefault();
                    event.stopPropagation();
                }
                if (shouldDetach) {
                    detachTabToWindow(id);
                } else if (wasDragging) {
                    activateTab(id);
                    showTabsToolbar(1200);
                }
            };
            button.addEventListener('pointerup', finalizar);
            button.addEventListener('pointercancel', (event) => {
                if (!tabDragState || tabDragState.id !== id || tabDragState.pointerId !== event.pointerId) return;
                tabDragState = null;
                clearTabDragClasses();
                try { button.releasePointerCapture(event.pointerId); } catch (_err) {}
            });
            button.addEventListener('lostpointercapture', () => {
                if (tabDragState && tabDragState.id === id) {
                    tabDragState = null;
                    clearTabDragClasses();
                }
            });
        }

        function setUpdateSaveOverlay(active, message = '') {
            if (updateSaveOverlay) updateSaveOverlay.classList.toggle('is-active', !!active);
            if (updateSaveMessage && message) updateSaveMessage.textContent = message;
        }

        function showUpdateToast(title, message, options = {}) {
            if (!updateToast) return;
            clearTimeout(updateToastTimer);
            updateToastActionHandler = typeof options.onAction === 'function' ? options.onAction : null;
            updateToast.classList.toggle('is-error', options.kind === 'error');
            updateToast.classList.add('is-active');
            if (updateToastTitle) updateToastTitle.textContent = title || 'Atualizacao';
            if (updateToastMessage) updateToastMessage.textContent = message || '';
            const hasAction = !!(updateToastAction && updateToastActionHandler);
            if (updateToastActions) updateToastActions.classList.toggle('is-active', hasAction);
            if (updateToastAction) {
                updateToastAction.textContent = options.actionLabel || 'Atualizar agora';
                updateToastAction.disabled = false;
            }
            const hasProgress = Number.isFinite(Number(options.progress));
            if (updateToastProgress) updateToastProgress.classList.toggle('is-active', hasProgress);
            if (updateToastProgressFill && hasProgress) {
                const progress = Math.max(0, Math.min(100, Number(options.progress)));
                updateToastProgressFill.style.width = `${progress}%`;
            }
            if (options.timeout > 0) {
                updateToastTimer = setTimeout(() => {
                    updateToast.classList.remove('is-active');
                }, options.timeout);
            }
        }

        if (updateToastAction) {
            updateToastAction.addEventListener('click', async () => {
                if (typeof updateToastActionHandler !== 'function') return;
                updateToastAction.disabled = true;
                try {
                    await updateToastActionHandler();
                } catch (err) {
                    showUpdateToast('Erro ao atualizar', err && err.message ? err.message : 'Nao foi possivel iniciar a atualizacao.', { kind: 'error', timeout: 8500 });
                }
            });
        }

        async function iniciarAtualizacaoAgora() {
            if (!window.electronAPI || typeof window.electronAPI.installUpdateNow !== 'function') {
                throw new Error('Atualizador indisponivel neste pacote.');
            }
            showUpdateToast('Iniciando atualizacao', 'Preparando download da nova versao...', { progress: 8 });
            const result = await window.electronAPI.installUpdateNow();
            if (!result || result.success === false) {
                throw new Error(result && (result.error || result.reason) || 'Nao foi possivel iniciar a atualizacao.');
            }
            return result;
        }

        function updatePayloadVersion(payload) {
            return payload && (
                payload.latestVersion
                || payload.currentVersion
                || payload.updateInfo && payload.updateInfo.version
            ) || '';
        }

        function bindAutoUpdateStatusToast() {
            if (!window.electronAPI || typeof window.electronAPI.onAutoUpdateStatus !== 'function') return;
            window.electronAPI.onAutoUpdateStatus((payload = {}) => {
                const status = payload.status || '';
                const version = updatePayloadVersion(payload);
                if (status === 'checking') {
                    showUpdateToast('Buscando atualizacao', 'Conferindo se existe uma versao mais recente...', { progress: 12 });
                    return;
                }
                if (status === 'available' || status === 'manual-update-available') {
                    showUpdateToast(
                        'Atualizacao encontrada',
                        `Versao ${version || 'nova'} disponivel. Baixando e instalando automaticamente.`,
                        { progress: 15 }
                    );
                    return;
                }
                if (status === 'download-requested') {
                    showUpdateToast('Baixando atualizacao', 'Download iniciado. Mantenha o app aberto.', { progress: 18 });
                    return;
                }
                if (status === 'downloading') {
                    const progress = Math.max(1, Math.min(99, Number(payload.percent || 0)));
                    showUpdateToast('Baixando atualizacao', `Download em andamento: ${Math.round(progress)}%`, { progress });
                    return;
                }
                if (status === 'downloaded') {
                    showUpdateToast('Atualizacao pronta', 'Salvando o trabalho aberto e instalando agora...', { progress: 100 });
                    return;
                }
                if (status === 'saving-work') {
                    showUpdateToast('Salvando trabalho', 'Guardando abas, rascunhos e dados locais antes de atualizar...', { progress: 100 });
                    return;
                }
                if (status === 'work-saved') {
                    showUpdateToast('Trabalho salvo', 'Instalacao automatica iniciando...', { progress: 100 });
                    return;
                }
                if (status === 'installing') {
                    showUpdateToast('Instalando atualizacao', 'O JK Sistema vai reiniciar sozinho em instantes.', { progress: 100 });
                    setUpdateSaveOverlay(true, 'Instalando atualizacao automaticamente...');
                    return;
                }
                if (status === 'not-available' || status === 'up-to-date') {
                    showUpdateToast('Sistema atualizado', `Voce ja esta na versao mais recente${version ? `: ${version}` : ''}.`, { progress: 100, timeout: 5200 });
                    return;
                }
                if (status === 'skipped') {
                    showUpdateToast('Atualizacao indisponivel', payload.reason || 'Nao foi possivel verificar atualizacao agora.', { timeout: 6500 });
                    return;
                }
                if (status === 'error') {
                    showUpdateToast('Erro ao atualizar', payload.error || 'Nao foi possivel concluir a atualizacao.', { kind: 'error', timeout: 8500 });
                }
            });
        }

        function getCurrentTabUrl(tab) {
            if (!tab) return '';
            try {
                const href = tab.webview && tab.webview.contentWindow && tab.webview.contentWindow.location
                    ? tab.webview.contentWindow.location.href
                    : '';
                if (href) return href;
            } catch (_err) {}
            return tab.url || '';
        }

        function saveOpenTabsSnapshot(reason = 'manual') {
            try {
                const snapshot = {
                    reason,
                    savedAt: Date.now(),
                    activeUrl: activeId && tabs.get(activeId) ? getCurrentTabUrl(tabs.get(activeId)) : '',
                    tabs: Array.from(tabs.values()).map(tab => ({
                        url: getCurrentTabUrl(tab),
                        title: tab.title || titleFromUrl(tab.url) || 'JK Sistema'
                    })).filter(item => item.url)
                };
                localStorage.setItem('jk-electron-update-tabs-v1', JSON.stringify(snapshot));
            } catch (_err) {}
        }

        function prepareTabForUpdate(tab, index, total) {
            return new Promise((resolve) => {
                if (!tab || !tab.webview || !tab.webview.contentWindow) {
                    resolve({ success: true, reason: 'no-tab-window' });
                    return;
                }
                const requestId = `update-save-${Date.now()}-${index}-${Math.random().toString(16).slice(2)}`;
                const timer = setTimeout(() => {
                    pendingUpdateSaveRequests.delete(requestId);
                    resolve({ success: false, timedOut: true, title: tab.title || '' });
                }, 8000);
                pendingUpdateSaveRequests.set(requestId, {
                    resolve: (result) => {
                        clearTimeout(timer);
                        pendingUpdateSaveRequests.delete(requestId);
                        resolve(result || { success: true });
                    }
                });
                postToTab(tab, {
                    channel: 'jk-prepare-for-update',
                    requestId,
                    payload: {
                        title: tab.title || '',
                        url: getCurrentTabUrl(tab),
                        index,
                        total
                    }
                });
            });
        }

        async function prepareAllTabsForUpdate(payload = {}) {
            const tabList = Array.from(tabs.values());
            saveOpenTabsSnapshot(payload.reason || 'update-install');
            setUpdateSaveOverlay(true, 'Salvando abas abertas e rascunhos locais...');
            const results = [];
            for (let index = 0; index < tabList.length; index += 1) {
                const tab = tabList[index];
                setUpdateSaveOverlay(true, `Salvando aba ${index + 1} de ${tabList.length}: ${tab.title || 'JK Sistema'}`);
                results.push(await prepareTabForUpdate(tab, index + 1, tabList.length));
            }
            if (window.electronAPI && typeof window.electronAPI.flushBrowserSession === 'function') {
                setUpdateSaveOverlay(true, 'Gravando sessao local no disco...');
                try {
                    await window.electronAPI.flushBrowserSession();
                } catch (_err) {}
            }
            setUpdateSaveOverlay(true, 'Tudo salvo. Instalando atualizacao...');
            return { success: true, tabCount: tabList.length, results };
        }

        function restoreTabsAfterUpdate() {
            let snapshot = null;
            try {
                snapshot = JSON.parse(localStorage.getItem('jk-electron-update-tabs-v1') || 'null');
                localStorage.removeItem('jk-electron-update-tabs-v1');
            } catch (_err) {
                snapshot = null;
            }
            if (!snapshot || !Array.isArray(snapshot.tabs) || !snapshot.tabs.length) return false;
            if (Date.now() - Number(snapshot.savedAt || 0) > 12 * 60 * 60 * 1000) return false;
            const seen = new Set();
            let restoredActiveId = '';
            snapshot.tabs.forEach((item) => {
                const url = normalizeTabUrl(item.url, appUrl);
                if (!url || seen.has(url)) return;
                seen.add(url);
                const id = createTab(url, item.title || titleFromUrl(url) || 'JK Sistema');
                if (snapshot.activeUrl && sameUrlWithoutCache(snapshot.activeUrl, url)) {
                    restoredActiveId = id;
                }
            });
            if (restoredActiveId) activateTab(restoredActiveId);
            return tabs.size > 0;
        }

        window.jkElectronPrepareForUpdate = prepareAllTabsForUpdate;

        function clearTabLoadTimer(tab) {
            if (tab && tab.loadTimer) {
                clearTimeout(tab.loadTimer);
                tab.loadTimer = null;
            }
            if (tab && tab.softReadyTimer) {
                clearTimeout(tab.softReadyTimer);
                tab.softReadyTimer = null;
            }
        }

        function setTabLoadState(id, state, message = '') {
            const tab = tabs.get(id);
            if (!tab || !tab.loadState) return;
            const isActive = id === activeId;
            const show = isActive && state && state !== 'ready';
            const titleEl = tab.loadState.querySelector('.tab-load-title');
            const msgEl = tab.loadState.querySelector('.tab-load-message');
            tab.loadState.classList.toggle('is-active', !!show);
            tab.loadState.classList.toggle('has-actions', state === 'error');
            if (titleEl) {
                titleEl.textContent = state === 'error'
                    ? 'Nao foi possivel carregar esta aba'
                    : 'Carregando modulo...';
            }
            if (msgEl) {
                msgEl.textContent = message || (
                    state === 'error'
                        ? 'O backend respondeu, mas o Electron nao conseguiu renderizar a pagina. Tente recarregar a aba.'
                        : 'Aguardando resposta do sistema local.'
                );
            }
        }

        function withCacheBust(url) {
            try {
                const target = new URL(url, appUrl);
                target.searchParams.set('_jk_retry', String(Date.now()));
                return target.href;
            } catch (_err) {
                return url;
            }
        }

        function startTabLoadWatchdog(id) {
            const tab = tabs.get(id);
            if (!tab) return;
            clearTabLoadTimer(tab);
            tab.loaded = false;
            setTabLoadState(id, 'loading');
            tab.softReadyTimer = setTimeout(() => {
                const atual = tabs.get(id);
                if (!atual || atual.loaded) return;
                const currentUrl = normalizeTabUrl(atual.url || atual.webview?.src || appUrl, appUrl);
                if (/^https?:\/\/(?:127\.0\.0\.1|localhost)(?::\d+)?\//i.test(currentUrl)) {
                    markTabReady(id);
                }
            }, 4500);
            tab.loadTimer = setTimeout(() => {
                const atual = tabs.get(id);
                if (!atual || atual.loaded) return;
                if ((atual.loadRetries || 0) < TAB_MAX_AUTO_RETRIES) {
                    atual.loadRetries = (atual.loadRetries || 0) + 1;
                    const currentUrl = normalizeTabUrl(atual.url || atual.webview?.src || appUrl, appUrl);
                    if (/\/frontend_index\.html(?:[?#]|$)/i.test(currentUrl)) {
                        setTabLoadState(id, 'loading', 'Sessao salva encontrada. Abrindo painel inicial...');
                        reloadTab(id, { keepRetryCount: true, cacheBust: true, url: dashboardUrl() });
                        return;
                    }
                    setTabLoadState(id, 'loading', 'A tela demorou para responder. Tentando recarregar automaticamente...');
                    reloadTab(id, { keepRetryCount: true, cacheBust: true });
                    return;
                }
                setTabLoadState(id, 'error', 'A aba abriu, mas ficou sem conteudo renderizado. Use Atualizar para tentar novamente.');
            }, TAB_LOAD_TIMEOUT_MS);
        }

        function markTabReady(id) {
            const tab = tabs.get(id);
            if (!tab) return;
            tab.loaded = true;
            tab.loadRetries = 0;
            clearTabLoadTimer(tab);
            setTabLoadState(id, 'ready');
        }

        function reloadTab(id, options = {}) {
            const tab = tabs.get(id);
            if (!tab) return;
            if (!options.keepRetryCount) tab.loadRetries = 0;
            const requestedUrl = options.url ? normalizeTabUrl(options.url, appUrl) : '';
            const currentUrl = normalizeTabUrl(requestedUrl || tab.url || tab.webview?.src || appUrl, appUrl);
            if (requestedUrl) {
                tab.url = requestedUrl;
                setTabTitle(id, titleFromUrl(requestedUrl) || tab.title || 'JK Sistema');
            }
            const nextUrl = options.cacheBust ? withCacheBust(currentUrl) : currentUrl;
            startTabLoadWatchdog(id);
            try {
                tab.webview.src = nextUrl;
            } catch (_err) {}
        }

        function ensureMlBrowserWebview() {
            if (mlBrowserWebview && mlBrowserWebview.parentNode) return mlBrowserWebview;

            mlBrowserWebview = document.createElement('webview');
            mlBrowserWebview.className = 'ml-browser-shell-webview';
            mlBrowserWebview.setAttribute('partition', browserPartition);
            mlBrowserWebview.setAttribute('allowpopups', 'true');
            mlBrowserWebview.setAttribute('webpreferences', 'contextIsolation=yes,nodeIntegration=no');

            const sendEvent = (name, event = {}) => {
                const owner = tabs.get(mlBrowserOwnerId);
                postToTab(owner, {
                    channel: 'jk-ml-browser-event',
                    event: name,
                    url: event.url || (typeof mlBrowserWebview.getURL === 'function' ? mlBrowserWebview.getURL() : ''),
                    errorDescription: event.errorDescription || '',
                    errorCode: event.errorCode || 0
                });
            };

            mlBrowserWebview.addEventListener('dom-ready', event => sendEvent('dom-ready', event));
            mlBrowserWebview.addEventListener('did-finish-load', event => sendEvent('did-finish-load', event));
            mlBrowserWebview.addEventListener('did-navigate', event => sendEvent('did-navigate', event));
            mlBrowserWebview.addEventListener('did-navigate-in-page', event => sendEvent('did-navigate-in-page', event));
            mlBrowserWebview.addEventListener('did-fail-load', event => sendEvent('did-fail-load', event));
            mlBrowserWebview.addEventListener('new-window', (event) => {
                if (event && event.url && /^https?:\/\//i.test(event.url)) {
                    event.preventDefault();
                    mlBrowserWebview.src = event.url;
                }
            });

            viewsEl.appendChild(mlBrowserWebview);
            return mlBrowserWebview;
        }

        function positionMlBrowserForTab(source, bounds) {
            const found = findTabBySource(source);
            if (!found) return null;
            const background = !!(bounds && bounds.background);
            const frameRect = found.tab.webview.getBoundingClientRect();
            const viewsRect = viewsEl.getBoundingClientRect();
            const temBoundsValidos = !!(
                bounds &&
                Number.isFinite(Number(bounds.left)) &&
                Number.isFinite(Number(bounds.top)) &&
                Number(bounds.width) >= 20 &&
                Number(bounds.height) >= 20
            );
            const left = temBoundsValidos
                ? Math.max(0, frameRect.left - viewsRect.left + Number(bounds.left || 0))
                : Math.max(0, frameRect.left - viewsRect.left);
            const top = temBoundsValidos
                ? Math.max(0, frameRect.top - viewsRect.top + Number(bounds.top || 0))
                : Math.max(0, frameRect.top - viewsRect.top);
            const width = temBoundsValidos
                ? Math.max(80, Number(bounds.width || 0))
                : Math.max(80, Number(frameRect.width || 0));
            const height = temBoundsValidos
                ? Math.max(80, Number(bounds.height || 0))
                : Math.max(80, Number(frameRect.height || 0));
            const webview = ensureMlBrowserWebview();
            webview.style.left = `${left}px`;
            webview.style.top = `${top}px`;
            webview.style.width = `${width}px`;
            webview.style.height = `${height}px`;
            mlBrowserOwnerId = found.id;
            webview.classList.toggle('is-active', found.id === activeId && !background);
            return { found, webview };
        }

        function positionMlBrowserForTabId(id, bounds) {
            const tab = tabs.get(id);
            if (!tab || !tab.webview || !tab.webview.contentWindow) return null;
            return positionMlBrowserForTab(tab.webview.contentWindow, bounds);
        }

        function getMlBrowserBoundsForTab(tab, bounds) {
            if (!tab || !tab.webview || typeof tab.webview.getBoundingClientRect !== 'function') return null;
            const background = !!(bounds && bounds.background);
            const frameRect = tab.webview.getBoundingClientRect();
            const temBoundsValidos = !!(
                bounds &&
                Number.isFinite(Number(bounds.left)) &&
                Number.isFinite(Number(bounds.top)) &&
                Number(bounds.width) >= 20 &&
                Number(bounds.height) >= 20
            );
            return {
                bounds: {
                    x: temBoundsValidos
                        ? Math.max(0, Math.round(frameRect.left + Number(bounds.left || 0)))
                        : Math.max(0, Math.round(frameRect.left)),
                    y: temBoundsValidos
                        ? Math.max(0, Math.round(frameRect.top + Number(bounds.top || 0)))
                        : Math.max(0, Math.round(frameRect.top)),
                    width: temBoundsValidos
                        ? Math.max(80, Math.round(Number(bounds.width || 0)))
                        : Math.max(80, Math.round(Number(frameRect.width || 0))),
                    height: temBoundsValidos
                        ? Math.max(80, Math.round(Number(bounds.height || 0)))
                        : Math.max(80, Math.round(Number(frameRect.height || 0))),
                    background
                }
            };
        }

        function getMlBrowserBoundsForMainWindow(source, bounds) {
            const found = findTabBySource(source);
            if (!found) return null;
            const data = getMlBrowserBoundsForTab(found.tab, bounds);
            if (!data) return null;
            return { found, bounds: data.bounds };
        }

        function getEmbeddedMlBrowserApi() {
            const api = window.electronAPI || null;
            if (!api) return null;
            if (typeof api.showEmbeddedMlBrowser !== 'function') return null;
            if (typeof api.positionEmbeddedMlBrowser !== 'function') return null;
            if (typeof api.hideEmbeddedMlBrowser !== 'function') return null;
            if (typeof api.executeEmbeddedMlBrowser !== 'function') return null;
            return api;
        }

        function restaurarEmbeddedMlBrowserSeAtivo() {
            if (!activeId) return;
            const tabId = activeId;
            if (!mlBrowserVisibleByTab.get(tabId)) return;
            const tab = tabs.get(tabId);
            if (!tab) return;
            const boundsSalvos = mlBrowserBoundsByTab.get(tabId) || null;
            if (boundsSalvos && boundsSalvos.background) return;
            const data = getMlBrowserBoundsForTab(tab, boundsSalvos);
            if (!data || !data.bounds) return;
            const embeddedApi = getEmbeddedMlBrowserApi();
            if (embeddedApi) {
                const ownerAnterior = mlBrowserOwnerId;
                if (ownerAnterior === tabId) {
                    embeddedApi.positionEmbeddedMlBrowser(data.bounds)
                        .then(result => {
                            if (result && result.success === false) return;
                            const resultUrl = String(result && result.url || '').trim();
                            if (/^https?:\/\//i.test(resultUrl)) {
                                mlBrowserUrlByTab.set(tabId, resultUrl);
                                if (!(result && result.authFlow) && !urlEmFluxoAutenticacaoMercadoLivreShell(resultUrl)) {
                                    mlBrowserRestorableUrlByTab.set(tabId, resultUrl);
                                }
                            }
                        })
                        .catch(() => {});
                    return;
                }
                const url = mlBrowserRestorableUrlByTab.get(tabId);
                if (!url) return;
                embeddedApi.showEmbeddedMlBrowser(url, data.bounds)
                    .then(result => {
                        const bloqueadoPorAuthDeOutraAba = !!(
                            ownerAnterior
                            && ownerAnterior !== tabId
                            && result
                            && (result.authFlow || result.preservedAuthFlow)
                        );
                        if (bloqueadoPorAuthDeOutraAba) {
                            reposicionarEmbeddedMlBrowserParaDono(ownerAnterior, embeddedApi);
                            return;
                        }
                        if (result && result.success === false) return;
                        mlBrowserOwnerId = tabId;
                        const resultUrl = String(result && result.url || '').trim();
                        if (/^https?:\/\//i.test(resultUrl)) {
                            mlBrowserUrlByTab.set(tabId, resultUrl);
                            if (!(result && result.authFlow) && !urlEmFluxoAutenticacaoMercadoLivreShell(resultUrl)) {
                                mlBrowserRestorableUrlByTab.set(tabId, resultUrl);
                            }
                        }
                    })
                    .catch(() => {});
                return;
            }
            const url = mlBrowserRestorableUrlByTab.get(tabId);
            if (!url) return;
            const positioned = positionMlBrowserForTabId(tabId, mlBrowserBoundsByTab.get(tabId) || null);
            if (!positioned || !positioned.webview) return;
            const currentUrl = typeof positioned.webview.getURL === 'function'
                ? positioned.webview.getURL()
                : positioned.webview.src;
            if (currentUrl !== url) {
                positioned.webview.src = url;
            }
        }

        function hideMlBrowserShell() {
            if (mlBrowserWebview) mlBrowserWebview.classList.remove('is-active');
        }

        function hideEmbeddedMlBrowserShell(options = {}) {
            const embeddedApi = getEmbeddedMlBrowserApi();
            if (!embeddedApi) return;
            embeddedApi.hideEmbeddedMlBrowser(options || {}).catch(() => {});
        }

        function reposicionarEmbeddedMlBrowserParaDono(ownerId, embeddedApi = getEmbeddedMlBrowserApi()) {
            if (!ownerId || !embeddedApi || typeof embeddedApi.positionEmbeddedMlBrowser !== 'function') return;
            const ownerTab = tabs.get(ownerId);
            if (!ownerTab) return;
            const ownerBounds = mlBrowserBoundsByTab.get(ownerId) || null;
            const ownerData = getMlBrowserBoundsForTab(ownerTab, ownerBounds);
            if (!ownerData || !ownerData.bounds) return;
            embeddedApi.positionEmbeddedMlBrowser(ownerData.bounds).catch(() => {});
        }

        function updateVisibleState() {
            const hasTabs = tabs.size > 0;
            emptyEl.classList.toggle('is-active', !hasTabs);
            homeBtn.disabled = !hasTabs;
            backBtn.disabled = !hasTabs;
            reloadBtn.disabled = !hasTabs;
            tabs.forEach((tab, id) => {
                const active = id === activeId;
                tab.button.classList.toggle('is-active', active);
                tab.webview.classList.toggle('is-active', active);
                if (tab.loadState) {
                    tab.loadState.classList.toggle('is-active', active && !tab.loaded);
                }
            });
            notifyRustDeskTabVisibility();
            if (isActiveRustDeskTab()) {
                window.clearTimeout(rustDeskShellHideTimer);
            } else {
                scheduleRustDeskShellHide('no-active-rustdesk-tab');
            }
            const activeMlBounds = activeId ? mlBrowserBoundsByTab.get(activeId) : null;
            const activeMlBackground = !!(activeMlBounds && activeMlBounds.background);
            const activeHasMlState = !!(activeId && mlBrowserUrlByTab.get(activeId));
            const activeMlVisible = !!(activeId && mlBrowserVisibleByTab.get(activeId));
            if (mlBrowserWebview) {
                mlBrowserWebview.classList.toggle('is-active', !!activeHasMlState && activeMlVisible && !activeMlBackground);
            }
            const embeddedApi = getEmbeddedMlBrowserApi();
            if ((!activeHasMlState || !activeMlVisible || activeMlBackground) && embeddedApi) {
                hideEmbeddedMlBrowserShell();
                hideMlBrowserShell();
            } else {
                restaurarEmbeddedMlBrowserSeAtivo();
            }
        }

        function activateTab(id) {
            if (!tabs.has(id)) return;
            activeId = id;
            const tab = tabs.get(id);
            document.title = `${tab.title || 'JK Sistema'} - JK Sistema`;
            updateVisibleState();
            showTabsToolbar(1400);
        }

        function closeTab(id) {
            const tab = tabs.get(id);
            if (!tab) return;
            if (isRustDeskTab(tab)) {
                const anotherRustDesk = hasAnotherRustDeskTab(id);
                postToTab(tab, {
                    channel: 'jk-rustdesk-tab-visibility',
                    active: false,
                    payload: {
                        closing: true,
                        frame: tabFrameBounds(tab, id),
                        anotherRustDeskActive: anotherRustDesk
                    }
                });
                if (!anotherRustDesk) {
                    hideRustDeskFromShell('rustdesk-tab-close');
                }
            }
            if (mlBrowserOwnerId === id) {
                mlBrowserOwnerId = '';
                hideEmbeddedMlBrowserShell({ destroy: true, reason: 'tab-close' });
                hideMlBrowserShell();
            }
            mlBrowserBoundsByTab.delete(id);
            mlBrowserUrlByTab.delete(id);
            mlBrowserRestorableUrlByTab.delete(id);
            mlBrowserVisibleByTab.delete(id);
            clearTabLoadTimer(tab);
            tab.button.remove();
            tab.webview.remove();
            if (tab.loadState) tab.loadState.remove();
            tabs.delete(id);
            if (activeId === id) {
                const last = Array.from(tabs.keys()).pop();
                activeId = last || '';
            }
            updateVisibleState();
            showTabsToolbar(1200);
        }

        function createTab(url, title = 'JK Sistema', options = {}) {
            const targetUrl = String(url || appUrl);
            if (isRustDeskUrl(targetUrl, title)) {
                const existingRustDesk = findRustDeskTab();
                if (existingRustDesk) {
                    dedupeRustDeskTabs(existingRustDesk.id);
                    if (!sameUrlWithoutCache(existingRustDesk.tab.url || existingRustDesk.tab.webview?.src || '', targetUrl)) {
                        reloadTab(existingRustDesk.id, { url: targetUrl });
                        setTabTitle(existingRustDesk.id, title || existingRustDesk.tab.title || 'Acesso Remoto');
                    }
                    activateTab(existingRustDesk.id);
                    return existingRustDesk.id;
                }
            }
            if (options.reuseExisting) {
                for (const [id, tab] of tabs) {
                    if (sameUrlWithoutCache(tab.url, targetUrl)) {
                        activateTab(id);
                        return id;
                    }
                }
            }

            const id = `tab-${Date.now()}-${++serial}`;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'tab';
            button.innerHTML = '<span class="tab-icon" aria-hidden="true"></span><span class="tab-title"></span><span class="tab-close" title="Fechar aba" aria-label="Fechar aba">x</span>';
            bindTabDragHandlers(button, id);
            button.addEventListener('click', () => {
                if (button.dataset.dragSuppress === '1') return;
                activateTab(id);
            });
            button.querySelector('.tab-close').addEventListener('click', (event) => {
                event.stopPropagation();
                closeTab(id);
            });

            const webview = document.createElement('iframe');
            webview.className = 'tab-view';
            webview.setAttribute('allow', 'camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; fullscreen');
            const loadState = document.createElement('div');
            loadState.className = 'tab-load-state';
            loadState.innerHTML = `
                <div class="tab-load-box">
                    <div class="tab-load-title">Carregando modulo...</div>

                        <button type="button" class="tab-load-action" data-action="home">Abrir inicio</button>
                    </div>
                </div>
            `;
            loadState.addEventListener('click', (event) => {
                const action = event.target && event.target.dataset ? event.target.dataset.action : '';
                if (action === 'reload') {
                    reloadTab(id, { cacheBust: true });
                } else if (action === 'home') {
                    navigateActiveTab(dashboardUrl(), 'Inicio');
                }
            });
            webview.addEventListener('load', () => {
                const tab = tabs.get(id);
                if (!tab) return;
                markTabReady(id);
                const frameTitle = titleFromFrame(webview);
                if (frameTitle) setTabTitle(id, frameTitle);
            });
            webview.addEventListener('error', () => {
                clearTabLoadTimer(tabs.get(id));
                setTabLoadState(id, 'error', 'O Electron recebeu erro ao carregar a pagina desta aba.');
            });

            tabs.set(id, { id, title: normalizeTitle(title), url: targetUrl, button, webview, loadState, loaded: false, loadRetries: 0, loadTimer: null, softReadyTimer: null });
            tabsEl.appendChild(button);
            viewsEl.appendChild(webview);
            viewsEl.appendChild(loadState);
            setTabTitle(id, title);
            activateTab(id);
            startTabLoadWatchdog(id);
            webview.src = targetUrl;
            return id;
        }

        function reloadActiveTab() {
            const tab = tabs.get(activeId);
            if (!tab) return;
            reloadTab(activeId, { cacheBust: true });
        }

        function dashboardUrl() {
            try {
                return new URL('/dashboard.html', appUrl).href;
            } catch (_err) {
                return appUrl;
            }
        }

        function navigateActiveTab(url, title = '') {
            const targetUrl = normalizeTabUrl(url, appUrl);
            const tab = tabs.get(activeId);
            if (!tab) {
                createTab(targetUrl, title || titleFromUrl(targetUrl) || 'Inicio');
                return;
            }
            tab.url = targetUrl;
            if (title) setTabTitle(activeId, title);
            startTabLoadWatchdog(activeId);
            try {
                tab.webview.src = targetUrl;
            } catch (_err) {}
        }

            navigateActiveTab(dashboardUrl(), 'Inicio');
        }

        function goBackActiveTab() {

        window.addEventListener('message', (event) => {
            const data = event && event.data ? event.data : {};
            if (!data || typeof data !== 'object') return;

                                ...resultado
                            }, '*');
                        }

                }
                return;
            }

            if (data.channel === 'jk-choose-display-media-source') {
                const requestId = data.requestId || '';
                const sourceWindow = event.source;
                const responder = (resultado) => {
                    try {
                        if (sourceWindow && typeof sourceWindow.postMessage === 'function') {

                            }, '*');

                }
                return;
            }

            if (
                data.channel === 'jk-favoritos-worker-enable'
                || data.channel === 'jk-favoritos-worker-progress'

            ) {

                    action

                        .then(result => {

                                        event: 'did-fail-load',
                                        url: result.url || requestedUrl,

                                        errorCode: -1

                                return;

                            const resultUrl = String(result && result.url || '').trim();
                            const previousUrl = mlBrowserUrlByTab.get(embedded.found.id) || '';
                            if (/^https?:\/\//i.test(resultUrl)) {
                                mlBrowserUrlByTab.set(embedded.found.id, resultUrl);
                                if (!(result && result.authFlow) && !urlEmFluxoAutenticacaoMercadoLivreShell(resultUrl)) {

                        })
                        .catch(err => {
                            postToTab(embedded.found.tab, {
                                channel: 'jk-ml-browser-event',
                                event: 'did-fail-load',
                                url: payload.url || '',
                                errorDescription: err && err.message ? err.message : String(err),
                                errorCode: -1
                            });
                        });
                    return;
                }
                const positioned = positionMlBrowserForTab(event.source, boundsPayload);

                    if (payload.url && /^https?:\/\//i.test(payload.url)) {

                }
                if (!positioned && data.channel === 'jk-ml-browser-show') {

                if (found) {

                    if (payload.destroy || payload.unload) {
                        mlBrowserBoundsByTab.delete(found.id);
                        mlBrowserUrlByTab.delete(found.id);
                        mlBrowserRestorableUrlByTab.delete(found.id);
                    }
                } else if (mlBrowserOwnerId) {
                    mlBrowserVisibleByTab.set(mlBrowserOwnerId, false);
                    if (payload.destroy || payload.unload) {
                        mlBrowserBoundsByTab.delete(mlBrowserOwnerId);
                        mlBrowserUrlByTab.delete(mlBrowserOwnerId);
                        mlBrowserRestorableUrlByTab.delete(mlBrowserOwnerId);
                    }
                }
                if (found && found.id === mlBrowserOwnerId) {

                        ...(payload || {}),

                    };
                    if (payload.destroy || payload.unload) {

            }

            function restaurarMlBrowserParaComando(found, embeddedApi) {
                if (!found || !embeddedApi) return Promise.resolve(false);
                if (found.id !== mlBrowserOwnerId && !mlBrowserUrlByTab.has(found.id) && mlBrowserOwnerId) {
                    return Promise.resolve(false);
                }
                const ownerAnterior = mlBrowserOwnerId;
                const donoMudou = !!ownerAnterior && ownerAnterior !== found.id;
                const boundsSalvos = mlBrowserBoundsByTab.get(found.id) || null;
                const urlSalva = mlBrowserRestorableUrlByTab.get(found.id) || '';
                if (!mlBrowserVisibleByTab.has(found.id)) {
                    mlBrowserVisibleByTab.set(found.id, true);
                }
                const dataBounds = getMlBrowserBoundsForTab(found.tab, boundsSalvos);
                if (!dataBounds || !dataBounds.bounds) return Promise.resolve(!donoMudou);
                const restaurarUrlDaAba = (forcar = false) => {
                    if ((!donoMudou && !forcar) || !urlSalva || typeof embeddedApi.showEmbeddedMlBrowser !== 'function') {

                            const resultUrl = String(result && result.url || '').trim();

                            return true;

                        .catch(() => false);

                    return restaurarUrlDaAba(true);
                }
                return embeddedApi.positionEmbeddedMlBrowser(dataBounds.bounds)
                    .then(result => {
                        const currentUrl = String(result && result.url || '').trim();
                        const authFlow = !!(result && result.authFlow)
                            || urlEmFluxoAutenticacaoMercadoLivreShell(currentUrl);

                        .then((podeExecutar) => {

                        .then(result => {

                        .catch(err => {

                        .then(result => responder({ result }))

                        .then((podeClicar) => {
                            if (!podeClicar) {

                            }
                            return embeddedApi.clickEmbeddedMlBrowser(point);

                        .then(result => responder({ result }))
                        .catch(err => responder({
                            error: err && err.message ? err.message : String(err)
                        }));

                }

                        .then(result => responder({ result }))
                        .catch(err => responder({

                        }));

                }

                        .then((podeDigitar) => {

                })()
                    .then(result => responder({ result }))
                    .catch(err => responder({ error: err && err.message ? err.message : String(err) }));
                return;
            }

            if (data.channel === 'jk-open-module-tab') {
                const payload = data.payload || {};
                if (payload.url) createTab(payload.url, payload.title || 'Modulo', { reuseExisting: true });
                return;
            }

            if (data.channel === 'jk-native-window-handle-request') {
                const requestId = data.requestId || data.payload?.requestId || '';
                const reply = (payload) => {
                    try {
                        event.source?.postMessage({
                            channel: 'jk-native-window-handle-response',
                            requestId,
                            payload
                        }, '*');
                    } catch (_err) {}
                };
                if (!window.electronAPI || typeof window.electronAPI.getNativeWindowHandle !== 'function') {
                    reply({ success: false, message: 'Electron API indisponivel.' });
                    return;
                }
                window.electronAPI.getNativeWindowHandle()
                    .then((result) => reply(result || { success: false, message: 'Handle indisponivel.' }))
                    .catch((err) => reply({ success: false, message: err && err.message ? err.message : String(err) }));
                return;
            }

            if (data.channel === 'jk-tab-frame-bounds-request') {
                const requestId = data.requestId || data.payload?.requestId || '';
                const found = findTabBySource(event.source);
                const reply = (payload) => {
                    try {
                        event.source?.postMessage({
                            channel: 'jk-tab-frame-bounds-response',
                            requestId,
                            payload
                        }, '*');
                    } catch (_err) {}
                };
                if (!found) {
                    reply({ success: false, message: 'Aba nao encontrada.' });
                    return;
                }
                const frame = tabFrameBounds(found.tab, found.id);
                reply({
                    success: !!frame,
                    frame,
                    active: found.id === activeId
                });
                return;
            }

            if (data.channel === 'jk-rustdesk-in-app-request') {
                const requestId = data.requestId || data.payload?.requestId || '';
                const payload = data.payload || {};
                const action = payload.action === 'hide' ? 'hide' : (payload.action === 'dock' ? 'dock' : 'open');
                const reply = (result) => {
                    try {
                        event.source?.postMessage({
                            channel: 'jk-rustdesk-in-app-response',
                            requestId,
                            payload: result
                        }, '*');
                    } catch (_err) {}
                };
                const api = window.electronAPI || null;
                const method = action === 'hide'
                    ? api?.hideRustDeskInApp
                    : (action === 'dock' ? api?.dockRustDeskInApp : api?.openRustDeskInApp);
                if (typeof method !== 'function') {
                    reply({ success: false, message: 'Electron API do Acesso Remoto indisponivel.' });
                    return;
                }
                method(payload.dockPayload || {}, payload.authToken || '')
                    .then((result) => reply(result || { success: false, message: 'Resposta vazia do Electron.' }))
                    .catch((err) => reply({ success: false, message: err && err.message ? err.message : String(err) }));
                return;
            }

            if (data.channel === 'jk-tab-title') {
                const payload = data.payload || {};
                const incomingTitle = payload.title || data.title || '';
                let handled = false;
                for (const [id, tab] of tabs) {
                    if (tab.webview && tab.webview.contentWindow === event.source) {
                        markTabReady(id);
                        if (payload.url) tab.url = normalizeTabUrl(payload.url, tab.url);
                        setTabTitle(id, incomingTitle || titleFromUrl(tab.url) || tab.title);
                        handled = true;
                        break;
                    }
                }
                return;
            }

            if (data.channel === 'jk-page-ready') {
                const found = findTabBySource(event.source);
                if (found) {
                    markTabReady(found.id);
                    const payload = data.payload || {};
                    if (payload.url) found.tab.url = normalizeTabUrl(payload.url, found.tab.url);
                    if (payload.title) setTabTitle(found.id, payload.title);
                }
            }
        });

        homeBtn.addEventListener('click', goHomeActiveTab);
        backBtn.addEventListener('click', goBackActiveTab);
        reloadBtn.addEventListener('click', reloadActiveTab);
        newTabBtn.addEventListener('click', () => createTab(appUrl, 'Inicio'));
        bindAutoHidingToolbar();
        bindAutoUpdateStatusToast();
        window.addEventListener('keydown', (event) => {
            if (event.key === 'F5' || ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 'r')) {
                event.preventDefault();
                reloadActiveTab();
            }
        });

        if (!restoreTabsAfterUpdate()) {
            createTab(appUrl, 'Inicio');
        }
    </script>
</body>
</html>
