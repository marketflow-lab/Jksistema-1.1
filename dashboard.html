<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JK Sistema</title>
    <script>
        (function () {
            const ua = navigator.userAgent || '';
            const mobileUa = /Android|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobile/i.test(ua);
            const compactScreen = window.matchMedia('(max-width: 920px)').matches;
            const touch = (navigator.maxTouchPoints || 0) > 0;
            window.__JK_DASHBOARD_MOBILE__ = mobileUa || (touch && compactScreen);
        })();
    </script>
    <style>
        @property --neon-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        :root {
            --bg: #070c14;
            --bg-alt: #0f1a2a;
            --card: #161925;
            --card-hover: #1b2232;
            --border: #2f3d56;
            --text: #e5e5e5;
            --muted: #b9c9df;
            --accent: #4facfe;
            --accent-hover: #3b8de0;
            --danger: #ff6b6b;
            --danger-hover: #e15757;
            --module-glow: rgba(79, 172, 254, 0.18);
        }

        body.dashboard-preload {
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 32px 20px;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 8%, rgba(79, 172, 254, 0.16), transparent 34%),
                radial-gradient(circle at 85% 12%, rgba(53, 182, 166, 0.11), transparent 30%),
                linear-gradient(145deg, var(--bg), #0b1320 58%, var(--bg-alt));
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .user-sidebar {
            position: fixed;
            left: 0;
            top: 20px;
            bottom: 20px;
            width: 224px;
            max-height: calc(100vh - 40px);
            box-sizing: border-box;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px 16px;
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border: 1px solid rgba(127, 188, 255, 0.24);
            border-left: 0;
            border-radius: 0 16px 16px 0;
            background: linear-gradient(180deg, rgba(11, 24, 43, 0.94), rgba(8, 17, 32, 0.96));
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(10px);
            transform: translateX(-202px);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            pointer-events: none;
        }

        .user-sidebar::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .user-sidebar.open {
            transform: translateX(0);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.44);
            pointer-events: auto;
        }

        .user-sidebar-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 14px;
            z-index: 45;
            background: transparent;
        }

        .user-sidebar-peek {
            position: absolute;
            right: 0;
            top: 50%;
            width: 22px;
            min-height: 108px;
            display: grid;
            place-items: center;
            color: #9bd1ff;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            writing-mode: vertical-rl;
            text-transform: uppercase;
            transform: translateY(-50%);
            border-left: 1px solid rgba(127, 188, 255, 0.22);
            background: rgba(79, 172, 254, 0.08);
            pointer-events: none;
        }

        .user-sidebar.open .user-sidebar-peek {
            opacity: 0;
        }

        .user-sidebar-brand {
            color: #9bd1ff;
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .user-sidebar-profile {
            display: grid;
            gap: 10px;
            min-width: 0;
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            color: #06111f;
            background: linear-gradient(135deg, #62d6ff, #61e2ad);
            font-weight: 900;
            font-size: 1.1rem;
            box-shadow: 0 10px 24px rgba(79, 172, 254, 0.22);
        }

        .user-name {
            margin: 0;
            color: #f4f9ff;
            font-size: 1.02rem;
            font-weight: 850;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .user-email {
            margin: 3px 0 0;
            color: rgba(217, 234, 255, 0.74);
            font-size: 0.78rem;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .user-sidebar-details {
            display: grid;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.09);
        }

        .user-info-row {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

        .user-info-label {
            color: rgba(155, 209, 255, 0.78);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .user-info-value {
            color: #eef7ff;
            font-size: 0.84rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-machine-online-list {
            display: grid;
            gap: 5px;
            margin-top: 2px;
            max-height: 92px;
            overflow: hidden;
        }

        .user-machine-online-item {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            padding: 5px 6px;
            border: 1px solid rgba(97, 226, 173, 0.22);
            border-radius: 8px;
            background: rgba(97, 226, 173, 0.08);
            color: #dff8ef;
            font-size: 0.72rem;
            line-height: 1.2;
        }

        .user-machine-online-dot {
            width: 7px;
            height: 7px;
            flex: 0 0 auto;
            border-radius: 99px;
            background: #61e2ad;
            box-shadow: 0 0 10px rgba(97, 226, 173, 0.75);
        }

        .user-machine-online-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-machine-online-tag {
            flex: 0 0 auto;
            color: #9bd1ff;
            font-size: 0.66rem;
            font-weight: 800;
        }

        .user-sidebar-spacer {
            flex: 1;
        }

        .user-sidebar .sidebar-logout {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.18);
        }

        .user-sidebar-actions {
            display: grid;
            gap: 8px;
            flex: 0 0 auto;
        }

        .user-sidebar-actions button {
            width: 100%;
        }

        body::selection {
            background: rgba(79, 172, 254, 0.3);
            color: #fff;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.28;
        }

        body::before {
            top: -120px;
            left: -80px;
            background: rgba(79, 172, 254, 0.55);
        }

        body::after {
            bottom: -130px;
            right: -90px;
            background: rgba(190, 135, 255, 0.45);
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            transition: opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
        }

        body.dashboard-preload .container {
            opacity: 0;
            transform: translateY(16px);
            filter: blur(8px);
        }

        .hero {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: #9bd1ff;
            margin: 0;
            font-size: clamp(1.7rem, 2.8vw, 2.4rem);
            letter-spacing: 0.4px;
            text-shadow: 0 6px 20px rgba(79, 172, 254, 0.2);
        }

        .subtitle {
            margin: 8px auto 0;
            color: var(--muted);
            font-size: 0.98rem;
            max-width: 720px;
            line-height: 1.4;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .card {
            --module: var(--accent);
            --module-soft: rgba(79, 172, 254, 0.28);
            --module-glow: rgba(79, 172, 254, 0.18);
            --module-alt: #cfe8ff;
            --neon-angle: 0deg;
            --neon-a: rgba(0, 191, 255, 0);
            --neon-b: rgba(102, 214, 255, 0);
            background:
                radial-gradient(circle at 100% -10%, var(--module-glow), transparent 44%),
                linear-gradient(180deg, rgba(18, 27, 42, 0.95), rgba(14, 23, 37, 0.96)) padding-box,
                conic-gradient(
                    from var(--neon-angle),
                    transparent 0deg 58deg,
                    var(--neon-b) 76deg,
                    var(--neon-a) 90deg,
                    var(--neon-b) 104deg,
                    transparent 122deg 238deg,
                    var(--neon-b) 256deg,
                    var(--neon-a) 270deg,
                    var(--neon-b) 284deg,
                    transparent 302deg 360deg
                ) border-box;
            border: 1px solid transparent;
            padding: 12px 16px;
            border-radius: 13px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            text-align: center;
            cursor: pointer;
            transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            will-change: transform;
            opacity: 1;
            isolation: isolate;
        }

        .card::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--module), transparent);
            opacity: 0.9;
            z-index: 0;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 0;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.035);
            --neon-a: rgba(0, 191, 255, 1);
            --neon-b: rgba(102, 214, 255, 0.92);
            background:
                radial-gradient(circle at 100% -10%, var(--module-glow), transparent 40%),
                linear-gradient(180deg, var(--card-hover), rgba(22, 34, 51, 0.98)) padding-box,
                conic-gradient(
                    from var(--neon-angle),
                    transparent 0deg 58deg,
                    var(--neon-b) 76deg,
                    var(--neon-a) 90deg,
                    var(--neon-b) 104deg,
                    transparent 122deg 238deg,
                    var(--neon-b) 256deg,
                    var(--neon-a) 270deg,
                    var(--neon-b) 284deg,
                    transparent 302deg 360deg
                ) border-box;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.34), 0 0 0 1px var(--module-soft), 0 0 18px var(--module-glow), 0 0 22px rgba(0, 191, 255, 0.2);
            z-index: 2;
                animation: ringRotate 1.2s linear infinite;
        }

        .card-head {
            display: grid;
            grid-template-columns: 38px 1fr;
            align-items: center;
            gap: 8px;
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            border: 1px solid var(--module-soft);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .card-title {
            text-align: left;
        }

        .card h2 {
            margin: 0;
            color: var(--module);
            font-size: 1.42rem;
            line-height: 1.2;
            letter-spacing: 0.2px;
            text-wrap: balance;
            text-shadow: 0 2px 12px var(--module-glow);
        }

        .card p {
            color: var(--muted);
            margin: 6px 0 0;
            font-size: 0.9rem;
            line-height: 1.38;
            text-wrap: balance;
            text-align: left;
        }

        .dashboard-empty-state {
            grid-column: 1 / -1;
            display: grid;
            justify-items: start;
            gap: 14px;
            color: var(--muted);
            font-size: 1.02rem;
            line-height: 1.45;
        }

        .dashboard-empty-state p {
            margin: 0;
        }

        .dashboard-empty-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logout {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 11px 24px;
            background: linear-gradient(100deg, var(--danger), #ff8e8e);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(255, 107, 107, 0.24);
        }

        button:hover {
            background: linear-gradient(100deg, var(--danger-hover), #ff7777);
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(255, 107, 107, 0.3);
        }

        .sidebar-admin-users,
        .sidebar-password,
        .sidebar-update,
        .sidebar-import-credentials,
        .sidebar-drive-sync,
        .modal-secondary {
            background: rgba(79, 172, 254, 0.12);
            color: #d9ecff;
            border-color: rgba(127, 188, 255, 0.34);
            box-shadow: none;
        }

        .sidebar-admin-users:hover,
        .sidebar-password:hover,
        .sidebar-update:hover,
        .sidebar-import-credentials:hover,
        .sidebar-drive-sync:hover,
        .modal-secondary:hover {
            background: rgba(79, 172, 254, 0.2);
            box-shadow: 0 10px 22px rgba(79, 172, 254, 0.14);
        }

        .password-modal {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(3, 8, 17, 0.72);
            backdrop-filter: blur(4px);
        }

        .password-modal.open {
            display: flex;
        }

        .password-card {
            width: min(430px, calc(100vw - 32px));
            border: 1px solid rgba(127, 188, 255, 0.28);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(13, 28, 50, 0.98), rgba(8, 17, 32, 0.98));
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }

        .password-card h2 {
            margin: 0 0 14px;
            color: #9bd1ff;
            font-size: 1.24rem;
        }

        .password-card label {
            display: grid;
            gap: 6px;
            margin-top: 12px;
            color: rgba(217, 234, 255, 0.8);
            font-size: 0.84rem;
            font-weight: 800;
        }

        .password-card input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(127, 188, 255, 0.28);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #f4f9ff;
            padding: 11px 12px;
            outline: none;
        }

        .password-card input:focus {
            border-color: rgba(79, 172, 254, 0.78);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.14);
        }

        .password-message {
            min-height: 18px;
            margin: 12px 0 0;
            color: #ffb0b0;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .password-message.success {
            color: #7ee8b2;
        }

        .password-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes ringRotate {
            from { --neon-angle: 0deg; }
            to { --neon-angle: 360deg; }
        }

        @media (max-width: 720px) {
            body {
                padding: 22px 14px;
            }

            .user-sidebar {
                position: relative;
                left: auto;
                top: auto;
                bottom: auto;
                width: auto;
                transform: none;
                pointer-events: auto;
                margin: 0 auto 16px;
                max-width: 1160px;
                max-height: none;
                overflow: visible;
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
            }

            .user-sidebar-trigger {
                display: none;
            }

            .user-sidebar-profile {
                grid-template-columns: 44px minmax(0, 1fr);
                align-items: center;
            }

            .user-avatar {
                width: 44px;
                height: 44px;
                border-radius: 12px;
            }

            .user-sidebar-brand,
            .user-sidebar-details,
            .user-sidebar-spacer,
            .user-sidebar-peek {
                display: none;
            }

            .user-sidebar .sidebar-logout {
                width: auto;
                min-width: 84px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .card {
                padding: 10px 12px;
            }

            .card h2 {
                font-size: 1.24rem;
            }

            .card-head {
                grid-template-columns: 36px 1fr;
                gap: 8px;
            }

            .card-icon {
                width: 36px;
                height: 36px;
                border-radius: 9px;
            }
        }

        body.modo-mobile {
            padding: 14px 10px 22px;
        }

        body.modo-mobile .user-sidebar {
            position: relative;
            left: auto;
            top: auto;
            bottom: auto;
            width: auto;
            transform: none;
            pointer-events: auto;
            margin: 0 0 14px;
            max-height: none;
            overflow: visible;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            padding: 14px;
        }

        body.modo-mobile .user-sidebar-trigger {
            display: none;
        }

        body.modo-mobile .user-sidebar-profile {
            grid-template-columns: 42px minmax(0, 1fr);
            align-items: center;
        }

        body.modo-mobile .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 1rem;
        }

        body.modo-mobile .user-sidebar-brand,
        body.modo-mobile .user-sidebar-details,
        body.modo-mobile .user-sidebar-spacer,
        body.modo-mobile .user-sidebar-peek {
            display: none;
        }

        body.modo-mobile .user-sidebar .sidebar-logout {
            width: auto;
            min-width: 78px;
            min-height: 40px;
            font-size: 0.86rem;
        }

        body.modo-mobile .hero {
            margin-bottom: 16px;
            text-align: left;
            padding: 0 4px;
        }

        body.modo-mobile h1 {
            font-size: 1.45rem;
            line-height: 1.2;
        }

        body.modo-mobile .subtitle {
            font-size: 0.9rem;
            margin-top: 6px;
            text-align: left;
        }

        body.modo-mobile .grid {
            grid-template-columns: 1fr;
            gap: 7px;
        }

        body.modo-mobile .card {
            padding: 9px 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
        }

        body.modo-mobile .card:hover {
            transform: none;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            animation: none;
        }

        body.modo-mobile .card h2 {
            font-size: 1.18rem;
        }

        body.modo-mobile .card p {
            font-size: 0.84rem;
            margin-top: 5px;
        }

        body.modo-mobile .logout {
            margin-top: 18px;
            position: sticky;
            bottom: 10px;
            z-index: 5;
        }

        body.modo-mobile .logout button {
            width: 100%;
            max-width: 100%;
            min-height: 46px;
            font-size: 0.98rem;
        }

        body:not(.modo-mobile) .user-sidebar {
            transform: translate3d(-224px, 0, 0) !important;
            pointer-events: none !important;
        }

        body:not(.modo-mobile).sidebar-open .user-sidebar {
            transform: translate3d(0, 0, 0) !important;
            pointer-events: auto !important;
        }

        body:not(.modo-mobile).sidebar-open .user-sidebar-peek {
            opacity: 0;
        }

        .dashboard-status-balloon {
            position: fixed;
            right: 92px;
            bottom: 22px;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 8px;
            width: min(340px, calc(100vw - 116px));
            padding: 9px 11px;
            color: #eaf6ff;
            background: rgba(8, 23, 41, 0.9);
            border: 1px solid rgba(96, 184, 255, 0.32);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
            transform: translate3d(0, 0, 0);
            opacity: 1;
            visibility: visible;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0s;
        }

        .dashboard-status-balloon.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 8px, 0);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s;
        }

        .dashboard-status-icon {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(79, 172, 254, 0.16);
            box-shadow: inset 0 0 0 1px rgba(145, 208, 255, 0.28);
        }

        .dashboard-status-icon::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.26);
            border-top-color: #ffffff;
            animation: dashboardStatusSpin 0.8s linear infinite;
        }

        .dashboard-status-balloon.is-success {
            border-color: rgba(79, 230, 174, 0.55);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        }

        .dashboard-status-balloon.is-error {
            border-color: rgba(255, 116, 116, 0.62);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.3);
        }

        .dashboard-status-balloon.is-info .dashboard-status-icon::before,
        .dashboard-status-balloon.is-error .dashboard-status-icon::before {

<script>
    if (window.__JK_DASHBOARD_MOBILE__) {
        document.body.classList.add('modo-mobile');
    }

    function finalizarEntradaDashboard() {
        if (!document.body) return;
        document.body.classList.add('dashboard-ready', 'jk-page-ready');
        document.body.classList.remove('dashboard-preload', 'jk-page-preload', 'jk-page-leaving');
    }

    function safeJsonParse(value, fallback) {
        try {
            return JSON.parse(value);
        } catch (_e) {
            return fallback;
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', finalizarEntradaDashboard, { once: true });
    } else {
        finalizarEntradaDashboard();
    }
    window.addEventListener('pageshow', finalizarEntradaDashboard);
    window.addEventListener('load', () => setTimeout(finalizarEntradaDashboard, 80), { once: true });
    setTimeout(finalizarEntradaDashboard, 250);
    setTimeout(finalizarEntradaDashboard, 1200);

    if (!verificarSessao()) {
        // verificarSessao já redireciona quando não há token.
    }

    let userData = safeJsonParse(localStorage.getItem('user_data') || 'null', null);
    let permissions = safeJsonParse(localStorage.getItem('permissions') || '{}', {});
    const APP_VERSION_FALLBACK = '1.0.26';
    let appVersionAtual = APP_VERSION_FALLBACK;

    if (!userData) {
        window.location.href = 'frontend_index.html';
    }

    async function atualizarSessaoDashboard() {
        const token = obterToken();
        if (!token || !userData) return;
        const permissoesAtuais = JSON.stringify(permissions || {});
        const usuarioAtual = JSON.stringify(userData || {});
        const machineId = encodeURIComponent(userData.machine_id || '');
        try {
            const resp = await fetch(`/api/auth/me?machine_id=${machineId}&_=${Date.now()}`, {
                cache: 'no-store',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || data.success === false) return;
            if (data.access_token) localStorage.setItem('access_token', data.access_token);
            if (data.user_data) {
                userData = data.user_data;
                localStorage.setItem('user_data', JSON.stringify(data.user_data));
            }
            if (data.permissions) {
                const novasPermissoes = JSON.stringify(data.permissions || {});
                permissions = data.permissions || {};
                localStorage.setItem('permissions', novasPermissoes);
                if (novasPermissoes !== permissoesAtuais || JSON.stringify(userData || {}) !== usuarioAtual) {
                    atualizarModuloDashboard();
                    preencherSidebarUsuario();
                    atualizarMaquinasOnlineSidebar();
                }
            }
        } catch (_err) {}
    }

    document.body.classList.remove('dashboard-preload');
    document.body.classList.add('dashboard-ready');

    const modules = [
        { key: 'analise_promo', href: 'frontend_promo.html', title: '📈 Promoção ML', desc: 'Análise de campanhas e cálculo de taxas.' },
        { key: 'renovacao_fixa', href: 'renovacao.html', title: '🔄 Renovação Fixa', desc: 'Comparar e renovar campanhas.' },
        { key: 'anuncios_ml', href: 'anunciosml.html', title: '📦 Anúncios ML', desc: 'Gestão de anúncios no Mercado Livre.' },
        { key: 'etiquetas', href: 'frontend_etiquetas.html', title: '🏷️ Etiquetas', desc: 'Gerador de etiquetas (ML, Shopee, TikTok).' },
        { key: 'integracao', href: 'integracoes.html', title: '🔗 Integrações', desc: 'Gerenciar conexões com Bling, ML, etc.' },
        { key: 'cadastro', href: 'cadastro.html', title: '🧾 Cadastro', desc: 'Cadastro manual de produtos.' },
        { key: 'estoque', href: 'estoque.html', title: '📦 Estoque', desc: 'Consulta rápida do estoque consolidado.' },
        { key: 'mercado_full', href: 'full.html', title: '🚚 Full', desc: 'Controle e acompanhamento do estoque Full.' },
        { key: 'vendas', href: 'vendas.html', title: '💰 Vendas', desc: 'Histórico de pedidos e itens.' },
        { key: 'favoritos', href: 'favoritos.html', title: '⭐ Favoritos ML', desc: 'Pesquisa e ranking de anúncios no Mercado Livre.' },
        { key: 'perguntas_pos_venda', href: 'perguntas_pos_venda.html', title: '💬 Perguntas e pós venda', desc: 'Central para perguntas dos clientes e atendimentos após a venda.' },
        { key: 'sala_reuniao', href: 'sala_reuniao.html', title: '📹 Sala de Reunião', desc: 'Abra chamadas Daily com câmera, microfone, chat e compartilhamento de tela.' },
        { key: 'medias_compras', href: 'medias_compras.html', title: '📊 Médias e Pedidos', desc: 'Planejamento e gestão de pedidos por média de vendas.' },
        { key: 'impostos', href: 'impostos.html', title: '💸 Impostos', desc: 'Regras fiscais por NCM/CEST e simulação tributária.' },
        { key: 'simulador', href: 'simulador.html', title: '🧮 Simulador', desc: 'Calcule o preço final por NCM, dólar, quantidade e cubagem.' },
        { key: 'configuracoes', href: 'configuracoes.html', title: '⚙️ Configurações', desc: 'Parâmetros globais do sistema para todos os usuários.' },
        { key: 'importacoes', href: 'importacoes.html', title: '📥 Importações', desc: 'Central de importação e processamento de planilhas.' },
        { key: 'admin_usuarios', href: 'admin_usuarios.html', title: '👥 Central de Usuários', desc: 'Usuários online, mensagens e permissões.' }
    ];

    let enabled = calcularModulosHabilitados();

    function usuarioFull() {
        return permissions && permissions.full === true;
    }

    function usuarioPodeAdmin() {
        return usuarioFull() || (permissions && permissions.admin_usuarios === true);
    }

    function calcularModulosHabilitados() {
        const enabledBase = usuarioFull()
            ? modules
            : modules.filter(m => permissions && permissions[m.key] === true);
        return enabledBase.slice().sort((a, b) => {
            if (a.key === 'admin_usuarios' && b.key !== 'admin_usuarios') return -1;
            if (a.key !== 'admin_usuarios' && b.key === 'admin_usuarios') return 1;
            if (a.key === 'configuracoes' && b.key !== 'configuracoes') return 1;
            if (a.key !== 'configuracoes' && b.key === 'configuracoes') return -1;
            return 0;
        });
    }

    function atualizarBotaoCentralUsuarios() {
        const botao = document.getElementById('btn-admin-usuarios');
        if (botao) botao.hidden = !usuarioPodeAdmin();
    }

    function atualizarModuloDashboard() {
        enabled = calcularModulosHabilitados();
        renderizarCardsDashboard();
        atualizarBotaoCentralUsuarios();
    }

    function abrirCentralUsuarios() {
        window.location.href = 'admin_usuarios.html';
    }

    function iniciaisUsuario(nome, email) {
        const base = String(nome || email || 'Usuario').trim();
        const partes = base.split(/\s+/).filter(Boolean);
        if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
        return base.slice(0, 2).toUpperCase();
    }

    function escaparHtmlSidebar(valor) {
        return String(valor || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function textoTempoMaquina(segundos) {
        const valor = Number(segundos || 0);
        if (!Number.isFinite(valor) || valor < 25) return 'agora';
        const minutos = Math.max(1, Math.round(valor / 60));
        if (minutos < 60) return `${minutos} min`;
        const horas = Math.round(minutos / 60);
        return `${horas} h`;
    }

    function renderizarMaquinasOnline(payload) {
        const countEl = document.getElementById('user-online-count');
        const listEl = document.getElementById('user-online-machines');
        if (!countEl || !listEl) return;
        const maquinas = Array.isArray(payload && payload.machines) ? payload.machines : [];
        const total = Number(payload && payload.online_count !== undefined ? payload.online_count : maquinas.length) || 0;
        countEl.textContent = total === 1 ? '1 máquina' : `${total} máquinas`;
        countEl.title = payload && payload.backend === 'firebase'
            ? 'Sincronizado pelo Firebase'
            : 'Presença local nesta máquina';

        if (!maquinas.length) {
            listEl.innerHTML = '<div class="user-machine-online-item"><span class="user-machine-online-dot"></span><span class="user-machine-online-name">Somente esta sessão</span></div>';
            return;
        }

        listEl.innerHTML = maquinas.slice(0, 3).map((maquina) => {
            const nome = escaparHtmlSidebar(maquina.label || maquina.machine_id || 'Máquina');
            const tempo = textoTempoMaquina(maquina.seconds_since_seen);
            const tag = maquina.current ? 'esta' : tempo;
            return `<div class="user-machine-online-item" title="${escaparHtmlSidebar(maquina.machine_id || nome)}"><span class="user-machine-online-dot"></span><span class="user-machine-online-name">${nome}</span><span class="user-machine-online-tag">${escaparHtmlSidebar(tag)}</span></div>`;
        }).join('');
    }

    async function atualizarMaquinasOnlineSidebar() {
        try {
            if (window.jkEnviarHeartbeatMaquina) {
                await window.jkEnviarHeartbeatMaquina('manual');
            }
            let data = null;
            if (window.jkBuscarMaquinasOnline) {
                data = await window.jkBuscarMaquinasOnline();
            } else {
                const machineId = String((userData && userData.machine_id) || '').trim();
                const resp = await fetch('/api/user/machines/online?machine_id=' + encodeURIComponent(machineId), {
                    headers: obterAuthHeaders(),
                    cache: 'no-store'
                });
                data = await resp.json().catch(() => ({}));
            }
            renderizarMaquinasOnline(data || {});
        } catch (_err) {
            const countEl = document.getElementById('user-online-count');
            if (countEl) {
                countEl.textContent = '-';
                countEl.title = 'Nao foi possivel carregar as maquinas online agora.';
            }
        }
    }

    function preencherSidebarUsuario() {
        if (!userData) return;
        const nome = String(userData.name || userData.username || 'Usuário').trim();
        const email = String(userData.email || userData.username || '').trim();
        const cliente = String(userData.client_id || 'default').trim();
        const maquina = String(userData.machine_id || '').trim();
        const avatar = document.getElementById('user-avatar');
        const nameEl = document.getElementById('user-name');
        const emailEl = document.getElementById('user-email');
        const clientEl = document.getElementById('user-client');
        const accessEl = document.getElementById('user-access');
        const machineEl = document.getElementById('user-machine');
        const versionEl = document.getElementById('app-version');
        if (avatar) avatar.textContent = iniciaisUsuario(nome, email);
        if (nameEl) nameEl.textContent = nome;
        if (emailEl) emailEl.textContent = email;
        if (clientEl) clientEl.textContent = cliente || '-';
        if (accessEl) accessEl.textContent = usuarioFull() ? 'Completo' : `${enabled.length} módulos`;
        if (machineEl) {
            machineEl.textContent = maquina ? maquina.slice(0, 18) : '-';
            machineEl.title = maquina || '';
        }
        if (versionEl) {
            versionEl.textContent = `v${APP_VERSION_FALLBACK}`;
            versionEl.title = `Versão ${APP_VERSION_FALLBACK}`;
        }
    }

    preencherSidebarUsuario();
    atualizarMaquinasOnlineSidebar();
    setInterval(atualizarMaquinasOnlineSidebar, 60000);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') atualizarMaquinasOnlineSidebar();
    });

    async function preencherVersaoApp() {
        const versionEl = document.getElementById('app-version');
        if (!versionEl) return;
        let versao = APP_VERSION_FALLBACK;
        try {
            if (window.electronAPI && typeof window.electronAPI.getAppVersion === 'function') {
                const retorno = await window.electronAPI.getAppVersion();
                if (retorno) versao = String(retorno);
            }
        } catch (_err) {}
        appVersionAtual = String(versao || APP_VERSION_FALLBACK).replace(/^v/i, '').trim() || APP_VERSION_FALLBACK;
        versionEl.textContent = `v${versao}`;
        versionEl.title = `Versão ${versao}`;
    }

    preencherVersaoApp();

    let dashboardStatusTimer = null;
    let updateStatusWatchdogTimer = null;
    const UPDATE_CHECK_UI_TIMEOUT_MS = 55000;

    function limparWatchdogAtualizacao() {
        clearTimeout(updateStatusWatchdogTimer);
        updateStatusWatchdogTimer = null;
    }

    function iniciarWatchdogAtualizacao(ms = UPDATE_CHECK_UI_TIMEOUT_MS) {
        limparWatchdogAtualizacao();
        updateStatusWatchdogTimer = setTimeout(() => {
            mostrarStatusDashboard(
                'Falha na atualização',
                'A consulta não respondeu. Tente novamente ou reinicie o app.',
                { tipo: 'error', tempoMs: 9000 }
            );
        }, ms);
    }

    function executarComTimeoutAtualizacao(promise, ms = UPDATE_CHECK_UI_TIMEOUT_MS) {
        return new Promise((resolve) => {
            let concluido = false;
            const timer = setTimeout(() => {
                if (concluido) return;
                concluido = true;
                resolve({
                    success: false,
                    timeout: true,
                    error: 'Tempo esgotado ao consultar atualizações.'
                });
            }, ms);

            Promise.resolve(promise)
                .then((value) => {
                    if (concluido) return;
                    concluido = true;
                    clearTimeout(timer);
                    resolve(value);
                })
                .catch((err) => {
                    if (concluido) return;
                    concluido = true;
                    clearTimeout(timer);
                    resolve({
                        success: false,
                        error: (err && err.message) || 'Não foi possível verificar.'
                    });
                });
        });
    }

    async function consultarAtualizacaoBackend(ms = 14000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        try {
            const versaoAtual = String(appVersionAtual || APP_VERSION_FALLBACK).replace(/^v/i, '').trim() || APP_VERSION_FALLBACK;
            const resp = await fetch(`/api/app-update/check?current_version=${encodeURIComponent(versaoAtual)}&_=${Date.now()}`, {
                cache: 'no-store',
                signal: controller.signal
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || data.success === false) {
                throw new Error(data.message || data.detail || 'Nao foi possivel consultar a versao publicada.');
            }
            return data;
        } catch (err) {
            if (err && err.name === 'AbortError') {
                throw new Error('Tempo esgotado consultando a versão publicada.');
            }
            throw err;
        } finally {
            clearTimeout(timer);
        }
    }

    function ocultarStatusDashboard() {
        const balloon = document.getElementById('dashboard-status-balloon');
        if (balloon) balloon.classList.add('hidden');
    }

    function mostrarStatusDashboard(titulo, texto, opcoes = {}) {
        const balloon = document.getElementById('dashboard-status-balloon');
        if (!balloon) return;
        const titleEl = document.getElementById('dashboard-status-title');
        const textEl = document.getElementById('dashboard-status-text');
        const tipo = opcoes.tipo || (opcoes.erro ? 'error' : opcoes.sucesso ? 'success' : opcoes.loading ? 'loading' : 'info');

        if (titleEl) titleEl.textContent = titulo || 'Atualização';
        if (textEl) textEl.textContent = texto || '';

        balloon.classList.remove('hidden', 'is-loading', 'is-success', 'is-error', 'is-info');
        balloon.classList.add(`is-${tipo}`);

        clearTimeout(dashboardStatusTimer);
        const tempoMs = Number(opcoes.tempoMs || 0) || (tipo === 'loading' ? 0 : 5200);
        if (tempoMs > 0) {
            dashboardStatusTimer = setTimeout(ocultarStatusDashboard, tempoMs);
        }
    }

    function versaoLegivelAtualizacao(valor) {
        const versao = String(valor || '').replace(/^v/i, '').trim();
        return versao ? `v${versao}` : 'a nova versão';
    }

    function obterVersaoDoStatus(payload) {
        if (!payload) return '';
        return payload.latestVersion || payload.currentVersion || payload.version || (payload.updateInfo && payload.updateInfo.version) || '';
    }

    function tratarStatusAtualizacao(payload = {}) {
        const status = payload.status || '';
        const versao = versaoLegivelAtualizacao(obterVersaoDoStatus(payload));
        if (status === 'checking') {
            iniciarWatchdogAtualizacao();
            mostrarStatusDashboard('Atualização', 'Verificando versão...', { tipo: 'loading' });
        } else if (status === 'available' || status === 'manual-update-available') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Atualização', `${versao} encontrada. Baixando...`, { tipo: 'loading' });
        } else if (status === 'downloading') {
            limparWatchdogAtualizacao();
            const pct = Number(payload.percent || 0);
            mostrarStatusDashboard('Baixando', pct > 0 ? `${pct}% concluído.` : 'Download em andamento...', { tipo: 'loading' });
        } else if (status === 'downloaded') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Instalando', 'Salvando dados...', { tipo: 'loading' });
        } else if (status === 'saving-work') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Preparando', 'Salvando abas abertas...', { tipo: 'loading' });
        } else if (status === 'work-saved') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Salvo', 'Continuando instalação...', { tipo: 'success' });
        } else if (status === 'installing') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Instalando', 'Reiniciando em instantes...', { tipo: 'loading' });
        } else if (status === 'not-available' || status === 'up-to-date') {
            limparWatchdogAtualizacao();
            const atual = versaoLegivelAtualizacao(payload.currentVersion || obterVersaoDoStatus(payload) || APP_VERSION_FALLBACK);
            mostrarStatusDashboard('Atualizado', `Versão ${atual}.`, { tipo: 'success', tempoMs: 4200 });
        } else if (status === 'deferred') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Aguardando', 'Finalizando tarefa atual.', { tipo: 'info', tempoMs: 5200 });
        } else if (status === 'skipped') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Sem atualização', payload.reason || 'Atualizador indisponível.', { tipo: 'info', tempoMs: 7000 });
        } else if (status === 'error') {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Falha na atualização', payload.error || 'Não foi possível consultar agora.', { tipo: 'error', tempoMs: 9000 });
        }
    }

    if (window.electronAPI && typeof window.electronAPI.onAutoUpdateStatus === 'function') {
        window.electronAPI.onAutoUpdateStatus(tratarStatusAtualizacao);
    }

    async function chamarDriveSync(endpoint) {
        const resp = await fetch(endpoint, {
            method: 'POST',
            headers: obterAuthHeaders()
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data.success === false) {
            throw new Error(data.detail || data.message || 'Nao foi possivel sincronizar com o Google Drive.');
        }
        return data;
    }

    function aguardarDrive(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function lerRespostaDashboard(resp, erroPadrao) {
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || data.success === false) {
            throw new Error(data.detail || data.message || erroPadrao || 'Nao foi possivel concluir a operacao.');
        }
        return data;
    }

    async function aguardarVinculoGoogleDrive(state) {
        for (let tentativa = 0; tentativa < 180; tentativa += 1) {
            const resp = await fetch('/api/auth/google/result/' + encodeURIComponent(state), { cache: 'no-store' });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) {
                throw new Error(data.detail || data.message || 'Nao foi possivel concluir a autorizacao Google.');
            }
            if (!data.pending) {
                if (!data.success) {
                    throw new Error(data.message || 'Conta Google nao autorizada.');
                }
                if (data.user_data) localStorage.setItem('user_data', JSON.stringify(data.user_data));
                if (data.permissions) localStorage.setItem('permissions', JSON.stringify(data.permissions || {}));
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                }
                return data;
            }
            await aguardarDrive(1000);
        }
        throw new Error('Tempo esgotado aguardando a autorizacao do Google Drive.');
    }

    async function vincularGoogleDrive() {
        const machineId = (userData && userData.machine_id) || '';
        const resp = await fetch('/api/auth/google/start?mode=json&machine_id=' + encodeURIComponent(machineId), { cache: 'no-store' });
        const data = await lerRespostaDashboard(resp, 'Nao foi possivel iniciar a autorizacao Google.');
        if (!data.auth_url || !data.state) {
            throw new Error(data.message || 'Google nao retornou o link de autorizacao.');
        }

        mostrarStatusDashboard('Autorizar Google Drive', 'Conclua a autorizacao na janela do Google. Depois volto a sincronizar automaticamente.', { tipo: 'loading' });
        if (window.electronAPI && typeof window.electronAPI.openExternalChrome === 'function') {
            await window.electronAPI.openExternalChrome(data.auth_url);
        } else {
            const popup = window.open(data.auth_url, '_blank', 'noopener,noreferrer');
            if (!popup) window.location.href = data.auth_url;
        }

        await aguardarVinculoGoogleDrive(data.state);
        mostrarStatusDashboard('Drive vinculado', 'Autorizacao concluida. Sincronizando os dados agora...', { tipo: 'success' });
    }

    async function sincronizarDriveBackup(manual = false) {
        const botao = document.getElementById('btn-sincronizar-drive');
        try {
            if (botao && manual) {
                botao.disabled = true;
                botao.textContent = 'Sincronizando...';
            }
            if (manual) {
                mostrarStatusDashboard('Sincronizando Drive', 'Verificando autorizacao e backups da conta Google...', { tipo: 'loading' });
            }
            let data = await chamarDriveSync('/api/drive-sync/auto');
            if (data.action === 'not_linked') {
                if (!manual) return;
                await vincularGoogleDrive();
                data = await chamarDriveSync('/api/drive-sync/auto');
            }
            if (data.action === 'conflict' && manual) {
                const enviarLocal = confirm('Existe um backup diferente no Google Drive e tambem ha dados locais nesta maquina. Deseja enviar os dados desta maquina para o Drive agora?');
                if (enviarLocal) {
                    data = await chamarDriveSync('/api/drive-sync/backup');
                }
            }
            if (manual) {
                mostrarStatusDashboard('Google Drive', data.message || 'Sincronizacao do Drive concluida.', { tipo: 'success', tempoMs: 6500 });
            } else if (data.action && data.action !== 'synced' && data.action !== 'not_linked') {
                console.info('[Drive Sync]', data.message || data.action);
            }
        } catch (err) {
            if (manual) {
                mostrarStatusDashboard('Erro no Google Drive', (err && err.message) || 'Nao foi possivel sincronizar com o Google Drive.', { tipo: 'error', tempoMs: 8000 });
            } else {
                console.warn('[Drive Sync]', err);
            }
        } finally {
            if (botao && manual) {
                botao.disabled = false;
                botao.textContent = 'Sincronizar Drive';
            }
        }
    }

    setTimeout(() => sincronizarDriveBackup(false), 1800);

    async function importarCredenciais() {
        const api = window.electronAPI;
        const botao = document.getElementById('btn-importar-credenciais');

        if (!api || typeof api.importCredentials !== 'function') {
            alert('Esta opção está disponível no aplicativo desktop. Se estiver no navegador, execute ImportarCredenciais.bat na pasta do sistema.');
            return;
        }

        const confirmar = confirm('Vou pedir para você selecionar o arquivo .jkcred e depois abrir o importador local. Informe a senha quando a janela abrir.');
        if (!confirmar) return;

        try {
            if (botao) {
                botao.disabled = true;
                botao.textContent = 'Abrindo...';
            }
            const resultado = await api.importCredentials();
            const mensagem = (resultado && resultado.message) || 'Importador de credenciais aberto.';
            alert(`${mensagem}\n\nQuando a importação terminar, saia e entre novamente para recarregar as permissões.`);
        } catch (err) {
            alert((err && err.message) || 'Não foi possível abrir o importador de credenciais.');
        } finally {
            if (botao) {
                botao.disabled = false;
                botao.textContent = 'Importar credenciais';
            }
        }
    }

    async function verificarAtualizacao() {
        const api = window.electronAPI;
        const botao = document.getElementById('btn-verificar-atualizacao');

        try {
            if (botao) {
                botao.disabled = true;
                botao.textContent = 'Verificando...';
            }
            mostrarStatusDashboard('Atualização', 'Verificando versão...', { tipo: 'loading' });
            const resultado = await consultarAtualizacaoBackend();

            if (resultado && resultado.skipped) {
                mostrarStatusDashboard('Sem atualização', resultado.reason || 'Atualizador indisponível.', { tipo: 'info', tempoMs: 7000 });
            } else if (resultado && resultado.checking) {
                mostrarStatusDashboard('Atualização', 'Verificação já está em andamento.', { tipo: 'info', tempoMs: 6500 });
            } else if (resultado && resultado.upToDate) {
                const atual = resultado.publishedOlderThanInstalled
                    ? `${versaoLegivelAtualizacao(resultado.currentVersion || APP_VERSION_FALLBACK)} instalada. GitHub em ${versaoLegivelAtualizacao(resultado.latestVersion)}.`
                    : `Versão ${versaoLegivelAtualizacao(resultado.currentVersion || APP_VERSION_FALLBACK)}.`;
                mostrarStatusDashboard('Atualizado', atual, { tipo: 'success', tempoMs: 4500 });
            } else if (resultado && resultado.available) {
                mostrarStatusDashboard('Atualização', `Baixando ${versaoLegivelAtualizacao(resultado.latestVersion)}...`, { tipo: 'loading' });
                if (api && typeof api.checkForUpdates === 'function') {
                    iniciarWatchdogAtualizacao();
                    executarComTimeoutAtualizacao(api.checkForUpdates(), UPDATE_CHECK_UI_TIMEOUT_MS)
                        .then((retorno) => {
                            limparWatchdogAtualizacao();
                            if (retorno && retorno.error) {
                                mostrarStatusDashboard('Falha na atualização', retorno.error, { tipo: 'error', tempoMs: 9000 });
                            } else if (retorno && retorno.upToDate) {
                                mostrarStatusDashboard('Atualizado', `Versão ${versaoLegivelAtualizacao(retorno.currentVersion || resultado.currentVersion || APP_VERSION_FALLBACK)}.`, { tipo: 'success', tempoMs: 5000 });
                            }
                        })
                        .catch((err) => {
                            limparWatchdogAtualizacao();
                            mostrarStatusDashboard('Falha na atualização', (err && err.message) || 'Não foi possível baixar.', { tipo: 'error', tempoMs: 9000 });
                        });
                } else {
                    mostrarStatusDashboard('Atualização disponível', `${versaoLegivelAtualizacao(resultado.latestVersion)} publicada. Use o app instalado para baixar.`, { tipo: 'info', tempoMs: 8000 });
                }
            } else if (resultado && resultado.timeout) {
                mostrarStatusDashboard('Falha na atualização', resultado.error, { tipo: 'error', tempoMs: 9000 });
            } else if (resultado && resultado.error) {
                mostrarStatusDashboard('Falha na atualização', resultado.error, { tipo: 'error', tempoMs: 9000 });
            } else {
                mostrarStatusDashboard('Atualização', 'Consulta finalizada.', { tipo: 'info', tempoMs: 5000 });
            }
        } catch (err) {
            limparWatchdogAtualizacao();
            mostrarStatusDashboard('Falha na atualização', (err && err.message) || 'Não foi possível verificar.', { tipo: 'error', tempoMs: 9000 });
        } finally {
            if (botao) {
                botao.disabled = false;
                botao.textContent = 'Verificar atualizacao';
            }
        }
    }

    function abrirTrocaSenha() {
        const modal = document.getElementById('password-modal');
        const form = document.getElementById('password-form');
        const msg = document.getElementById('password-message');
        if (!modal) return;
        if (form) form.reset();
        if (msg) {
            msg.textContent = '';
            msg.classList.remove('success');
        }
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(() => document.getElementById('senha-atual')?.focus(), 30);
    }

    function fecharTrocaSenha() {
        const modal = document.getElementById('password-modal');
        if (!modal) return;
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
    }

    function mostrarMensagemSenha(texto, sucesso = false) {
        const msg = document.getElementById('password-message');
        if (!msg) return;
        msg.textContent = texto || '';
        msg.classList.toggle('success', !!sucesso);
    }

    async function salvarNovaSenha(event) {
        event.preventDefault();
        const atual = document.getElementById('senha-atual')?.value || '';
        const nova = document.getElementById('senha-nova')?.value || '';
        const confirmar = document.getElementById('senha-confirmar')?.value || '';
        const botao = document.getElementById('password-submit');

        if (nova.length < 6) {
            mostrarMensagemSenha('A nova senha deve ter pelo menos 6 caracteres.');
            return;
        }
        if (nova !== confirmar) {
            mostrarMensagemSenha('A confirmação da senha não confere.');
            return;
        }

        try {
            if (botao) botao.disabled = true;
            mostrarMensagemSenha('Salvando...');
            const resp = await fetch('/api/auth/change-password', {
                method: 'PUT',
                headers: obterAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    current_password: atual,
                    new_password: nova,
                    confirm_password: confirmar
                })
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || data.success === false) {
                throw new Error(data.detail || data.message || 'Não foi possível trocar a senha.');
            }
            mostrarMensagemSenha(data.message || 'Senha alterada com sucesso.', true);
            setTimeout(fecharTrocaSenha, 900);
        } catch (err) {
            mostrarMensagemSenha(err.message || 'Não foi possível trocar a senha.');
        } finally {
            if (botao) botao.disabled = false;
        }
    }

    document.getElementById('password-form')?.addEventListener('submit', salvarNovaSenha);
    document.getElementById('password-modal')?.addEventListener('click', (event) => {
        if (event.target && event.target.id === 'password-modal') fecharTrocaSenha();
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') fecharTrocaSenha();
    });

    (function controlarSidebarRecolhivel() {
        const sidebar = document.querySelector('.user-sidebar');
        const trigger = document.getElementById('user-sidebar-trigger');
        if (!sidebar || document.body.classList.contains('modo-mobile')) return;
        let timerFechar = null;

        function abrir() {
            clearTimeout(timerFechar);
            document.body.classList.add('sidebar-open');
            sidebar.classList.add('open');
            sidebar.style.transform = 'translate3d(0, 0, 0)';
            sidebar.style.pointerEvents = 'auto';
        }

        function fechar(rapido = false) {
            clearTimeout(timerFechar);
            timerFechar = setTimeout(() => {
                if (sidebar.matches(':hover')) return;
                document.body.classList.remove('sidebar-open');
                sidebar.classList.remove('open');
                sidebar.style.transform = 'translate3d(-224px, 0, 0)';
                sidebar.style.pointerEvents = 'none';
                sidebar.querySelectorAll('button, input').forEach(el => el.blur());
            }, rapido ? 0 : 120);
        }

        trigger?.addEventListener('mouseenter', abrir);
        sidebar.addEventListener('mouseleave', fechar);
        document.body.classList.remove('sidebar-open');
        sidebar.classList.remove('open');
        sidebar.style.transform = 'translate3d(-224px, 0, 0)';
        sidebar.style.pointerEvents = 'none';
        document.addEventListener('mousemove', (event) => {
            if (event.clientX <= 12) {
                abrir();
                return;
            }
            if (document.body.classList.contains('sidebar-open')) {
                const rect = sidebar.getBoundingClientRect();
                const foraDaSidebar = event.clientX > rect.right + 8 || event.clientY < rect.top || event.clientY > rect.bottom;
                if (foraDaSidebar) fechar(true);
            }
        });
    })();

    function renderizarCardsDashboard() {
        const cards = document.getElementById('cards');
        if (!cards) return;
        cards.innerHTML = '';

        if (!enabled.length) {
            const empty = document.createElement('div');
            empty.className = 'dashboard-empty-state';
            empty.innerHTML = `
                <p>Nenhum módulo habilitado para seu usuário.</p>
                <div class="dashboard-empty-actions">
                    <button class="sidebar-import-credentials" type="button" onclick="importarCredenciais()">Importar credenciais</button>
                    <button class="modal-secondary" type="button" onclick="sair()">Sair e entrar novamente</button>
                </div>
            `;
            cards.appendChild(empty);
            return;
        }

        enabled.forEach(mod => {
            const a = document.createElement('a');
            a.className = 'card';
            a.dataset.key = String(mod.key || '');
            a.style.setProperty('--d', String(Math.min(560, cards.childElementCount * 40)) + 'ms');
            if (mod.dev) {
                a.href = '#';
                a.addEventListener('click', (e) => { e.preventDefault(); alert('Em desenvolvimento'); });
            } else {
                a.href = mod.href;
            }
            const m = String(mod.title || '').match(/^(\S+)\s+(.+)$/);
            const icon = m ? m[1] : '•';
            const titleText = m ? m[2] : String(mod.title || 'Módulo');
            a.innerHTML =
                '<div class="card-head">' +
                    '<span class="card-icon" aria-hidden="true">' + icon + '</span>' +
                    '<div class="card-title"><h2>' + titleText + '</h2></div>' +
                '</div>' +
                '<p>' + mod.desc + '</p>';
            cards.appendChild(a);
        });
    }

    renderizarCardsDashboard();
    atualizarBotaoCentralUsuarios();
    atualizarSessaoDashboard();

    function sair() {
        encerrarSessao();
    }
</script>
<script src="/ia-sidebar.js"></script>
