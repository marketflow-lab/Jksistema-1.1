<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - JK Sistema</title>
    <style>
        body { margin:0; padding:20px; background:#0e1117; color:#e5e5e5; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width:1200px; margin:0 auto; }
        .header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
        .back-btn { padding:8px 14px; background:#4facfe; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold; }
        .back-btn:hover { background:#0073e6; }
        h1 { margin:0; }
        .status-bar { margin:10px 0 16px; padding:10px 12px; border-radius:8px; background:#161925; border:1px solid #222; min-height:20px; }
        .status-bar:empty { display:none; }
        .status-bar.loading { color:#9bd1ff; border-color:#4facfe; background:#0a1428; }
        .status-bar.error { color:#ff6b6b; border-color:#c62828; background:#28010d; }
        .status-bar.success { color:#66bb6a; border-color:#1b5e20; background:#0f2e0d; }
        .loading { color:#9bd1ff; }
        .error { color:#ff6b6b; }
        .success { color:#80ed99; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid #4facfe; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .layout { display:block; }
        .card { background:#1c1f2b; border:1px solid #222; border-radius:10px; padding:14px; }
        .card h2 { margin:0 0 12px; color:#9bd1ff; font-size:1.05rem; }
        .card-title-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
        .card-title-row h2 { margin:0; }
        .card-title-row .status-bar { margin:0; min-height:0; padding:6px 10px; font-size:0.9rem; }
        .tabs { display:flex; gap:8px; margin:0 0 12px; border-bottom:1px solid #2c3347; }
        .tab-btn { padding:10px 14px; border:0; border-bottom:3px solid transparent; background:transparent; color:#c8d7ea; cursor:pointer; font-weight:700; }
        .tab-btn:hover { color:#fff; background:#202637; }
        .tab-btn.active { color:#9bd1ff; border-bottom-color:#4facfe; }
        .tab-panel[hidden] { display:none; }
        .grupo-loja-row td { background:#121a2a; color:#9bd1ff; font-weight:700; border-top:1px solid #34425f; }

        .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field.full { grid-column: 1 / -1; }
        label { font-size:0.9rem; color:#c8d7ea; }
        input, textarea { padding:9px; border-radius:6px; border:1px solid #333; background:#101422; color:#e5e5e5; }
        textarea { min-height:70px; resize:vertical; }
        .actions { display:flex; gap:10px; margin-top:12px; }
        .btn { padding:9px 12px; border-radius:6px; border:1px solid transparent; cursor:pointer; font-weight:600; }
        .btn-primary { background:#28a745; color:#fff; }
        .btn-primary:hover { background:#20913a; }
        .btn-secondary { background:#2b3245; color:#e5e5e5; border-color:#3a435c; }
        .btn-secondary:hover { background:#36415b; }

        .toolbar { display:flex; justify-content:flex-start; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
        .toolbar input { min-width:260px; }

        table { width:max-content; min-width:100%; table-layout:auto; border-collapse:collapse; background:#1c1f2b; border:1px solid #222; }
        th, td { padding:9px; border-bottom:1px solid #222; text-align:left; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:90px; }
        th { background:#161925; color:#9bd1ff; position:sticky; top:0; z-index:1; overflow:hidden; }
        tr:hover { background:#1f2331; }
        .table-wrap { overflow-x:auto; border-radius:8px; }
        .paginacao { display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap; }
        .paginacao button { padding:6px 12px; border-radius:6px; border:1px solid #3a435c; background:#2b3245; color:#e5e5e5; cursor:pointer; font-weight:600; }
        .paginacao button:hover { background:#36415b; }
        .paginacao button.ativo { background:#4facfe; color:#fff; border-color:#4facfe; }
        .paginacao button:disabled { opacity:0.4; cursor:default; }
        .paginacao span { color:#aaa; font-size:0.9rem; }
        .th-content { position:relative; padding-right:12px; user-select:none; }
        .th-resizer { position:absolute; top:-9px; right:-6px; width:14px; height:calc(100% + 18px); cursor:col-resize; border-right:2px solid rgba(79, 172, 254, 0.45); z-index:3; }
        .th-resizer:hover { background:rgba(79, 172, 254, 0.18); border-right-color:#4facfe; }
        .foto-cell { display:flex; align-items:center; gap:8px; min-width:120px; }
        .foto-td { overflow:visible !important; position:relative; }
        .foto-thumb { width:42px; height:42px; border-radius:6px; object-fit:cover; border:1px solid #333; background:#101422; transition:transform .18s ease, box-shadow .18s ease; transform-origin:left center; position:relative; z-index:1; }
        .foto-thumb:hover { transform:scale(2.6); z-index:50; box-shadow:0 10px 24px rgba(0,0,0,.55); }
        .foto-link { color:#9bd1ff; text-decoration:none; font-weight:600; }
        .foto-link:hover { text-decoration:underline; }
        .custo-lojas-td { white-space:normal; min-width:220px; max-width:340px; }
        .custo-lojas { display:flex; flex-direction:column; gap:4px; line-height:1.25; }
        .custo-lojas div { display:flex; justify-content:space-between; gap:10px; }
        .custo-lojas .loja { color:#9bd1ff; font-weight:600; }
        .custo-lojas .valor { color:#e5e5e5; text-align:right; }

        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="/auth.js?v=20260417c"></script>
    <script src="/ncm-sync.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> Cadastro de Produtos</h1>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <a class="back-btn" href="/dashboard.html">🏠 Home</a>
            <a class="back-btn" href="/dashboard.html">Voltar</a>
        </div>
    </div>

    <div id="statusNcmGlobal" class="status-bar" style="display:none; margin:10px 0; padding:10px 12px; border-radius:8px; background:#161925; border:1px solid #222; min-height:20px;"></div>

    <div class="layout">
        <div class="card">
            <div class="card-title-row">
                <h2>Produtos cadastrados</h2>
                <div id="status" class="status-bar"></div>
            </div>
            <div class="tabs" role="tablist" aria-label="Cadastro de produtos">
                <button id="tabProdutos" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="painelProdutos">Produtos</button>
                <button id="tabCustos" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="painelCustos">Custos</button>
            </div>
            <div id="painelProdutos" class="tab-panel" role="tabpanel" aria-labelledby="tabProdutos">
                <div class="toolbar">
                    <button id="btnAtualizar" class="btn btn-secondary" type="button">Atualizar lista</button>
                    <button id="btnSyncNcm" class="btn btn-secondary" type="button">Sincronizar NCM</button>
                    <button id="btnEditarCadastro" class="btn btn-secondary" type="button">Editar</button>
                    <button id="btnIncluirCadastro" class="btn btn-secondary" type="button">Incluir</button>
                    <button id="btnImportarColunas" class="btn btn-secondary" type="button">Importar colunas (Excel/CSV)</button>
                    <input id="inputImportarColunas" type="file" accept=".xlsx,.xls,.csv" style="display:none;">
                    <input id="filtro" type="text" placeholder="Filtrar por SKU, nome, categoria ou marca">
                </div>
                <div class="table-wrap">
                    <table>
                        <colgroup id="tCols"></colgroup>
                        <thead id="tHead"></thead>
                        <tbody id="tBody"></tbody>
                    </table>
                </div>
                <div id="paginacao" class="paginacao"></div>

                <h2>Detalhes MLB por SKU</h2>
                <div class="toolbar">
                    <select id="skuSelect" style="padding:9px; border-radius:6px; border:1px solid #333; background:#101422; color:#e5e5e5; min-width:260px;"></select>
                </div>
                <div class="table-wrap" style="max-height:40vh;">
                    <table>
                        <thead>
                            <tr>
                                <th>MLB</th>
                                <th>Título</th>
                                <th>Frete</th>
                                <th>Categoria</th>
                            </tr>
                        </thead>
                        <tbody id="tBodyMlb"></tbody>
                    </table>
                </div>
            </div>
            <div id="painelCustos" class="tab-panel" role="tabpanel" aria-labelledby="tabCustos" hidden>
                <div class="toolbar">
                    <button id="btnAtualizarCustosImpostos" class="btn btn-secondary" type="button">Atualizar custos/impostos por SKU</button>
                    <input id="inputAtualizarCustosImpostos" type="file" accept=".xlsx,.xls,.csv" style="display:none;">
                    <select id="lojaCustosSelect" style="padding:9px; border-radius:6px; border:1px solid #333; background:#101422; color:#e5e5e5; min-width:220px;"></select>
                    <input id="filtroCustos" type="text" placeholder="Filtrar custos por SKU, nome ou produto">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Loja</th>
                                <th>SKU</th>
                                <th>Produto</th>
                                <th>Custo</th>
                                <th>Preço</th>
                                <th>Imposto</th>
                                <th>Atualizado em</th>
                            </tr>
                        </thead>
                        <tbody id="tBodyCustos"></tbody>
                    </table>
                </div>
                <div id="paginacaoCustos" class="paginacao"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const statusEl = document.getElementById('status');
    const btnAtualizar = document.getElementById('btnAtualizar');
    const btnSyncNcm = document.getElementById('btnSyncNcm');
    const btnEditarCadastro = document.getElementById('btnEditarCadastro');
    const btnIncluirCadastro = document.getElementById('btnIncluirCadastro');
    const btnImportarColunas = document.getElementById('btnImportarColunas');
    const inputImportarColunas = document.getElementById('inputImportarColunas');
    const filtro = document.getElementById('filtro');
    const skuSelect = document.getElementById('skuSelect');
    const tCols = document.getElementById('tCols');
    const tHead = document.getElementById('tHead');
    const tBody = document.getElementById('tBody');
    const tBodyMlb = document.getElementById('tBodyMlb');
    const tabProdutos = document.getElementById('tabProdutos');
    const tabCustos = document.getElementById('tabCustos');
    const painelProdutos = document.getElementById('painelProdutos');
    const painelCustos = document.getElementById('painelCustos');
    const btnAtualizarCustosImpostos = document.getElementById('btnAtualizarCustosImpostos');
    const inputAtualizarCustosImpostos = document.getElementById('inputAtualizarCustosImpostos');
    const lojaCustosSelect = document.getElementById('lojaCustosSelect');
    const filtroCustos = document.getElementById('filtroCustos');
    const tBodyCustos = document.getElementById('tBodyCustos');
    const paginacaoCustosEl = document.getElementById('paginacaoCustos');

    const paginacaoEl = document.getElementById('paginacao');
    const ITENS_POR_PAGINA = 50;
    const LS_LARGURAS_KEY = 'cadastro_larguras_colunas';

    let paginaAtual = 1;
    let paginaCustosAtual = 1;
    let clientId = null;
    let produtos = [];
    let lojasIntegradasCustos = [];
    let lojasIntegradasCustosKeys = new Set();
    let lojasIntegradasCustosPorKey = new Map();
    let colunasTabela = [];
    let colunasTabelaKey = '';
    const largurasColunas = JSON.parse(localStorage.getItem(LS_LARGURAS_KEY) || '{}');

    function _salvarLarguras() {
        try { localStorage.setItem(LS_LARGURAS_KEY, JSON.stringify(largurasColunas)); } catch(e) {}
    }

    const colunasFixasPrimeiro = [
        'sku', 'foto', 'produto_bling', 'nome', 'produto', 'ncm', 'cest', 'categoria', 'custo', 'preco', 'descricao', 'imposto', 'updated_at'
    ];
    const colunasOcultas = new Set([
        'marca', 'mlb_principal', 'mlb_ids', 'qtd_anuncios_mlb', 'titulos_anuncios_mlb', 'custos_frete_mlb', 'modalidades_mlb', 'gtins_mlb',
        'custos_por_loja', 'tem_custo_loja', 'loja_custo'
    ]);

    function colunaEhIndesejada(coluna) {
        const n = String(coluna || '').trim().toLowerCase().replace(/_/g, ' ');
        if (n.includes('unnamed')) return true;
        if (n === 'sku key' || n === 'cg sku') return true;
        if (n === 'custoattr' || n === 'custo attr') return true;
        if (n === 'impostoattr' || n === 'imposto attr') return true;
        return false;
    }

    function obterClientId() {
        const user = JSON.parse(localStorage.getItem('user_data') || 'null');
        return user && user.client_id ? user.client_id : null;
    }

    function setStatus(msg, cls) {
        statusEl.className = 'status-bar ' + (cls || '');
        statusEl.textContent = msg || '';
    }

    function formatarNumero(valor) {
        if (valor === null || valor === undefined || valor === '') return '';
        const num = Number(valor);
        if (!Number.isFinite(num)) return String(valor);
        return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatarSkuExibicao(valor) {
        const sku = String(valor || '').trim();
        // Regra solicitada: SKUs de 10 a 99 não devem ter zero à esquerda (ex: 099 -> 99)
        if (/^0\d{2}$/.test(sku)) {
            const n = parseInt(sku, 10);
            if (n >= 10 && n <= 99) return String(n);
        }
        return sku;
    }

    function normalizarBuscaTexto(valor) {
        return String(valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();
    }

    function normalizarBuscaSku(valor) {
        return normalizarBuscaTexto(valor)
            .replace(/^sku\s*/i, '')
            .replace(/[^a-z0-9]/g, '');
    }

    function corrigirTextoQuebrado(valor) {
        let texto = String(valor || '');
        const substituicoes = {
            '\u00e3\u00a7': 'ç',
            '\u00e3\u00a3': 'ã',
            '\u00e3\u00a1': 'á',
            '\u00e3\u00a2': 'â',
            '\u00e3\u00a9': 'é',
            '\u00e3\u00aa': 'ê',
            '\u00e3\u00ad': 'í',
            '\u00e3\u00b3': 'ó',
            '\u00e3\u00b4': 'ô',
            '\u00e3\u00ba': 'ú',
            '\u00e2\u20ac\u201c': '-',
            '\u00e2\u20ac\u201d': '-',
            '\u00e2\u20ac\u0153': '"',
            '\u00e2\u20ac\ufffd': '"',
            '\u00e2\u20ac\u2122': "'",
            '\u00e2\u20ac\u00a2': '-'
        };
        Object.entries(substituicoes).forEach(([errado, correto]) => {
            texto = texto.split(errado).join(correto);
        });
        for (let i = 0; i < 2 && /[\u00c3\u00c2\ufffd]/.test(texto); i++) {
            try {
                const bytes = Array.from(texto, ch => `%${ch.charCodeAt(0).toString(16).padStart(2, '0')}`).join('');
                const corrigido = decodeURIComponent(bytes);
                if (!corrigido || corrigido === texto) break;
                texto = corrigido;
            } catch (e) {
                break;
            }
        }
        return texto;
    }

    function normalizarLegendaColuna(coluna) {
        const mapa = {
            sku: 'SKU',
            nome: 'Nome',
            mlb_principal: 'MLB Principal',
            mlb_ids: 'MLBs',
            qtd_anuncios_mlb: 'Anúncios MLB',
            produto: 'Produto',
            categoria: 'Para que serve',
            marca: 'Marca',
            foto: 'Foto',
            ncm: 'NCM',
            cest: 'CEST',
            produto_bling: 'Produto Bling',
            custo: 'Custo',
            preco: 'Preço',
            descricao: 'Descrição',
            imposto: 'Imposto',
            updated_at: 'Atualizado em'
        };
        if (mapa[coluna]) return mapa[coluna];
        return corrigirTextoQuebrado(String(coluna || '')
            .replace(/^cg_/i, '')
            .replace(/_/g, ' ')
            .replace(/\s+/g, ' ')
            .trim());
    }

    function escaparHtml(valor) {
        return corrigirTextoQuebrado(valor)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function ehUrlAbsoluta(valor) {
        return /^https?:\/\//i.test(String(valor || '').trim());
    }

    function obterUrlFoto(valor) {
        const foto = String(valor || '').trim();
        if (!foto) return '';
        if (ehUrlAbsoluta(foto)) return foto;
        const nomeArquivo = foto.split('/').pop();
        if (!nomeArquivo) return '';
        return `/api/cadastro/foto-arquivo/${encodeURIComponent(nomeArquivo)}`;
    }

    function formatarImposto(valor) {
        if (valor === null || valor === undefined || valor === '') return '';
        const texto = String(valor).trim();
        if (!texto) return '';
        if (texto.includes('%')) return texto;
        const num = Number(texto.replace(',', '.'));
        if (!Number.isFinite(num)) return texto;
        return `${num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;
    }

    function renderCampoPorLojaProduto(item, campo, formatador) {
        const lojas = obterLojasIntegradasProduto(item);
        const linhas = lojas
            .map(loja => {
                const dados = obterDadosCustoLoja(item, loja);
                const valor = dados && dados[campo] !== undefined ? dados[campo] : '';
                if (valor === null || valor === undefined || String(valor).trim() === '') return null;
                return { loja, valor };
            })
            .filter(Boolean);
        if (!linhas.length) return '';

        return `<div class="custo-lojas">${linhas.map(({ loja, valor }) => (
            `<div><span class="loja">${escaparHtml(loja)}</span><span class="valor">${escaparHtml(formatador(valor))}</span></div>`
        )).join('')}</div>`;
    }

    function classeCelula(coluna, item) {
        if (coluna === 'foto') return 'foto-td';
        if (coluna === 'custo' && renderCampoPorLojaProduto(item, 'custo', formatarNumero)) return 'custo-lojas-td';
        if (coluna === 'imposto' && renderCampoPorLojaProduto(item, 'imposto', formatarImposto)) return 'custo-lojas-td';
        return '';
    }

    function renderConteudoCelula(coluna, item) {
        if (coluna === 'custo') {
            const custosPorLoja = renderCampoPorLojaProduto(item, 'custo', formatarNumero);
            if (custosPorLoja) return custosPorLoja;
            return escaparHtml(formatarNumero(item[coluna]));
        }
        if (coluna === 'imposto') {
            const impostosPorLoja = renderCampoPorLojaProduto(item, 'imposto', formatarImposto);
            if (impostosPorLoja) return impostosPorLoja;
            return escaparHtml(formatarImposto(item[coluna]));
        }
        if (coluna === 'preco') {
            return escaparHtml(formatarNumero(item[coluna]));
        }
        if (coluna === 'sku') {
            return escaparHtml(formatarSkuExibicao(item[coluna]));
        }
        if (coluna === 'foto') {
            const fotoUrl = obterUrlFoto(item[coluna]);
            if (!fotoUrl) return '<span style="color:#777;">Sem foto</span>';
            return `<div class="foto-cell"><a class="foto-link" href="${escaparHtml(fotoUrl)}" target="_blank" rel="noopener noreferrer"><img class="foto-thumb" src="${escaparHtml(fotoUrl)}" alt="Foto do SKU"></a></div>`;
        }
        return escaparHtml(String(item[coluna] || ''));
    }

    function primeiroTitulo(item) {
        const raw = String(item.titulos_anuncios_mlb || '').trim();
        if (!raw) return '';
        const partes = raw.split(' || ').map(s => s.trim()).filter(Boolean);
        return partes[0] || '';
    }

    function construirColunas(lista) {
        if (!lista.length) return [];
        const presentes = new Set();
        lista.forEach(item => Object.keys(item || {}).forEach(k => presentes.add(k)));

        // Mantém colunas-chave sempre visíveis (incluindo NCM/CEST), mesmo se vierem vazias da API.
        const fixas = [...colunasFixasPrimeiro];
        const extras = Array.from(presentes)
            .filter(c => !fixas.includes(c) && !colunasOcultas.has(c) && !colunaEhIndesejada(c))
            .sort((a, b) => a.localeCompare(b));
        return [...fixas, ...extras];
    }

    function obterLarguraColuna(coluna) {
        const w = parseInt(largurasColunas[coluna], 10);
        return Number.isFinite(w) ? w : 180;
    }

    function splitLista(raw, sep) {
        return String(raw || '').split(sep).map(s => s.trim()).filter(Boolean);
    }

    function skuTextoSegura(valor) {
        if (valor === undefined || valor === null) return '';
        return String(valor).trim();
    }

    function textoProdutoSuspeito(valor) {
        const texto = skuTextoSegura(valor);
        if (!texto) return true;
        if (texto.includes('\n') || texto.includes('\r')) return true;
        if (texto.length > 220) return true;
        if ((texto.match(/;/g) || []).length >= 2) return true;
        return false;
    }

    function obterNomeProdutoCadastro(item) {
        const candidatos = [
            item && item.nome,
            item && item.produto,
            item && item.produto_bling,
            item && item.titulo
        ];
        for (const candidato of candidatos) {
            const texto = skuTextoSegura(candidato);
            if (!texto) continue;
            if (textoProdutoSuspeito(texto)) continue;
            return texto;
        }
        return '';
    }

    function renderCabecalho(colunas) {
        tHead.innerHTML = '';
        tCols.innerHTML = '';
        if (!colunas.length) return;

        colunas.forEach(col => {
            const colEl = document.createElement('col');
            colEl.style.width = `${obterLarguraColuna(col)}px`;
            tCols.appendChild(colEl);
        });

        const tr = document.createElement('tr');
        colunas.forEach((col, idx) => {
            const th = document.createElement('th');
            const baseW = obterLarguraColuna(col);
            th.style.width = `${baseW}px`;
            th.style.minWidth = `${baseW}px`;
            th.style.maxWidth = `${baseW}px`;
            const content = document.createElement('div');
            content.className = 'th-content';
            content.textContent = normalizarLegendaColuna(col);

            const resizer = document.createElement('div');
            resizer.className = 'th-resizer';
            resizer.addEventListener('mousedown', (ev) => iniciarResizeColuna(ev, idx, col));
            content.appendChild(resizer);

            th.appendChild(content);
            tr.appendChild(th);
        });
        tHead.appendChild(tr);
    }

    function aplicarLarguraColuna(idx, colName, width, salvar = false) {
        const w = Math.max(90, parseInt(width, 10) || 180);
        largurasColunas[colName] = w;
        if (salvar) _salvarLarguras();

        const colEl = tCols.children[idx];
        if (colEl) colEl.style.width = `${w}px`;

        const th = tHead.querySelector(`tr th:nth-child(${idx + 1})`);
        if (th) {
            th.style.width = `${w}px`;
            th.style.minWidth = `${w}px`;
            th.style.maxWidth = `${w}px`;
        }

        const rows = tBody.querySelectorAll('tr');
        rows.forEach(row => {
            const td = row.children[idx];
            if (td) {
                td.style.width = `${w}px`;
                td.style.minWidth = `${w}px`;
                td.style.maxWidth = `${w}px`;
            }
        });
    }

    function iniciarResizeColuna(event, idx, colName) {
        event.preventDefault();
        const startX = event.clientX;
        const startW = obterLarguraColuna(colName);

        function onMove(e) {
            const delta = e.clientX - startX;
            const newW = Math.max(90, startW + delta);
            aplicarLarguraColuna(idx, colName, newW);
        }

        function onUp() {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            _salvarLarguras();
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    }

    function renderPaginacao(totalItens) {
        paginacaoEl.innerHTML = '';
        const totalPaginas = Math.ceil(totalItens / ITENS_POR_PAGINA);
        if (totalPaginas <= 1) return;

        const btnAnterior = document.createElement('button');
        btnAnterior.textContent = 'Anterior';
        btnAnterior.disabled = paginaAtual === 1;
        btnAnterior.addEventListener('click', () => { paginaAtual--; renderTabela(false); window.scrollTo(0,0); });
        paginacaoEl.appendChild(btnAnterior);

        // Páginas ao redor da atual
        const inicio = Math.max(1, paginaAtual - 2);
        const fim = Math.min(totalPaginas, paginaAtual + 2);
        if (inicio > 1) {
            const btn = document.createElement('button');
            btn.textContent = '1';
            btn.addEventListener('click', () => { paginaAtual = 1; renderTabela(false); window.scrollTo(0,0); });
            paginacaoEl.appendChild(btn);
            if (inicio > 2) paginacaoEl.insertAdjacentHTML('beforeend', '<span>…</span>');
        }
        for (let i = inicio; i <= fim; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === paginaAtual) btn.classList.add('ativo');
            btn.addEventListener('click', () => { paginaAtual = i; renderTabela(false); window.scrollTo(0,0); });
            paginacaoEl.appendChild(btn);
        }
        if (fim < totalPaginas) {
            if (fim < totalPaginas - 1) paginacaoEl.insertAdjacentHTML('beforeend', '<span>…</span>');
            const btn = document.createElement('button');
            btn.textContent = totalPaginas;
            btn.addEventListener('click', () => { paginaAtual = totalPaginas; renderTabela(false); window.scrollTo(0,0); });
            paginacaoEl.appendChild(btn);
        }

        const btnProximo = document.createElement('button');
        btnProximo.textContent = 'Próximo';
        btnProximo.disabled = paginaAtual === totalPaginas;
        btnProximo.addEventListener('click', () => { paginaAtual++; renderTabela(false); window.scrollTo(0,0); });
        paginacaoEl.appendChild(btnProximo);

        const info = document.createElement('span');
        const de = (paginaAtual - 1) * ITENS_POR_PAGINA + 1;
        const ate = Math.min(paginaAtual * ITENS_POR_PAGINA, totalItens);
        info.textContent = `${de} à ${ate} de ${totalItens}`;
        paginacaoEl.appendChild(info);
    }

    function compararSku(a, b) {
        return String(a.sku || '').localeCompare(String(b.sku || ''), undefined, { numeric: true, sensitivity: 'base' });
    }

    function renderTabela(resetarPagina = true) {
        const termoTexto = normalizarBuscaTexto(filtro.value);
        const termoSku = normalizarBuscaSku(filtro.value);
        const listaCompleta = (termoTexto
            ? produtos
                .map((p, idx) => {
                    const skuBruto = String(p?.sku || '');
                    const skuExibicao = formatarSkuExibicao(skuBruto);
                    const skuNormBruto = normalizarBuscaSku(skuBruto);
                    const skuNormExib = normalizarBuscaSku(skuExibicao);

                    let prioridade = null;
                    if (termoSku) {
                        if (skuNormBruto === termoSku || skuNormExib === termoSku) {
                            prioridade = 0; // match exato de SKU
                        } else if (skuNormBruto.startsWith(termoSku) || skuNormExib.startsWith(termoSku)) {
                            prioridade = 1; // SKU inicia com termo
                        } else if (skuNormBruto.includes(termoSku) || skuNormExib.includes(termoSku)) {
                            prioridade = 2; // SKU contém termo
                        }
                    }

                    if (prioridade === null) {
                        const encontrouTexto = Object.values(p || {}).some(v =>
                            normalizarBuscaTexto(v).includes(termoTexto)
                        );
                        if (!encontrouTexto) return null;
                        prioridade = 3; // match por outros campos
                    }

                    return { p, prioridade, idx };
                })
                .filter(Boolean)
                .sort((a, b) => {
                    if (a.prioridade !== b.prioridade) return a.prioridade - b.prioridade;
                    const cmp = compararSku(a.p, b.p);
                    if (cmp !== 0) return cmp;
                    return a.idx - b.idx;
                })
                .map(x => x.p)
            : [...produtos].sort(compararSku)
        );

        if (resetarPagina) paginaAtual = 1;
        const lista = listaCompleta.slice((paginaAtual - 1) * ITENS_POR_PAGINA, paginaAtual * ITENS_POR_PAGINA);

        const novasColunas = construirColunas(lista.length ? lista : listaCompleta);
        const novaKey = novasColunas.join('|');
        if (novaKey !== colunasTabelaKey) {
            colunasTabela = novasColunas;
            colunasTabelaKey = novaKey;
            renderCabecalho(colunasTabela);
        }

        tBody.innerHTML = '';
        if (!lista.length) {
            const tr = document.createElement('tr');
            const colspan = Math.max(colunasTabela.length, 1);
            tr.innerHTML = `<td colspan="${colspan}" style="color:#aaa;">Nenhum produto cadastrado.</td>`;
            tBody.appendChild(tr);
            return;
        }

        const frag = document.createDocumentFragment();
        lista.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = colunasTabela.map(col => {
                return `<td class="${classeCelula(col, item)}">${renderConteudoCelula(col, item)}</td>`;
            }).join('');
            frag.appendChild(tr);
        });
        tBody.appendChild(frag);

        colunasTabela.forEach((col, idx) => aplicarLarguraColuna(idx, col, obterLarguraColuna(col)));
        renderPaginacao(listaCompleta.length);
    }

    function renderPaginacaoCustos(totalItens) {

        info.textContent = `${de} à ${ate} de ${totalItens}`;

    function obterLojaProduto(item) {
        return String(
            item?.loja_custo ||
            item?.loja_sync ||
            item?.loja ||
            item?.conta ||
            item?.loja_conta ||
            item?.seller ||
            'Sem loja'
        ).trim() || 'Sem loja';
    }

    function obterLojasCustos() {
        return [...lojasIntegradasCustos];
    }

    function normalizarLojaCusto(valor) {
        return String(valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '');
    }

    function lojaCustoEstaIntegrada(loja) {
        const chave = normalizarLojaCusto(loja);
        return !!chave && lojasIntegradasCustosKeys.has(chave);
    }

    function dividirLojas(valor) {
        return String(valor || '')
            .split('|')
            .map(v => v.trim())
            .filter(Boolean);
    }

    function adicionarLojaIntegrada(setLojas, loja) {
        const nome = String(loja || '').trim();
        const chave = normalizarLojaCusto(nome);
        const nomeIntegrado = lojasIntegradasCustosPorKey.get(chave);
        if (nomeIntegrado && lojaCustoEstaIntegrada(nome)) {
            setLojas.add(nomeIntegrado);
        }
    }

    function obterLojasIntegradasProduto(item) {
        const lojas = new Set();
        [
            item?.loja_sync,
            item?.loja,
            item?.conta,
            item?.loja_conta,
            item?.seller
        ].forEach(valor => dividirLojas(valor).forEach(loja => adicionarLojaIntegrada(lojas, loja)));

        const mapa = item && item.custos_por_loja;
        if (mapa && typeof mapa === 'object') {
            Object.values(mapa).forEach(dados => adicionarLojaIntegrada(lojas, dados && dados.loja_sync));
        }

        return Array.from(lojas).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    }

    function obterDadosCustoLoja(item, loja) {
        const mapa = item && item.custos_por_loja;
        if (!mapa || typeof mapa !== 'object') return null;
        const lojaKey = normalizarLojaCusto(loja);
        if (lojaKey && mapa[lojaKey]) return mapa[lojaKey];
        const entrada = Object.values(mapa).find(v => normalizarLojaCusto(v && v.loja_sync) === lojaKey);
        return entrada || null;
    }

    function aplicarDadosCustoLoja(item, loja) {
        const dados = obterDadosCustoLoja(item, loja);
        if (!dados) {
            return {
                ...item,
                loja_custo: loja,
                custo: '',
                preco: '',
                imposto: '',
                updated_at: '',
                tem_custo_loja: false
            };
        }
        return {
            ...item,
            loja_custo: loja,
            custo: dados.custo !== undefined ? dados.custo : '',
            preco: dados.preco !== undefined ? dados.preco : '',
            imposto: dados.imposto !== undefined ? dados.imposto : '',
            updated_at: dados.updated_at || '',
            tem_custo_loja: true
        };
    }

    function expandirCustosPorLoja(lista) {
        return lista.flatMap(item => {
            const lojas = obterLojasIntegradasProduto(item);
            if (!lojas.length) return [];
            return lojas.map(loja => aplicarDadosCustoLoja(item, loja));
        });
    }

    function atualizarFiltroLojasCustos() {
        const valorAtual = lojaCustosSelect.value || '';
        const lojas = obterLojasCustos();
        if (!lojas.length) {
            lojaCustosSelect.innerHTML = '<option value="">Nenhuma loja integrada</option>';
            return;
        }
        lojaCustosSelect.innerHTML = '<option value="">Todas as lojas integradas</option>' + lojas
            .map(loja => `<option value="${escaparHtml(loja)}">${escaparHtml(loja)}</option>`)
            .join('');
        if (valorAtual && lojas.includes(valorAtual)) {
            lojaCustosSelect.value = valorAtual;
        }
    }

    function renderCustos(resetarPagina = true) {
        const termoTexto = normalizarBuscaTexto(filtroCustos.value);
        const termoSku = normalizarBuscaSku(filtroCustos.value);
        const lojaSelecionada = String(lojaCustosSelect.value || '').trim();
        const listaBase = expandirCustosPorLoja(produtos)
            .filter(item => lojaSelecionada || item.tem_custo_loja);
        const listaCompleta = (termoTexto
            ? listaBase.filter(item => {
                const skuBruto = String(item?.sku || '');
                const skuExibicao = formatarSkuExibicao(skuBruto);
                const skuNormBruto = normalizarBuscaSku(skuBruto);
                const skuNormExib = normalizarBuscaSku(skuExibicao);
                if (termoSku && (skuNormBruto.includes(termoSku) || skuNormExib.includes(termoSku))) return true;
                return [
                    item?.nome,
                    item?.produto,
                    item?.produto_bling,
                    item?.custo,
                    item?.preco,
                    item?.imposto
                ].some(v => normalizarBuscaTexto(v).includes(termoTexto));
            })
            : [...listaBase]
        )
            .filter(item => !lojaSelecionada || obterLojaProduto(item) === lojaSelecionada)
            .sort((a, b) => {
                const cmpLoja = obterLojaProduto(a).localeCompare(obterLojaProduto(b), undefined, { sensitivity: 'base' });
                return cmpLoja || compararSku(a, b);
            });

        if (resetarPagina) paginaCustosAtual = 1;
        const lista = listaCompleta.slice((paginaCustosAtual - 1) * ITENS_POR_PAGINA, paginaCustosAtual * ITENS_POR_PAGINA);

        tBodyCustos.innerHTML = '';
        if (!lista.length) {
            tBodyCustos.innerHTML = '<tr><td colspan="7" style="color:#aaa;">Nenhum custo encontrado.</td></tr>';
            paginacaoCustosEl.innerHTML = '';
            return;
        }

        const frag = document.createDocumentFragment();
        let lojaGrupoAtual = '';
        lista.forEach(item => {
            const loja = obterLojaProduto(item);
            if (loja !== lojaGrupoAtual) {
                lojaGrupoAtual = loja;
                const trGrupo = document.createElement('tr');
                trGrupo.className = 'grupo-loja-row';
                trGrupo.innerHTML = `<td colspan="7">Loja: ${escaparHtml(loja)}</td>`;
                frag.appendChild(trGrupo);
            }
            const tr = document.createElement('tr');
            tr.innerHTML = [
                loja,
                formatarSkuExibicao(item.sku),
                obterNomeProdutoCadastro(item),
                formatarNumero(item.custo),
                formatarNumero(item.preco),
                item.imposto || '',
                item.updated_at || ''
            ].map(v => `<td>${escaparHtml(v)}</td>`).join('');
            frag.appendChild(tr);
        });
        tBodyCustos.appendChild(frag);
        renderPaginacaoCustos(listaCompleta.length);
    }

    function trocarAba(aba) {
        const custosAtivo = aba === 'custos';
        tabProdutos.classList.toggle('active', !custosAtivo);
        tabCustos.classList.toggle('active', custosAtivo);
        tabProdutos.setAttribute('aria-selected', String(!custosAtivo));
        tabCustos.setAttribute('aria-selected', String(custosAtivo));
        painelProdutos.hidden = custosAtivo;
        painelCustos.hidden = !custosAtivo;
        if (custosAtivo) renderCustos(false);
    }

    function montarSeletorSku() {
        skuSelect.innerHTML = '';
        const optDefault = document.createElement('option');
        optDefault.value = '';
        optDefault.textContent = 'Selecione um SKU para ver MLBs';
        skuSelect.appendChild(optDefault);

        const ordenados = [...produtos].sort((a, b) => String(a.sku || '').localeCompare(String(b.sku || '')));
        ordenados.forEach(item => {
            const op = document.createElement('option');
            op.value = String(item.sku || '');
            op.textContent = `${formatarSkuExibicao(item.sku)} - ${obterNomeProdutoCadastro(item)}`;
            skuSelect.appendChild(op);
        });
    }

    function renderDetalhesMlbPorSku(sku) {
        tBodyMlb.innerHTML = '';
        if (!sku) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="4" style="color:#aaa;">Selecione um SKU para visualizar os MLBs.</td>';
            tBodyMlb.appendChild(tr);
            return;
        }

        const item = produtos.find(p => String(p.sku || '') === String(sku));
        if (!item) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="4" style="color:#aaa;">SKU não encontrado.</td>';
            tBodyMlb.appendChild(tr);
            return;
        }

        const mlbs = splitLista(item.mlb_ids, '|');
        const titulos = splitLista(item.titulos_anuncios_mlb, ' || ');
        const fretes = splitLista(item.custos_frete_mlb, '|');
        const categoria = String(item.categoria || '').trim();
        const maxLen = Math.max(mlbs.length, titulos.length, fretes.length);

        if (!maxLen) {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td colspan="4" style="color:#aaa;">Este SKU não possui MLB vinculado.</td>';
            tBodyMlb.appendChild(tr);
            return;
        }

        const frag = document.createDocumentFragment();
        for (let i = 0; i < maxLen; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = [
                mlbs[i] || '',
                titulos[i] || obterNomeProdutoCadastro(item),
                fretes[i] || '',
                categoria
            ].map(v => `<td>${escaparHtml(v)}</td>`).join('');
            frag.appendChild(tr);
        }
        tBodyMlb.appendChild(frag);
    }

    function lojaTemIntegracaoAtiva(loja) {
        const integracoes = loja && loja.integracoes;
        if (!integracoes || typeof integracoes !== 'object') return false;

        return Object.entries(integracoes).some(([servico, cfg]) => {
            if (String(servico || '').toLowerCase() === 'criacao') return false;
            if (!cfg || typeof cfg !== 'object') return false;
            if (cfg.connected === false) return false;
            if (cfg.connected === true) return true;
            if (String(cfg.status || '').toLowerCase() === 'conectado') return true;
            return Boolean(cfg.access_token || cfg.refresh_token || cfg.api_key || cfg.token);
        });
    }

    async function carregarLojasIntegradasCustos() {
        try {
            const resp = await fetch('/api/lojas', { headers: obterAuthHeaders() });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const lojas = await resp.json();
            lojasIntegradasCustos = (Array.isArray(lojas) ? lojas : [])
                .filter(lojaTemIntegracaoAtiva)
                .map(loja => String(loja?.nome || '').trim())
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
            lojasIntegradasCustosKeys = new Set(lojasIntegradasCustos.map(normalizarLojaCusto).filter(Boolean));
            lojasIntegradasCustosPorKey = new Map(
                lojasIntegradasCustos.map(nome => [normalizarLojaCusto(nome), nome]).filter(([chave]) => Boolean(chave))
            );
        } catch (e) {
            console.warn('Nao foi possivel carregar lojas integradas:', e);
            lojasIntegradasCustos = [];
            lojasIntegradasCustosKeys = new Set();
            lojasIntegradasCustosPorKey = new Map();
        }
    }

    async function carregarProdutos(opcoes = {}) {
        setStatus('Carregando produtos...', 'loading');
        btnAtualizar.disabled = true;
        btnSyncNcm.disabled = true;
        try {
            clientId = clientId || obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }
            const resp = await fetch('/api/cadastro/produtos', {
                headers: obterAuthHeaders()
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            produtos = await resp.json();
            await carregarLojasIntegradasCustos();
            atualizarFiltroLojasCustos();
            renderTabela();
            renderCustos();
            montarSeletorSku();
            renderDetalhesMlbPorSku(skuSelect.value || '');
            setStatus(`Produtos carregados: ${produtos.length}`, 'success');
        } catch (e) {
            setStatus(`Erro ao carregar produtos: ${e.message}`, 'error');
        } finally {
            btnAtualizar.disabled = false;
            btnSyncNcm.disabled = false;
        }
    }

    function setStatusNcmGlobal(html, cls) {
        const statusNcmEl = document.getElementById('statusNcmGlobal');
        if (!statusNcmEl) return;
        
        if (!html) {
            statusNcmEl.style.display = 'none';
            return;
        }
        
        statusNcmEl.innerHTML = html;
        statusNcmEl.className = 'status-bar ' + (cls || '');
        statusNcmEl.style.display = 'block';
    }

    async function sincronizarNcmBackground() {
        try {
            setStatusNcmGlobal('Iniciando sincronização de NCM...', 'loading');
            btnSyncNcm.disabled = true;
            
            await NCM_SYNC.iniciarSincronizacao();
        } catch (e) {
            console.error('Erro ao iniciar sincronização NCM:', e);
            setStatusNcmGlobal(`Erro: ${e.message}`, 'error');
            btnSyncNcm.disabled = false;
        }
    }

    function onNcmSyncComplete(status) {
        btnSyncNcm.disabled = false;
        if (status === 'done') {
            setStatusNcmGlobal('✅ Sincronização NCM concluída! Recarregando produtos...', 'success');
            setTimeout(() => {
                carregarProdutos();
                setStatusNcmGlobal('', '');
            }, 1500);
        } else if (status === 'error') {
            setStatusNcmGlobal('❌ Sincronização NCM finalizou com erro.', 'error');
        }
    }

    async function importarColunasPorSku(arquivo) {
        if (!arquivo) return;
        setStatus('Importando colunas da planilha e vinculando por SKU...', 'loading');
        btnAtualizar.disabled = true;
        btnSyncNcm.disabled = true;
        btnImportarColunas.disabled = true;
        try {
            clientId = clientId || obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }

            const formData = new FormData();
            formData.append('arquivo', arquivo);
            const lojaSelecionada = String(lojaCustosSelect.value || '').trim();
            if (!lojaSelecionada) {
                throw new Error('Selecione uma loja para salvar custo e imposto por conta.');
            }
            formData.append('loja', lojaSelecionada);
            formData.append('modo', 'custos');

            const resp = await fetch('/api/cadastro/importar-colunas', {
                method: 'POST',
                headers: obterAuthHeaders(),
                body: formData
            });

            const payload = await resp.json();
            if (!resp.ok) {
                throw new Error(payload?.detail || `HTTP ${resp.status}`);
            }

            const criadas = (payload.colunas_criadas || []).length;
            const atualizados = Number(payload.skus_atualizados || 0);
            const incluidos = Number(payload.skus_incluidos || 0);
            const semMatch = Number(payload.skus_sem_correspondencia || 0);
            setStatus(
                `Importação concluída. Colunas criadas: ${criadas}. SKUs atualizados: ${atualizados}. SKUs incluídos: ${incluidos}. SKUs sem correspondência: ${semMatch}.`,
                'success'
            );
            await carregarProdutos();
        } catch (e) {
            setStatus(`Erro ao importar colunas: ${e.message}`, 'error');
        } finally {
            inputImportarColunas.value = '';
            btnAtualizar.disabled = false;
            btnSyncNcm.disabled = false;
            btnImportarColunas.disabled = false;
        }
    }

    async function atualizarCustosImpostosPorSku(arquivo) {
        if (!arquivo) return;
        setStatus('Atualizando custo e imposto por SKU...', 'loading');
        btnAtualizarCustosImpostos.disabled = true;
        try {
            clientId = clientId || obterClientId();
            if (!clientId) {
                window.location.href = '/frontend_index.html';
                return;
            }

            const formData = new FormData();
            formData.append('arquivo', arquivo);
            const lojaSelecionada = String(lojaCustosSelect.value || '').trim();
            if (!lojaSelecionada) {
                throw new Error('Selecione uma loja para salvar custo e imposto por conta.');
            }
            formData.append('loja', lojaSelecionada);
            formData.append('modo', 'custos');

            const resp = await fetch('/api/cadastro/importar-colunas', {
                method: 'POST',
                headers: obterAuthHeaders(),
                body: formData
            });

            const payload = await resp.json();
            if (!resp.ok) {
                throw new Error(payload?.detail || `HTTP ${resp.status}`);
            }

            const atualizados = Number(payload.skus_atualizados || 0);
            const incluidos = Number(payload.skus_incluidos || 0);
            const semMatch = Number(payload.skus_sem_correspondencia || 0);
            const custosAtualizados = Number(payload.custos_loja_atualizados ?? atualizados);
            const custosIncluidos = Number(payload.custos_loja_incluidos ?? incluidos);
            const lojaResp = payload.custos_loja ? ` em ${payload.custos_loja}` : '';
            setStatus(`Custos/impostos salvos por conta${lojaResp}. Atualizados: ${custosAtualizados}. Incluídos: ${custosIncluidos}. Sem correspondência: ${semMatch}.`, 'success');
            await carregarProdutos();
            trocarAba('custos');
        } catch (e) {
            setStatus(`Erro ao atualizar custos/impostos: ${e.message}`, 'error');
        } finally {
            inputAtualizarCustosImpostos.value = '';
            btnAtualizarCustosImpostos.disabled = false;
        }
    }

    // Inicializar sistema de sincronização NCM
    NCM_SYNC.init(setStatusNcmGlobal, onNcmSyncComplete);

    filtro.addEventListener('input', renderTabela);
    filtroCustos.addEventListener('input', () => renderCustos(true));
    lojaCustosSelect.addEventListener('change', () => renderCustos(true));
    tabProdutos.addEventListener('click', () => trocarAba('produtos'));
    tabCustos.addEventListener('click', () => trocarAba('custos'));
    skuSelect.addEventListener('change', () => renderDetalhesMlbPorSku(skuSelect.value));
    btnAtualizar.addEventListener('click', carregarProdutos);
    btnSyncNcm.addEventListener('click', sincronizarNcmBackground);
    btnEditarCadastro.addEventListener('click', () => {
        window.location.href = '/cadastro_editar.html';
    });
    btnIncluirCadastro.addEventListener('click', () => {
        window.location.href = '/cadastro_incluir.html';
    });
    btnImportarColunas.addEventListener('click', () => inputImportarColunas.click());
    btnAtualizarCustosImpostos.addEventListener('click', () => inputAtualizarCustosImpostos.click());
    inputImportarColunas.addEventListener('change', () => {
        const arq = inputImportarColunas.files && inputImportarColunas.files[0];
        if (arq) importarColunasPorSku(arq);
    });
    inputAtualizarCustosImpostos.addEventListener('change', () => {
        const arq = inputAtualizarCustosImpostos.files && inputAtualizarCustosImpostos.files[0];
        if (arq) atualizarCustosImpostosPorSku(arq);
    });

    carregarProdutos();
</script>
<script src="/table_columns.js"></script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
