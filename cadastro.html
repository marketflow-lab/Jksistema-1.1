<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - JK Sistema</title>
    <link rel="stylesheet" href="/cadastro/styles/main.css?v=20260821-cadastro-modular-v1">
    <script src="/auth.js?v=20260618-persist-login"></script>
    <script src="/ncm-sync.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1> Cadastro de Produtos</h1>
        <div class="header-actions">
            <a class="back-btn" href="/dashboard.html">🏠 Home</a>
            <a class="back-btn" href="/dashboard.html">Voltar</a>
        </div>
    </div>

    <div id="statusNcmGlobal" class="status-bar status-ncm-global"></div>

    <div class="layout">
        <div class="card">
            <div class="card-title-row">
                <h2>Produtos cadastrados</h2>
                <div id="status" class="status-bar"></div>
            </div>
            <div class="tabs" role="tablist" aria-label="Cadastro de produtos">
                <button id="tabProdutos" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="painelProdutos">Produtos</button>
                <button id="tabCustos" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="painelCustos">Custos</button>
            </div>
            <div id="painelProdutos" class="tab-panel" role="tabpanel" aria-labelledby="tabProdutos">
                <div class="toolbar">
                    <button id="btnAtualizar" class="btn btn-secondary" type="button">Atualizar lista</button>
                    <button id="btnSyncNcm" class="btn btn-secondary" type="button">Sincronizar NCM e monofásico</button>
                    <button id="btnEditarCadastro" class="btn btn-secondary" type="button">Editar</button>
                    <button id="btnIncluirCadastro" class="btn btn-secondary" type="button">Incluir</button>
                    <button id="btnImportarColunas" class="btn btn-secondary" type="button">Importar colunas (Excel/CSV)</button>
                    <input id="inputImportarColunas" class="file-input-hidden" type="file" accept=".xlsx,.xls,.csv">
                    <input id="filtro" type="text" placeholder="Filtrar por SKU, nome, categoria ou marca">
                </div>
                <div class="table-wrap">
                    <table>
                        <colgroup id="tCols"></colgroup>
                        <thead id="tHead"></thead>
                        <tbody id="tBody"></tbody>
                    </table>
                </div>
                <div id="paginacao" class="paginacao"></div>

                <h2>Detalhes MLB por SKU</h2>
                <div class="toolbar">
                    <select id="skuSelect" class="toolbar-select sku-select"></select>
                </div>
                <div class="table-wrap table-wrap-compact">
                    <table>
                        <thead>
                            <tr>
                                <th>MLB</th>
                                <th>Título</th>
                                <th>Frete</th>
                                <th>Categoria</th>
                            </tr>
                        </thead>
                        <tbody id="tBodyMlb"></tbody>
                    </table>
                </div>
            </div>
            <div id="painelCustos" class="tab-panel" role="tabpanel" aria-labelledby="tabCustos" hidden>
                <div class="toolbar">
                    <button id="btnAtualizarCustosImpostos" class="btn btn-secondary" type="button">Atualizar custos/impostos por SKU</button>
                    <input id="inputAtualizarCustosImpostos" class="file-input-hidden" type="file" accept=".xlsx,.xls,.csv">
                    <select id="lojaCustosSelect" class="toolbar-select loja-select"></select>
                    <input id="filtroCustos" type="text" placeholder="Filtrar custos por SKU, nome ou produto">
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Loja</th>
                                <th>SKU</th>
                                <th>Produto</th>
                                <th>Custo</th>
                                <th>Preço</th>
                                <th>Imposto</th>
                                <th>Atualizado em</th>
                            </tr>
                        </thead>
                        <tbody id="tBodyCustos"></tbody>
                    </table>
                </div>
                <div id="paginacaoCustos" class="paginacao"></div>
            </div>
        </div>
    </div>
</div>

<script src="/cadastro/00-runtime.js?v=20260821-cadastro-modular-v1"></script>
<script src="/cadastro/01-core.js?v=20260821-cadastro-modular-v1"></script>
<script src="/cadastro/main/01-produtos.js?v=20260821-cadastro-modular-v1"></script>
<script src="/cadastro/main/02-custos-mlb.js?v=20260821-cadastro-modular-v1"></script>
<script src="/cadastro/main/03-actions.js?v=20260821-cadastro-modular-v1"></script>
<script src="/cadastro/main/04-init.js?v=20260821-cadastro-modular-v1"></script>
<script src="/table_columns.js"></script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
