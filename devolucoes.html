<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoluções por SKU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            gap: 5px;
        }
        input[type="date"], input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        input[type="date"]:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        .card-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        .card-subtext {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            color: #666;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .table-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            font-size: 12px;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            color: #333;
        }
        tbody tr {
            transition: background 0.3s;
            cursor: pointer;
        }
        tbody tr:hover {
            background: #f8f9fa;
        }
        tbody tr.group-row {
            background: #f0f0f0;
            font-weight: 600;
            cursor: pointer;
        }
        tbody tr.group-row:hover {
            background: #e0e0e0;
        }
        .sku-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            display: inline-block;
        }
        .expandable-content {
            display: none;
        }
        .expandable-content.visible {
            display: table-row;
        }
        .expand-icon {
            display: inline-block;
            transition: transform 0.3s;
        }
        .expand-icon.expanded {
            transform: rotate(90deg);
        }
        .details-row {
            background: #f8f9fa;
        }
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .filters {
                width: 100%;
            }
            th, td {
                padding: 10px;
                font-size: 12px;
            }
            .card-value {
                font-size: 20px;
            }
        }
    </style>
    <script src="/auth.js?v=20260417c"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Devoluções por SKU</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="navegarComTransicao('/dashboard.html')">🏠 Home</button>
                <button class="btn btn-secondary" onclick="voltarVendas()">← Voltar</button>
            </div>
        </div>

        <div class="filters">
            <div class="input-group">
                <label>De:</label>
                <input type="date" id="dataInicio">
            </div>
            <div class="input-group">
                <label>Até:</label>
                <input type="date" id="dataFim">
            </div>
            <button class="btn btn-primary" onclick="carregarDevolucoes()">🔍 Filtrar</button>
        </div>

        <div class="status-bar" id="statusBar" style="display: none;"></div>

        <div class="summary-cards">
            <div class="card">
                <div class="card-label">Total de SKUs com Devoluções</div>
                <div class="card-value" id="totalSkus">0</div>
            </div>
            <div class="card">
                <div class="card-label">Total de Devoluções</div>
                <div class="card-value" id="totalDevolucoes">0</div>
            </div>
            <div class="card">
                <div class="card-label">Valor Total Devolvido</div>
                <div class="card-value" id="valorTotal">R$ 0,00</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;"></th>
                        <th>SKU</th>
                        <th>Descrição</th>
                        <th>Devoluções</th>
                        <th>Valor Total</th>
                        <th>Fornecedores</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <tr class="empty">
                        <td colspan="6">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataInicio = urlParams.get('data_inicio');
        const dataFim = urlParams.get('data_fim');
        let devolucoesPorSku = [];
        let skuSelecionados = new Set();

        function formatarData(dataString) {
            if (!dataString) return '';
            const partes = dataString.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function formatarMoeda(valor) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(valor || 0);
        }

        function salvarFiltros() {
            const inicio = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            sessionStorage.setItem('devolucoes_data_inicio', inicio);
            sessionStorage.setItem('devolucoes_data_fim', fim);
        }

        function restaurarFiltros() {
            const inicio = sessionStorage.getItem('devolucoes_data_inicio') || dataInicio || '';
            const fim = sessionStorage.getItem('devolucoes_data_fim') || dataFim || '';
            document.getElementById('dataInicio').value = inicio;
            document.getElementById('dataFim').value = fim;
        }

        async function carregarDevolucoes() {
            const inicio = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;

            if (!inicio || !fim) {
                alert('Informe as datas de início e fim.');
                return;
            }

            const statusBar = document.getElementById('statusBar');
            statusBar.innerHTML = '⏳ Carregando...';
            statusBar.style.display = 'block';

            try {
                const clientId = JSON.parse(localStorage.getItem('user_data') || '{}').client_id;
                const response = await fetch(`/api/notas-entrada?data_inicio=${inicio}&data_fim=${fim}&agrupado=true`, {
                    headers: {
                        'X-Client-ID': clientId
                    }
                });

                if (!response.ok) throw new Error('Erro ao carregar devoluções');

                devolucoesPorSku = await response.json();
                salvarFiltros();
                renderizarTabela();
                statusBar.style.display = 'none';
            } catch (erro) {
                statusBar.innerHTML = `❌ Erro: ${erro.message}`;
                console.error('Erro:', erro);
            }
        }

        async function carregarItensDoSku(sku) {
            try {
                const clientId = JSON.parse(localStorage.getItem('user_data') || '{}').client_id;
                const inicio = document.getElementById('dataInicio').value;
                const fim = document.getElementById('dataFim').value;
                
                const response = await fetch(`/api/notas-entrada/sku/${encodeURIComponent(sku)}?data_inicio=${inicio}&data_fim=${fim}`, {
                    headers: {
                        'X-Client-ID': clientId
                    }
                });

                if (!response.ok) throw new Error('Erro ao carregar itens');

                return await response.json();
            } catch (erro) {
                console.error('Erro ao carregar itens do SKU:', erro);
                return [];
            }
        }

        function renderizarTabela() {
            const corpo = document.getElementById('tabelaCorpo');
            skuSelecionados.clear();

            if (!devolucoesPorSku || devolucoesPorSku.length === 0) {
                corpo.innerHTML = '<tr class="empty"><td colspan="6">Nenhuma devolução encontrada no período.</td></tr>';
                document.getElementById('totalSkus').textContent = '0';
                document.getElementById('totalDevolucoes').textContent = '0';
                document.getElementById('valorTotal').textContent = 'R$ 0,00';
                return;
            }

            let totalDevolucoes = 0;
            let valorTotalDevolvido = 0;
            let html = '';

            devolucoesPorSku.forEach((grupo, index) => {
                totalDevolucoes += grupo.total_devolucoes || 0;
                valorTotalDevolvido += grupo.valor_total || 0;

                const sku = grupo.sku || 'N/A';
                const descricao = grupo.descricao || 'Sem descrição';
                const qtd = grupo.total_devolucoes || 0;
                const valor = grupo.valor_total || 0;
                const fornecedores = grupo.fornecedores || '';

                html += `
                    <tr class="group-row" onclick="toggleDetalhes('${index}')">
                        <td><span class="expand-icon" id="expand-${index}">▶</span></td>
                        <td><span class="sku-badge">${sku}</span></td>
                        <td>${descricao}</td>
                        <td>${qtd}</td>
                        <td>${formatarMoeda(valor)}</td>
                        <td>${fornecedores}</td>
                    </tr>
                    <tr class="expandable-content details-row" id="details-${index}" style="display: none;">
                        <td colspan="6">
                            <div style="padding: 20px; background: #fff;">
                                <div id="itens-${index}" style="min-height: 50px;">Carregando itens...</div>
                            </div>
                        </td>
                    </tr>
                `;
            });

            corpo.innerHTML = html;

            document.getElementById('totalSkus').textContent = devolucoesPorSku.length;
            document.getElementById('totalDevolucoes').textContent = totalDevolucoes;
            document.getElementById('valorTotal').textContent = formatarMoeda(valorTotalDevolvido);
        }

        async function toggleDetalhes(index) {
            const detalhe = document.getElementById(`details-${index}`);
            const expand = document.getElementById(`expand-${index}`);
            const grupo = devolucoesPorSku[index];

            if (detalhe.classList.contains('visible')) {
                detalhe.classList.remove('visible');
                expand.classList.remove('expanded');
            } else {
                detalhe.classList.add('visible');
                expand.classList.add('expanded');

                const itensDiv = document.getElementById(`itens-${index}`);
                if (!itensDiv.classList.contains('loaded')) {
                    const itens = await carregarItensDoSku(grupo.sku);
                    let tabelaItens = '<table style="width: 100%; font-size: 12px;"><thead><tr style="background: #f0f0f0;"><th style="padding: 8px; text-align: left;">NF</th><th>Data</th><th>Quantidade</th><th>Valor Unit.</th><th>Valor Total</th><th>Fornecedor</th></tr></thead><tbody>';
                    
                    itens.forEach(item => {
                        tabelaItens += `
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 8px;">${item.numero_nota || '-'}</td>
                                <td>${formatarData(item.data_emissao) || '-'}</td>
                                <td>${item.quantidade || 0}</td>
                                <td>${formatarMoeda(item.valor_unitario || 0)}</td>
                                <td>${formatarMoeda(item.valor_total || 0)}</td>
                                <td>${item.fornecedor || '-'}</td>
                            </tr>
                        `;
                    });
                    
                    tabelaItens += '</tbody></table>';
                    itensDiv.innerHTML = tabelaItens;
                    itensDiv.classList.add('loaded');
                }
            }
        }

        function voltarVendas() {
            const inicio = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            navegarComTransicao(`/vendas.html?data_inicio=${inicio}&data_fim=${fim}`);
        }

        // Inicializar
        restaurarFiltros();
        if (dataInicio && dataFim) {
            carregarDevolucoes();
        }
    </script>
<script src="/ia-sidebar.js"></script>
</body>
</html>
