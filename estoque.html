<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - JK Sistema</title>
    <style>

        .estoque-page { margin:0; min-height:100vh; padding:24px 28px; background:radial-gradient(ellipse at 82% 0, #0d2440 0, transparent 42%), #07111f; color:#e2ecf9; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }

        .estoque-mark { width:42px; height:46px; flex:0 0 auto; }

        .estoque-header-right { display:flex; align-items:center; gap:20px; flex:0 0 auto; }
        .estoque-illustration { width:190px; height:106px; object-fit:contain; }
        .estoque-header-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .estoque-icon { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; }

        .estoque-page .tab-btn:hover { color:#eaf5ff; background:#13273e; }
        .estoque-page .aba-conteudo.hidden { display:none; }
        .estoque-page .store-scope { margin:0 0 17px; }
        .estoque-page .loja-group { display:flex; flex-wrap:wrap; gap:7px; min-width:0; }
        .estoque-page .loja-btn { min-height:32px; max-width:100%; padding:6px 11px; border:1px solid #2b4260; border-radius:7px; background:#0d1e33; color:#c5d7ed; font:400 12px/1.4 "Segoe UI", sans-serif; cursor:pointer; overflow-wrap:anywhere; transition:background .15s, border-color .15s; }
        .estoque-page .loja-btn:hover { border-color:#5681af; background:#173351; }

        .estoque-page .search-field { display:flex; gap:10px; align-items:center; min-width:0; padding:0 12px; border:1px solid #304a6a; border-radius:8px; background:#0d1e33; color:#9db7d6; }
        .estoque-page .search-field:focus-within { border-color:#65bcff; box-shadow:0 0 0 2px #168bfa22; }
        .estoque-page .search-field input { min-width:0; width:100%; height:38px; padding:8px 0; border:0; outline:none; border-radius:0; background:transparent; color:#e2ecf9; font:14px "Segoe UI", sans-serif; }
        .estoque-page .search-field input::placeholder { color:#8da7c6; }

        .estoque-page .inventory-toolbar select, .estoque-page .history-actions input, .estoque-page .history-actions select, .estoque-page #histSkuInput { min-width:0; max-width:100%; min-height:36px; padding:7px 10px; border:1px solid #304a6a; border-radius:7px; color:#dce8f8; background:#0d1e33; color-scheme:dark; font:13px "Segoe UI", sans-serif; }
        .estoque-page .inventory-toolbar select { width:100%; height:38px; }

        .estoque-page .foto-placeholder { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; width:100%; height:100%; font-size:9px; line-height:1.2; text-align:center; }

        .estoque-page .estoque-foto img.jk-auth-image-error { display:none; }
        .estoque-page .estoque-foto:has(img[src]:not(.jk-auth-image-error)) .foto-placeholder { visibility:hidden; }
        .estoque-page .inventory-empty { display:none; min-height:190px; padding:30px; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#8faaca; }

        .estoque-page .container:has(#status.loading) .inventory-panel:has(#tBody:empty) .inventory-loading { display:grid; }

        .estoque-page .paginacao { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:14px 0 0; }
        .estoque-page .page-info { color:#9db7d6; font-size:12px; }

        .estoque-page .history-actions input, .estoque-page .history-actions select { width:170px; }
        .estoque-page .history-view-options { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; padding:14px 16px; margin-bottom:14px; border:1px solid #29415e; border-radius:10px; background:#0d1d31; font-size:13px; }
        .estoque-page .history-view-options strong { color:#dceafa; font-size:13px; }
        .estoque-page .history-view-options label { display:flex; align-items:center; gap:7px; min-width:0; color:#b8cde5; font-size:12px; }
        .estoque-page .history-view-options input[type="checkbox"] { width:16px; height:16px; margin:0; accent-color:#168bfa; }
        .estoque-page .history-view-options input:disabled { opacity:.5; cursor:not-allowed; }
        .estoque-page #histSkuInput { width:210px; }
        .estoque-page .history-help { flex-basis:100%; margin:0; color:#8ea9c8; font-size:12px; line-height:1.5; }
        .estoque-page #historicoResumo { margin:0 0 14px; }
        .estoque-page #historicoResumo .card { flex:1 1 170px; min-width:0; }
        .estoque-page #historicoResumo .card .val { font-size:16px; }
        .estoque-page .history-table th, .estoque-page .history-table td { text-align:right; font-variant-numeric:tabular-nums; }
        .estoque-page .history-table th:first-child, .estoque-page .history-table td:first-child { text-align:left; }
        .estoque-page .history-table .history-separator { border-left:2px solid #37536b; }
        @media (max-width:980px) {
            .estoque-page { padding:18px; }
            .estoque-page .estoque-header-right { gap:10px; }
            .estoque-page .estoque-illustration { width:130px; height:86px; }
            .estoque-page .inventory-toolbar { grid-template-columns:minmax(160px, 1fr) 220px; }

            .estoque-page .tabs { gap:5px; }
            .estoque-page .tab-btn { font-size:12px; padding-inline:8px; }
